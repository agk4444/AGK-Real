n    set out to []\n    create half as Integer\n    set half to len(cd)\n    for i from 0 to half - 1:\n        create x1 as Float\n        set x1 to xd[i * 2]\n        create x2 as Float\n        set x2 to xd[i * 2 + 1]\n        create c as Float\n        set c to cd[i]\n        create s as Float\n        set s to sd[i]\n        out.append(x1 * c - x2 * s)\n        out.append(x1 * s + x2 * c)\n    return tensor_from_list(out)\n\n\ndefine function infer_attention_step that takes x as Object, lw as List, layer_cache as List, pos as Integer, cos_row as Object, sin_row as Object, n_head as Integer, head_dim as Integer returns Object:\n    create q as Object\n    set q to tensor_reshape(tensor_matmul(x, lw[1]), [n_head, head_dim])\n    create k as Object\n    set k to tensor_reshape(tensor_matmul(x, lw[2]), [n_head, head_dim])\n    create v as Object\n    set v to tensor_reshape(tensor_matmul(x, lw[3]), [n_head, head_dim])\n    create outs as List\n    set outs to []\n    create scale as Float\n    set scale to 1.0 / math.sqrt(head_dim * 1.0)\n    for h from 0 to n_head - 1:\n        create qhr as Object\n        set qhr to infer_apply_rope(tensor_take1(q, h, 0), cos_row, sin_row)\n        create khr as Object\n        set khr to infer_apply_rope(tensor_take1(k, h, 0), cos_row, sin_row)\n        create vhr as Object\n        set vhr to tensor_take1(v, h, 0)\n        create klist as List\n        set klist to layer_cache[0][h]\n        klist.append(khr)\n        create vlist as List\n        set vlist to layer_cache[1][h]\n        vlist.append(vhr)\n        create kmat as Object\n        set kmat to tensor_stack(klist)\n        create vmat as Object\n        set vmat to tensor_stack(vlist)\n        create scores as Object\n        set scores to tensor_mul(tensor_matmul(tensor_reshape(qhr, [1, head_dim]), tensor_transpose(kmat)), scale)\n        create weights as Object\n        set weights to tensor_softmax_rows(scores)\n        create oh as Object\n        set oh to tensor_matmul(weights, vmat)\n        outs.append(oh)\n    create ocat as Object\n    set ocat to tensor_reshape(tensor_stack(outs), [1, n_head * head_dim])\n    return tensor_matmul(ocat, lw[4])\n\n\ndefine function infer_mlp_step that takes x as Object, lw as List returns Object:\n    create g as Object\n    set g to tensor_silu(tensor_matmul(x, lw[6]))\n    create u as Object\n    set u to tensor_matmul(x, lw[7])\n    return tensor_matmul(tensor_mul(g, u), lw[8])\n\n\ndefine function infer_step that takes model as List, caches as List, tok_id as Integer, pos as Integer returns Object:\n    create config as List\n    set config to model[0]\n    create n_layer as Integer\n    set n_layer to config[0]\n    create n_head as Integer\n    set n_head to config[1]\n    create head_dim as Integer\n    set head_dim to config[3]\n    create vocab_size as Integer\n    set vocab_size to config[6]\n    create x as Object\n    set x to tensor_reshape(tensor_take1(model[2], tok_id, 0), [1, config[2]])\n    create cos_row as Object\n    set cos_row to tensor_take1(model[5], pos, 0)\n    create sin_row as Object\n    set sin_row to tensor_take1(model[6], pos, 0)\n    for l from 0 to n_layer - 1:\n        create lw as List\n        set lw to model[1][l]\n        create att as Object\n        set att to infer_attention_step(tensor_rmsnorm(x, lw[0], 0.00001), lw, caches[l], pos, cos_row, sin_row, n_head, head_dim)\n        set x to tensor_add(x, att)\n        create mlp as Object\n        set mlp to infer_mlp_step(tensor_rmsnorm(x, lw[5], 0.00001), lw)\n        set x to tensor_add(x, mlp)\n    set x to tensor_rmsnorm(x, model[3], 0.00001)\n    return tensor_reshape(tensor_matmul(x, model[4]), [vocab_size])\n\n\ndefine function infer_forward_logits that takes model as List, ids as List returns Object:\n    create caches as List\n    set caches to infer_new_caches(model)\n    create pos as Integer\n    set pos to 0\n    create logits as Object\n    set logits to tensor_zeros([1])\n    for each tid in ids:\n        set logits to infer_step(model, caches, tid, pos)\n        set pos to pos + 1\n    return logits\n\n\ndefine function _infer_index_of that takes itos as List, ch as String returns Integer:\n    create i as Integer\n    set i to 0\n    for each c in itos:\n        if c == ch:\n            return i\n        set i to i + 1\n    return -1\n\n\ndefine function infer_encode that takes model as List, text as String returns List:\n    create itos as List\n    set itos to model[7]\n    create ids as List\n    set ids to []\n    for each ch in text:\n        create idx as Integer\n        set idx to _infer_index_of(itos, ch)\n        if idx == -1:\n            raise \"infer_encode: character not in vocabulary: '{ch}'\"\n        ids.append(idx)\n    return ids\n\n\ndefine function infer_decode that takes model as List, ids as List returns String:\n    create itos as List\n    set itos to model[7]\n    create out as String\n    set out to \"\"\n    for each i in ids:\n        set out to out + itos[i]\n    return out\n\n\ndefine function infer_sample that takes logits as Object, temperature as Float returns Integer:\n    if temperature <= 0.0:\n        return tensor_argmax(logits)\n    create probs as Object\n    set probs to tensor_softmax_1d(tensor_div(logits, temperature))\n    return tensor_random_choice(tensor_numel(logits), tensor_to_list(probs))\n\n\ndefine function infer_generate that takes model as List, prompt as String, max_new_tokens as Integer, temperature as Float returns String:\n    create config as List\n    set config to model[0]\n    create block_size as Integer\n    set block_size to config[5]\n    create ids as List\n    set ids to infer_encode(model, prompt)\n    create caches as List\n    set caches to infer_new_caches(model)\n    create pos as Integer\n    set pos to 0\n    create logits as Object\n    set logits to tensor_zeros([1])\n    for each tid in ids:\n        set logits to infer_step(model, caches, tid, pos)\n        set pos to pos + 1\n    create out_ids as List\n    set out_ids to []\n    create n as Integer\n    set n to 0\n    while n < max_new_tokens and pos < block_size:\n        create nid as Integer\n        set nid to infer_sample(logits, temperature)\n        out_ids.append(nid)\n        set logits to infer_step(model, caches, nid, pos)\n        set pos to pos + 1\n        set n to n + 1\n    return infer_decode(model, out_ids)\n", "agk/stdlib/iniutils.agk": "# AGK-Real standard library: INI config file utilities.\n# Import with: import iniutils\n# (Functions are inlined into your program; call them directly.)\n# Reads classic \"section / key = value\" config files \u2014\n# built on Python's configparser.\n\nimport configparser\n\ndefine function ini_get that takes path as String, section as String, key as String and returns String:\n    create cp as Object\n    set cp to configparser.ConfigParser()\n    cp.read(path)\n    if cp.has_option(section, key) is false:\n        return \"\"\n    return cp.get(section, key)\n\ndefine function ini_get_or that takes path as String, section as String, key as String, default as String and returns String:\n    create cp as Object\n    set cp to configparser.ConfigParser()\n    cp.read(path)\n    if cp.has_option(section, key) is false:\n        return default\n    return cp.get(section, key)\n\ndefine function ini_has that takes path as String, section as String, key as String and returns Boolean:\n    create cp as Object\n    set cp to configparser.ConfigParser()\n    cp.read(path)\n    return cp.has_option(section, key)\n\ndefine function ini_has_section that takes path as String, section as String and returns Boolean:\n    create cp as Object\n    set cp to configparser.ConfigParser()\n    cp.read(path)\n    return cp.has_section(section)\n\ndefine function ini_sections that takes path as String and returns List:\n    create cp as Object\n    set cp to configparser.ConfigParser()\n    cp.read(path)\n    return cp.sections()\n\ndefine function ini_keys that takes path as String, section as String and returns List:\n    create cp as Object\n    set cp to configparser.ConfigParser()\n    cp.read(path)\n    if cp.has_section(section) is false:\n        raise \"iniutils.ini_keys: no such section '{section}'\"\n    return cp.options(section)\n", "agk/stdlib/iterutils.agk": "# AGK-Real standard library: iteration helpers.\n# Import with: import iterutils\n# (Functions are inlined into your program; call them directly.)\n# Chunking, flattening, deduplication, and pairwise combination \u2014\n# written in pure AGK.\n\ndefine function chunked that takes xs as List, n as Integer and returns List:\n    if n < 1:\n        raise \"iterutils.chunked: n must be at least 1\"\n    create out as List\n    set out to []\n    create chunk as List\n    set chunk to []\n    create i as Integer\n    set i to 0\n    for each x in xs:\n        chunk.append(x)\n        set i to i + 1\n        if i == n:\n            out.append(chunk)\n            set chunk to []\n            set i to 0\n    if len(chunk) > 0:\n        out.append(chunk)\n    return out\n\ndefine function flatten that takes xss as List and returns List:\n    create out as List\n    set out to []\n    for each xs in xss:\n        for each x in xs:\n            out.append(x)\n    return out\n\ndefine function unique that takes xs as List and returns List:\n    create out as List\n    set out to []\n    for each x in xs:\n        create seen as Boolean\n        set seen to false\n        for each y in out:\n            if y == x:\n                set seen to true\n        if seen is false:\n            out.append(x)\n    return out\n\ndefine function pairwise that takes xs as List and returns List:\n    create out as List\n    set out to []\n    create i as Integer\n    set i to 0\n    while i + 1 < len(xs):\n        out.append([xs[i], xs[i + 1]])\n        set i to i + 1\n    return out\n\ndefine function zip_lists that takes a as List, b as List and returns List:\n    create out as List\n    set out to []\n    create n as Integer\n    set n to len(a)\n    if len(b) < n:\n        set n to len(b)\n    create i as Integer\n    set i to 0\n    while i < n:\n        out.append([a[i], b[i]])\n        set i to i + 1\n    return out\n", "agk/stdlib/jsonutils.agk": "# AGK-Real standard library: JSON utilities.\n# Import with: import jsonutils\n# (Functions are inlined into your program; call them directly.)\n\nimport json\n\ndefine function parse_json that takes s as String and returns Object:\n    return json.loads(s)\n\ndefine function to_json that takes value as Object and returns String:\n    return json.dumps(value)\n", "agk/stdlib/listutils.agk": "# AGK-Real standard library: list utilities.\n# Import with: import listutils\n# (Functions are inlined into your program; call them directly.)\n\ndefine function sum_list that takes xs as List and returns Integer:\n    create total as Integer\n    set total to 0\n    for each x in xs:\n        set total to total + x\n    return total\n\ndefine function max_in_list that takes xs as List and returns Integer:\n    create best as Integer\n    set best to xs[0]\n    for each x in xs:\n        if x > best:\n            set best to x\n    return best\n\ndefine function min_in_list that takes xs as List and returns Integer:\n    create best as Integer\n    set best to xs[0]\n    for each x in xs:\n        if x < best:\n            set best to x\n    return best\n\ndefine function contains_int that takes xs as List, item as Integer and returns Boolean:\n    for each x in xs:\n        if x == item:\n            return true\n    return false\n", "agk/stdlib/logutils.agk": "# AGK-Real standard library: simple file logging.\n# Import with: import logutils\n# (Functions are inlined into your program; call them directly.)\n# Timestamped log lines appended to a file \u2014 no setup, no rotation.\n# For structured or high-volume logging, use Python's logging module.\n\nimport datetime\n\ndefine function log_line that takes path as String, level as String, message as String:\n    create stamp as String\n    set stamp to datetime.datetime.now().isoformat()\n    create f as Object\n    set f to open(path, \"a\")\n    f.write(\"[\" + stamp + \"] \" + level + \": \" + message + \"\\n\")\n    f.close()\n\ndefine function log_debug that takes path as String, message as String:\n    log_line(path, \"DEBUG\", message)\n\ndefine function log_info that takes path as String, message as String:\n    log_line(path, \"INFO\", message)\n\ndefine function log_warn that takes path as String, message as String:\n    log_line(path, \"WARN\", message)\n\ndefine function log_error that takes path as String, message as String:\n    log_line(path, \"ERROR\", message)\n", "agk/stdlib/mathutils.agk": "# AGK-Real standard library: math utilities.\n# Import with: import mathutils\n# (Functions are inlined into your program; call them directly.)\n# Built on Python's math module.\n\nimport math\n\ndefine function pi_value that returns Float:\n    return math.pi\n\ndefine function e_value that returns Float:\n    return math.e\n\ndefine function sqrt_of that takes x as Float and returns Float:\n    if x < 0:\n        raise \"mathutils.sqrt_of: cannot take the square root of a negative number\"\n    return math.sqrt(x)\n\ndefine function floor_of that takes x as Float and returns Integer:\n    return math.floor(x)\n\ndefine function ceil_of that takes x as Float and returns Integer:\n    return math.ceil(x)\n\ndefine function round_to that takes x as Float, n as Integer and returns Float:\n    return round(x, n)\n\ndefine function sin_of that takes x as Float and returns Float:\n    return math.sin(x)\n\ndefine function cos_of that takes x as Float and returns Float:\n    return math.cos(x)\n\ndefine function tan_of that takes x as Float and returns Float:\n    return math.tan(x)\n\ndefine function ln that takes x as Float and returns Float:\n    if x <= 0:\n        raise \"mathutils.ln: x must be positive\"\n    return math.log(x)\n\ndefine function log10_of that takes x as Float and returns Float:\n    if x <= 0:\n        raise \"mathutils.log10_of: x must be positive\"\n    return math.log10(x)\n\ndefine function log_base that takes x as Float, base as Float and returns Float:\n    if x <= 0:\n        raise \"mathutils.log_base: x must be positive\"\n    if base <= 0:\n        raise \"mathutils.log_base: base must be positive\"\n    return math.log(x, base)\n\ndefine function exp_of that takes x as Float and returns Float:\n    return math.exp(x)\n\ndefine function power that takes x as Float, y as Float and returns Float:\n    return math.pow(x, y)\n\ndefine function gcd_of that takes a as Integer, b as Integer and returns Integer:\n    return math.gcd(a, b)\n\ndefine function factorial_of that takes n as Integer and returns Integer:\n    if n < 0:\n        raise \"mathutils.factorial_of: n must not be negative\"\n    return math.factorial(n)\n\ndefine function to_radians that takes deg as Float and returns Float:\n    return math.radians(deg)\n\ndefine function to_degrees that takes rad as Float and returns Float:\n    return math.degrees(rad)\n\ndefine function is_close that takes a as Float, b as Float and returns Boolean:\n    return math.isclose(a, b)\n\ndefine function hypot_of that takes x as Float, y as Float and returns Float:\n    return math.hypot(x, y)\n", "agk/stdlib/pathutils.agk": "# AGK-Real standard library: file path utilities.\n# Import with: import pathutils\n# (Functions are inlined into your program; call them directly.)\n# Pure path manipulation (no disk access) \u2014 built on Python's os.path.\n\nimport os\n\ndefine function join_path that takes a as String, b as String and returns String:\n    return os.path.join(a, b)\n\ndefine function base_name that takes p as String and returns String:\n    return os.path.basename(p)\n\ndefine function dir_name that takes p as String and returns String:\n    return os.path.dirname(p)\n\ndefine function abs_path that takes p as String and returns String:\n    return os.path.abspath(p)\n\ndefine function norm_path that takes p as String and returns String:\n    return os.path.normpath(p)\n\ndefine function file_extension that takes p as String and returns String:\n    return os.path.splitext(p)[1]\n\ndefine function file_stem that takes p as String and returns String:\n    return os.path.splitext(os.path.basename(p))[0]\n\ndefine function is_abs_path that takes p as String and returns Boolean:\n    return os.path.isabs(p)\n", "agk/stdlib/randutils.agk": "# AGK-Real standard library: random number utilities.\n# Import with: import randutils\n# (Functions are inlined into your program; call them directly.)\n# Built on Python's random module. Call seed() first for reproducible results.\n\nimport random\n\ndefine function seed that takes n as Integer:\n    random.seed(n)\n\ndefine function randint_between that takes a as Integer, b as Integer and returns Integer:\n    return random.randint(a, b)\n\ndefine function randfloat that returns Float:\n    return random.random()\n\ndefine function randfloat_between that takes a as Float, b as Float and returns Float:\n    return random.uniform(a, b)\n\ndefine function choice_of that takes xs as List:\n    if len(xs) == 0:\n        raise \"randutils.choice_of: cannot choose from an empty list\"\n    return random.choice(xs)\n\ndefine function shuffle_list that takes xs as List and returns List:\n    random.shuffle(xs)\n    return xs\n\ndefine function sample_of that takes xs as List, k as Integer and returns List:\n    if k < 0:\n        raise \"randutils.sample_of: k must not be negative\"\n    if k > len(xs):\n        raise \"randutils.sample_of: k is larger than the list\"\n    return random.sample(xs, k)\n", "agk/stdlib/regexutils.agk": "# AGK-Real standard library: regular-expression utilities.\n# Import with: import regexutils\n# (Functions are inlined into your program; call them directly.)\n\nimport re\n\ndefine function regex_match that takes pattern as String, text as String and returns Boolean:\n    if re.search(pattern, text):\n        return true\n    return false\n\ndefine function regex_find_all that takes pattern as String, text as String and returns List:\n    return re.findall(pattern, text)\n\ndefine function regex_replace that takes pattern as String, replacement as String, text as String and returns String:\n    return re.sub(pattern, replacement, text)\n\ndefine function regex_split that takes pattern as String, text as String and returns List:\n    return re.split(pattern, text)\n", "agk/stdlib/sqliteutils.agk": "# AGK-Real standard library: SQLite helpers.\n# Import with: import sqliteutils\n# (Functions are inlined into your program; call them directly.)\n#\n# These helpers are deliberately stateless: every call opens the database,\n# runs its statement, commits (for writes), and closes the connection.\n\nimport sqlite3\n\ndefine function db_execute that takes db_path as String, sql as String and returns String:\n    create con as Object\n    set con to sqlite3.connect(db_path)\n    con.execute(sql)\n    con.commit()\n    con.close()\n    return \"ok\"\n\ndefine function db_query that takes db_path as String, sql as String and returns List:\n    create con as Object\n    set con to sqlite3.connect(db_path)\n    create cur as Object\n    set cur to con.execute(sql)\n    create out as List\n    set out to []\n    for each r in cur:\n        out.append(list(r))\n    con.close()\n    return out\n", "agk/stdlib/statutils.agk": "# AGK-Real standard library: statistics utilities.\n# Import with: import statutils\n# (Functions are inlined into your program; call them directly.)\n# Descriptive statistics over lists of numbers \u2014\n# built on Python's statistics module.\n\nimport statistics\n\ndefine function mean_of that takes xs as List and returns Float:\n    if len(xs) == 0:\n        raise \"statutils.mean_of: empty list\"\n    return statistics.mean(xs)\n\ndefine function median_of that takes xs as List and returns Float:\n    if len(xs) == 0:\n        raise \"statutils.median_of: empty list\"\n    return statistics.median(xs)\n\ndefine function stdev_of that takes xs as List and returns Float:\n    if len(xs) < 2:\n        raise \"statutils.stdev_of: need at least 2 values\"\n    return statistics.stdev(xs)\n\ndefine function variance_of that takes xs as List and returns Float:\n    if len(xs) < 2:\n        raise \"statutils.variance_of: need at least 2 values\"\n    return statistics.variance(xs)\n\ndefine function mode_of that takes xs as List:\n    if len(xs) == 0:\n        raise \"statutils.mode_of: empty list\"\n    return statistics.mode(xs)\n\ndefine function min_max_of that takes xs as List and returns List:\n    if len(xs) == 0:\n        raise \"statutils.min_max_of: empty list\"\n    return [min(xs), max(xs)]\n", "agk/stdlib/strutils.agk": "# AGK-Real standard library: string utilities.\n# Import with: import strutils\n# (Functions are inlined into your program; call them directly.)\n\ndefine function shout that takes s as String and returns String:\n    return s.upper() + \"!\"\n\ndefine function repeat_string that takes s as String, n as Integer and returns String:\n    create out as String\n    set out to \"\"\n    create i as Integer\n    set i to 0\n    while i < n:\n        set out to out + s\n        set i to i + 1\n    return out\n\ndefine function join_lines that takes lines as List and returns String:\n    create out as String\n    set out to \"\"\n    for each line in lines:\n        set out to out + line + \"\\n\"\n    return out\n\ndefine function slug that takes s as String and returns String:\n    return s.lower().replace(\" \", \"-\")\n", "agk/stdlib/sysutils.agk": "# AGK-Real standard library: system utilities.\n# Import with: import sysutils\n# (Functions are inlined into your program; call them directly.)\n# Environment variables, command-line arguments, and platform info \u2014\n# built on Python's os / sys / platform modules.\n\nimport os\nimport sys\nimport platform\n\ndefine function getenv that takes name as String and returns String:\n    return os.environ.get(name, \"\")\n\ndefine function getenv_or that takes name as String, default as String and returns String:\n    return os.environ.get(name, default)\n\ndefine function setenv that takes name as String, value as String:\n    os.environ.update({name: value})\n\ndefine function argv that returns List:\n    create out as List\n    set out to []\n    create first as Boolean\n    set first to true\n    for each a in sys.argv:\n        if first:\n            set first to false\n        otherwise:\n            out.append(a)\n    return out\n\ndefine function exit_with_code that takes n as Integer:\n    sys.exit(n)\n\ndefine function platform_name that returns String:\n    return platform.system()\n\ndefine function python_version that returns String:\n    return platform.python_version()\n\ndefine function cwd that returns String:\n    return os.getcwd()\n\ndefine function home_dir that returns String:\n    return os.path.expanduser(\"~\")\n\ndefine function path_sep that returns String:\n    return os.sep\n", "agk/stdlib/tensor.agk": "# AGK-Real standard library: tensor primitives for neural network inference.\n# Import with: import tensor\n# (Functions are inlined into your program; call them directly.)\n#\n# NumPy-backed n-dimensional array operations: creation, shape queries,\n# matrix multiplication, elementwise math, softmax, RMSNorm, SiLU,\n# row/column selection, stacking, random sampling and .npz weight\n# loading. Everything is float32, the standard dtype for inference.\n#\n# These are the building blocks the `infer` module uses to run a real\n# transformer: AGK orchestrates, NumPy does the arithmetic.\n#\n# Nothing here is imported until you call it: importing this AGK module\n# never requires NumPy to be installed. Every function raises a clear\n# \"pip install numpy\" error when it is missing.\n#\n# Requires: pip install numpy\n\nimport importlib\nimport math\n\n\ndefine function _tensor_need that returns Object:\n    try:\n        return importlib.import_module(\"numpy\")\n    catch:\n        raise \"tensor: this needs the 'numpy' Python package. Install it with: pip install numpy\"\n\n\ndefine function tensor_zeros that takes shape as List returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.zeros(shape, np.float32)\n\n\ndefine function tensor_ones that takes shape as List returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.ones(shape, np.float32)\n\n\ndefine function tensor_randn that takes shape as List, seed as Integer returns Object:\n    create np as Object\n    set np to _tensor_need()\n    np.random.seed(seed)\n    create total as Integer\n    set total to 1\n    for each d in shape:\n        set total to total * d\n    create flat as Object\n    set flat to np.random.standard_normal(total)\n    return np.reshape(flat, shape)\n\n\ndefine function tensor_from_list that takes xs as List returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.array(xs, np.float32)\n\n\ndefine function tensor_to_list that takes t as Object returns List:\n    return t.tolist()\n\n\ndefine function tensor_shape that takes t as Object returns List:\n    create out as List\n    set out to []\n    for each d in t.shape:\n        out.append(int(d))\n    return out\n\n\ndefine function tensor_numel that takes t as Object returns Integer:\n    create n as Integer\n    set n to 1\n    for each d in tensor_shape(t):\n        set n to n * d\n    return n\n\n\ndefine function tensor_reshape that takes t as Object, shape as List returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.reshape(t, shape)\n\n\ndefine function tensor_transpose that takes t as Object returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.transpose(t)\n\n\ndefine function tensor_matmul that takes a as Object, b as Object returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.matmul(a, b)\n\n\ndefine function tensor_add that takes a as Object, b as Object returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.add(a, b)\n\n\ndefine function tensor_sub that takes a as Object, b as Object returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.subtract(a, b)\n\n\ndefine function tensor_mul that takes a as Object, b as Object returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.multiply(a, b)\n\n\ndefine function tensor_div that takes a as Object, b as Object returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.divide(a, b)\n\n\ndefine function tensor_neg that takes t as Object returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.negative(t)\n\n\ndefine function tensor_exp that takes t as Object returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.exp(t)\n\n\ndefine function tensor_sqrt that takes t as Object returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.sqrt(t)\n\n\ndefine function tensor_sum that takes t as Object returns Float:\n    create np as Object\n    set np to _tensor_need()\n    return float(np.sum(t))\n\n\ndefine function tensor_sum_axis that takes t as Object, axis as Integer returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.sum(t, axis)\n\n\ndefine function tensor_max that takes t as Object returns Float:\n    create np as Object\n    set np to _tensor_need()\n    return float(np.max(t))\n\n\ndefine function tensor_argmax that takes t as Object returns Integer:\n    create np as Object\n    set np to _tensor_need()\n    return int(np.argmax(t))\n\n\ndefine function tensor_take that takes t as Object, idx as List, axis as Integer returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.take(t, idx, axis)\n\n\ndefine function tensor_take1 that takes t as Object, i as Integer, axis as Integer returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.take(t, i, axis)\n\n\ndefine function tensor_stack that takes xs as List returns Object:\n    create np as Object\n    set np to _tensor_need()\n    return np.stack(xs, 0)\n\n\ndefine function tensor_softmax_1d that takes t as Object returns Object:\n    create e as Object\n    set e to tensor_exp(tensor_sub(t, tensor_max(t)))\n    return tensor_div(e, tensor_sum(e))\n\n\ndefine function tensor_softmax_rows that takes t as Object returns Object:\n    create e as Object\n    set e to tensor_exp(tensor_sub(t, tensor_max(t)))\n    create s as Object\n    set s to tensor_sum_axis(e, 1)\n    create sh as List\n    set sh to tensor_shape(e)\n    create s2 as Object\n    set s2 to tensor_reshape(s, [sh[0], 1])\n    return tensor_div(e, s2)\n\n\ndefine function tensor_rmsnorm that takes x as Object, weight as Object, eps as Float returns Object:\n    create ms as Float\n    set ms to tensor_sum(tensor_mul(x, x)) / (tensor_numel(x) * 1.0)\n    create r as Float\n    set r to math.sqrt(ms + eps)\n    return tensor_div(tensor_mul(x, weight), r)\n\n\ndefine function tensor_sigmoid that takes t as Object returns Object:\n    return tensor_div(1.0, tensor_add(1.0, tensor_exp(tensor_neg(t))))\n\n\ndefine function tensor_silu that takes t as Object returns Object:\n    return tensor_mul(t, tensor_sigmoid(t))\n\n\ndefine function tensor_max_abs_diff that takes a as Object, b as Object returns Float:\n    create np as Object\n    set np to _tensor_need()\n    return float(np.max(np.abs(np.subtract(a, b))))\n\n\ndefine function tensor_seed that takes seed as Integer:\n    create np as Object\n    set np to _tensor_need()\n    np.random.seed(seed)\n\n\ndefine function tensor_random_choice that takes n as Integer, probs as List returns Integer:\n    create np as Object\n    set np to _tensor_need()\n    create total as Float\n    set total to 0.0\n    for each p in probs:\n        set total to total + p\n    create normed as List\n    set normed to []\n    for each p in probs:\n        normed.append(p / total)\n    create r as Object\n    set r to np.random.choice(n, 1, true, normed)\n    return int(r[0])\n\n\ndefine function tensor_load_npz that takes path as String returns Object:\n    create np as Object\n    set np to _tensor_need()\n    try:\n        return np.load(path)\n    catch:\n        raise \"tensor: could not load weights file '{path}'\"\n\n\ndefine function tensor_npz_names that takes npz as Object returns List:\n    return npz.files\n\n\ndefine function tensor_npz_get that takes npz as Object, name as String returns Object:\n    try:\n        return npz[name]\n    catch:\n        raise \"tensor: weights file has no array named '{name}'\"\n", "agk/stdlib/timeutils.agk": "# AGK-Real standard library: time utilities.\n# Import with: import timeutils\n# (Functions are inlined into your program; call them directly.)\n# Built on Python's time module. All times are in seconds.\n\nimport time\n\ndefine function sleep_seconds that takes s as Float:\n    if s < 0:\n        raise \"timeutils.sleep_seconds: seconds must not be negative\"\n    time.sleep(s)\n\ndefine function epoch_seconds that returns Float:\n    return time.time()\n\ndefine function monotonic_seconds that returns Float:\n    return time.monotonic()\n\ndefine function cpu_seconds that returns Float:\n    return time.process_time()\n\ndefine function format_epoch that takes ts as Float and returns String:\n    return time.strftime(\"%Y-%m-%d %H:%M:%S\", time.localtime(ts))\n", "agk/stdlib/tokenizer.agk": "# AGK-Real standard library: tokenizer helpers for LLM work.\n# Import with: import tokenizer\n# (Functions are inlined into your program; call them directly.)\n#\n# Token counting, truncation and chunking on top of HuggingFace\n# tokenizers, plus tiktoken (OpenAI) encode/decode, plus a dependency-free\n# estimate. Nothing here is imported until you call it: importing this\n# AGK module never requires the Python packages to be installed. Every\n# backend function raises a clear \"pip install ...\" error when its\n# package is missing.\n#\n# Requires for HF functions: pip install transformers\n# Requires for tiktoken functions: pip install tiktoken\n\nimport importlib\n\n\ndefine function _tok_need that takes package as String and returns Object:\n    try:\n        return importlib.import_module(package)\n    catch:\n        raise \"tokenizer: this needs the '{package}' Python package. Install it with: pip install {package}\"\n\n\ndefine function _tok_hf that takes model as String and returns Object:\n    create transformers as Object\n    set transformers to _tok_need(\"transformers\")\n    return transformers.AutoTokenizer.from_pretrained(model)\n\n\ndefine function tok_estimate that takes text as String and returns Integer:\n    return int(len(text) / 4) + 1\n\n\ndefine function tok_count that takes model as String, text as String and returns Integer:\n    create tok as Object\n    set tok to _tok_hf(model)\n    return len(tok.encode(text))\n\n\ndefine function tok_encode that takes model as String, text as String and returns List:\n    create tok as Object\n    set tok to _tok_hf(model)\n    return tok.encode(text)\n\n\ndefine function tok_decode that takes model as String, ids as List and returns String:\n    create tok as Object\n    set tok to _tok_hf(model)\n    return tok.decode(ids)\n\n\ndefine function _tok_count_with that takes tok as Object, text as String and returns Integer:\n    return len(tok.encode(text))\n\n\ndefine function tok_truncate that takes model as String, text as String, max_tokens as Integer and returns String:\n    create tok as Object\n    set tok to _tok_hf(model)\n    create ids as List\n    set ids to tok.encode(text)\n    create clipped as List\n    set clipped to []\n    create i as Integer\n    set i to 0\n    while i < len(ids) and i < max_tokens:\n        clipped.append(ids[i])\n        set i to i + 1\n    return tok.decode(clipped)\n\n\ndefine function tok_chunks that takes model as String, text as String, max_tokens as Integer and returns List:\n    create tok as Object\n    set tok to _tok_hf(model)\n    create parts as List\n    set parts to text.split(\"\\n\\n\")\n    create chunks as List\n    set chunks to []\n    create current as String\n    set current to \"\"\n    for each part in parts:\n        create trial as String\n        if current == \"\":\n            set trial to part\n        otherwise:\n            set trial to current + \"\\n\\n\" + part\n        if _tok_count_with(tok, trial) <= max_tokens:\n            set current to trial\n        otherwise:\n            if current != \"\":\n                chunks.append(current)\n            set current to part\n    if current != \"\":\n        chunks.append(current)\n    return chunks\n\n\ndefine function tok_tiktoken_encode that takes encoding_name as String, text as String and returns List:\n    create tiktoken as Object\n    set tiktoken to _tok_need(\"tiktoken\")\n    create enc as Object\n    set enc to tiktoken.get_encoding(encoding_name)\n    return enc.encode(text)\n\n\ndefine function tok_tiktoken_decode that takes encoding_name as String, ids as List and returns String:\n    create tiktoken as Object\n    set tiktoken to _tok_need(\"tiktoken\")\n    create enc as Object\n    set enc to tiktoken.get_encoding(encoding_name)\n    return enc.decode(ids)\n\n\ndefine function tok_tiktoken_count that takes encoding_name as String, text as String and returns Integer:\n    return len(tok_tiktoken_encode(encoding_name, text))\n", "agk/stdlib/torchutils.agk": "# AGK-Real standard library: PyTorch tensor helpers.\n# Import with: import torchutils\n# (Functions are inlined into unction torch_shape that takes t as Object and returns List:\n    return list(t.shape)\n\n\ndefine function torch_add that takes a as Object, b as Object and returns Object:\n    return a + b\n\n\ndefine function torch_sub that takes a as Object, b as Object and returns Object:\n    return a - b\n\n\ndefine function torch_mul that takes a as Object, b as Object and returns Object:\n    return a * b\n\n\ndefine function torch_matmul that takes a as Object, b as Object and returns Object:\n    create torch as Object\n    set torch to _torch_need()\n    return torch.matmul(a, b)\n\n\ndefine function torch_softmax that takes t as Object, dim as Integer and returns Object:\n    create torch as Object\n    set torch to _torch_need()\n    return torch.softmax(t, dim)\n\n\ndefine function torch_argmax that takes t as Object and returns Integer:\n    create torch as Object\n    set torch to _torch_need()\n    return int(torch.argmax(t))\n\n\ndefine function torch_sum that takes t as Object and returns Float:\n    create torch as Object\n    set torch to _torch_need()\n    return float(torch.sum(t))\n\n\ndefine function torch_mean that takes t as Object and returns Float:\n    create torch as Object\n    set torch to _torch_need()\n    return float(torch.mean(t))\n\n\ndefine function torch_norm that takes t as Object and returns Float:\n    create torch as Object\n    set torch to _torch_need()\n    return float(torch.norm(t))\n\n\ndefine function torch_to_list that takes t as Object and returns List:\n    return t.tolist()\n\n\ndefine function torch_save that takes t as Object, path as String:\n    create torch as Object\n    set torch to _torch_need()\n    torch.save(t, path)\n\n\ndefine function torch_load that takes path as String and returns Object:\n    create torch as Object\n    set torch to _torch_need()\n    return torch.load(path)\n", "agk/stdlib/transformers.agk": "# AGK-Real standard library: HuggingFace transformers helpers.\n# Import with: import transformers\n# (Functions are inlined into your program; call them directly.)\n#\n# Text generation, sentiment classification, summarization, translation,\n# fill-mask, question answering, zero-shot classification, embeddings,\n# tokenization and model downloading via the HuggingFace transformers\n# Python library. Nothing here is imported until you call it: importing\n# this AGK module never requires the Python packages to be installed.\n# Every function raises a clear \"pip install ...\" error when its\n# backend is missing.\n#\n# Requires: pip install transformers torch\n# (some tokenizers additionally need: pip install sentencepiece)\n#\n# Note on tf_generate: AGK cannot pass keyword arguments to Python\n# calls, so generation runs as a small explicit loop (tokenize, forward,\n# pick the next token, repeat) instead of model.generate(...). It is\n# slower than the native call but needs no kwargs and behaves the same\n# for greedy (temperature 0) and sampled decoding.\n\nimport importlib\n\n\ndefine function _tf_need that takes package as String and returns Object:\n    try:\n        return importlib.import_module(package)\n    catch:\n        raise \"transformers: this needs the '{package}' Python package. Install it with: pip install {package}\"\n\n\ndefine function tf_generate that takes model as String, prompt as String, max_new_tokens as Integer = 20, temperature as Float = 0.0 and returns String:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create torch as Object\n    set torch to _tf_need(\"torch\")\n    create tok as Object\n    set tok to transformers.AutoTokenizer.from_pretrained(model)\n    create m as Object\n    set m to transformers.AutoModelForCausalLM.from_pretrained(model)\n    m.eval()\n    create ids as List\n    set ids to tok.encode(prompt)\n    create taken as Integer\n    set taken to 0\n    create finished as Boolean\n    set finished to false\n    while taken < max_new_tokens and not finished:\n        create inp as Object\n        set inp to torch.tensor([ids])\n        create out as Object\n        set out to m(inp)\n        create logits as Object\n        set logits to out.logits\n        create last as Object\n        set last to logits[0][len(ids) - 1]\n        create next_id as Integer\n        if temperature <= 0.0:\n            set next_id to int(torch.argmax(last))\n        otherwise:\n            create probs as Object\n            set probs to torch.softmax(last / temperature, 0)\n            set next_id to int(torch.multinomial(probs, 1)[0])\n        if next_id == tok.eos_token_id:\n            set finished to true\n        otherwise:\n            ids.append(next_id)\n        set taken to taken + 1\n    return tok.decode(ids)\n\n\ndefine function tf_generate_pipeline that takes model as String, prompt as String and returns String:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create gen as Object\n    set gen to transformers.pipeline(\"text-generation\", model)\n    create out as Object\n    set out to gen(prompt)\n    return out[0][\"generated_text\"]\n\n\ndefine function tf_classify that takes model as String, text as String and returns Dict:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create clf as Object\n    set clf to transformers.pipeline(\"sentiment-analysis\", model)\n    create out as Object\n    set out to clf(text)\n    create top as Object\n    set top to out[0]\n    return {\"label\": top[\"label\"], \"score\": top[\"score\"]}\n\n\ndefine function tf_summarize that takes model as String, text as String and returns String:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create summ as Object\n    set summ to transformers.pipeline(\"summarization\", model)\n    create out as Object\n    set out to summ(text)\n    return out[0][\"summary_text\"]\n\n\ndefine function tf_translate that takes model as String, text as String and returns String:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create tra as Object\n    set tra to transformers.pipeline(\"translation\", model)\n    create out as Object\n    set out to tra(text)\n    return out[0][\"translation_text\"]\n\n\ndefine function tf_fill_mask that takes model as String, text as String and returns String:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create fill as Object\n    set fill to transformers.pipeline(\"fill-mask\", model)\n    create out as Object\n    set out to fill(text)\n    return out[0][\"token_str\"]\n\n\ndefine function tf_answer that takes model as String, question as String, context as String and returns String:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create qa as Object\n    set qa to transformers.pipeline(\"question-answering\", model)\n    create out as Object\n    set out to qa(question, context)\n    return out[\"answer\"]\n\n\ndefine function tf_zero_shot that takes model as String, text as String, labels as List and returns String:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create zsc as Object\n    set zsc to transformers.pipeline(\"zero-shot-classification\", model)\n    create out as Object\n    set out to zsc(text, labels)\n    return out[\"labels\"][0]\n\n\ndefine function tf_embed that takes model as String, text as String and returns List:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create torch as Object\n    set torch to _tf_need(\"torch\")\n    create fe as Object\n    set fe to transformers.pipeline(\"feature-extraction\", model)\n    create feats as Object\n    set feats to fe(text)\n    create mat as Object\n    set mat to torch.tensor(feats[0])\n    create pooled as Object\n    set pooled to torch.mean(mat, 0)\n    return pooled.tolist()\n\n\ndefine function tf_encode that takes model as String, text as String and returns List:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create tok as Object\n    set tok to transformers.AutoTokenizer.from_pretrained(model)\n    return tok.encode(text)\n\n\ndefine function tf_decode that takes model as String, ids as List and returns String:\n    create transformers as Object\n    set transformers to _tf_need(\"transformers\")\n    create tok as Object\n    set tok to transformers.AutoTokenizer.from_pretrained(model)\n    return tok.decode(ids)\n\n\ndefine function tf_download that takes model as String and returns String:\n    create hub as Object\n    set hub to _tf_need(\"huggingface_hub\")\n    return hub.snapshot_download(model)\n", "agk/stdlib/urlutils.agk": "# AGK-Real standard library: URL utilities.\n# Import with: import urlutils\n# (Functions are inlined into your program; call them directly.)\n# Percent-encoding, decoding, and URL splitting \u2014 built on Python's\n# urllib.parse.\n\nimport urllib.parse\n\ndefine function url_encode that takes s as String and returns String:\n    return urllib.parse.quote(s, \"\")\n\ndefine function url_decode that takes s as String and returns String:\n    return urllib.parse.unquote(s)\n\ndefine function url_join that takes base as String, url as String and returns String:\n    return urllib.parse.urljoin(base, url)\n\ndefine function url_parts that takes s as String and returns List:\n    create p as Object\n    set p to urllib.parse.urlsplit(s)\n    return [p.scheme, p.netloc, p.path, p.query]\n\ndefine function url_scheme that takes s as String and returns String:\n    return urllib.parse.urlsplit(s).scheme\n\ndefine function url_host that takes s as String and returns String:\n    return urllib.parse.urlsplit(s).netloc\n", "agk/stdlib/uuidutils.agk": "# AGK-Real standard library: UUID generation.\n# Import with: import uuidutils\n# (Functions are inlined into your program; call them directly.)\n# Universally unique identifiers \u2014 built on Python's uuid module.\n\nimport uuid\n\ndefine function uuid4_hex that returns String:\n    return uuid.uuid4().hex\n\ndefine function uuid4_str that returns String:\n    return str(uuid.uuid4())\n\ndefine function uuid1_hex that returns String:\n    return uuid.uuid1().hex\n", "agk/stdlib/xmlutils.agk": "# AGK-Real standard library: simple XML utilities.\n# Import with: import xmlutils\n# (Functions are inlined into your program; call them directly.)\n# Tag lookup for small XML documents \u2014 built on Python's\n# xml.etree.ElementTree. For large or namespace-heavy XML, use\n# Python's xml libraries directly.\n\nimport xml.etree.ElementTree\n\ndefine function xml_root_tag that takes xml_text as String and returns String:\n    create root as Object\n    try:\n        set root to xml.etree.ElementTree.fromstring(xml_text)\n    catch:\n        raise \"xmlutils: invalid XML\"\n    return root.tag\n\ndefine function xml_find_texts that takes xml_text as String, tag as String and returns List:\n    create root as Object\n    try:\n        set root to xml.etree.ElementTree.fromstring(xml_text)\n    catch:\n        raise \"xmlutils: invalid XML\"\n    create out as List\n    set out to []\n    for each el in root.iter(tag):\n        out.append(el.text)\n    return out\n\ndefine function xml_find_attr that takes xml_text as String, tag as String, attr as String and returns String:\n    create root as Object\n    try:\n        set root to xml.etree.ElementTree.fromstring(xml_text)\n    catch:\n        raise \"xmlutils: invalid XML\"\n    for each el in root.iter(tag):\n        create v as String\n        set v to el.attrib.get(attr, \"\")\n        if v is not \"\":\n            return v\n    return \"\"\n", "agk/stdlib/ziputils.agk": "# AGK-Real standard library: compression and zip archives.\n# Import with: import ziputils\n# (Functions are inlined into your program; call them directly.)\n# gzip for strings (compressed bytes travel as hex text) and zipfile\n# for archives \u2014 built on Python's gzip / zipfile / codecs.\n\nimport gzip\nimport zipfile\nimport codecs\n\ndefine function gzip_compress that takes s as String and returns String:\n    return gzip.compress(s.encode(\"utf-8\")).hex()\n\ndefine function gzip_decompress that takes h as String and returns String:\n    create raw as Object\n    try:\n        set raw to gzip.decompress(codecs.decode(h, \"hex\"))\n    catch:\n        raise \"ziputils.gzip_decompress: input is not valid compressed data\"\n    return raw.decode(\"utf-8\")\n\ndefine function zip_create that takes zip_path as String, files as List:\n    create zf as Object\n    set zf to zipfile.ZipFile(zip_path, \"w\")\n    for each f in files:\n        zf.write(f)\n    zf.close()\n\ndefine function zip_list that takes zip_path as String and returns List:\n    create zf as Object\n    set zf to zipfile.ZipFile(zip_path, \"r\")\n    create names as List\n    set names to zf.namelist()\n    zf.close()\n    return names\n\ndefine function zip_read_text that takes zip_path as String, name as String and returns String:\n    create zf as Object\n    set zf to zipfile.ZipFile(zip_path, \"r\")\n    create data as String\n    try:\n        set data to zf.read(name).decode(\"utf-8\")\n    catch:\n        zf.close()\n        raise \"ziputils.zip_read_text: no such file '{name}' in archive\"\n    zf.close()\n    return data\n"};

async function loadPyodideLib() {
  // Primary CDN is attempted via the <script> tag in <head>. If it did
  // not define loadPyodide (blocked/slow network), try a fallback CDN
  // before giving up with a clear message.
  if (typeof loadPyodide !== "undefined") return;
  const fallbacks = [
    "https://unpkg.com/pyodide@0.26.4/full/pyodide.js",
    "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"
  ];
  for (const url of fallbacks) {
    try {
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = url;
        s.onload = resolve;
        s.onerror = () => reject(new Error("script error"));
        document.head.appendChild(s);
      });
    } catch (e) { /* try next */ }
    if (typeof loadPyodide !== "undefined") return;
  }
  throw new Error("could not download Pyodide from a CDN — check your internet connection and reload");
}

async function init() {
  try {
    await loadPyodideLib();
    pyodide = await loadPyodide();
    for (const [path, content] of Object.entries(SOURCES)) {
      const dir = path.split("/").slice(0, -1).join("/");
      try { pyodide.FS.mkdir("/" + dir); } catch (e) { /* exists */ }
      pyodide.FS.writeFile("/" + path, content);
    }
    pyodide.runPython(`

sys.path.insert(0, "/")
import io, traceback
from contextlib import redirect_stdout
import agk.pipeline

def agk_compile(src):
    try:
        code, warnings = agk.pipeline.compile_source(src, filename="playground.agk")
        return {"ok": True, "code": code, "warnings": warnings}
    except Exception as e:
        return {"ok": False, "error": str(e)}

def agk_run(src):
    try:
        code, warnings = agk.pipeline.compile_source(src, filename="playground.agk")
    except Exception as e:
        return {"ok": False, "error": str(e)}
    ns = {"__name__": "__main__"}
    buf = io.StringIO()
    try:
        with redirect_stdout(buf):
            exec(compile(code, "playground.agk", "exec"), ns)
    except Exception as e:
        tb = "".join(traceback.format_exception(type(e), e, e.__traceback__))
        return {"ok": False, "error": tb, "output": buf.getvalue()}
    return {"ok": True, "output": buf.getvalue(), "warnings": warnings}
`);
    statusEl.textContent = "ready";
    statusEl.className = "ready";
    runBtn.disabled = false;
    compileBtn.disabled = false;
  } catch (e) {
    statusEl.textContent = "failed to load: " + e;
  }
}

function doCompile() {
  const r = pyodide.globals.get("agk_compile")(srcEl.value).toJs({dict_converter: Object.fromEntries});
  if (r.ok) {
    viewEl.value = "python";
    document.getElementById("outlabel").textContent = "generated python";
    let html = "";
    for (const w of r.warnings || []) html += `<span class="warn">${esc(w)}</span>\n`;
    show(html + esc(r.code));
  } else {
    viewEl.value = "output";
    document.getElementById("outlabel").textContent = "output";
    show(`<span class="err">${esc(r.error)}</span>`);
  }
}

function doRun() {
  const r = pyodide.globals.get("agk_run")(srcEl.value).toJs({dict_converter: Object.fromEntries});
  viewEl.value = "output";
  document.getElementById("outlabel").textContent = "output";
  let html = "";
  const out = r.output || "";
  if (out) html += esc(out);
  if (r.ok) {
    for (const w of r.warnings || []) html += `<span class="warn">${esc(w)}</span>\n`;
    if (!html) html = '<span class="ok">(no output)</span>';
  } else {
    html += `<span class="err">${esc(r.error)}</span>`;
  }
  show(html);
}

runBtn.onclick = doRun;
compileBtn.onclick = doCompile;
viewEl.onchange = () => {
  document.getElementById("outlabel").textContent =
    viewEl.value === "python" ? "generated python" : "output";
  if (viewEl.value === "python") doCompile();
};
