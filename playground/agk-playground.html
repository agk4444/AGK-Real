 s.value is not None:\n                s.value = self._check_expr(s.value)\n        elif isinstance(s, A.YieldStmt):\n            # v0.4.0: `yield` makes the enclosing function a generator.\n            if self._in_function == 0:\n                self.error(\"'yield' outside a function\", s)\n            if self._in_async_function > 0:\n                self.error(\"'yield' is not allowed in an async function \"\n                           \"(AGK has no async generators)\", s)\n            if s.value is not None:\n                s.value = self._check_expr(s.value)\n        elif isinstance(s, A.ExprStmt):\n            s.expr = self._check_expr(s.expr)\n        else:\n            self.error(\"unexpected statement\", s)\n        return s\n\n    # -- expressions ---------------------------------------------------------------\n\n    def _check_expr(self, e):\n        if isinstance(e, (A.IntLit, A.FloatLit, A.StringLit, A.BoolLit)):\n            return e\n        if isinstance(e, A.Name):\n            return self._resolve_name(e)\n        if isinstance(e, A.BinOp):\n            e.left = self._check_expr(e.left)\n            e.right = self._check_expr(e.right)\n            return e\n        if isinstance(e, A.UnaryOp):\n            e.operand = self._check_expr(e.operand)\n            return e\n        if isinstance(e, A.AwaitExpr):\n            # v0.4.0: `await` only inside an async function.\n            if self._in_async_function == 0:\n                self.error(\"'await' outside an async function\", e)\n            e.operand = self._check_expr(e.operand)\n            return e\n        if isinstance(e, A.Call):\n            return self._check_call(e)\n        if isinstance(e, A.Attribute):\n            e.obj = self._check_expr(e.obj)\n            return e\n        if isinstance(e, A.Index):\n            e.obj = self._check_expr(e.obj)\n            e.index = self._check_expr(e.index)\n            return e\n        if isinstance(e, A.ListLit):\n            e.elements = [self._check_expr(x) for x in e.elements]\n            return e\n        if isinstance(e, A.DictLit):\n            e.pairs = [(self._check_expr(k), self._check_expr(v))\n                       for k, v in e.pairs]\n            return e\n        self.error(\"unexpected expression\", e)\n\n    def _resolve_name(self, node):\n        scope, entry = self._scope.lookup(node.id)\n        if entry is not None:\n            entry[\"used\"] = True\n            return node\n        if (self._class_fields is not None\n                and node.id in self._class_fields):\n            # bare field read -> self.<field>\n            self._scope.lookup(\"self\")[1][\"used\"] = True\n            return A.Attribute(A.Name(\"self\", line=node.line, col=node.col),\n                               node.id, line=node.line, col=node.col)\n        if node.id in BUILTINS or node.id in self.functions \\\n                or node.id in self.classes or node.id in self.extern_functions:\n            return node\n        self.error(f\"undefined variable '{node.id}'{self._suggest(node.id)}\",\n                   node)\n\n    def _arity_error(self, kind, name, params, got, node):\n        required = sum(1 for p in params if p.default is None)\n        total = len(params)\n        if required == total:\n            self.error(\n                f\"{kind} '{name}' takes {total} argument(s), got {got}\", node)\n        elif not required <= got <= total:\n            self.error(\n                f\"{kind} '{name}' takes {required} to {total} arguments, \"\n                f\"got {got}\", node)\n\n    def _check_call(self, e):\n        e.args = [self._check_expr(a) for a in e.args]\n        func = e.func\n        if isinstance(func, A.Name):\n            name = func.id\n            if name in self.extern_functions:\n                # FFI calls check arity exactly like normal functions\n                # (extern params never have defaults). Checked before\n                # BUILTINS so an extern may deliberately shadow one.\n                params = self.extern_functions[name].params\n                if len(e.args) != len(params):\n                    self._arity_error(\"extern function\", name, params,\n                                      len(e.args), e)\n                return e\n            if name in BUILTINS:\n                return e\n            if name in self.functions:\n                params = self.functions[name].params\n                required = sum(1 for p in params if p.default is None)\n                if not required <= len(e.args) <= len(params):\n                    self._arity_error(\"function\", name, params,\n                                      len(e.args), e)\n                return e\n            if name in self.classes:\n                ctor = self.classes[name].constructor\n                if ctor is not None:\n                    params = ctor.params\n                    required = sum(1 for p in params if p.default is None)\n                    if not required <= len(e.args) <= len(params):\n                        self._arity_error(\"constructor of\", name, params,\n                                          len(e.args), e)\n                return e\n            # maybe a local variable holding a callable, or a method via self\n            _, entry = self._scope.lookup(name)\n            if entry is not None:\n                entry[\"used\"] = True\n                return e\n            self.error(f\"undefined function '{name}'{self._suggest(name)}\",\n                       func)\n        # Attribute or other callable: check the object, can't verify arity\n        e.func = self._check_expr(func)\n        return e\n\n    # -- warnings ---------------------------------------------------------------------\n\n    def _check_unused(self, scope, skip=()):\n        for name, entry in scope.vars.items():\n            if name in skip:\n                continue\n            node = entry[\"node\"]\n            if isinstance(node, (A.Import, A.Param)):\n                continue\n            if isinstance(node, A.CreateStmt) and not entry[\"assigned\"]:\n                self.warn(f\"variable '{name}' is never assigned a value\", node)\n            elif not entry[\"used\"]:\n                self.warn(f\"unused variable '{name}'\", node)\n\n\ndef analyze(program, filename=\"<input>\", predeclared=(), extra_top_levels=()):\n    \"\"\"Run semantic analysis. Returns (rewritten_program, warnings).\n    Raises SemanticError on the first error.\n\n    predeclared: names treated as already-declared (the REPL carries\n    variables across inputs). extra_top_levels: programs whose top-level\n    functions/classes/constants are visible (compiled stdlib modules).\n    \"\"\"\n    analyzer = SemanticAnalyzer(filename)\n    warnings = analyzer.analyze(program, predeclared=predeclared,\n                                extra_top_levels=extra_top_levels)\n    return program, warnings\n", "agk/test_runner.py": "\"\"\"AGK-Real v2 test runner.\n\nDiscovers ``test_*.agk`` / ``*_test.agk`` files, compiles each with the\nreal pipeline (``compile_source`` with ``annotate=True`` and the file's\nown directory on the search path so sibling ``import``s work), executes\nit, and runs every namespace callable named ``test_*``. A test passes\nif it returns without raising; anything raised (test authors use\n``raise \"message\"``) fails it, and the failure is reported with an\nAGK-mapped traceback so it points at AGK source lines, not generated\nPython.\n\nFixtures: if the module defines ``setup`` it runs before each test\nfunction; ``teardown`` runs after each one -- even when setup or the\ntest itself raised. Neither name is treated as a test.\n\nMocks: every test module gets ``mock(name)``, ``mock_return(name,\nvalue)`` and ``unmock(m)`` helpers (see agk/mock.py). Because imports\nare compiled inline into a single namespace, replacing a module-level\nfunction name with a Mock intercepts every call to it, including calls\nmade from imported helper code. The names ``mock``, ``mock_return``\nand ``unmock`` are reserved in test files.\n\nCoverage: with ``coverage=True`` (``agk test --coverage``), executed\ngenerated-Python lines are traced with sys.settrace and mapped back to\nAGK source lines via the `# AGK file:line` annotations; a per-file\ncoverage table (covered / total executable AGK lines) is printed after\nthe summary. Bundled stdlib modules are excluded from the table.\n\nPublic API: ``run_tests(path, coverage=False) -> int`` (exit code),\n``collect(path)``.\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\nfrom .errors import AGKError\nfrom .mock import MOCK_PRELUDE, install_helpers\nfrom .pipeline import (STDLIB_DIR, agk_line_map, compile_source,\n                       format_agk_traceback)\nfrom .pkg import find_project_root\n\n\ndef collect(path):\n    \"\"\"Find AGK test files under ``path``.\n\n    A directory is searched recursively for ``test_*.agk`` and\n    ``*_test.agk`` files (returned sorted). A single file given\n    explicitly is collected as-is. Raises FileNotFoundError when the\n    path does not exist.\n    \"\"\"\n    p = Path(path)\n    if not p.exists():\n        raise FileNotFoundError(f\"no such file or directory: '{path}'\")\n    if p.is_file():\n        return [p]\n    return sorted(\n        f for f in p.rglob(\"*.agk\")\n        if f.name.startswith(\"test_\") or f.name.endswith(\"_test.agk\")\n    )\n\n\ndef _test_names(namespace):\n    \"\"\"Sorted names of callables in the namespace starting with test_.\"\"\"\n    return sorted(\n        name for name, value in namespace.items()\n        if name.startswith(\"test_\") and callable(value)\n    )\n\n\ndef _fixture(namespace, name):\n    \"\"\"The module's fixture function, or None when absent/not callable.\"\"\"\n    fn = namespace.get(name)\n    return fn if callable(fn) else None\n\n\nclass _Tracer:\n    \"\"\"sys.settrace line tracer limited to one generated file.\n\n    Only frames whose code object filename matches the compiled test\n    file are traced, so Python builtins and the runner itself don't\n    pollute the results. Restores any previous trace function on exit.\n    \"\"\"\n\n    def __init__(self, filename):\n        self.filename = filename\n        self.lines = set()\n        self._prev = None\n\n    def __enter__(self):\n        self._prev = sys.gettrace()\n        sys.settrace(self._trace_calls)\n        return self\n\n    def __exit__(self, *exc):\n        sys.settrace(self._prev)\n        return False\n\n    def _trace_calls(self, frame, event, _arg):\n        if event == \"call\" and frame.f_code.co_filename == self.filename:\n            return self._trace_lines\n        return None\n\n    def _trace_lines(self, frame, event, _arg):\n        if event == \"line\":\n            self.lines.add(frame.f_lineno)\n        return self._trace_lines\n\n\ndef _is_stdlib(agk_file):\n    try:\n        return Path(agk_file).is_relative_to(STDLIB_DIR)\n    except (ValueError, OSError):\n        return False\n\n\nclass Coverage:\n    \"\"\"Per-AGK-file line coverage aggregated over a test run.\"\"\"\n\n    def __init__(self):\n        self._files = {}  # agk path -> [total lines set, covered lines set]\n\n    def add_run(self, code, executed_lines):\n        \"\"\"Fold one compiled test file's executed Python lines in.\n\n        ``executed_lines`` is a set of generated-Python line numbers;\n        they are mapped back to AGK (file, line) pairs via the\n        `# AGK file:line` annotations. Total executable lines are the\n        distinct AGK lines that produced generated code.\n        \"\"\"\n        for py_lineno, (agk_file, agk_lineno) in \\\n                agk_line_map(code).items():\n            if _is_stdlib(agk_file):\n                continue\n            total, covered = self._files.setdefault(agk_file, (set(), set()))\n            total.add(agk_lineno)\n            if py_lineno in executed_lines:\n                covered.add(agk_lineno)\n\n    def rows(self):\n        \"\"\"Sorted [(agk_file, pct, covered, total)] for the report.\"\"\"\n        out = []\n        for agk_file in sorted(self._files):\n            total, covered = self._files[agk_file]\n            pct = round(100 * len(covered) / len(total)) if total else 100\n            out.append((agk_file, pct, len(covered), len(total)))\n        return out\n\n\ndef _exec_tests(path, code, namespace, results):\n    \"\"\"Exec one compiled test module and run its test_* functions.\n\n    Appends (label, ok) tuples to ``results``. Returns True when the\n    module executed cleanly (individual test failures still return\n    True; they are recorded in ``results``).\n    \"\"\"\n    try:\n        exec(compile(code, str(path), \"exec\"), namespace)  # noqa: S102\n    except Exception:\n        print(f\"{path}: module-level error\", file=sys.stderr)\n        exc_type, exc_value, tb = sys.exc_info()\n        sys.stderr.write(format_agk_traceback(exc_type, exc_value, tb, code))\n        results.append((str(path), False))\n        return False\n    setup = _fixture(namespace, \"setup\")\n    teardown = _fixture(namespace, \"teardown\")\n    for name in _test_names(namespace):\n        try:\n            try:\n                if setup is not None:\n                    setup()\n                namespace[name]()\n            finally:\n                if teardown is not None:\n                    teardown()\n        except Exception:\n            print(f\"FAIL {path}::{name}\")\n            exc_type, exc_value, tb = sys.exc_info()\n            sys.stderr.write(\n                format_agk_traceback(exc_type, exc_value, tb, code))\n            results.append((f\"{path}::{name}\", False))\n        else:\n            print(f\"PASS {path}::{name}\")\n            results.append((f\"{path}::{name}\", True))\n    return True\n\n\ndef _run_file(path, results, coverage=None):\n    \"\"\"Compile, exec, and run one test file. Appends (label, ok) tuples\n    to ``results``. When ``coverage`` (a Coverage) is given, executed\n    lines are traced and folded into it. Returns True when the file\n    was collected cleanly.\"\"\"\n    try:\n        src = path.read_text(encoding=\"utf-8\")\n    except OSError as e:\n        print(f\"agk: cannot read '{path}': {e.strerror}\", file=sys.stderr)\n        results.append((str(path), False))\n        return False\n    try:\n        # Inside a project (nearest agk.json ancestor), tests may import\n        # modules from the project root or its src/ directory (e.g.\n        # src/<mod>.agk from an `agk new` skeleton) in addition to their\n        # own directory.\n        search = [str(path.parent)]\n        root = find_project_root(path.parent)\n        if root is not None:\n            root = Path(root)\n            if root != path.parent.resolve():\n                for cand in (root / \"src\", root):\n                    if cand.is_dir() and str(cand) not in search:\n                        search.append(str(cand))\n        code, warnings = compile_source(\n            src, filename=str(path), search_paths=search,\n            annotate=True, extra_top_levels=(MOCK_PRELUDE,))\n    except AGKError as e:\n        print(f\"{path}: {e}\", file=sys.stderr)\n        results.append((str(path), False))\n        return False\n    for w in warnings:\n        print(w, file=sys.stderr)\n    namespace = {}\n    namespace.update(install_helpers(namespace))\n    if coverage is None:\n        return _exec_tests(path, code, namespace, results)\n    with _Tracer(str(path)) as tracer:\n        ok = _exec_tests(path, code, namespace, results)\n    coverage.add_run(code, tracer.lines)\n    return ok\n\n\ndef run_tests(path=\".\", coverage=False):\n    \"\"\"Discover and run AGK tests under ``path``.\n\n    Prints PASS/FAIL lines plus a summary, and returns an exit code:\n    0 when everything passed, 1 when any test failed or a file could\n    not be collected, 2 when the path itself is unusable.\n\n    With ``coverage=True``, a per-file AGK line-coverage table is\n    printed after the summary.\n    \"\"\"\n    try:\n        files = collect(path)\n    except FileNotFoundError as e:\n        print(f\"agk: {e}\", file=sys.stderr)\n        return 2\n    results = []\n    cov = Coverage() if coverage else None\n    for f in files:\n        _run_file(f, results, cov)\n    passed = sum(1 for _label, ok in results if ok)\n    failed = len(results) - passed\n    print(f\"{passed} passed, {failed} failed\")\n    if failed:\n        print(\"failed:\")\n        for label, ok in results:\n            if not ok:\n                print(f\"  {label}\")\n    if cov is not None:\n        print(\"coverage:\")\n        for agk_file, pct, n_covered, n_total in cov.rows():\n            print(f\"  {agk_file}: {pct}% ({n_covered}/{n_total} lines)\")\n    return 0 if failed == 0 else 1\n", "agk/tokens.py": "\"\"\"Token types for the AGK-Real v1 lexer.\"\"\"\n\nfrom enum import Enum, auto\n\n\nclass TokenType(Enum):\n    # Keywords\n    DEFINE = auto()\n    FUNCTION = auto()\n    THAT = auto()\n    TAKES = auto()\n    AND = auto()\n    RETURNS = auto()\n    CREATE = auto()\n    SET = auto()\n    TO = auto()\n    CONSTANT = auto()\n    IF = auto()\n    ELIF = auto()\n    ELSE = auto()\n    WHILE = auto()\n    FOR = auto()\n    EACH = auto()\n    IN = auto()\n    RETURN = auto()\n    CLASS = auto()\n    VARIABLE = auto()\n    CONSTRUCTOR = auto()\n    EXTENDS = auto()\n    IMPLEMENTS = auto()\n    IMPORT = auto()\n    OR = auto()\n    NOT = auto()\n    TRUE = auto()\n    FALSE = auto()\n    AS = auto()\n    SELF = auto()\n    # v2 keywords\n    TRY = auto()\n    CATCH = auto()\n    FINALLY = auto()\n    RAISE = auto()\n    FROM = auto()\n    STEP = auto()\n    # FFI keyword\n    EXTERN = auto()\n    # v0.4.0 keywords\n    ASYNC = auto()\n    AWAIT = auto()\n    YIELD = auto()\n\n    # Literals / names\n    IDENTIFIER = auto()\n    INT = auto()\n    FLOAT = auto()\n    STRING = auto()\n\n    # Operators\n    PLUS = auto()\n    MINUS = auto()\n    STAR = auto()\n    SLASH = auto()\n    PERCENT = auto()\n    EQ = auto()        # ==\n    NEQ = auto()       # !=\n    ASSIGN = auto()     # = (only valid in `define constant`)\n    LT = auto()\n    GT = auto()\n    LTE = auto()       # <=\n    GTE = auto()       # >=\n\n    # Delimiters\n    LPAREN = auto()\n    RPAREN = auto()\n    LBRACKET = auto()\n    RBRACKET = auto()\n    LBRACE = auto()\n    RBRACE = auto()\n    COMMA = auto()\n    COLON = auto()\n    DOT = auto()\n    AT = auto()        # @ (decorators)\n\n    # Structural\n    NEWLINE = auto()\n    INDENT = auto()\n    DEDENT = auto()\n    EOF = auto()\n\n\n# Lexer emits LTE/GTE for <= and >=.\nKEYWORDS = {\n    \"define\": TokenType.DEFINE,\n    \"function\": TokenType.FUNCTION,\n    \"that\": TokenType.THAT,\n    \"takes\": TokenType.TAKES,\n    \"and\": TokenType.AND,\n    \"returns\": TokenType.RETURNS,\n    \"create\": TokenType.CREATE,\n    \"set\": TokenType.SET,\n    \"to\": TokenType.TO,\n    \"constant\": TokenType.CONSTANT,\n    \"if\": TokenType.IF,\n    \"elif\": TokenType.ELIF,\n    \"else\": TokenType.ELSE,\n    \"while\": TokenType.WHILE,\n    \"for\": TokenType.FOR,\n    \"each\": TokenType.EACH,\n    \"in\": TokenType.IN,\n    \"return\": TokenType.RETURN,\n    \"class\": TokenType.CLASS,\n    \"variable\": TokenType.VARIABLE,\n    \"constructor\": TokenType.CONSTRUCTOR,\n    \"extends\": TokenType.EXTENDS,\n    \"implements\": TokenType.IMPLEMENTS,\n    \"import\": TokenType.IMPORT,\n    \"or\": TokenType.OR,\n    \"not\": TokenType.NOT,\n    \"true\": TokenType.TRUE,\n    \"false\": TokenType.FALSE,\n    \"as\": TokenType.AS,\n    \"self\": TokenType.SELF,\n    \"try\": TokenType.TRY,\n    \"catch\": TokenType.CATCH,\n    \"finally\": TokenType.FINALLY,\n    \"raise\": TokenType.RAISE,\n    \"from\": TokenType.FROM,\n    \"step\": TokenType.STEP,\n    \"async\": TokenType.ASYNC,\n    \"await\": TokenType.AWAIT,\n    \"yield\": TokenType.YIELD,\n    \"extern\": TokenType.EXTERN,\n}\n\n\nclass Token:\n    __slots__ = (\"type\", \"value\", \"line\", \"column\")\n\n    def __init__(self, type_, value, line, column):\n        self.type = type_\n        self.value = value\n        self.line = line\n        self.column = column\n\n    def __repr__(self):\n        return f\"Token({self.type.name}, {self.value!r}, {self.line}:{self.column})\"\n\n    def __eq__(self, other):\n        return (\n            isinstance(other, Token)\n            and self.type == other.type\n            and self.value == other.value\n        )\n", "agk/typecheck.py": "\"\"\"AGK-Real static type checker.\n\nRuns after semantic analysis (wired in via pipeline.py). Verifies the\ndeclared annotations on variables, constants, function parameters, and\nreturn types against simply-inferred expression types:\n\n    Integer, Float, String, Boolean, List, Dict, None, Object,\n    plus class names as nominal types.\n\nGradual typing: anything the checker cannot infer is \"unknown\" and\nnever produces an error, and ``Object`` accepts any type in either\ndirection (it is the dynamic escape hatch). Unannotated code \u2014 e.g.\nfunctions without a declared return type \u2014 is left alone.\n\nRaises TypeCheckError (a compile error, like SemanticError) on the\nfirst mismatch. There are no generics and no union types.\n\"\"\"\n\nfrom . import ast_nodes as A\nfrom .errors import TypeCheckError\n\nINTEGER = \"Integer\"\nFLOAT = \"Float\"\nSTRING = \"String\"\nBOOLEAN = \"Boolean\"\nLIST = \"List\"\nDICT = \"Dict\"\nOBJECT = \"Object\"\nNONE_TYPE = \"None\"  # e.g. the result of print(), or a bare `return`\n\n_NUMERIC = {INTEGER, FLOAT}\n\n# builtin name -> fixed result type. Builtins with argument-dependent or\n# otherwise dynamic results (abs/min/max/round) are special-cased in\n# _call_type; everything else not listed here is \"unknown\".\n_BUILTIN_TYPES = {\n    \"print\": NONE_TYPE,\n    \"len\": INTEGER,\n    \"str\": STRING,\n    \"int\": INTEGER,\n    \"float\": FLOAT,\n    \"bool\": BOOLEAN,\n    \"input\": STRING,\n    \"list\": LIST,\n    \"dict\": DICT,\n    \"repr\": STRING,\n    \"sorted\": LIST,\n}\n\n\nclass _Param:\n    __slots__ = (\"name\", \"type_name\")\n\n    def __init__(self, name, type_name):\n        self.name = name\n        self.type_name = type_name\n\n\nclass _FuncSig:\n    __slots__ = (\"params\", \"return_type\")\n\n    def __init__(self, params, return_type):\n        self.params = params          # list of _Param\n        self.return_type = return_type  # declared type name or None\n\n\nclass _ClassInfo:\n    def __init__(self, name, base):\n        self.name = name\n        self.base = base              # base class name or None\n        self.fields = {}              # field name -> declared type name\n        self.methods = {}             # method name -> _FuncSig\n        self.ctor = None              # _FuncSig or None\n\n\nclass TypeChecker:\n    def __init__(self, filename=\"<input>\"):\n        self.filename = filename\n        self.funcs = {}    # function name -> _FuncSig\n        self.classes = {}  # class name -> _ClassInfo\n        self._top_scope = {}\n        self._scope = None       # current function scope: name -> type|None\n        self._func_sig = None    # _FuncSig of the function being checked\n        self._func_label = \"\"    # e.g. \"function 'f'\" (for messages)\n        self._class = None       # _ClassInfo of the class being checked\n\n    # -- helpers ----------------------------------------------------------\n\n    def error(self, message, node):\n        raise TypeCheckError(message, self.filename, node.line, node.col)\n\n    def _assignable(self, want, got):\n        \"\"\"Can a value of inferred type `got` be stored where `want` is\n        declared? Either side may be None (unknown) \u2014 gradual typing:\n        unknown is always accepted.\"\"\"\n        if want is None or got is None:\n            return True\n        if want == OBJECT or got == OBJECT:\n            return True  # Object is the dynamic escape hatch\n        if want == got:\n            return True\n        if want == FLOAT and got == INTEGER:\n            return True  # numeric widening\n        return self._is_subclass(got, want)\n\n    def _is_subclass(self, child, parent):\n        \"\"\"Nominal subclass check over the collected class table.\"\"\"\n        seen = set()\n        cur = self.classes.get(child)\n        while cur is not None and cur.name not in seen:\n            seen.add(cur.name)\n            if cur.base is None:\n                return False\n            if cur.base == parent:\n                return True\n            cur = self.classes.get(cur.base)\n        return False\n\n    def _method_sig(self, class_name, method_name):\n        \"\"\"Look up a method through the inheritance chain.\"\"\"\n        seen = set()\n        cur = self.classes.get(class_name)\n        while cur is not None and cur.name not in seen:\n            seen.add(cur.name)\n            if method_name in cur.methods:\n                return cur.methods[method_name], cur.name\n            cur = self.classes.get(cur.base) if cur.base else None\n        return None, None\n\n    # -- entry --------------------------------------------------------------\n\n    def check(self, program, extra_top_levels=()):\n        # pass 1: collect signatures (extras first, like semantic analysis)\n        for mod in extra_top_levels:\n            self._collect_top_level(mod)\n        self._collect_top_level(program)\n        # pass 2: check bodies\n        for mod in extra_top_levels:\n            for stmt in mod.statements:\n                if isinstance(stmt, A.ConstantDef):\n                    self._top_scope[stmt.name] = stmt.type_name\n        for stmt in program.statements:\n            if isinstance(stmt, A.ConstantDef):\n                self._check_constant(stmt)\n                self._top_scope[stmt.name] = stmt.type_name\n            elif isinstance(stmt, A.FunctionDef):\n                self._check_function(stmt, None)\n            elif isinstance(stmt, A.ClassDef):\n                self._check_class(stmt)\n\n    def _collect_top_level(self, program):\n        for stmt in program.statements:\n            if isinstance(stmt, A.FunctionDef):\n                self.funcs[stmt.name] = _FuncSig(\n                    [_Param(p.name, p.type_name) for p in stmt.params],\n                    stmt.return_type)\n            elif isinstance(stmt, A.ClassDef):\n                self._collect_class(stmt)\n\n    def _collect_class(self, cls):\n        info = _ClassInfo(cls.name, cls.base)\n        self.classes[cls.name] = info  # register first: order-independent\n        if cls.base and cls.base in self.classes:\n            info.fields.update(self.classes[cls.base].fields)\n        for f in cls.fields:\n            info.fields[f.name] = f.type_name\n        if cls.constructor is not None:\n            info.ctor = _FuncSig(\n                [_Param(p.name, p.type_name)\n                 for p in cls.constructor.params],\n                None)\n        for m in cls.methods:\n            info.methods[m.name] = _FuncSig(\n                [_Param(p.name, p.type_name) for p in m.params],\n                m.return_type)\n\n    # -- functions / classes --------------------------------------------------\n\n    def _new_scope(self, params):\n        scope = dict(self._top_scope)\n        for p in params:\n            scope[p.name] = p.type_name\n        return scope\n\n    def _check_defaults(self, params, label):\n        for p in params:\n            if p.default is not None:\n                got = self._type_of(p.default)\n                if not self._assignable(p.type_name, got):\n                    self.error(\n                        f\"type mismatch: default value of parameter \"\n                        f\"'{p.name}' of {label} is {got}, \"\n                        f\"expected {p.type_name}\", p.default)\n\n    def _check_function(self, fn, class_info):\n        if class_info is None:\n            sig = self.funcs[fn.name]\n            label = f\"function '{fn.name}'\"\n        else:\n            sig = class_info.methods[fn.name]\n            label = f\"method '{fn.name}' of class '{class_info.name}'\"\n        self._check_defaults(fn.params, label)\n        self._scope = self._new_scope(fn.params)\n        self._func_sig = sig\n        self._func_label = label\n        self._class = class_info\n        try:\n            self._check_block(fn.body)\n        finally:\n            self._scope = None\n            self._func_sig = None\n            self._class = None\n\n    def _check_class(self, cls):\n        info = self.classes[cls.name]\n        if cls.constructor is not None:\n            ctor = cls.constructor\n            label = f\"constructor of class '{cls.name}'\"\n            self._check_defaults(ctor.params, label)\n            self._scope = self._new_scope(ctor.params)\n            self._scope[\"self\"] = cls.name\n            self._func_sig = info.ctor\n            self._func_label = label\n            self._class = info\n            try:\n                self._check_block(ctor.body)\n            finally:\n                self._scope = None\n                self._func_sig = None\n                self._class = None\n        for m in cls.methods:\n            self._check_function(m, info)\n\n    def _check_constant(self, stmt):\n        got = self._type_of(stmt.value)\n        if not self._assignable(stmt.type_name, got):\n            self.error(\n                f\"type mismatch: constant '{stmt.name}' declared as \"\n                f\"{stmt.type_name}, but value is {got}\", stmt)\n\n    # -- statements ---------------------------------------------------------------\n\n    def _check_block(self, stmts):\n        for s in stmts:\n            self._check_stmt(s)\n\n    def _check_stmt(self, s):\n        if isinstance(s, A.CreateStmt):\n            # v0.6.0 (Simple AGK): a soft `x is <expr>` redeclare keeps the\n            # original declared type, so reassignment is checked exactly\n            # like `set` (a type mismatch is still an error).\n            if not s.soft or s.name not in self._scope:\n                self._scope[s.name] = s.type_name\n        elif isinstance(s, A.SetStmt):\n            got = self._type_of(s.value)\n            want = self._scope.get(s.name)\n            if not self._assignable(want, got):\n                self.error(\n                    f\"type mismatch: cannot assign {got} to variable \"\n                    f\"'{s.name}' declared as {want}\", s)\n        elif isinstance(s, A.SetAttr):\n            # field assignment (semantic analysis rewrote bare field\n            # names to self.<field>)\n            want = self._field_type(s.obj, s.attr)\n            if want is not None:\n                got = self._type_of(s.value)\n                if not self._assignable(want, got):\n                    self.error(\n                        f\"type mismatch: cannot assign {got} to field \"\n                        f\"'{s.attr}' declared as {want}\", s)\n        elif isinstance(s, A.ReturnStmt):\n            want = self._func_sig.return_type if self._func_sig else None\n            if want is not None:\n                if s.value is None:\n                    self.error(\n                        f\"type mismatch: {self._func_label} declares \"\n                        f\"return type {want}, but 'return' has no value\", s)\n                else:\n                    got = self._type_of(s.value)\n                    if not self._assignable(want, got):\n                        self.error(\n                            f\"type mismatch: {self._func_label} declares \"\n                            f\"return type {want}, but returns {got}\", s)\n        elif isinstance(s, A.IfStmt):\n            self._type_of(s.condition)\n            self._check_block(s.then_body)\n            for cond, body in s.elifs:\n                self._type_of(cond)\n                self._check_block(body)\n            if s.else_body is not None:\n                self._check_block(s.else_body)\n        elif isinstance(s, A.WhileStmt):\n            self._type_of(s.condition)\n            self._check_block(s.body)\n        elif isinstance(s, A.ForEachStmt):\n            self._type_of(s.iterable)\n            self._scope.setdefault(s.var, None)  # element type is unknown\n            self._check_block(s.body)\n        elif isinstance(s, A.ForRangeStmt):\n            self._type_of(s.start)\n            self._type_of(s.end)\n            if s.step is not None:\n                self._type_of(s.step)\n            self._scope.setdefault(s.var, INTEGER)\n            self._check_block(s.body)\n        elif isinstance(s, A.TryStmt):\n            self._check_block(s.body)\n            if s.catch_body is not None:\n                if s.catch_name is not None:\n                    self._scope.setdefault(s.catch_name, None)\n                self._check_block(s.catch_body)\n            if s.finally_body is not None:\n                self._check_block(s.finally_body)\n        elif isinstance(s, A.RaiseStmt):\n            if s.value is not None:\n                self._type_of(s.value)\n        elif isinstance(s, A.ExprStmt):\n            self._type_of(s.expr)\n        # anything else was already validated by semantic analysis\n\n    def _field_type(self, obj, attr):\n        \"\"\"Declared type of a field store/load, or None if unknown.\"\"\"\n        class_name = None\n        if (isinstance(obj, A.Name) and obj.id == \"self\"\n                and self._class is not None):\n            class_name = self._class.name\n        else:\n            class_name = self._type_of(obj)\n        info = self.classes.get(class_name) if class_name else None\n        if info is not None:\n            return info.fields.get(attr)\n        return None\n\n    # -- expressions ---------------------------------------------------------------\n\n    def _type_of(self, e):\n        \"\"\"Infer the type of an expression. Returns a type name, or None\n        when the type is unknown (gradual typing: never an error).\"\"\"\n        if isinstance(e, A.IntLit):\n            return INTEGER\n        if isinstance(e, A.FloatLit):\n            return FLOAT\n        if isinstance(e, A.StringLit):\n            return STRING\n        if isinstance(e, A.BoolLit):\n            return BOOLEAN\n        if isinstance(e, A.ListLit):\n            for x in e.elements:\n                self._type_of(x)\n            return LIST\n        if isinstance(e, A.DictLit):\n            for k, v in e.pairs:\n                self._type_of(k)\n                self._type_of(v)\n            return DICT\n        if isinstance(e, A.Name):\n            if self._scope is not None:\n                return self._scope.get(e.id)\n            return None\n        if isinstance(e, A.BinOp):\n            lt = self._type_of(e.left)\n            rt = self._type_of(e.right)\n            return self._binop_type(e.op, lt, rt)\n        if isinstance(e, A.UnaryOp):\n            t = self._type_of(e.operand)\n            if e.op == \"not\":\n                return BOOLEAN\n            if e.op == \"-\" and t in _NUMERIC:\n                return t\n            return None\n        if isinstance(e, A.Call):\n            return self._call_type(e)\n        if isinstance(e, A.Attribute):\n            return self._attr_type(e)\n        if isinstance(e, A.Index):\n            self._type_of(e.obj)\n            self._type_of(e.index)\n            return None  # element type is unknown without generics\n        return None\n\n    @staticmethod\n    def _binop_type(op, lt, rt):\n        if op in (\"==\", \"!=\", \"<\", \">\", \"<=\", \">=\"):\n            return BOOLEAN\n        if op in (\"and\", \"or\"):\n            # `x or default` keeps x's type; stay silent rather than\n            # claim Boolean and risk false positives.\n            return None\n        if lt is None or rt is None:\n            return None\n        if op == \"/\":\n            return FLOAT if lt in _NUMERIC and rt in _NUMERIC else None\n        if lt in _NUMERIC and rt in _NUMERIC:\n            return FLOAT if FLOAT in (lt, rt) else INTEGER\n        if op == \"+\" and lt == STRING and rt == STRING:\n            return STRING\n        if op == \"+\" and lt == LIST and rt == LIST:\n            return LIST\n        return None\n\n    def _call_type(self, e):\n        arg_types = [self._type_of(a) for a in e.args]\n        func = e.func\n        if isinstance(func, A.Name):\n            name = func.id\n            if name in _BUILTIN_TYPES:\n                return _BUILTIN_TYPES[name]\n            if name == \"abs\" and arg_types:\n                t = arg_types[0]\n                return t if t in _NUMERIC else None\n            if name in (\"min\", \"max\") and arg_types:\n                known = {t for t in arg_types if t is not None}\n                return known.pop() if len(known) == 1 else None\n            if name == \"round\":\n                if len(arg_types) == 1:\n                    return INTEGER\n                if len(arg_types) == 2:\n                    return FLOAT\n                return None\n            if name in self.funcs:\n                sig = self.funcs[name]\n                self._check_args(f\"function '{name}'\", sig.params,\n                                 e.args, arg_types, e)\n                return sig.return_type  # None => unknown\n            if name in self.classes:\n                info = self.classes[name]\n                if info.ctor is not None:\n                    self._check_args(f\"constructor of class '{name}'\",\n                                     info.ctor.params, e.args, arg_types, e)\n                return name  # constructing yields the class type\n            return None\n        if isinstance(func, A.Attribute):\n            recv = func.obj\n            # interpolated strings desugar to \"<tmpl>\".format(...)\n            if isinstance(recv, A.StringLit) and func.attr == \"format\":\n                return STRING\n            if (isinstance(recv, A.Name) and recv.id == \"self\"\n                    and self._class is not None):\n                recv_type = self._class.name\n            else:\n                recv_type = self._type_of(recv)\n            if recv_type:\n                sig, owner = self._method_sig(recv_type, func.attr)\n                if sig is not None:\n                    self._check_args(\n                        f\"method '{func.attr}' of class '{owner}'\",\n                        sig.params, e.args, arg_types, e)\n                    return sig.return_type\n            return None\n        self._type_of(func)\n        return None\n\n    def _attr_type(self, e):\n        # bare field reads were rewritten to self.<field> by semantic\n        # analysis; explicit self.<field> parses this way directly.\n        if (isinstance(e.obj, A.Name) and e.obj.id == \"self\"\n                and self._class is not None):\n            return self._class.fields.get(e.attr)\n        return None\n\n    def _check_args(self, label, params, args, arg_types, node):\n        for i, (arg, got) in enumerate(zip(args, arg_types)):\n            if i >= len(params):\n                break  # arity already enforced by semantic analysis\n            p = params[i]\n            if not self._assignable(p.type_name, got):\n                self.error(\n                    f\"type mismatch: argument '{p.name}' of {label} \"\n                    f\"expects {p.type_name}, got {got}\", arg)\n\n\ndef typecheck(program, filename=\"<input>\", extra_top_levels=()):\n    \"\"\"Run the static type checker over an already-analyzed program.\n\n    Raises TypeCheckError on the first type mismatch. extra_top_levels\n    are programs whose top-level functions/classes/constants are visible\n    (compiled stdlib modules); their signatures are collected but their\n    bodies are not re-checked.\n    \"\"\"\n    checker = TypeChecker(filename)\n    checker.check(program, extra_top_levels=extra_top_levels)\n", "agk/stdlib/agent.agk": "# AGK-Real standard library: LLM-backed agent helpers.\n# Import with: import agent\n# (Functions are inlined into your program; call them directly.)\n#\n# Talks to any OpenAI-compatible /chat/completions endpoint using only\n# the Python standard library (urllib). Requires an API key and network\n# access: set the AGK_LLM_API_KEY environment variable, or pass\n# api_key=\"...\". An alternate endpoint can be set with the\n# AGK_LLM_BASE_URL environment variable or base_url=\"...\".\n# Nothing in this module works offline.\n\nimport json\nimport os\nimport urllib.request\nimport urllib.error\n\n\ndefine function _api_key that takes api_key as String and returns String:\n    if api_key != \"\":\n        return api_key\n    create env_key as Object\n    set env_key to os.environ.get(\"AGK_LLM_API_KEY\", \"\")\n    if env_key == \"\":\n        raise \"agent: no API key - set the AGK_LLM_API_KEY environment variable or pass api_key=\\\"...\\\"\"\n    return env_key\n\n\ndefine function _base_url that takes base_url as String and returns String:\n    if base_url != \"\":\n        return base_url\n    create env_url as Object\n    set env_url to os.environ.get(\"AGK_LLM_BASE_URL\", \"\")\n    if env_url == \"\":\n        return \"https://api.openai.com/v1\"\n    return env_url\n\n\ndefine function _extract_json that takes s as String and returns String:\n    create t as String\n    set t to s.strip()\n    set t to t.replace(\"```json\", \"\")\n    set t to t.replace(\"```\", \"\")\n    return t.strip()\n\n\ndefine function chat that takes messages as List, model as String = \"gpt-4o-mini\", api_key as String = \"\", base_url as String = \"\", timeout as Integer = 30 and returns String:\n    create key as String\n    set key to _api_key(api_key)\n    create url as String\n    set url to _base_url(base_url)\n    create payload as Object\n    set payload to {\"model\": model, \"messages\": messages}\n    create body as String\n    set body to json.dumps(payload)\n    create req as Object\n    set req to urllib.request.Request(url + \"/chat/completions\", body.encode(\"utf-8\"))\n    req.add_header(\"Authorization\", \"Bearer \" + key)\n    req.add_header(\"Content-Type\", \"application/json\")\n    create text as String\n    set text to \"\"\n    # AGK has no None literal: dict.get on a missing key yields Python None,\n    # which is what urlopen expects for its data argument here (the Request\n    # already carries the body).\n    create no_data as Object\n    set no_data to {\"k\": 1}.get(\"missing\")\n    try:\n        create resp as Object\n        set resp to urllib.request.urlopen(req, no_data, timeout)\n        set text to resp.read().decode(\"utf-8\")\n        resp.close()\n    catch:\n        raise \"agent.chat: request to {url} failed - check the API key, base URL and network connection\"\n    create data as Object\n    set data to {}\n    try:\n        set data to json.loads(text)\n    catch:\n        raise \"agent.chat: the model response was not valid JSON\"\n    create content as String\n    set content to \"\"\n    try:\n        set content to data[\"choices\"][0][\"message\"][\"content\"]\n    catch:\n        raise \"agent.chat: unexpected response shape (missing choices[0].message.content)\"\n    return content\n\n\ndefine function react that takes goal as String, tools as Dict, max_steps as Integer = 8, model as String = \"gpt-4o-mini\", api_key as String = \"\", base_url as String = \"\" and returns Object:\n    create names as Object\n    set names to []\n    for each name in tools.keys():\n        names.append(name)\n    create system as String\n    set system to \"You are a reasoning agent. Your available tools: \" + str(names) + \". Reply with ONLY one JSON object per turn and no other text: either {{\\\"tool\\\": \\\"<name>\\\", \\\"args\\\": {{...}}}} to call a tool, or {{\\\"answer\\\": \\\"...\\\"}} when you have the final answer.\"\n    create messages as Object\n    set messages to [{\"role\": \"system\", \"content\": system}, {\"role\": \"user\", \"content\": goal}]\n    create steps as Object\n    set steps to []\n    create answer as String\n    set answer to \"\"\n    create done as Boolean\n    set done to false\n    create step_n as Integer\n    set step_n to 0\n    create reply as String\n    set reply to \"\"\n    create parsed as Object\n    set parsed to {}\n    create ok as Boolean\n    set ok to true\n    create has_answer as Boolean\n    set has_answer to false\n    create ans as Object\n    set ans to \"\"\n    create has_tool as Boolean\n    set has_tool to false\n    create tname as Object\n    set tname to \"\"\n    create known as Boolean\n    set known to false\n    create tool_fn as Object\n    set tool_fn to 0\n    create args as Object\n    set args to {}\n    create observation as Object\n    set observation to \"\"\n    while step_n < max_steps and not done:\n        set step_n to step_n + 1\n        set reply to chat(messages, model, api_key, base_url)\n        set parsed to {}\n        set ok to true\n        try:\n            set parsed to json.loads(_extract_json(reply))\n        catch:\n            set ok to false\n        if not ok:\n            messages.append({\"role\": \"user\", \"content\": \"That was not valid JSON. Reply with ONLY a JSON object: {{\\\"tool\\\": \\\"<name>\\\", \\\"args\\\": {{...}}}} or {{\\\"answer\\\": \\\"...\\\"}}.\"})\n        else:\n            set has_answer to false\n            set ans to \"\"\n            try:\n                set ans to parsed[\"answer\"]\n                set has_answer to true\n            catch:\n                set has_answer to false\n            if has_answer:\n                set answer to ans\n                set done to true\n            else:\n                set has_tool to false\n                set tname to \"\"\n                try:\n                    set tname to parsed[\"tool\"]\n                    set has_tool to true\n                catch:\n                    set has_tool to false\n                if not has_tool:\n                    messages.append({\"role\": \"user\", \"content\": \"Reply with ONLY a JSON object: {{\\\"tool\\\": \\\"<name>\\\", \\\"args\\\": {{...}}}} or {{\\\"answer\\\": \\\"...\\\"}}.\"})\n                else:\n                    set known to false\n                    set tool_fn to 0\n                    try:\n                        set tool_fn to tools[tname]\n                        set known to true\n                    catch:\n                        set known to false\n                    if not known:\n                        messages.append({\"role\": \"user\", \"content\": \"Unknown tool '\" + str(tname) + \"'. Available tools: \" + str(names) + \". Reply with ONLY a JSON object.\"})\n                    else:\n                        set args to {}\n                        try:\n                            set args to parsed[\"args\"]\n                        catch:\n                            set args to {}\n                        set observation to \"\"\n                        try:\n                            set observation to str(tool_fn(args))\n                        catch:\n                            set observation to \"the tool raised an error\"\n                        steps.append({\"step\": step_n, \"tool\": tname, \"args\": args, \"observation\": observation})\n                        messages.append({\"role\": \"assistant\", \"content\": reply})\n                        messages.append({\"role\": \"user\", \"content\": \"Observation: \" + observation})\n    return {\"answer\": answer, \"steps\": steps, \"done\": done, \"goal\": goal}\n", "agk/stdlib/colorutils.agk": "# AGK-Real standard library: terminal colors.\n# Import with: import colorutils\n# (Functions are inlined into your program; call them directly.)\n# ANSI color helpers for CLI output. Colors only render on terminals\n# that understand ANSI escapes; strip_ansi removes them again.\n\nimport unicodedata\nimport re\n\ndefine function _esc_code that returns String:\n    return unicodedata.lookup(\"ESCAPE\")\n\ndefine function red that takes s as String and returns String:\n    create e as String\n    set e to _esc_code()\n    return e + \"[31m\" + s + e + \"[0m\"\n\ndefine function green that takes s as String and returns String:\n    create e as String\n    set e to _esc_code()\n    return e + \"[32m\" + s + e + \"[0m\"\n\ndefine function yellow that takes s as String and returns String:\n    create e as String\n    set e to _esc_code()\n    return e + \"[33m\" + s + e + \"[0m\"\n\ndefine function blue that takes s as String and returns String:\n    create e as String\n    set e to _esc_code()\n    return e + \"[34m\" + s + e + \"[0m\"\n\ndefine function magenta that takes s as String and returns String:\n    create e as String\n    set e to _esc_code()\n    return e + \"[35m\" + s + e + \"[0m\"\n\ndefine function cyan that takes s as String and returns String:\n    create e as String\n    set e to _esc_code()\n    return e + \"[36m\" + s + e + \"[0m\"\n\ndefine function bold that takes s as String and returns String:\n    create e as String\n    set e to _esc_code()\n    return e + \"[1m\" + s + e + \"[0m\"\n\ndefine function strip_ansi that takes s as String and returns String:\n    return re.sub(_esc_code() + \"\\\\[[0-9;]*m\", \"\", s)\n", "agk/stdlib/crypto.agk": "# AGK-Real standard library: cryptographic helpers.\n# Import with: import crypto\n# (Functions are inlined into your program; call them directly.)\n#\n# Hashing, message authentication (HMAC), password key derivation\n# (PBKDF2), base64 and secure random tokens \u2014 built on Python's\n# hashlib / hmac / base64 / secrets. Hashing and authentication only:\n# there is no public-key encryption here.\n\nimport hashlib\nimport hmac\nimport base64\nimport secrets\n\n\ndefine function sha256 that takes s as String and returns String:\n    return hashlib.sha256(s.encode(\"utf-8\")).hexdigest()\n\n\ndefine function sha512 that takes s as String and returns String:\n    return hashlib.sha512(s.encode(\"utf-8\")).hexdigest()\n\n\ndefine function sha1 that takes s as String and returns String:\n    return hashlib.sha1(s.encode(\"utf-8\")).hexdigest()\n\n\ndefine function md5 that takes s as String and returns String:\n    return hashlib.md5(s.encode(\"utf-8\")).hexdigest()\n\n\ndefine function hmac_sha256 that takes key as String, message as String and returns String:\n    return hmac.new(key.encode(\"utf-8\"), message.encode(\"utf-8\"), hashlib.sha256).hexdigest()\n\n\ndefine function pbkdf2_hex that takes password as String, salt as String, iterations as Integer and returns String:\n    if iterations < 1:\n        raise \"crypto.pbkdf2_hex: iterations must be at least 1\"\n    return hashlib.pbkdf2_hmac(\"sha256\", password.encode(\"utf-8\"), salt.encode(\"utf-8\"), iterations).hex()\n\n\ndefine function base64_encode that takes s as String and returns String:\n    return base64.b64encode(s.encode(\"utf-8\")).decode(\"ascii\")\n\n\ndefine function base64_decode that takes s as String and returns String:\n    try:\n        return base64.b64decode(s.encode(\"ascii\")).decode(\"utf-8\")\n    catch:\n        raise \"crypto.base64_decode: input is not valid base64\"\n\n\ndefine function token_hex that takes nbytes as Integer and returns String:\n    if nbytes < 1:\n        raise \"crypto.token_hex: nbytes must be at least 1\"\n    return secrets.token_hex(nbytes)\n\n\ndefine function compare_digest that takes a as String, b as String and returns Boolean:\n    return secrets.compare_digest(a.encode(\"utf-8\"), b.encode(\"utf-8\"))\n", "agk/stdlib/csvutils.agk": "# AGK-Real standard library: CSV utilities.\n# Import with: import csvutils\n# (Functions are inlined into your program; call them directly.)\n\nimport csv\nimport io\n\ndefine function csv_parse that takes text as String and returns List:\n    create reader as Object\n    set reader to csv.reader(io.StringIO(text))\n    return list(reader)\n\ndefine function csv_to_text that takes rows as List and returns String:\n    create buf as Object\n    set buf to io.StringIO()\n    create writer as Object\n    set writer to csv.writer(buf)\n    for each row in rows:\n        writer.writerow(row)\n    return buf.getvalue()\n", "agk/stdlib/datasets.agk": "# AGK-Real standard library: HuggingFace datasets helpers.\n# Import with: import datasets\n# (Functions are inlined into your program; call them directly.)\n#\n# Load, inspect, slice, shuffle, split, build, save and reload datasets\n# via the HuggingFace datasets Python library. Nothing here is imported\n# until you call it: importing this AGK module never requires the\n# datasets package to be installed. Every function raises a clear\n# \"pip install datasets\" error when it is missing.\n#\n# Requires: pip install datasets\n\nimport importlib\n\n\ndefine function _ds_need that returns Object:\n    try:\n        return importlib.import_module(\"datasets\")\n    catch:\n        raise \"datasets: this needs the 'datasets' Python package. Install it with: pip install datasets\"\n\n\ndefine function ds_load that takes name as String, split as String = \"train\" and returns Object:\n    create datasets as Object\n    set datasets to _ds_need()\n    return datasets.load_dataset(name, split)\n\n\ndefine function ds_load_config that takes name as String, config as String, split as String = \"train\" and returns Object:\n    create datasets as Object\n    set datasets to _ds_need()\n    return datasets.load_dataset(name, config, split)\n\n\ndefine function ds_len that takes ds as Object and returns Integer:\n    return len(ds)\n\n\ndefine function ds_row that takes ds as Object, i as Integer and returns Dict:\n    return dict(ds[i])\n\n\ndefine function ds_column that takes ds as Object, name as String and returns List:\n    return list(ds[name] etime.date.today().isoformat()\n\ndefine function now that returns String:\n    return datetime.datetime.now().isoformat()\n\ndefine function add_days that takes date_str as String, days as Integer and returns String:\n    create d as Object\n    set d to datetime.datetime.strptime(date_str, \"%Y-%m-%d\")\n    return (d + datetime.timedelta(days)).date().isoformat()\n", "agk/stdlib/embeddings.agk": "# AGK-Real standard library: text embedding helpers.\n# Import with: import embeddings\n# (Functions are inlined into your program; call them directly.)\n#\n# Sentence embeddings via the sentence-transformers Python library,\n# plus dependency-free cosine similarity and a small semantic-search\n# helper written in pure AGK. Nothing here is imported until you call\n# it: importing this AGK module never requires sentence-transformers\n# to be installed. The encode functions raise a clear\n# \"pip install sentence-transformers\" error when it is missing;\n# emb_cosine always works with no dependencies.\n#\n# Requires for encoding: pip install sentence-transformers\n\nimport importlib\nimport mathutils\n\n\ndefine function _emb_need that returns Object:\n    try:\n        return importlib.import_module(\"sentence_transformers\")\n    catch:\n        raise \"embeddings: this needs the 'sentence_transformers' Python package. Install it with: pip install sentence-transformers\"\n\n\ndefine function emb_encode that takes model as String, texts as List and returns List:\n    create st as Object\n    set st to _emb_need()\n    create m as Object\n    set m to st.SentenceTransformer(model)\n    create arr as Object\n    set arr to m.encode(texts)\n    return arr.tolist()\n\n\ndefine function emb_encode_one that takes model as String, text as String and returns List:\n    create vecs as List\n    set vecs to emb_encode(model, [text])\n    return vecs[0]\n\n\ndefine function emb_cosine that takes a as List, b as List and returns Float:\n    create dot as Float\n    set dot to 0.0\n    create na as Float\n    set na to 0.0\n    create nb as Float\n    set nb to 0.0\n    create i as Integer\n    set i to 0\n    while i < len(a) and i < len(b):\n        set dot to dot + a[i] * b[i]\n        set na to na + a[i] * a[i]\n        set nb to nb + b[i] * b[i]\n        set i to i + 1\n    if na == 0.0 or nb == 0.0:\n        return 0.0\n    return dot / (sqrt_of(na) * sqrt_of(nb))\n\n\ndefine function emb_search that takes model as String, query as String, corpus as List and returns List:\n    create q as List\n    set q to emb_encode_one(model, query)\n    create docvecs as List\n    set docvecs to emb_encode(model, corpus)\n    create pairs as List\n    set pairs to []\n    create i as Integer\n    set i to 0\n    for each v in docvecs:\n        pairs.append([emb_cosine(q, v), i])\n        set i to i + 1\n    create ranked as List\n    set ranked to sorted(pairs)\n    create out as List\n    set out to []\n    create j as Integer\n    set j to len(ranked) - 1\n    while j >= 0:\n        create p as List\n        set p to ranked[j]\n        out.append([p[1], p[0]])\n        set j to j - 1\n    return out\n", "agk/stdlib/fileutils.agk": "# AGK-Real standard library: file utilities.\n# Import with: import fileutils\n# (Functions are inlined into your program; call them directly.)\n\nimport os\n\ndefine function read_text that takes path as String and returns String:\n    return open(path).read()\n\ndefine function write_text that takes path as String, text as String:\n    create f as Object\n    set f to open(path, \"w\")\n    f.write(text)\n    f.close()\n\ndefine function append_text that takes path as String, text as String:\n    create f as Object\n    set f to open(path, \"a\")\n    f.write(text)\n    f.close()\n\ndefine function file_exists that takes path as String and returns Boolean:\n    return os.path.exists(path)\n\ndefine function list_dir that takes path as String and returns List:\n    return os.listdir(path)\n", "agk/stdlib/finetune.agk": "# AGK-Real standard library: LoRA fine-tuning helpers.\n# Import with: import finetune\n# (Functions are inlined into your program; call them directly.)\n#\n# Low-rank adaptation (LoRA) fine-tuning of causal language models via\n# the peft + transformers + datasets Python libraries, plus manual\n# training-data preparation and adapter merging. Nothing here is\n# imported until you call it: importing this AGK module never requires\n# the Python packages to be installed. Every function raises a clear\n# \"pip install ...\" error when its backend is missing.\n#\n# Requires: pip install torch transformers datasets peft\n#\n# Note: AGK cannot pass keyword arguments to Python calls, so\n# ft_lora_train builds its TrainingArguments from the output directory\n# alone and uses the library defaults for everything else (3 epochs,\n# learning rate 5e-5, batch size 8, no evaluation split). LoraConfig is\n# built positionally as (r=8, target_modules, lora_alpha=16). Pass\n# [\"q_proj\", \"v_proj\"] for LLaMA/Mistral-style models or\n# [\"query\", \"key\", \"value\"] for older attention layouts.\n\nimport importlib\n\n\ndefine function _ft_need that takes package as String and returns Object:\n    try:\n        return importlib.import_module(package)\n    catch:\n        raise \"finetune: this needs the '{package}' Python package. Install it with: pip install {package}\"\n\n\ndefine function _ft_none that returns Object:\n    create d as Dict\n    set d to {}\n    return d.get(\"no_such_key\")\n\n\ndefine function ft_prepare_lm that takes model as String, texts as List, max_length as Integer = 256 and returns List:\n    create transformers as Object\n    set transformers to _ft_need(\"transformers\")\n    create tok as Object\n    set tok to transformers.AutoTokenizer.from_pretrained(model)\n    create pad_id as Integer\n    set pad_id to tok.eos_token_id\n    create records as List\n    set records to []\n    for each text in texts:\n        create ids as List\n        set ids to
