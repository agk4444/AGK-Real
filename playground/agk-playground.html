    self._in_function += 1\n        try:\n            self._check_params(fn.params)\n            self._check_block(fn.body)\n            self._check_unused(self._scope)\n        finally:\n            self._in_function -= 1\n            self._scope = self._scope.parent\n\n    def _all_fields(self, cls):\n        \"\"\"Own fields plus inherited fields (transitive, cycle-safe).\"\"\"\n        fields = [f.name for f in cls.fields]\n        seen_classes = {cls.name}\n        base_name = cls.base\n        while base_name:\n            if base_name in seen_classes:\n                break\n            seen_classes.add(base_name)\n            base_def = self.classes.get(base_name)\n            if base_def is None:\n                break\n            for f in base_def.fields:\n                if f.name not in fields:\n                    fields.append(f.name)\n            base_name = base_def.base\n        return fields\n\n    def _check_class(self, cls):\n        own_fields = [f.name for f in cls.fields]\n        if len(set(own_fields)) != len(own_fields):\n            self.error(f\"duplicate field in class '{cls.name}'\", cls)\n        if cls.base and cls.base not in self.classes:\n            self.error(f\"undefined base class '{cls.base}'\", cls)\n        fields = self._all_fields(cls)\n        method_names = [m.name for m in cls.methods]\n        if len(set(method_names)) != len(method_names):\n            self.error(f\"duplicate method in class '{cls.name}'\", cls)\n        prev_fields = self._class_fields\n        self._class_fields = set(fields)\n        try:\n            if cls.constructor:\n                self._check_method_like(cls.constructor, is_constructor=True)\n            for m in cls.methods:\n                self._check_method_like(m, is_constructor=False)\n        finally:\n            self._class_fields = prev_fields\n\n    def _check_method_like(self, fn, is_constructor):\n        self._scope = _Scope(self._scope)\n        self._in_function += 1\n        try:\n            self._scope.declare(\"self\", fn)\n            self._scope.vars[\"self\"][\"assigned\"] = True\n            seen = {\"self\"}\n            seen_default = False\n            for p in fn.params:\n                if p.name in seen:\n                    self.error(f\"duplicate parameter '{p.name}'\", p)\n                seen.add(p.name)\n                if p.default is not None:\n                    seen_default = True\n                elif seen_default:\n                    self.error(\n                        f\"parameter '{p.name}' without a default follows a \"\n                        f\"parameter with a default\", p)\n                self._scope.declare(p.name, p)\n                self._scope.vars[p.name][\"assigned\"] = True\n            self._check_block(fn.body)\n            self._check_unused(self._scope, skip={\"self\"})\n        finally:\n            self._in_function -= 1\n            self._scope = self._scope.parent\n\n    # -- statements ---------------------------------------------------------------\n\n    def _check_block(self, stmts):\n        seen_return = False\n        for i, s in enumerate(stmts):\n            if seen_return:\n                self.warn(\"unreachable code\", s)\n            stmts[i] = self._check_stmt(s)\n            if isinstance(s, A.ReturnStmt):\n                seen_return = True\n\n    def _check_stmt(self, s):\n        if isinstance(s, A.CreateStmt):\n            if s.name in self._scope.vars:\n                self.error(f\"variable '{s.name}' is already declared\", s)\n            self._scope.declare(s.name, s)\n        elif isinstance(s, A.SetStmt):\n            s.value = self._check_expr(s.value)\n            scope, entry = self._scope.lookup(s.name)\n            if entry is not None:\n                entry[\"assigned\"] = True\n            elif (self._class_fields is not None\n                    and s.name in self._class_fields):\n                # field assignment -> self.<field> = value\n                return A.SetAttr(A.Name(\"self\", line=s.line, col=s.col),\n                                 s.name, s.value, line=s.line, col=s.col)\n            else:\n                self.error(f\"cannot set undefined variable '{s.name}'\", s)\n        elif isinstance(s, A.IfStmt):\n            s.condition = self._check_expr(s.condition)\n            self._check_block(s.then_body)\n            new_elifs = []\n            for cond, body in s.elifs:\n                new_elifs.append((self._check_expr(cond), body))\n                self._check_block(body)\n            s.elifs = new_elifs\n            if s.else_body is not None:\n                self._check_block(s.else_body)\n        elif isinstance(s, A.WhileStmt):\n            s.condition = self._check_expr(s.condition)\n            self._check_block(s.body)\n        elif isinstance(s, A.ForEachStmt):\n            s.iterable = self._check_expr(s.iterable)\n            if s.var not in self._scope.vars:\n                self._scope.declare(s.var, s)\n            self._scope.vars[s.var][\"assigned\"] = True\n            self._check_block(s.body)\n        elif isinstance(s, A.ForRangeStmt):\n            s.start = self._check_expr(s.start)\n            s.end = self._check_expr(s.end)\n            if s.step is not None:\n                s.step = self._check_expr(s.step)\n            if s.var not in self._scope.vars:\n                self._scope.declare(s.var, s)\n            self._scope.vars[s.var][\"assigned\"] = True\n            self._check_block(s.body)\n        elif isinstance(s, A.TryStmt):\n            self._check_block(s.body)\n            if s.catch_body is not None:\n                if s.catch_name is not None:\n                    if s.catch_name not in self._scope.vars:\n                        self._scope.declare(s.catch_name, s)\n                    self._scope.vars[s.catch_name][\"assigned\"] = True\n                self._check_block(s.catch_body)\n            if s.finally_body is not None:\n                self._check_block(s.finally_body)\n        elif isinstance(s, A.RaiseStmt):\n            if s.value is not None:\n                s.value = self._check_expr(s.value)\n        elif isinstance(s, A.ReturnStmt):\n            if self._in_function == 0:\n                self.error(\"'return' outside a function\", s)\n            if s.value is not None:\n                s.value = self._check_expr(s.value)\n        elif isinstance(s, A.ExprStmt):\n            s.expr = self._check_expr(s.expr)\n        else:\n            self.error(\"unexpected statement\", s)\n        return s\n\n    # -- expressions ---------------------------------------------------------------\n\n    def _check_expr(self, e):\n        if isinstance(e, (A.IntLit, A.FloatLit, A.StringLit, A.BoolLit)):\n            return e\n        if isinstance(e, A.Name):\n            return self._resolve_name(e)\n        if isinstance(e, A.BinOp):\n            e.left = self._check_expr(e.left)\n            e.right = self._check_expr(e.right)\n            return e\n        if isinstance(e, A.UnaryOp):\n            e.operand = self._check_expr(e.operand)\n            return e\n        if isinstance(e, A.Call):\n            return self._check_call(e)\n        if isinstance(e, A.Attribute):\n            e.obj = self._check_expr(e.obj)\n            return e\n        if isinstance(e, A.Index):\n            e.obj = self._check_expr(e.obj)\n            e.index = self._check_expr(e.index)\n            return e\n        if isinstance(e, A.ListLit):\n            e.elements = [self._check_expr(x) for x in e.elements]\n            return e\n        if isinstance(e, A.DictLit):\n            e.pairs = [(self._check_expr(k), self._check_expr(v))\n                       for k, v in e.pairs]\n            return e\n        self.error(\"unexpected expression\", e)\n\n    def _resolve_name(self, node):\n        scope, entry = self._scope.lookup(node.id)\n        if entry is not None:\n            entry[\"used\"] = True\n            return node\n        if (self._class_fields is not None\n                and node.id in self._class_fields):\n            # bare field read -> self.<field>\n            self._scope.lookup(\"self\")[1][\"used\"] = True\n            return A.Attribute(A.Name(\"self\", line=node.line, col=node.col),\n                               node.id, line=node.line, col=node.col)\n        if node.id in BUILTINS or node.id in self.functions \\\n                or node.id in self.classes:\n            return node\n        self.error(f\"undefined variable '{node.id}'\", node)\n\n    def _arity_error(self, kind, name, params, got, node):\n        required = sum(1 for p in params if p.default is None)\n        total = len(params)\n        if required == total:\n            self.error(\n                f\"{kind} '{name}' takes {total} argument(s), got {got}\", node)\n        elif not required <= got <= total:\n            self.error(\n                f\"{kind} '{name}' takes {required} to {total} arguments, \"\n                f\"got {got}\", node)\n\n    def _check_call(self, e):\n        e.args = [self._check_expr(a) for a in e.args]\n        func = e.func\n        if isinstance(func, A.Name):\n            name = func.id\n            if name in BUILTINS:\n                return e\n            if name in self.functions:\n                params = self.functions[name].params\n                required = sum(1 for p in params if p.default is None)\n                if not required <= len(e.args) <= len(params):\n                    self._arity_error(\"function\", name, params,\n                                      len(e.args), e)\n                return e\n            if name in self.classes:\n                ctor = self.classes[name].constructor\n                if ctor is not None:\n                    params = ctor.params\n                    required = sum(1 for p in params if p.default is None)\n                    if not required <= len(e.args) <= len(params):\n                        self._arity_error(\"constructor of\", name, params,\n                                          len(e.args), e)\n                return e\n            # maybe a local variable holding a callable, or a method via self\n            _, entry = self._scope.lookup(name)\n            if entry is not None:\n                entry[\"used\"] = True\n                return e\n            self.error(f\"undefined function '{name}'\", func)\n        # Attribute or other callable: check the object, can't verify arity\n        e.func = self._check_expr(func)\n        return e\n\n    # -- warnings ---------------------------------------------------------------------\n\n    def _check_unused(self, scope, skip=()):\n        for name, entry in scope.vars.items():\n            if name in skip:\n                continue\n            node = entry[\"node\"]\n            if isinstance(node, (A.Import, A.Param)):\n                continue\n            if isinstance(node, A.CreateStmt) and not entry[\"assigned\"]:\n                self.warn(f\"variable '{name}' is never assigned a value\", node)\n            elif not entry[\"used\"]:\n                self.warn(f\"unused variable '{name}'\", node)\n\n\ndef analyze(program, filename=\"<input>\", predeclared=(), extra_top_levels=()):\n    \"\"\"Run semantic analysis. Returns (rewritten_program, warnings).\n    Raises SemanticError on the first error.\n\n    predeclared: names treated as already-declared (the REPL carries\n    variables across inputs). extra_top_levels: programs whose top-level\n    functions/classes/constants are visible (compiled stdlib modules).\n    \"\"\"\n    analyzer = SemanticAnalyzer(filename)\n    warnings = analyzer.analyze(program, predeclared=predeclared,\n                                extra_top_levels=extra_top_levels)\n    return program, warnings\n", "agk/tokens.py": "\"\"\"Token types for the AGK-Real v1 lexer.\"\"\"\n\nfrom enum import Enum, auto\n\n\nclass TokenType(Enum):\n    # Keywords\n    DEFINE = auto()\n    FUNCTION = auto()\n    THAT = auto()\n    TAKES = auto()\n    AND = auto()\n    RETURNS = auto()\n    CREATE = auto()\n    SET = auto()\n    TO = auto()\n    CONSTANT = auto()\n    IF = auto()\n    ELIF = auto()\n    ELSE = auto()\n    WHILE = auto()\n    FOR = auto()\n    EACH = auto()\n    IN = auto()\n    RETURN = auto()\n    CLASS = auto()\n    VARIABLE = auto()\n    CONSTRUCTOR = auto()\n    EXTENDS = auto()\n    IMPLEMENTS = auto()\n    IMPORT = auto()\n    OR = auto()\n    NOT = auto()\n    TRUE = auto()\n    FALSE = auto()\n    AS = auto()\n    SELF = auto()\n    # v2 keywords\n    TRY = auto()\n    CATCH = auto()\n    FINALLY = auto()\n    RAISE = auto()\n    FROM = auto()\n    STEP = auto()\n\n    # Literals / names\n    IDENTIFIER = auto()\n    INT = auto()\n    FLOAT = auto()\n    STRING = auto()\n\n    # Operators\n    PLUS = auto()\n    MINUS = auto()\n    STAR = auto()\n    SLASH = auto()\n    PERCENT = auto()\n    EQ = auto()        # ==\n    NEQ = auto()       # !=\n    ASSIGN = auto()     # = (only valid in `define constant`)\n    LT = auto()\n    GT = auto()\n    LTE = auto()       # <=\n    GTE = auto()       # >=\n\n    # Delimiters\n    LPAREN = auto()\n    RPAREN = auto()\n    LBRACKET = auto()\n    RBRACKET = auto()\n    LBRACE = auto()\n    RBRACE = auto()\n    COMMA = auto()\n    COLON = auto()\n    DOT = auto()\n\n    # Structural\n    NEWLINE = auto()\n    INDENT = auto()\n    DEDENT = auto()\n    EOF = auto()\n\n\n# Lexer emits LTE/GTE for <= and >=.\nKEYWORDS = {\n    \"define\": TokenType.DEFINE,\n    \"function\": TokenType.FUNCTION,\n    \"that\": TokenType.THAT,\n    \"takes\": TokenType.TAKES,\n    \"and\": TokenType.AND,\n    \"returns\": TokenType.RETURNS,\n    \"create\": TokenType.CREATE,\n    \"set\": TokenType.SET,\n    \"to\": TokenType.TO,\n    \"constant\": TokenType.CONSTANT,\n    \"if\": TokenType.IF,\n    \"elif\": TokenType.ELIF,\n    \"else\": TokenType.ELSE,\n    \"while\": TokenType.WHILE,\n    \"for\": TokenType.FOR,\n    \"each\": TokenType.EACH,\n    \"in\": TokenType.IN,\n    \"return\": TokenType.RETURN,\n    \"class\": TokenType.CLASS,\n    \"variable\": TokenType.VARIABLE,\n    \"constructor\": TokenType.CONSTRUCTOR,\n    \"extends\": TokenType.EXTENDS,\n    \"implements\": TokenType.IMPLEMENTS,\n    \"import\": TokenType.IMPORT,\n    \"or\": TokenType.OR,\n    \"not\": TokenType.NOT,\n    \"true\": TokenType.TRUE,\n    \"false\": TokenType.FALSE,\n    \"as\": TokenType.AS,\n    \"self\": TokenType.SELF,\n    \"try\": TokenType.TRY,\n    \"catch\": TokenType.CATCH,\n    \"finally\": TokenType.FINALLY,\n    \"raise\": TokenType.RAISE,\n    \"from\": TokenType.FROM,\n    \"step\": TokenType.STEP,\n}\n\n\nclass Token:\n    __slots__ = (\"type\", \"value\", \"line\", \"column\")\n\n    def __init__(self, type_, value, line, column):\n        self.type = type_\n        self.value = value\n        self.line = line\n        self.column = column\n\n    def __repr__(self):\n        return f\"Token({self.type.name}, {self.value!r}, {self.line}:{self.column})\"\n\n    def __eq__(self, other):\n        return (\n            isinstance(other, Token)\n            and self.type == other.type\n            and self.value == other.value\n        )\n", "agk/stdlib/dateutils.agk": "# AGK-Real standard library: date utilities.\n# Import with: import dateutils\n# (Functions are inlined into your program; call them directly.)\n# Dates are \"YYYY-MM-DD\" strings.\n\nimport datetime\n\ndefine function today that returns String:\n    return datetime.date.today().isoformat()\n\ndefine function now that returns String:\n    return datetime.datetime.now().isoformat()\n\ndefine function add_days that takes date_str as String, days as Integer and returns String:\n    create d as Object\n    set d to datetime.datetime.strptime(date_str, \"%Y-%m-%d\")\n    return (d + datetime.timedelta(days)).date().isoformat()\n", "agk/stdlib/fileutils.agk": "# AGK-Real standard library: file utilities.\n# Import with: import fileutils\n# (Functions are inlined into your program; call them directly.)\n\nimport os\n\ndefine function read_text that takes path as String and returns String:\n    return open(path).read()\n\ndefine function write_text that takes path as String, text as String:\n    create f as Object\n    set f to open(path, \"w\")\n    f.write(text)\n    f.close()\n\ndefine function append_text that takes path as String, text as String:\n    create f as Object\n    set f to open(path, \"a\")\n    f.write(text)\n    f.close()\n\ndefine function file_exists that takes path as String and returns Boolean:\n    return os.path.exists(path)\n\ndefine function list_dir that takes path as String and returns List:\n    return os.listdir(path)\n", "agk/stdlib/httputils.agk": "# AGK-Real standard library: HTTP utilities.\n# Import with: import httputils\n# (Functions are inlined into your program; call them directly.)\n\nimport urllib.request\n\ndefine function http_get that takes url as String and returns String:\n    create resp as Object\n    set resp to urllib.request.urlopen(url)\n    create data as String\n    set data to resp.read().decode(\"utf-8\")\n    resp.close()\n    return data\n", "agk/stdlib/jsonutils.agk": "# AGK-Real standard library: JSON utilities.\n# Import with: import jsonutils\n# (Functions are inlined into your program; call them directly.)\n\nimport json\n\ndefine function parse_json that takes s as String and returns Object:\n    return json.loads(s)\n\ndefine function to_json that takes value as Object and returns String:\n    return json.dumps(value)\n", "agk/stdlib/listutils.agk": "# AGK-Real standard library: list utilities.\n# Import with: import listutils\n# (Functions are inlined into your program; call them directly.)\n\ndefine function sum_list that takes xs as List and returns Integer:\n    create total as Integer\n    set total to 0\n    for each x in xs:\n        set total to total + x\n    return total\n\ndefine function max_in_list that takes xs as List and returns Integer:\n    create best as Integer\n    set best to xs[0]\n    for each x in xs:\n        if x > best:\n            set best to x\n    return best\n\ndefine function min_in_list that takes xs as List and returns Integer:\n    create best as Integer\n    set best to xs[0]\n    for each x in xs:\n        if x < best:\n            set best to x\n    return best\n\ndefine function contains_int that takes xs as List, item as Integer and returns Boolean:\n    for each x in xs:\n        if x == item:\n            return true\n    return false\n", "agk/stdlib/strutils.agk": "# AGK-Real standard library: string utilities.\n# Import with: import strutils\n# (Functions are inlined into your program; call them directly.)\n\ndefine function shout that takes s as String and returns String:\n    return s.upper() + \"!\"\n\ndefine function repeat_string that takes s as String, n as Integer and returns String:\n    create out as String\n    set out to \"\"\n    create i as Integer\n    set i to 0\n    while i < n:\n        set out to out + s\n        set i to i + 1\n    return out\n\ndefine function join_lines that takes lines as List and returns String:\n    create out as String\n    set out to \"\"\n    for each line in lines:\n        set out to out + line + \"\\n\"\n    return out\n\ndefine function slug that takes s as String and returns String:\n    return s.lower().replace(\" \", \"-\")\n"};

const SAMPLES = {
  "hello": `define function greet that takes name as String = "World":\n    print("Hello, {name}!")\n\ndefine function main:\n    greet()\n    greet("Gopi")\n    for i from 1 to 5:\n        print("count: {i}")\n`,
  "errors": `define function main:\n    try:\n        print(1 / 0)\n    catch err:\n        print("caught: {err}")\n    finally:\n        print("cleanup runs")\n    try:\n        raise "something broke"\n    catch:\n        print("bare catch works")\n`,
  "stdlib": `import jsonutils\nimport dateutils\n\ndefine function main:\n    create obj as Object\n    set obj to parse_json("{{\\"a\\": 1}}")\n    print("json: {to_json(obj)}")\n    print("today: {today()}")\n    print("next week: {add_days(today(), 7)}")\n`
};

const srcEl = document.getElementById("src");
const outEl = document.getElementById("out");
const statusEl = document.getElementById("status");
const runBtn = document.getElementById("run");
const compileBtn = document.getElementById("compile");
const samplesEl = document.getElementById("samples");
const viewEl = document.getElementById("view");

for (const k of Object.keys(SAMPLES)) {
  const o = document.createElement("option");
  o.value = k; o.textContent = k + ".agk";
  samplesEl.appendChild(o);
}
samplesEl.onchange = () => { srcEl.value = SAMPLES[samplesEl.value]; };
srcEl.value = SAMPLES.hello;

let pyodide = null;
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function show(html) { outEl.innerHTML = html; }

async function loadPyodideLib() {
  // Primary CDN is attempted via the <script> tag in <head>. If it did
  // not define loadPyodide (blocked/slow network), try a fallback CDN
  // before giving up with a clear message.
  if (typeof loadPyodide !== "undefined") return;
  const fallbacks = [
    "https://unpkg.com/pyodide@0.26.4/full/pyodide.js",
    "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"
  ];
  for (const url of fallbacks) {
    try {
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = url;
        s.onload = resolve;
        s.onerror = () => reject(new Error("script error"));
        document.head.appendChild(s);
      });
    } catch (e) { /* try next */ }
    if (typeof loadPyodide !== "undefined") return;
  }
  throw new Error("could not download Pyodide from a CDN — check your internet connection and reload");
}

async function init() {
  try {
    await loadPyodideLib();
    pyodide = await loadPyodide();
    for (const [path, content] of Object.entries(SOURCES)) {
      const dir = path.split("/").slice(0, -1).join("/");
      try { pyodide.FS.mkdir("/" + dir); } catch (e) { /* exists */ }
      pyodide.FS.writeFile("/" + path, content);
    }
    pyodide.runPython(`
import sys
sys.path.insert(0, "/")
import io, traceback
from contextlib import redirect_stdout
import agk.pipeline

def agk_compile(src):
    try:
        code, warnings = agk.pipeline.compile_source(src, filename="playground.agk")
        return {"ok": True, "code": code, "warnings": warnings}
    except Exception as e:
        return {"ok": False, "error": str(e)}

def agk_run(src):
    try:
        code, warnings = agk.pipeline.compile_source(src, filename="playground.agk")
    except Exception as e:
        return {"ok": False, "error": str(e)}
    ns = {"__name__": "__main__"}
    buf = io.StringIO()
    try:
        with redirect_stdout(buf):
            exec(compile(code, "playground.agk", "exec"), ns)
    except Exception as e:
        tb = "".join(traceback.format_exception(type(e), e, e.__traceback__))
        return {"ok": False, "error": tb, "output": buf.getvalue()}
    return {"ok": True, "output": buf.getvalue(), "warnings": warnings}
`);
    statusEl.textContent = "ready";
    statusEl.className = "ready";
    runBtn.disabled = false;
    compileBtn.disabled = false;
  } catch (e) {
    statusEl.textContent = "failed to load: " + e;
  }
}

function doCompile() {
  const r = pyodide.globals.get("agk_compile")(srcEl.value).toJs({dict_converter: Object.fromEntries});
  if (r.ok) {
    viewEl.value = "python";
    document.getElementById("outlabel").textContent = "generated python";
    let html = "";
    for (const w of r.warnings || []) html += `<span class="warn">${esc(w)}</span>\n`;
    show(html + esc(r.code));
  } else {
    viewEl.value = "output";
    document.getElementById("outlabel").textContent = "output";
    show(`<span class="err">${esc(r.error)}</span>`);
  }
}

function doRun() {
  const r = pyodide.globals.get("agk_run")(srcEl.value).toJs({dict_converter: Object.fromEntries});
  viewEl.value = "output";
  document.getElementById("outlabel").textContent = "output";
  let html = "";
  const out = r.output || "";
  if (out) html += esc(out);
  if (r.ok) {
    for (const w of r.warnings || []) html += `<span class="warn">${esc(w)}</span>\n`;
    if (!html) html = '<span class="ok">(no output)</span>';
  } else {
    html += `<span class="err">${esc(r.error)}</span>`;
  }
  show(html);
}

runBtn.onclick = doRun;
compileBtn.onclick = doCompile;
viewEl.onchange = () => {
  document.getElementById("outlabel").textContent =
    viewEl.value === "python" ? "generated python" : "output";
  if (viewEl.value === "python") doCompile();
};
init();
</script>
</body>
</html>
