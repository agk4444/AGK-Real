<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGK Playground</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d1117; color: #e6edf3; }
  header { padding: 12px 16px; border-bottom: 1px solid #21262d;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header h1 span { color: #58a6ff; }
  header .sub { color: #8b949e; font-size: 12px; }
  #status { margin-left: auto; font-size: 12px; color: #8b949e; }
  #status.ready { color: #3fb950; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 57px); }
  .pane { display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid #21262d; }
  .toolbar { display: flex; gap: 8px; padding: 8px 12px; align-items: center;
             border-bottom: 1px solid #21262d; flex-wrap: wrap; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px;
           padding: 8px 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
  button.secondary { background: #21262d; color: #e6edf3; }
  button:disabled { opacity: .4; cursor: default; }
  select { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
           border-radius: 6px; padding: 7px; font-family: inherit; font-size: 13px; }
  textarea, pre { flex: 1; margin: 0; padding: 12px; background: #0d1117;
                  color: #e6edf3; border: 0; font-size: 13px; line-height: 1.5;
                  font-family: inherit; white-space: pre; overflow: auto; }
  textarea { resize: none; outline: none; }
  pre .err { color: #f85149; }
  pre .warn { color: #d29922; }
  pre .ok { color: #3fb950; }
  .label { font-size: 11px; color: #8b949e; text-transform: uppercase;
           letter-spacing: .08em; padding: 8px 12px 0; }
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; height: auto; }
    .pane + .pane { border-left: 0; border-top: 1px solid #21262d; }
    textarea, pre { min-height: 38vh; }
  }
</style>
</head>
<body>
<header>
  <h1>AGK <span>Playground</span></h1>
  <div class="sub">English-like code &rarr; Python, in your browser</div>
  <div id="status">loading python&hellip;</div>
</header>
<main>
  <div class="pane">
    <div class="toolbar">
      <select id="samples"></select>
      <button id="run" disabled>Run</button>
      <button id="compile" class="secondary" disabled>Compile</button>
    </div>
    <div class="label">program.agk</div>
    <textarea id="src" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="toolbar">
      <select id="view">
        <option value="output">Output</option>
        <option value="python">Generated Python</option>
      </select>
    </div>
    <div class="label" id="outlabel">output</div>
    <pre id="out"></pre>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const SOURCES = {"agk/__init__.py": "", "agk/__main__.py": "\"\"\"AGK-Real v2 command line.\n\n    python -m agk run <file.agk> [--no-opt]   compile and run\n    python -m agk debug <file.agk>      run under the AGK-aware debugger\n                                       (break/step/list/p use AGK lines)\n    python -m agk build <file.agk> [-o out.py] [--clean] [--no-opt]\n                                              compile to Python\n                                              (incremental via .agkcache/)\n    python -m agk clean [dir]         wipe the .agkcache/ compilation cache\n    python -m agk check <file.agk>       compile only; report errors/warnings\n    python -m agk test [path]             discover and run test_*.agk /\n                                         *_test.agk files (default: .)\n    python -m agk test --coverage [path]  same, plus a per-file AGK line-\n                                         coverage table\n    python -m agk fmt [--check] <file.agk>   canonical formatting (rewrite in\n                                             place, or just check with --check)\n    python -m agk pkg init [--name NAME] [--version VER]\n    python -m agk pkg install <git-url-or-path> [--name NAME]\n    python -m agk pkg list\n    python -m agk repl                   interactive session\n    python -m agk                        interactive session\n\nExit codes: 0 ok, 1 compile error, 2 runtime or usage error.\nFor fmt: 0 ok (or clean under --check), 1 would reformat / lex error,\n2 usage/IO error.\nFor test: 0 all tests passed, 1 some test failed or a file could not\nbe collected, 2 usage/IO error.\n\"\"\"\n\nimport os\nimport sys\n\nfrom .debugger import debug_file\nfrom .errors import AGKError, LexerError\nfrom .format import format_source\nfrom .pipeline import (CACHE_DIR_NAME, compile_source, compile_source_cached,\n                       format_agk_traceback, wipe_cache)\nfrom .pkg import PkgError, cmd_init, cmd_install, cmd_list\nfrom .repl import repl\nfrom .test_runner import run_tests\n\nUSAGE = __doc__\n\n\ndef _read(path):\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            return f.read()\n    except OSError as e:\n        print(f\"agk: cannot read '{path}': {e.strerror}\", file=sys.stderr)\n        raise SystemExit(2)\n\n\ndef _compile(path, annotate=False, no_opt=False):\n    src = _read(path)\n    search = [os.path.dirname(os.path.abspath(path))]\n    try:\n        return compile_source(src, filename=path, search_paths=search,\n                              annotate=annotate, optimize=not no_opt)\n    except AGKError as e:\n        print(e, file=sys.stderr)\n        raise SystemExit(1)\n\n\ndef _report_warnings(warnings):\n    for w in warnings:\n        print(w, file=sys.stderr)\n\n\ndef cmd_run(path, no_opt=False):\n    code, warnings = _compile(path, annotate=True, no_opt=no_opt)\n    _report_warnings(warnings)\n    try:\n        exec(compile(code, path, \"exec\"), {\"__name__\": \"__main__\"})  # noqa: S102\n    except Exception:\n        # Show AGK file:line (not generated-Python lines) so the user\n        # sees their own code. Needs sys.exc_info: the traceback object.\n        exc_type, exc_value, tb = sys.exc_info()\n        sys.stderr.write(format_agk_traceback(exc_type, exc_value, tb, code))\n        raise SystemExit(2)\n    return 0\n\n\ndef cmd_build(path, out, clean=False, no_opt=False):\n    src = _read(path)\n    search = [os.path.dirname(os.path.abspath(path))]\n    cache_dir = os.path.join(os.path.dirname(os.path.abspath(path)),\n                             CACHE_DIR_NAME)\n    if clean:\n        wipe_cache(cache_dir)\n    try:\n        code, warnings, status = compile_source_cached(\n            src, filename=path, search_paths=search, cache_dir=cache_dir,\n            optimize=not no_opt)\n    except AGKError as e:\n        print(e, file=sys.stderr)\n        raise SystemExit(1)\n    for name, hit in status:\n        print((\"cache hit: \" if hit else \"compiled: \") + name)\n    _report_warnings(warnings)\n    if out is None:\n        out = os.path.splitext(path)[0] + \".py\"\n    try:\n        with open(out, \"w\", encoding=\"utf-8\") as f:\n            f.write(code)\n    except OSError as e:\n        print(f\"agk: cannot write '{out}': {e.strerror}\", file=sys.stderr)\n        raise SystemExit(2)\n    print(f\"wrote {out}\")\n    return 0\n\n\ndef cmd_clean(path):\n    cache_dir = os.path.join(os.path.abspath(path), CACHE_DIR_NAME)\n    if wipe_cache(cache_dir):\n        print(f\"removed {cache_dir}\")\n    else:\n        print(f\"no cache at {cache_dir}\")\n    return 0\n\n\ndef cmd_check(path):\n    _code, warnings = _compile(path)\n    _report_warnings(warnings)\n    print(f\"{path}: OK\")\n    return 0\n\n\ndef cmd_debug(path):\n    return debug_file(path)\n\n\ndef cmd_fmt(path, check=False):\n    src = _read(path)\n    try:\n        out = format_source(src, filename=path)\n    except LexerError as e:\n        print(f\"agk: cannot format '{path}': {e}\", file=sys.stderr)\n        return 1\n    if out == src:\n        if check:\n            print(\"ok\")\n        return 0\n    if check:\n        print(f\"would reformat {path}\")\n        return 1\n    try:\n        with open(path, \"w\", encoding=\"utf-8\") as f:\n            f.write(out)\n    except OSError as e:\n        print(f\"agk: cannot write '{path}': {e.strerror}\", file=sys.stderr)\n        raise SystemExit(2)\n    return 0\n\n\ndef cmd_pkg(args):\n    if not args:\n        print(\"agk pkg: init | install <url-or-path> [--name NAME] | list\",\n              file=sys.stderr)\n        return 2\n    sub, rest = args[0], args[1:]\n    try:\n        if sub == \"init\":\n            return _pkg_init(rest)\n        if sub == \"install\":\n            return _pkg_install(rest)\n        if sub == \"list\":\n            return _pkg_list(rest)\n    except PkgError as e:\n        print(f\"agk pkg: {e}\", file=sys.stderr)\n        return 2\n    print(f\"agk pkg: unknown subcommand '{sub}'\", file=sys.stderr)\n    return 2\n\n\ndef _flag(args, flag):\n    \"\"\"Split off '--flag VALUE' from args. Returns (value, remaining).\"\"\"\n    out, value, i = [], None, 0\n    while i < len(args):\n        if args[i] == flag and i + 1 < len(args):\n            value = args[i + 1]\n            i += 2\n        else:\n            out.append(args[i])\n            i += 1\n    return value, out\n\n\ndef _pkg_init(args):\n    name, rest = _flag(args, \"--name\")\n    version, rest = _flag(rest, \"--version\")\n    if rest:\n        print(\"agk pkg init [--name NAME] [--version VER]\", file=sys.stderr)\n        return 2\n    manifest = cmd_init(name=name, version=version or \"0.1.0\")\n    print(f\"created agk.json ({manifest['name']} {manifest['version']})\")\n    return 0\n\n\ndef _pkg_install(args):\n    name, rest = _flag(args, \"--name\")\n    if len(rest) != 1:\n        print(\"agk pkg install <git-url-or-path> [--name NAME]\",\n              file=sys.stderr)\n        return 2\n    info = cmd_install(rest[0], name=name)\n    if info[\"already_installed\"]:\n        print(f\"{info['name']}: already installed ({info['path']})\")\n    else:\n        commit = info[\"entry\"][\"commit\"]\n        print(f\"installed {info['name']} -> {info['path']}\"\n              + (f\" @ {commit[:12]}\" if commit else \"\"))\n    return 0\n\n\ndef _pkg_list(args):\n    if args:\n        print(\"agk pkg list\", file=sys.stderr)\n        return 2\n    items = cmd_list()\n    if not items:\n        print(\"no packages installed\")\n        return 0\n    for pkg_name, entry, present in items:\n        ver = entry.get(\"version\") or \"?\"\n        commit = (entry.get(\"commit\") or \"local\")[:12]\n        status = \"\" if present else \" (missing)\"\n        print(f\"{pkg_name} {ver} {entry.get('url')} @ {commit}{status}\")\n    return 0\n\n\ndef main(argv=None):\n    if argv is None:\n        argv = sys.argv[1:]\n    if not argv or argv[0] == \"repl\":\n        repl()\n        return 0\n    cmd, rest = argv[0], argv[1:]\n    if cmd == \"run\" and rest:\n        no_opt = \"--no-opt\" in rest\n        args = [a for a in rest if a != \"--no-opt\"]\n        if len(args) == 1:\n            return cmd_run(args[0], no_opt=no_opt)\n    if cmd == \"debug\" and len(rest) == 1:\n        return cmd_debug(rest[0])\n    if cmd == \"build\" and rest:\n        args = list(rest)\n        clean = False\n        if args[0] == \"--clean\":\n            clean = True\n            args = args[1:]\n        no_opt = \"--no-opt\" in args\n        args = [a for a in args if a != \"--no-opt\"]\n        if args and args[0].endswith(\".agk\"):\n            out = None\n            if len(args) == 3 and args[1] == \"-o\":\n                out = args[2]\n            elif len(args) != 1:\n                print(USAGE, file=sys.stderr)\n                return 2\n            return cmd_build(args[0], out, clean=clean, no_opt=no_opt)\n    if cmd == \"clean\" and len(rest) <= 1:\n        return cmd_clean(rest[0] if rest else \".\")\n    if cmd == \"check\" and len(rest) == 1:\n        return cmd_check(rest[0])\n    if cmd == \"test\":\n        args = list(rest)\n        coverage = False\n        if \"--coverage\" in args:\n            coverage = True\n            args = [a for a in args if a != \"--coverage\"]\n        if len(args) > 1:\n            print(USAGE, file=sys.stderr)\n            return 2\n        return run_tests(args[0] if args else \".\", coverage=coverage)\n    if cmd == \"pkg\":\n        return cmd_pkg(rest)\n    if cmd == \"fmt\":\n        check = bool(rest) and rest[0] == \"--check\"\n        args = rest[1:] if check else rest\n        if len(args) != 1:\n            print(USAGE, file=sys.stderr)\n            return 2\n        return cmd_fmt(args[0], check=check)\n    print(USAGE, file=sys.stderr)\n    return 2\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main(sys.argv[1:]))\n", "agk/ast_nodes.py": "\"\"\"AST nodes for AGK-Real v1.\n\nEvery node carries source line/column for error reporting (file:line:col).\nPositions are excluded from equality (compare=False) so tests can assert\nAST shape without caring about positions.\n\"\"\"\n\nfrom dataclasses import dataclass, field\nfrom typing import List, Optional, Tuple, Any\n\n\n@dataclass\nclass Node:\n    line: int = field(default=0, compare=False, kw_only=True)\n    col: int = field(default=0, compare=False, kw_only=True)\n\n\n# -- program ------------------------------------------------------------\n\n@dataclass\nclass Program(Node):\n    statements: List[Any]  # top-level: Import, ConstantDef, FunctionDef, ClassDef\n\n\n@dataclass\nclass Import(Node):\n    module: str  # e.g. \"math\", \"os.path\"\n\n\n@dataclass\nclass ConstantDef(Node):\n    name: str\n    type_name: str\n    value: Any  # IntLit | FloatLit | StringLit | BoolLit\n\n\n@dataclass\nclass Param(Node):\n    name: str\n    type_name: str\n    default: Optional[Any] = None  # v2: literal default value\n\n\n@dataclass\nclass ExternDef(Node):\n    \"\"\"FFI declaration: `extern function <name> [...] from \"<lib>\"`.\n\n    Binds a C function from a shared library. params use Param nodes\n    (no defaults allowed); return_type may be None (void). lib is the\n    library name or path as written in the `from \"...\"` clause.\"\"\"\n    name: str\n    params: List[Param]\n    return_type: Optional[str]\n    lib: str\n\n\n@dataclass\nclass FunctionDef(Node):\n    name: str\n    params: List[Param]\n    return_type: Optional[str]\n    body: List[Any]\n    is_async: bool = False                    # v0.4.0: `define async function`\n    decorators: List[Any] = field(default_factory=list)  # v0.4.0: `@name` lines\n\n\n@dataclass\nclass ConstructorDef(Node):\n    params: List[Param]\n    body: List[Any]\n\n\n@dataclass\nclass FieldDecl(Node):\n    name: str\n    type_name: str\n\n\n@dataclass\nclass ClassDef(Node):\n    name: str\n    base: Optional[str]\n    fields: List[FieldDecl]\n    constructor: Optional[ConstructorDef]\n    methods: List[FunctionDef]\n\n\n# -- statements ----------------------------------------------------------\n\n@dataclass\nclass CreateStmt(Node):\n    name: str\n    type_name: str\n    # v0.6.0 (Simple AGK): when True, this declaration came from `x is <expr>`\n    # or `ask ... giving x` \u2014 declare the name if it is new in scope, but\n    # silently treat it as an assignment when the name already exists\n    # (never a redeclare error). Always False for explicit `create`.\n    soft: bool = False\n\n\n@dataclass\nclass SetStmt(Node):\n    name: str\n    value: Any\n\n\n@dataclass\nclass SetAttr(Node):\n    \"\"\"Assignment to an attribute, e.g. self.name = value.\n    Produced by the semantic phase when `set <field>` targets a class field.\"\"\"\n    obj: Any\n    attr: str\n    value: Any\n\n\n@dataclass\nclass IfStmt(Node):\n    condition: Any\n    then_body: List[Any]\n    elifs: List[Tuple[Any, List[Any]]] = field(default_factory=list)\n    else_body: Optional[List[Any]] = None\n\n\n@dataclass\nclass WhileStmt(Node):\n    condition: Any\n    body: List[Any]\n\n\n@dataclass\nclass ForEachStmt(Node):\n    var: str\n    iterable: Any\n    body: List[Any]\n\n\n@dataclass\nclass ForRangeStmt(Node):\n    \"\"\"v2: `for i from <start> to <end> [step <step>]:` \u2014 inclusive.\"\"\"\n    var: str\n    start: Any\n    end: Any\n    step: Optional[Any]  # None => step 1\n    body: List[Any]\n\n\n@dataclass\nclass TryStmt(Node):\n    \"\"\"v2: try/catch/finally. catch_name None => bare `catch:`.\"\"\"\n    body: List[Any]\n    catch_name: Optional[str]\n    catch_body: Optional[List[Any]]\n    finally_body: Optional[List[Any]]\n\n\n@dataclass\nclass RaiseStmt(Node):\n    \"\"\"v2: `raise <expr>` or bare `raise` (re-raise).\"\"\"\n    value: Optional[Any]\n\n\n@dataclass\nclass ReturnStmt(Node):\n    value: Optional[Any]  # None => bare `return`\n\n\n@dataclass\nclass YieldStmt(Node):\n    \"\"\"v0.4.0: `yield <expr>` or bare `yield`. A function whose body\n    contains one becomes a generator (Python semantics).\"\"\"\n    value: Optional[Any]  # None => bare `yield` (yields None)\n\n\n@dataclass\nclass ExprStmt(Node):\n    \"\"\"A bare expression used as a statement (e.g. a call like print(x)).\"\"\"\n    expr: Any\n\n\n# -- expressions ----------------------------------------------------------\n\n@dataclass\nclass IntLit(Node):\n    value: int\n\n\n@dataclass\nclass FloatLit(Node):\n    value: float\n\n\n@dataclass\nclass StringLit(Node):\n    value: str\n\n\n@dataclass\nclass BoolLit(Node):\n    value: bool\n\n\n@dataclass\nclass Name(Node):\n    id: str\n\n\n@dataclass\nclass BinOp(Node):\n    left: Any\n    op: str      # '+', '-', '*', '/', '%', '==', '!=', '<', '>', '<=', '>=', 'and', 'or'\n    right: Any\n\n\n@dataclass\nclass UnaryOp(Node):\n    op: str      # '-', 'not'\n    operand: Any\n\n\n@dataclass\nclass AwaitExpr(Node):\n    \"\"\"v0.4.0: `await <expr>` \u2014 valid only inside an async function.\n    Binds like Python: `await f() + 1` is `(await f()) + 1`.\"\"\"\n    operand: Any\n\n\n@dataclass\nclass Call(Node):\n    func: Any\n    args: List[Any]\n\n\n@dataclass\nclass Attribute(Node):\n    obj: Any\n    attr: str\n\n\n@dataclass\nclass Index(Node):\n    obj: Any\n    index: Any\n\n\n@dataclass\nclass ListLit(Node):\n    elements: List[Any]\n\n\n@dataclass\nclass DictLit(Node):\n    pairs: List[Tuple[Any, Any]]\n", "agk/codegen.py": "\"\"\"AGK-Real v2 Python code generator.\n\nTranslates the semantically-analyzed AST to plain Python 3 (no runtime\ndependency). Expression emission is precedence-aware: parentheses are\nadded exactly when the child binds less tightly than its context.\n\"\"\"\n\nfrom . import ast_nodes as A\nfrom .ffi import FFI_CTYPES\n\n_PREC = {\n    \"or\": 1,\n    \"and\": 2,\n    \"==\": 3, \"!=\": 3,\n    \"<\": 4, \">\": 4, \"<=\": 4, \">=\": 4,\n    \"+\": 5, \"-\": 5,\n    \"*\": 6, \"/\": 6, \"%\": 6,\n}\n_UNARY_PREC = 7\n_AWAIT_PREC = 8  # v0.4.0: `await` binds tighter than unary `-`/`not`\n_ATOM_PREC = 9\n\n\ndef _quote(s):\n    return '\"' + (s.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"')\n                   .replace(\"\\n\", \"\\\\n\").replace(\"\\t\", \"\\\\t\")) + '\"'\n\n\ndef _is_format_call(node):\n    \"\"\"True for `\"\u2026\".format(\u2026)` \u2014 which is how interpolated string\n    literals desugar, so the result is statically known to be a str.\"\"\"\n    return (isinstance(node, A.Call)\n            and isinstance(node.func, A.Attribute)\n            and node.func.attr == \"format\"\n            and isinstance(node.func.obj, A.StringLit))\n\n\nclass CodeGenerator:\n    def __init__(self, agk_file=None):\n        self.lines = []\n        self.indent = 0\n        self._started = False  # blank-line separator state across programs\n        # FFI state: loader emitted once, one ctypes.CDLL handle per\n        # distinct `from \"<lib>\"` string.\n        self._extern_loader_emitted = False\n        self._extern_libs = {}\n        # When agk_file is set, every emitted statement line gets a\n        # trailing `# AGK <file>:<line>` comment so tracebacks can be\n        # mapped back to AGK source lines (see pipeline.rewrite_traceback).\n        self._agk_file = agk_file\n\n    def emit(self, text, node=None):\n        line = \"    \" * self.indent + text\n        if (self._agk_file and node is not None and text.strip()\n                and getattr(node, \"line\", 0)):\n            line += f\"  # AGK {self._agk_file}:{node.line}\"\n        self.lines.append(line)\n\n    # -- entry ------------------------------------------------------------\n\n    def generate_program(self, program, skip_imports=frozenset(),\n                         agk_file=None):\n        \"\"\"Emit one program's top-level statements, skipping resolved\n        (inlined) module imports.\"\"\"\n        if agk_file is not None:\n            self._agk_file = agk_file\n        for stmt in program.statements:\n            if isinstance(stmt, A.Import) and stmt.module in skip_imports:\n                continue\n            if self._started:\n                self.emit(\"\")\n            self._started = True\n            self.gen_top(stmt)\n\n    def generate(self, program):\n        self.emit(\"# Generated by AGK-Real v2 - do not edit\")\n        if program_uses_async(program) and not _asyncio_imported([program]):\n            self.emit(\"import asyncio\")\n        self.generate_program(program)\n        main_def = next((s for s in program.statements\n                         if isinstance(s, A.FunctionDef) and s.name == \"main\"),\n                        None)\n        if main_def is not None:\n            self.emit(\"\")\n            self.emit('if __name__ == \"__main__\":')\n            self.indent += 1\n            # v0.4.0: an async main runs on the event loop.\n            if main_def.is_async:\n                self.emit(\"asyncio.run(main())\", main_def)\n            else:\n                self.emit(\"main()\")\n            self.indent -= 1\n        return \"\\n\".join(self.lines) + \"\\n\"\n\n    def gen_top(self, stmt):\n        if isinstance(stmt, A.Import):\n            self.emit(f\"import {stmt.module}\", stmt)\n        elif isinstance(stmt, A.ConstantDef):\n            self.emit(f\"{stmt.name} = {self.expr(stmt.value)}\", stmt)\n        elif isinstance(stmt, A.FunctionDef):\n            self.gen_def(stmt.name, stmt.params, stmt.body, node=stmt)\n        elif isinstance(stmt, A.ExternDef):\n            self.gen_extern(stmt)\n        elif isinstance(stmt, A.ClassDef):\n            self.gen_class(stmt)\n        else:  # pragma: no cover - parser/semantic never produce this\n            raise AssertionError(f\"unexpected top-level node: {stmt!r}\")\n\n    def gen_def(self, name, params, body, extra_params=(), node=None):\n        names = list(extra_params) + [\n            p.name if p.default is None\n            else f\"{p.name}={self.expr(p.default)}\"\n            for p f-8\")'\n        return param.name\n\n    def _extern_lib_var(self, lib, node):\n        \"\"\"Return the variable holding the loaded library, emitting the\n        loader helper and the CDLL call on first use.\"\"\"\n        if lib in self._extern_libs:\n            return self._extern_libs[lib]\n        if not self._extern_loader_emitted:\n            self.emit(\"import ctypes\", node)\n            self.emit(\"import ctypes.util\", node)\n            self.emit(\"def _agk_load_library(name):\", node)\n            self.indent += 1\n            self.emit('if \"/\" in name or name.startswith(\".\"):', node)\n            self.indent += 1\n            self.emit(\"path = name\", node)\n            self.indent -= 1\n            self.emit(\"else:\", node)\n            self.indent += 1\n            self.emit(\"path = ctypes.util.find_library(name) or name\",\n                       node)\n            self.indent -= 1\n            self.emit(\"return ctypes.CDLL(path)\", node)\n            self.indent -= 1\n            self._extern_loader_emitted = True\n        var = f\"_agk_lib{len(self._extern_libs)}\"\n        self.emit(f\"{var} = _agk_load_library({_quote(lib)})\", node)\n        self._extern_libs[lib] = var\n        return var\n\n    def gen_class(self, cls):\n        base = f\"({cls.base})\" if cls.base else \"\"\n        self.emit(f\"class {cls.name}{base}:\", cls)\n        self.indent += 1\n        if cls.constructor:\n            self.gen_def(\"__init__\", cls.constructor.params,\n                         cls.constructor.body, extra_params=(\"self\",),\n                         node=cls.constructor)\n        elif cls.fields:\n            self.emit(\"def __init__(self):\")\n            self.indent += 1\n            for f in cls.fields:\n                self.emit(f\"self.{f.name} = None\")\n            self.indent -= 1\n        for m in cls.methods:\n            self.gen_def(m.name, m.params, m.body, extra_params=(\"self\",),\n                         node=m)\n        self.indent -= 1\n\n    # -- statements ---------------------------------------------------------\n\n    def gen_stmt(self, s):\n        if isinstance(s, A.CreateStmt):\n            pass  # declaration only; no output until `set`\n        elif isinstance(s, A.SetStmt):\n            self.emit(f\"{s.name} = {self.expr(s.value)}\", s)\n        elif isinstance(s, A.SetAttr):\n            self.emit(f\"{self.expr(s.obj)}.{s.attr} = {self.expr(s.value)}\", s)\n        elif isinstance(s, A.IfStmt):\n            self.emit(f\"if {self.expr(s.condition)}:\", s)\n            self.gen_block(s.then_body)\n            for cond, body in s.elifs:\n                self.emit(f\"elif {self.expr(cond)}:\")\n                self.gen_block(body)\n            if s.else_body is not None:\n                self.emit(\"else:\")\n                self.gen_block(s.else_body)\n        elif isinstance(s, A.WhileStmt):\n            self.emit(f\"while {self.expr(s.condition)}:\", s)\n            self.gen_block(s.body)\n        elif isinstance(s, A.ForEachStmt):\n            self.emit(f\"for {s.var} in {self.expr(s.iterable)}:\", s)\n            self.gen_block(s.body)\n        elif isinstance(s, A.ForRangeStmt):\n            start, end = self.expr(s.start), self.expr(s.end)\n            if s.step is None:\n                self.emit(f\"for {s.var} in range({start}, ({end}) + 1):\", s)\n            else:\n                step = self.expr(s.step)\n                # inclusive on both ends, counting up or down\n                stop = (f\"(({end}) + 1) if (({step}) > 0) \"\n                        f\"else (({end}) - 1)\")\n                self.emit(f\"for {s.var} in range({start}, {stop}, {step}):\",\n                          s)\n            self.gen_block(s.body)\n        elif isinstance(s, A.TryStmt):\n            self.emit(\"try:\", s)\n            self.gen_block(s.body)\n            if s.catch_body is not None:\n                if s.catch_name:\n                    self.emit(f\"except Exception as {s. no cover\n\n\ndef generate(program):\n    \"\"\"Generate Python source for a semantically-analyzed program.\"\"\"\n    return CodeGenerator().generate(program)\n\n\ndef program_uses_async(program):\n    \"\"\"True if any function or method in the program is `async`.\"\"\"\n    for stmt in program.statements:\n        if isinstance(stmt, A.FunctionDef) and stmt.is_async:\n            return True\n        if isinstance(stmt, A.ClassDef):\n            if any(m.is_async for m in stmt.methods):\n                return True\n    return False\n\n\ndef _asyncio_imported(programs):\n    \"\"\"True if any program already has a plain `import asyncio`.\"\"\"\n    return any(isinstance(s, A.Import) and s.module == \"asyncio\"\n               for p in programs for s in p.statements)\n", "agk/debugger.py": "\"\"\"AGK-aware debugging: `agk debug <file.agk>`.\n\nCompiles the AGK file with ``annotate=True`` (every generated line\ncarries an ``# AGK file:line`` comment), builds an AGK<->Python line\nmap, and runs the program under a small :class:`pdb.Pdb` subclass that\ntranslates the debugging experience back to AGK terms:\n\n- ``break <agk-line>`` (or ``break <file.agk>:<line>``) sets a\n  breakpoint at the corresponding generated-Python line.\n- Stack frames (on stop, ``where``) show ``\"<agk file>\"(<line>)func()``\n  with the AGK source line, not generated-Python locations.\n- ``list`` shows AGK source around the current AGK line, marking the\n  current line with ``->`` and breakpoint lines with ``B``.\n- ``p <var>`` evaluates AGK variable names. Codegen preserves names\n  verbatim, except bare field references inside methods, which the\n  semantic analyzer rewrites to ``self.<field>`` \u2014 so a bare name that\n  raises ``NameError`` is retried as ``self.<name>`` when the current\n  frame has a ``self``.\n\n``step``, ``next``, ``continue``, ``up``/``down`` and the rest of pdb\nwork unchanged. Interactive use reads commands from stdin; scripted\nuse works by piping commands on stdin.\n\"\"\"\n\nimport os\nimport pdb\nimport re\nimport sys\nimport tempfile\nimport bdb as _bdb\n\nfrom .errors import AGKError\nfrom .pipeline import agk_line_map, compile_source, format_agk_traceback\n\n_IDENT = re.compile(r\"[A-Za-z_]\\w*\\Z\")\n# Matches pdb's \"at <file>:<line>\" fragments (breakpoint confirmations,\n# the `break` listing, \"Deleted ...\" messages) so they can be rewritten\n# in AGK terms.\n_AT_RE = re.compile(r\"at (\\S+):(\\d+)\")\n\n\n# Frames belonging to the debugger machinery itself (this module, pdb,\n# bdb) are noise in an AGK traceback, the same way `agk run` skips its\n# own exec frame.\n_DEBUGGER_NOISE = {os.path.realpath(p)\n                   for p in (__file__, pdb.__file__, _bdb.__file__)}\n\n\ndef _skip_debugger_frames(tb):\n    \"\"\"Drop leading traceback frames from the debugger machinery.\"\"\"\n    while tb is not None:\n        try:\n            name = os.path.realpath(tb.tb_frame.f_code.co_filename)\n        except OSError:\n            break\n        if name in _DEBUGGER_NOISE:\n            tb = tb.tb_next\n        else:\n            break\n    return tb\n\n\nclass AGKDebugger(pdb.Pdb):\n    \"\"\"A pdb that speaks AGK line numbers and shows AGK source.\"\"\"\n\n    def __init__(self, agk_path, tmp_py, py_to_agk, agk_to_py):\n        super().__init__()\n        self.prompt = \"(agk) \"\n        self._agk_path = agk_path  # path as given on the command line\n        self._tmp_py = tmp_py  # generated-Python file pdb actually runs\n        self._canonic_tmp = self.canonic(tmp_py)\n        # {py_lineno: (agk_file, agk_line)}\n        self._py_to_agk = py_to_agk\n        # {(agk_file, agk_line): first py_lineno}\n        self._agk_to_py = agk_to_py\n        self._source_cache = {}\n        self._agk_list_lineno = None\n\n    # -- line-map helpers -------------------------------------------------\n\n    def _agk_lines(self, path):\n        if path not in self._source_cache:\n            try:\n                with open(path, encoding=\"utf-8\") as f:\n                    self._source_cache[path] = f.read().splitlines()\n            except OSError:\n                self._source_cache[path] = []\n        return self._source_cache[path]\n\n    def _matches_agk_file(self, filename):\n        if filename == self._agk_path:\n            return True\n        try:\n            if os.path.abspath(filename) == os.path.abspath(self._agk_path):\n                return True\n        except OSError:\n            pass\n        return os.path.basename(filename) == os.path.basename(self._agk_path)\n\n    # -- break ------------------------------------------------------------\n\n    def _translate_break_arg(self, arg):\n        \"\"\"Rewrite an AGK ``break`` location to generated-Python terms.\n\n        Returns ``(new_arg, agk_file, agk_line)``; ``new_arg`` is None\n        when translation failed (the error is already reported), and\n        ``agk_line`` is None when the argument was passed through to\n        pdb unchanged (function names, other files, empty args).\n        \"\"\"\n        if not arg or not arg.strip():\n            return arg, None, None\n        cond = \"\"\n        rest = arg\n        comma = rest.find(\",\")\n        if comma > 0:\n            cond, rest = rest[comma:], rest[:comma]\n        loc = rest.strip()\n        filename = None\n        lineno_text = loc\n        if \":\" in loc:\n            filename, _, lineno_text = loc.rpartition(\":\")\n            filename = filename.strip()\n            lineno_text = lineno_text.strip()\n        if not lineno_text.isdigit():\n            return arg, None, None  # function name etc.: let pdb handle it\n        agk_line = int(lineno_text)\n        agk_file = self._agk_path\n        if filename and not self._matches_agk_file(filename):\n            return arg, None, None  # some other file: pass through\n        py_line = self._agk_to_py.get((agk_file, agk_line))\n        if py_line is None:\n            self.error(f\"No code at {agk_file}:{agk_line}\")\n            return None, None, None\n        return f\"{self._tmp_py}:{py_line}{cond}\", agk_file, agk_line\n\n    def do_break(self, arg, temporary=0):\n        \"\"\"b(reak) [ ([filename:]lineno | function) [, condition] ]\n\n        Line numbers are AGK lines in the file under debug; they are\n        translated to the generated-Python lines before pdb sees them.\n        \"\"\"\n        new_arg, _agk_file, _agk_line = self._translate_break_arg(arg)\n        if new_arg is None:\n            return  # translation error already reported\n        super().do_break(new_arg, temporary=temporary)\n\n    do_b = do_break\n\n    def message(self, msg):\n        \"\"\"Rewrite pdb's \"at <tmpfile>:<pyline>\" fragments to AGK.\"\"\"\n        def _agk_loc(m):\n            fname, lineno = m.group(1), int(m.group(2))\n            if self.canonic(fname) == self._canonic_tmp:\n                loc = self._py_to_agk.get(lineno)\n                if loc is not None:\n                    return f\"at {loc[0]}:{loc[1]}\"\n            return m.group(0)\n\n        super().message(_AT_RE.sub(_agk_loc, msg))\n\n    # -- frame display ------------------------------------------------------\n\n    def format_stack_entry(self, frame_lineno, lprefix=\": \"):\n        frame, lineno = frame_lineno\n        loc = self._py_to_agk.get(lineno) if lineno is not None else None\n        if loc is None:\n            # Not AGK-generated code (stdlib, unannotated line): show the\n            # real Python location rather than a wrong AGK one.\n            return super().format_stack_entry(frame_lineno, lprefix)\n        agk_file, agk_line = loc\n        name = frame.f_code.co_name or \"<lambda>\"\n        s = f'\"{agk_file}\"({agk_line}){name}()'\n        lines = self._agk_lines(agk_file)\n        if 1 <= agk_line <= len(lines):\n            s += lprefix + lines[agk_line - 1].strip()\n        return s\n\n    # -- source listing -----------------------------------------------------\n\n    def _agk_break_lines(self, agk_file):\n        \"\"\"AGK lines in *agk_file* that currently hold breakpoints.\"\"\"\n        found = set()\n        for py_line in self.get_file_breaks(self._tmp_py):\n            loc = self._py_to_agk.get(py_line)\n            if loc is not None and loc[0] == agk_file:\n                found.add(loc[1])\n        return found\n\n    def do_list(self, arg):\n        \"\"\"l(ist) [first[, last] | .]\n\n        List AGK source around the current line. Arguments are AGK line\n        numbers in the current file. The current line is marked ``->``,\n        lines holding breakpoints with ``B``.\n        \"\"\"\n        self.lastcmd = \"list\"\n        frame = self.curframe\n        loc = self._py_to_agk.get(frame.f_lineno)\n        lines = self._agk_lines(loc[0]) if loc is not None else []\n        if not lines:\n            return super().do_list(arg)\n        agk_file, agk_line = loc\n        last = None\n        if arg and arg != \".\":\n            try:\n                if \",\" in arg:\n                    first_s, last_s = arg.split(\",\", 1)\n                    first = int(first_s.strip())\n                    last = int(last_s.strip())\n                    if last < first:\n                        last = first + last  # a count, like pdb\n                else:\n                    first = max(1, int(arg.strip()) - 5)\n            except ValueError:\n                self.error(\"Error in argument: %r\" % arg)\n                return\n        elif self._agk_list_lineno is None or arg == \".\":\n            first = max(1, agk_line - 5)\n        else:\n            first = self._agk_list_lineno + 1\n        if last is None:\n            last = first + 10\n        first = max(1, first)\n        last = min(last, len(lines))\n        bp_lines = self._agk_break_lines(agk_file)\n        for i in range(first, last + 1):\n            marker = \"->\" if i == agk_line else \"  \"\n            bmark = \"B\" if i in bp_lines else \" \"\n            self.message(f\"{marker}{bmark} {i:4d}  {lines[i - 1]}\")\n        self._agk_list_lineno = last\n        if last >= len(lines):\n            self.message(\"[EOF]\")\n\n    do_l = do_list\n\n    def do_longlist(self, arg):\n        \"\"\"ll | longlist\n\n        List the AGK source lines spanned by the current function.\n        \"\"\"\n        frame = self.curframe\n        agk_file = lo = hi = None\n        try:\n            py_lines = [ln for _, _, ln in frame.f_code.co_lines()\n                        if ln is not None]\n        except Exception:\n            py_lines = []\n        for py_line in py_lines:\n            loc = self._py_to_agk.get(py_line)\n            if loc is None:\n                continue\n            if agk_file is None:\n                agk_file = loc[0]\n            if loc[0] != agk_file:\n                continue\n            lo = loc[1] if lo is None else min(lo, loc[1])\n            hi = loc[1] if hi is None else max(hi, loc[1])\n        if agk_file is None:\n            return super().do_longlist(arg)\n        self.do_list(f\"{lo},{hi}\")\n\n    do_ll = do_longlist\n\n    # -- expression evaluation ----------------------------------------------\n\n    def _getval(self, arg):\n        frame = self.curframe\n        try:\n            return eval(arg, frame.f_globals, self.curframe_locals)  # noqa: S307\n        except NameError:\n            # Bare field references inside methods compile to\n            # `self.<field>`; let `p field` find them.\n            name = arg.strip()\n            if _IDENT.fullmatch(name) and \"self\" in self.curframe_locals:\n                try:\n                    return eval(\"self.\" + name, frame.f_globals,  # noqa: S307\n                                self.curframe_locals)\n                except NameError:\n                    pass\n            self._error_exc()\n            raise\n        except BaseException:\n            self._error_exc()\n            raise\n\n    def default(self, line):\n        # Like _getval: a bare field name typed as an expression inside a\n        # method resolves to self.<name>.\n        if (line[:1] != \"!\" and self.curframe is not None\n                and _IDENT.fullmatch(line.strip())\n                and \"self\" in self.curframe_locals):\n            try:\n                val = eval(\"self.\" + line.strip(),  # noqa: S307\n                           self.curframe.f_globals, self.curframe_locals)\n            except Exception:\n                pass\n            else:\n                print(repr(val), file=self.stdout)\n                return\n        return super().default(line)\n\n\ndef debug_file(path):\n    \"\"\"Compile *path* and run it under the AGK-aware debugger.\n\n    Returns the process exit code: 0 when the session ends, 1 on\n    compile error, 2 when the debugged program dies with an unhandled\n    exception (an AGK-mapped traceback is printed, like `agk run`).\n    \"\"\"\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            src = f.read()\n    except OSError as e:\n        print(f\"agk: cannot read '{path}': {e.strerror}\", file=sys.stderr)\n        raise SystemExit(2)\n    search = [os.path.dirname(os.path.abspath(path))]\n    try:\n        code, warnings = compile_source(src, filename=path,\n                                        search_paths=search, annotate=True)\n    except AGKError as e:\n        print(e, file=sys.stderr)\n        raise SystemExit(1)\n    for w in warnings:\n        print(w, file=sys.stderr)\n    fd, tmp_py = tempfile.mkstemp(prefix=\"agk_debug_\", suffix=\".py\")\n    try:\n        with os.fdopen(fd, \"w\", encoding=\"utf-8\") as f:\n            f.write(code)\n        py_to_agk = agk_line_map(code)\n        agk_to_py = {}\n        for py_line, (agk_file, agk_line) in py_to_agk.items():\n            key = (agk_file, agk_line)\n            if key not in agk_to_py or py_line < agk_to_py[key]:\n                agk_to_py[key] = py_line\n        dbg = AGKDebugger(path, tmp_py, py_to_agk, agk_to_py)\n        dbg.message(f\"Debugging {path}: break/step/list/p use AGK lines; \"\n                    f\"'help' lists pdb commands.\")\n        try:\n            dbg.run(compile(code, tmp_py, \"exec\"),\n                    {\"__name__\": \"__main__\", \"__file__\": tmp_py})\n        except SystemExit:\n            raise  # the program called sys.exit(): keep its exit code\n        except BaseException:\n            # Unhandled exception under the debugger: show AGK file:line\n            # like `agk run` does, without the debugger's own frames.\n            exc_type, exc_value, tb = sys.exc_info()\n            sys.stderr.write(format_agk_traceback(\n                exc_type, exc_value, _skip_debugger_frames(tb), code))\n            return 2\n    finally:\n        try:\n            os.unlink(tmp_py)\n        except OSError:\n            pass\n    return 0\n", "agk/errors.py": "\"\"\"Compiler errors. All user-facing errors carry file:line:column and never\nleak Python tracebacks (the CLI catches these and prints them cleanly).\"\"\"\n\n\nclass AGKError(Exception):\n    def __init__(self, message, filename=\"<input>\", line=0, column=0, phase=\"error\"):\n        self.message = message\n        self.filename = filename\n        self.line = line\n        self.column = column\n        self.phase = phase\n        super().__init__(str(self))\n\n    def __str__(self):\n        if self.line:\n            return f\"{self.filename}:{self.line}:{self.column}: {self.phase}: {self.message}\"\n        return f\"{self.filename}: {self.phase}: {self.message}\"\n\n\nclass LexerError(AGKError):\n    def __init__(self, message, filename=\"<input>\", line=0, column=0):\n        super().__init__(message, filename, line, column, phase=\"lexer error\")\n\n\nclass ParserError(AGKError):\n    def __init__(self, message, filename=\"<input>\", line=0, column=0):\n        super().__init__(message, filename, line, column, phase=\"parser error\")\n\n\nclass SemanticError(AGKError):\n    def __init__(self, message, filename=\"<input>\", line=0, column=0):\n        super().__init__(message, filename, line, column, phase=\"semantic error\")\n\n\nclass TypeCheckError(AGKError):\n    def __init__(self, message, filename=\"<input>\", line=0, column=0):\n        super().__init__(message, filename, line, column, phase=\"type error\")\n", "agk/ffi.py": "\"\"\"AGK-Real FFI: shared metadata for `extern function` declarations.\n\nSingle source of truth for the AGK -> ctypes type mapping, used by the\nsemantic analyzer (signature validation) and the code generator\n(argtypes/restype emission).\n\"\"\"\n\n# AGK type name -> ctypes type expression used for argtypes/restype.\n#\n# Integer maps to C int (c_int), not long: this covers the overwhelming\n# majority of C APIs (getpid, abs, toupper, strcmp, ...). APIs that return\n# size_t/long will have their result truncated to int range -- a\n# documented FFI limitation, not a silent miscompile of the common case.\nFFI_CTYPES = {\n    \"String\": \"ctypes.c_char_p\",\n    \"Integer\": \"ctypes.c_int\",\n    \"Float\": \"ctypes.c_double\",\n    \"Boolean\": \"ctypes.c_bool\",\n}\n", "agk/format.py": "\"\"\"Canonical formatter for AGK-Real v1 source.\n\nRe-emits the token stream with canonical layout instead of parsing:\nindentation is derived from the lexer's INDENT/DEDENT tokens, so the\nformatter never needs a parse tree and always terminates on lexable input.\n`format_source` is idempotent: format(format(x)) == format(x).\n\nFormatting rules:\n1. Indentation is 4 spaces per INDENT/DEDENT nesting level; any existing\n   indentation is normalized.\n2. Tokens on a line are separated by single spaces, except:\n   - no space before `,` `:` `)` `]` `}` `.`\n   - no space after `(` `[` `{` `.`\n   - no space between a call/index target and `(`/`[`: `print(\"hi\")`,\n     `items[0]`\n   - `,` is followed by exactly one space, unless `)` or `]` comes next\n   - `:` is followed by exactly one space when more tokens follow on the\n     line (a `:` ending the line, e.g. a block header, gets none)\n   (`.` binds tight on both sides so `a.b()` and `self.x` stay glued;\n   unary `-` / `not` keep plain single spacing, e.g. `set x to - 5`.)\n3. Trailing whitespace is stripped.\n4. Runs of 2+ blank lines collapse to one; leading and trailing blank\n   lines are dropped.\n5. The file ends with exactly one newline.\n6. STRING contents are preserved exactly (re-quoted with escapes);\n   comments (`# ...`, whole-line or trailing) are preserved verbatim and\n   re-indented to their context.\n\"\"\"\n\nfrom .lexer import Lexer\nfrom .tokens import TokenType\n\n_NO_SPACE_BEFORE = frozenset({\n    TokenType.COMMA, TokenType.COLON, TokenType.RPAREN,\n    TokenType.RBRACKET, TokenType.RBRACE, TokenType.DOT,\n})\n_NO_SPACE_AFTER = frozenset({\n    TokenType.LPAREN, TokenType.LBRACKET, TokenType.LBRACE, TokenType.DOT,\n    TokenType.AT,  # v0.4.0: `@name`, not `@ name`\n})\n# A `(`/`[` that opens a call/index sticks to its target: `print(\"hi\")`,\n# `items[0]`.\n_CALL_TARGET_END = frozenset({\n    TokenType.IDENTIFIER, TokenType.SELF,\n    TokenType.RPAREN, TokenType.RBRACKET,\n})\n# `,` gets no space after it when a closer follows: `f(a,)` not `f(a, )`.\n_COMMA_NO_SPACE_NEXT = frozenset({TokenType.RPAREN, TokenType.RBRACKET})\n\n_ESCAPE_OUT = {\"\\\\\": \"\\\\\\\\\", '\"': '\\\\\"', \"\\n\": \"\\\\n\", \"\\t\": \"\\\\t\"}\n\n\ndef _quote_string(value):\n    \"\"\"Re-quote a lexed STRING value, preserving its exact contents.\"\"\"\n    return '\"' + \"\".join(_ESCAPE_OUT.get(ch, ch) for ch in value) + '\"'\n\n\ndef _token_text(tok):\n    if tok.type is TokenType.STRING:\n        return _quote_string(tok.value)\n    return tok.value\n\n\ndef _scan_source(source):\n    \"\"\"Pre-scan raw lines for things the token stream drops.\n\n    Returns (blank, comment_only, trailing) where:\n      blank:        set of 1-based line numbers that are empty/whitespace\n      comment_only: {lineno: (indent_width, comment_text)} for `# ...` lines\n      trailing:     {lineno: comment_text} for code lines ending in `# ...`\n    Comment text is verbatim from `#` to end of line, right-stripped.\n    \"\"\"\n    blank = set()\n    comment_only = {}\n    trailing = {}\n    for lineno, raw in enumerate(source.split(\"\\n\"), start=1):\n        if raw.strip() == \"\":\n            blank.add(lineno)\n            continue\n        # find a `#` outside any string literal (mirror the lexer: only\n        # \\\", \\\\, \\n, \\t escapes exist)\n        in_string = False\n        i = 0\n        hash_at = None\n        while i < len(raw):\n            ch = raw[i]\n            if in_string:\n                if ch == \"\\\\\":\n                    i += 2\n                    continue\n                if ch == '\"':\n                    in_string = False\n                i += 1\n                continue\n            if ch == '\"':\n                in_string = True\n            elif ch == \"#\":\n                hash_at = i\n                break\n            i += 1\n        if hash_at is None:\n            continue\n        text = raw[hash_at:].rstrip()\n        if raw[:hash_at].strip() == \"\":\n            indent = len(raw) - len(raw.lstrip(\" \"))\n            comment_only[lineno] = (indent, text)\n        else:\n            trailing[lineno] = text\n    return blank, comment_only, trailing\n\n\ndef _line_depths_and_code(tokens):\n    \"\"\"Group tokens into code lines: [(lineno, depth, [tokens])].\"\"\"\n    lines = []\n    depth = 0\n    current = []\n    for tok in tokens:\n        t = tok.type\n        if t is TokenType.INDENT:\n            depth += 1\n        elif t is TokenType.DEDENT:\n            depth -= 1\n            assert depth >= 0, \"unbalanced DEDENT\"\n        elif t is TokenType.NEWLINE:\n            lines.append((tok.line, depth, current))\n            current = []\n        elif t is TokenType.EOF:\n            break\n        else:\n            current.append(tok)\n    return lines\n\n\ndef _comment_depths(comment_only, code_lines):\n    \"\"\"Depth for each comment-only line.\n\n    The lexer drops comment-only lines, so their context depth is\n    unknowable from tokens alone; trust the comment's own indentation,\n    clamped to the deepest neighboring code line. (Idempotent: after one\n    pass every comment indent is a multiple of 4 at or under that max.)\n    \"\"\"\n    depths = {}\n    linenos = [ln for ln, _d, _t in code_lines]\n    cdepths = [d for _ln, d, _t in code_lines]\n    for lineno, (indent, _text) in comment_only.items():\n        own = indent // 4\n        neighbors = []\n        # nearest preceding / following code line depths\n        prev_d = next_d = None\n        for ln, d in zip(linenos, cdepths):\n            if ln < lineno:\n                prev_d = d\n            elif ln > lineno and next_d is None:\n                next_d = d\n        if prev_d is not None:\n            neighbors.append(prev_d)\n        if next_d is not None:\n            neighbors.append(next_d)\n        cap = max(neighbors) if neighbors else own\n        depths[lineno] = min(own, cap)\n    return depths\n\n\ndef _format_code_line(tokens):\n    \"\"\"Join one line's tokens per the spacing rules.\"\"\"\n    parts = []\n    prev_type = None\n    for i, tok in enumerate(tokens):\n        text = _token_text(tok)\n        t = tok.type\n        if i == 0:\n            parts.append(text)\n        elif t in _NO_SPACE_BEFORE:\n            parts.append(text)\n        elif prev_type in _NO_SPACE_AFTER:\n            parts.append(text)\n        elif t is TokenType.LPAREN and prev_type in _CALL_TARGET_END:\n            parts.append(text)\n        elif t is TokenType.LBRACKET and prev_type in _CALL_TARGET_END:\n            parts.append(text)\n        elif (prev_type is TokenType.COMMA\n                and t in _COMMA_NO_SPACE_NEXT):\n            parts.append(text)\n        else:\n            parts.append(\" \" + text)\n        prev_type = t\n    return \"\".join(parts)\n\n\ndef format_source(source, filename=\"<input>\"):\n    \"\"\"Format AGK source canonically. Raises LexerError on lex failure.\"\"\"\n    tokens = Lexer(source, filename).tokenize()\n    blank, comment_only, trailing = _scan_source(source)\n    code_lines = _line_depths_and_code(tokens)\n    cdepths = _comment_depths(comment_only, code_lines)\n\n    out = []          # finished lines, no trailing whitespace by construction\n    last_lineno = 0   # lineno of the last emitted item\n    emitted = False   # anything emitted yet (suppresses leading blanks)\n\n    def maybe_blank(lineno):\n        nonlocal emitted\n        if emitted and any(ln in blank\n                           for ln in range(last_lineno + 1, lineno)):\n            out.append(\"\")\n\n    def emit(lineno, text):\n        nonlocal last_lineno, emitted\n        maybe_blank(lineno)\n        out.append(text)\n        last_lineno = lineno\n        emitted = True\n\n    # comment-only lines that precede each code line, in lineno order\n    pending_comments = sorted(comment_only)\n    ci = 0\n    for lineno, depth, toks in code_lines:\n        while ci < len(pending_comments) and pending_comments[ci] < lineno:\n            cl = pending_comments[ci]\n            _indent, text = comment_only[cl]\n            emit(cl, \"    \" * cdepths[cl] + text)\n            ci += 1\n        line = \"    \" * depth + _format_code_line(toks)\n        if lineno in trailing:\n            line += \"  \" + trailing[lineno]\n        emit(lineno, line)\n    # trailing comment-only lines after the last code line\n    while ci < len(pending_comments):\n        cl = pending_comments[ci]\n        _indent, text = comment_only[cl]\n        emit(cl, \"    \" * cdepths[cl] + text)\n        ci += 1\n\n    return \"\\n\".join(out) + \"\\n\"\n", "agk/lexer.py": "\"\"\"AGK-Real v1 lexer.\n\nProduces INDENT/DEDENT tokens from significant leading whitespace\n(4 spaces per level; tabs are an error). Blank lines and comment-only\nlines never affect indentation. All failures raise LexerError with\nfile:line:column.\n\"\"\"\n\nfrom .tokens import Token, TokenType, KEYWORDS\nfrom .errors import LexerError\n\n_TWO_CHAR_OPS = {\n    \"==\": TokenType.EQ,\n    \"!=\": TokenType.NEQ,\n    \"<=\": TokenType.LTE,\n    \">=\": TokenType.GTE,\n}\n\n_ONE_CHAR_OPS = {\n    \"+\": TokenType.PLUS,\n    \"-\": TokenType.MINUS,\n    \"*\": TokenType.STAR,\n    \"/\": TokenType.SLASH,\n    \"%\": TokenType.PERCENT,\n    \"<\": TokenType.LT,\n    \">\": TokenType.GT,\n    \"(\": TokenType.LPAREN,\n    \")\": TokenType.RPAREN,\n    \"[\": TokenType.LBRACKET,\n    \"]\": TokenType.RBRACKET,\n    \"{\": TokenType.LBRACE,\n    \"}\": TokenType.RBRACE,\n    \",\": TokenType.COMMA,\n    \":\": TokenType.COLON,\n    \".\": TokenType.DOT,\n    \"@\": TokenType.AT,\n}\n\n_ESCAPES = {\"n\": \"\\n\", \"t\": \"\\t\", '\"': '\"', \"\\\\\": \"\\\\\"}\n\n\nclass Lexer:\n    def __init__(self, source, filename=\"<input>\"):\n        self.source = source\n        self.filename = filename\n        self.tokens = []\n        # indent stack holds column counts; index == nesting depth\n        self._indents = [0]\n\n    def error(self, message, line, column):\n        raise LexerError(message, self.filename, line, column)\n\n    def tokenize(self):\n        lines = self.source.split(\"\\n\")\n        for lineno, raw in enumerate(lines, start=1):\n            self._lex_line(raw, lineno)\n        # unwind any remaining indentation at EOF\n        while len(self._indents) > 1:\n            self._indents.pop()\n            self.tokens.append(Token(TokenType.DEDENT, \"\", lineno, 0))\n        self.tokens.append(Token(TokenType.EOF, \"\", lineno, 0))\n        return self.tokens\n\n    # -- line handling -------------------------------------------------\n\n    def _lex_line(self, raw, lineno):\n        # measure leading whitespace\n        pos = 0\n        while pos < len(raw) and raw[pos] in \" \\t\":\n            if raw[pos] == \"\\t\":\n                self.error(\"tabs are not allowed for indentation (use 4 spaces)\",\n                           lineno, pos)\n            pos += 1\n        indent = pos\n        rest = raw[pos:]\n\n        # blank or comment-only lines: emit nothing, ignore indentation\n        stripped = rest.lstrip()\n        if stripped == \"\" or stripped.startswith(\"#\"):\n            return\n\n        # indentation change -> INDENT / DEDENTs\n        if indent > self._indents[-1]:\n            if indent - self._indents[-1] != 4:\n                self.error(\n                    f\"indentation must increase by exactly 4 spaces \"\n                    f\"(got {indent - self._indents[-1]})\",\n                    lineno, 0)\n            self._indents.append(indent)\n            self.tokens.append(Token(TokenType.INDENT, \"\", lineno, 0))\n        elif indent < self._indents[-1]:\n            while len(self._indents) > 1 and indent < self._indents[-1]:\n                self._indents.pop()\n                self.tokens.append(Token(TokenType.DEDENT, \"\", lineno, 0))\n            if indent != self._indents[-1]:\n                self.error(\"dedent does not match any outer indentation level\",\n                           lineno, 0)\n\n        self._lex_code(rest, lineno, pos)\n        self.tokens.append(Token(TokenType.NEWLINE, \"\\n\", lineno, len(raw)))\n\n    # -- code handling -------------------------------------------------\n\n    def _lex_code(self, text, lineno, base_col):\n        i = 0\n        n = len(text)\n        while i < n:\n            ch = text[i]\n            col = base_col + i\n            if ch == \"#\":\n                break  # comment to end of line\n            if ch in \" \\t\":\n                i += 1\n                continue\n            two = text[i:i + 2]\n            if two in _TWO_CHAR_OPS:\n                self.tokens.append(Token(_TWO_CHAR_OPS[two], two, lineno, col))\n                i += 2\n                continue\n            if ch in _ONE_CHAR_OPS:\n                self.tokens.append(Token(_ONE_CHAR_OPS[ch], ch, lineno, col))\n                i += 1\n                continue\n            if ch == \"=\":\n                # `=` is only valid in `define constant X as T = <lit>`;\n                # anything else is a parser error (M2 gives the hint there)\n                self.tokens.append(Token(TokenType.ASSIGN, ch, lineno, col))\n                i += 1\n                continue\n            if ch == '\"':\n                value, i = self._lex_string(text, i, lineno, base_col)\n                self.tokens.append(Token(TokenType.STRING, value, lineno, col))\n                continue\n            if ch.isdigit():\n                value, i = self._lex_number(text, i)\n                ttype = TokenType.FLOAT if \".\" in value else TokenType.INT\n                self.tokens.append(Token(ttype, value, lineno, col))\n                continue\n            if ch.isalpha() or ch == \"_\":\n                j = i\n                while j < n and (text[j].isalnum() or text[j] == \"_\"):\n                    j += 1\n                word = text[i:j]\n                ttype = KEYWORDS.get(word, TokenType.IDENTIFIER)\n                self.tokens.append(Token(ttype, word, lineno, col))\n                i = j\n                continue\n            self.error(f\"unexpected character {ch!r}\", lineno, col)\n\n    def _lex_string(self, text, i, lineno, base_col):\n        # text[i] == '\"'\n        i += 1\n        out = []\n        n = len(text)\n        while i < n:\n            ch = text[i]\n            if ch == '\"':\n                return \"\".join(out), i + 1\n            if ch == \"\\\\\":\n                if i + 1 >= n or text[i + 1] not in _ESCAPES:\n                    self.error(f\"bad escape '\\\\{text[i + 1] if i + 1 < n else ''}'\",\n                               lineno, base_col + i)\n                out.append(_ESCAPES[text[i + 1]])\n                i += 2\n                continue\n            out.append(ch)\n            i += 1\n        self.error(\"unterminated string literal\", lineno, base_col + i)\n\n    def _lex_number(self, text, i):\n        j = i\n        n = len(text)\n        while j < n and text[j].isdigit():\n            j += 1\n        if j < n and text[j] == \".\" and j + 1 < n and text[j + 1].isdigit():\n            j += 1\n            while j < n and text[j].isdigit():\n                j += 1\n        return text[i:j], j\n", "agk/lsp.py": "\"\"\"Minimal JSON-RPC-over-stdio language server for AGK (.agk) files.\n\nRun it with::\n\n    python -m agk.lsp\n\nIt speaks LSP over stdin/stdout with ``Content-Length`` framing. Supported:\n- ``initialize`` -> capabilities {textDocumentSync: full, hover,\n  definition, completion, rename, references, documentSymbol}\n- ``initialized`` (notification)\n- ``textDocument/didOpen`` / ``textDocument/didChange`` (full sync) ->\n  the document is run through the real compile pipeline and\n  ``textDocument/publishDiagnostics`` is emitted\n- ``textDocument/hover`` -> markdown summary for defined\n  functions/classes/constants/variables/parameters/fields\n- ``textDocument/definition`` -> Location of the defining line\n- ``textDocument/completion`` -> in-scope variables/parameters, functions,\n  classes, constants, keywords, builtins, stdlib modules; after\n  ``<module>.`` the module's functions\n- ``textDocument/rename`` -> WorkspaceEdit renaming the symbol under the\n  cursor (definition + all references, scope-aware)\n- ``textDocument/references`` -> all locations of the symbol under the\n  cursor; the definition site is included by default (honours\n  ``context.includeDeclaration``)\n- ``textDocument/documentSymbol`` -> file outline: functions (with params),\n  classes (fields, constructor, methods), constants, imports\n- ``shutdown`` / ``exit``\n\nNo workspace symbols, no incremental sync, no external dependencies.\n\nRename/references track locals, parameters, functions, classes, constants,\nfields, and ``self``-attribute/method uses. Method calls on other objects\n(``a.deposit(...)``) are not tracked: AGK carries no static receiver types,\nso those call sites cannot be resolved to a class.\n\"\"\"\n\nimport dataclasses\nimport json\nimport os\nimport re\nimport sys\nfrom urllib.parse import unquote\nfrom urllib.request import url2pathname\n\nfrom . import ast_nodes as A\nfrom .errors import AGKError\nfrom .parser import parse\nfrom .pipeline import compile_program\nfrom .semantic import BUILTINS, _Scope as _SemScope\nfrom .tokens import KEYWORDS\n\nSERVER_NAME = \"agk-lsp\"\nSERVER_VERSION = \"0.2.0\"\n\n_WORD_RE = re.compile(r\"[A-Za-z_][A-Za-z0-9_]*\")\n_WARN_RE = re.compile(r\"^(.*?):(\\d+):(\\d+): warning: (.*)$\")\n\n\n# -- framing --------------------------------------------------------------\n\n\ndef read_message(stream):\n    \"\"\"Read one Content-Length framed JSON-RPC message from a binary stream.\n\n    Returns the decoded dict, or None on EOF.\n    \"\"\"\n    headers = {}\n    while True:\n        line = stream.readline()\n        if not line:\n            return None  # EOF\n        line = line.decode(\"ascii\", errors=\"replace\").strip()\n        if not line:\n            break\n        name, _, value = line.partition(\":\")\n        headers[name.strip().lower()] = value.strip()\n    try:\n        length = int(headers.get(\"content-length\", \"0\"))\n    except ValueError:\n        return None\n    if length <= 0:\n        return None\n    body = stream.read(length)\n    if not body:\n        return None\n    return json.loads(body.decode(\"utf-8\"))\n\n\ndef write_message(stream, obj):\n    body = json.dumps(obj, separators=(\",\", \":\")).encode(\"utf-8\")\n    stream.write(b\"Content-Length: %d\\r\\n\\r\\n\" % len(body))\n    stream.write(body)\n    stream.flush()\n\n\n# -- documents and symbol index -------------------------------------------\n\n\ndef uri_to_path(uri):\n    if uri.startswith(\"file://\"):\n        return url2pathname(unquote(uri[len(\"file://\"):]))\n    return None\n\n\ndef word_at(line_text, character):\n    for m in _WORD_RE.finditer(line_text):\n        if m.start() <= character <= m.end():\n            return m.group(0)\n    return None\n\n\ndef _extend_to_word(line_text, character):\n    \"\"\"Expand (line, character) to the identifier end for nicer ranges.\"\"\"\n    m = _WORD_RE.search(line_text, character)\n    if m and m.start() <= character:\n        return m.end()\n    return character + 1\n\n\nclass SymbolIndex:\n    \"\"\"name -> list of {kind, name, line (1-based), col (0-based), detail}.\"\"\"\n\n    def __init__(self):\n        self.symbols = {}\n\n    @classmethod\n    def from_program(cls, program):\n        index = cls()\n        try:\n            index._walk(program.statements)\n        except Exception:\n            pass\n        return index\n\n    def _add(self, kind, name, node, detail=\"\"):\n        self.symbols.setdefault(name, []).append({\n            \"kind\": kind,\n            \"name\": name,\n            \"line\": node.line,\n            \"col\": node.col,\n            \"detail\": detail or \"\",\n        })\n\n    def _sig(self, fn):\n        params = \", \".join(\n            p.name + (f\" as {p.type_name}\" if p.type_name else \"\")\n            for p in fn.params)\n        ret = f\" -> {fn.return_type}\" if fn.return_type else \"\"\n        return f\"({params}){ret}\"\n\n    def _walk(self, stmts):\n        for s in stmts or []:\n            if isinstance(s, A.FunctionDef):\n                self._add(\"function\", s.name, s, self._sig(s))\n                for p in s.params:\n                    self._add(\"parameter\", p.name, p, p.type_name or \"\")\n                self._walk(s.body)\n            elif isinstance(s, A.ClassDef):\n                self._add(\"class\", s.name, s,\n                          f\"extends {s.base}\" if s.base else \"\")\n                for f in s.fields:\n                    self._add(\"field\", f.name, f, f.type_name or \"\")\n                    self._add(\"field\", f\"{s.name}.{f.name}\", f,\n                              f.type_name or \"\")\n                if s.constructor:\n                    for p in s.constructor.params:\n                        self._add(\"parameter\", p.name, p, p.type_name or \"\")\n                    self._walk(s.constructor.body)\n                for m in s.methods:\n                    self._add(\"method\", m.name, m, self._sig(m))\n                    self._add(\"method\", f\"{s.name}.{m.name}\", m,\n                              self._sig(m))\n                    for p in m.params:\n                        self._add(\"parameter\", p.name, p, p.type_name or \"\")\n                    self._walk(m.body)\n            elif isinstance(s, A.ConstantDef):\n                self._add(\"constant\", s.name, s, s.type_name or \"\")\n            elif isinstance(s, A.ExternDef):\n                self._add(\"extern function\", s.name, s, self._sig(s))\n            elif isinstance(s, A.CreateStmt):\n                self._add(\"variable\", s.name, s, s.type_name or \"\")\n            elif isinstance(s, A.IfStmt):\n                self._walk(s.then_body)\n                for _cond, body in s.elifs:\n                    self._walk(body)\n                self._walk(s.else_body)\n            elif isinstance(s, (A.WhileStmt, A.ForEachStmt, A.ForRangeStmt)):\n                self._walk(s.body)\n            elif isinstance(s, A.TryStmt):\n                self._walk(s.body)\n                self._walk(s.catch_body)\n                self._walk(s.finally_body)\n\n\n# -- scope-aware index ----------------------------------------------------\n# Powers completion, rename, find-references, and document symbols.\n# Unlike SymbolIndex (name -> entries, used by hover/definition), this\n# index tracks lexical scopes the way semantic.py does (module, class,\n# function/method -- no block scopes) and resolves every Name/SetStmt\n# target to the Def that declares it, so shadowed names in different\n# functions never get mixed up. It is best-effort: it never raises, and\n# on a document with errors it simply resolves fewer references.\n\n\nclass Def:\n    \"\"\"A single definition site. line is 1-based, col is 0-based.\"\"\"\n\n    __slots__ = (\"kind\", \"name\", \"line\", \"col\", \"detail\", \"scope_id\")\n\n    def __init__(self, kind, name, line, col, detail, scope_id):\n        self.kind = kind\n        self.name = name\n        self.line = line\n        self.col = col\n        self.detail = detail\n        self.scope_id = scope_id\n\n\nclass Ref:\n    \"\"\"A reference site resolved to a Def key (scope_id, name).\"\"\"\n\n    __slots__ = (\"def_key\", \"name\", \"line\", \"col\")\n\n    def __init__(self, def_key, name, line, col):\n        self.def_key = def_key\n        self.name = name\n        self.line = line\n        self.col = col\n\n\nclass _LspScope:\n    \"\"\"A lexical scope. Name lookup reuses semantic._Scope's chain.\"\"\"\n\n    def __init__(self, sid, parent, kind, name):\n        self.id = sid\n        self.parent = parent  # _LspScope or None\n        self.kind = kind  # module|class|function|method|constructor\n        self.name = name\n        self.start_line = 0  # 1-based, inclusive\n        self.end_line = 0\n        self.table = _SemScope()\n        self.defs = {}  # name -> Def; first declaration wins\n        if parent is not None:\n            self.table.parent = parent.table\n\n    def declare(self, kind, name, line, col, detail=\"\"):\n        if name in self.defs:\n            return self.defs[name]\n        d = Def(kind, name, line, col, detail, self.id)\n        self.defs[name] = d\n        self.table.declare(name, d)\n        return d\n\n\ndef _max_line(obj):\n    \"\"\"Greatest 1-based source line in an AST subtree.\"\"\"\n    best = 0\n    if isinstance(obj, A.Node):\n        best = obj.line or 0\n        for f in dataclasses.fields(obj):\n            best = max(best, _max_line(getattr(obj, f.name)))\n    elif isinstance(obj, (list, tuple)):\n        for x in obj:\n            best = max(best, _max_line(x))\n    return best\n\n\ndef locate_range(lines, line1, col, word):\n    \"\"\"Find the LSP range of `word` on 1-based `line1`, at/after `col`.\n\n    AST node positions usually point at the statement start (e.g. the\n    ``define`` keyword), so the identifier itself is located textually.\n    Returns (lsp_line, start_char, end_char) or None.\n    \"\"\"\n    lsp_line = line1 - 1\n    if not (0 <= lsp_line < len(lines)):\n        return None\n    text = lines[lsp_line]\n    fallback = None\n    for m in _WORD_RE.finditer(text):\n        if m.group(0) != word:\n            continue\n        if m.start() <= col < m.end():\n            return (lsp_line, m.start(), m.end())\n        if fallback is None and m.start() >= col:\n            fallback = (lsp_line, m.start(), m.end())\n    return fallback\n\n\ndef _lsp_range(loc):\n    return {\"start\": {\"line\": loc[0], \"character\": loc[1]},\n            \"end\": {\"line\": loc[0], \"character\": loc[2]}}\n\n\ndef _contains(loc, lsp_line, character):\n    return loc[0] == lsp_line and loc[1] <= character <= loc[2]\n\n\nclass ScopeIndex:\n    \"\"\"Scope-aware definitions + resolved reference sites for one document.\"\"\"\n\n    def __init__(self):\n        self.scopes = []        # _LspScope; [0] is the module scope\n        self.refs = []          # [Ref]\n        self.class_members = {}  # class name -> {\"fields\",\"methods\",\"base\"}\n        self.top_symbols = []   # outline entries for documentSymbol\n\n    @classmethod\n    def from_program(cls, program):\n        index = cls()\n        try:\n            if program is not None:\n                index._build(program)\n        except Exception:\n            pass\n        return index\n\n    # -- construction ---------------------------------------------------\n\n    def _new_scope(self, parent, kind, name, start_line, end_line):\n        sc = _LspScope(len(self.scopes), parent, kind, name)\n        sc.start_line = start_line\n        sc.end_line = end_line\n        self.scopes.append(sc)\n        return sc\n\n    @staticmethod\n    def _sig(params, return_type):\n        ps = \", \".join(p.name + (f\" as {p.type_name}\" if p.type_name else \"\")\n                       for p in params or [])\n        ret = f\" -> {return_type}\" if return_type else \"\"\n        return f\"({ps}){ret}\"\n\n    def _build(self, program):\n        module = self._new_scope(None, \"module\", \"<module>\", 1, 10 ** 9)\n        functions, classes = [], []\n        # pass 1: top-level names (mirrors semantic.py's first pass)\n        for s in program.statements or []:\n            if isinstance(s, A.FunctionDef):\n                module.declare(\"function\", s.name, s.line, s.col,\n                               self._sig(s.params, s.return_type))\n                functions.append(s)\n            elif isinstance(s, A.ClassDef):\n                module.declare(\"class\", s.name, s.line, s.col,\n                               f\"extends {s.base}\" if s.base else \"\")\n                classes.append(s)\n            elif isinstance(s, A.ConstantDef):\n                module.declare(\"constant\", s.name, s.line, s.col,\n                               s.type_name or \"\")\n            elif isinstance(s, A.Import):\n                top = s.module.split(\".\")[0]\n                module.declare(\"module\", top, s.line, s.col, s.module)\n        # declare class fields before walking any bodies so that\n        # inherited field/method references resolve\n        class_scopes = {}\n        for c in classes:\n            cscope = self._new_scope(module, \"class\", c.name, c.line,\n                                     _max_line(c) or c.line)\n            fields, methods = {}, {}\n            for f in c.fields or []:\n                fields[f.name] = cscope.declare(\n                    \"field\", f.name, f.line, f.col, f.type_name or \"\")\n            self.class_members[c.name] = {\n                \"fields\": fields, \"methods\": methods, \"base\": c.base}\n            class_scopes[c.name] = cscope\n        for c in classes:\n            members = self.class_members[c.name]\n            cscope = class_scopes[c.name]\n            if c.constructor is not None:\n                self._walk_function(c.constructor, cscope, \"constructor\",\n                                    c.name, \"constructor\")\n            for m in c.methods or []:\n                members[\"methods\"][m.name] = cscope.declare(\n                    \"method\", m.name, m.line, m.col,\n                    self._sig(m.params, m.return_type))\n                self._walk_function(m, cscope, \"method\", c.name, m.name)\n        for fn in functions:\n            self._walk_function(fn, module, \"function\", None, fn.name)\n        self._build_outline(program)\n\n    def _walk_function(self, fn, parent_scope, kind, cls_name, disp_name):\n        scope = self._new_scope(parent_scope, kind, disp_name, fn.line,\n                                _max_line(fn.body) or fn.line)\n        if kind in (\"method\", \"constructor\"):\n            scope.declare(\"parameter\", \"self\", fn.line, fn.col, cls_name or \"\")\n        for p in fn.params or []:\n            scope.declare(\"parameter\", p.name, p.line, p.col,\n                          p.type_name or \"\")\n        self._walk_block(fn.body, scope, cls_name)\n\n    def _walk_block(self, stmts, scope, cls_name):\n        for s in stmts or []:\n            try:\n                self._walk_stmt(s, scope, cls_name)\n            except Exception:\n                continue  # one odd statement must not kill the index\n\n    def _walk_stmt(self, s, scope, cls_name):\n        if isinstance(s, A.CreateStmt):\n            scope.declare(\"variable\", s.name, s.line, s.col,\n                          s.type_name or \"\")\n        elif isinstance(s, A.SetStmt):\n            self._walk_expr(s.value, scope, cls_name)\n            self._record_target(s.name, s.line, s.col, scope, cls_name)\n        elif isinstance(s, A.SetAttr):\n            # produced by the semantic phase for `set <field> ...`\n            self._walk_expr(s.obj, scope, cls_name)\n            self._record_attr(s.attr, s.line, s.col, s.obj, scope, cls_name)\n            self._walk_expr(s.value, scope, cls_name)\n        elif isinstance(s, A.IfStmt):\n            self._walk_expr(s.condition, scope, cls_name)\n            self._walk_block(s.then_body, scope, cls_name)\n            for cond, body in s.elifs or []:\n                self._walk_expr(cond, scope, cls_name)\n                self._walk_block(body, scope, cls_name)\n            if s.else_body is not None:\n                self._walk_block(s.else_body, scope, cls_name)\n        elif isinstance(s, A.WhileStmt):\n            self._walk_expr(s.condition, scope, cls_name)\n            self._walk_block(s.body, scope, cls_name)\n        elif isinstance(s, A.ForEachStmt):\n            self._walk_expr(s.iterable, scope, cls_name)\n            scope.declare(\"variable\", s.var, s.line, s.col, \"\")\n            self._walk_block(s.body, scope, cls_name)\n        elif isinstance(s, A.ForRangeStmt):\n            self._walk_expr(s.start, scope, cls_name)\n            self._walk_expr(s.end, scope, cls_name)\n            if s.step is not None:\n                self._walk_expr(s.step, scope, cls_name)\n            scope.declare(\"variable\", s.var, s.line, s.col, \"\")\n            self._walk_block(s.body, scope, cls_name)\n        elif isinstance(s, A.TryStmt):\n            self._walk_block(s.body, scope, cls_name)\n            if s.catch_body is not None:\n                if s.catch_name:\n                    scope.declare(\"variable\", s.catch_name, s.line, s.col, \"\")\n                self._walk_block(s.catch_body, scope, cls_name)\n            if s.finally_body is not None:\n                self._walk_block(s.finally_body, scope, cls_name)\n        elif isinstance(s, A.RaiseStmt):\n            if s.value is not None:\n                self._walk_expr(s.value, scope, cls_name)\n        elif isinstance(s, A.ReturnStmt):\n            if s.value is not None:\n                self._walk_expr(s.value, scope, cls_name)\n        elif isinstance(s, A.ExprStmt):\n            self._walk_expr(s.expr, scope, cls_name)\n        elif isinstance(s, A.FunctionDef):\n            # not valid AGK, but don't crash on it\n            self._walk_function(s, scope, \"function\", cls_name, s.name)\n        # top-level-only statements need no walk here\n\n    def _walk_expr(self, e, scope, cls_name):\n        if e is None or isinstance(\n                e, (A.IntLit, A.FloatLit, A.StringLit, A.BoolLit)):\n            return\n        if isinstance(e, A.Name):\n            self._record_target(e.id, e.line, e.col, scope, cls_name)\n        elif isinstance(e, A.Call):\n            func = e.func\n            if isinstance(func, A.Name):\n                # mirrors semantic._check_call: bare names resolve to\n                # builtins, functions, classes, or scope variables\n                self._record_target(func.id, func.line, func.col,\n                                    scope, cls_name)\n            else:\n                self._walk_expr(func, scope, cls_name)\n            for a in e.args or []:\n                self._walk_expr(a, scope, cls_name)\n        elif isinstance(e, A.Attribute):\n            self._walk_expr(e.obj, scope, cls_name)\n            self._record_attr(e.attr, e.line, e.col, e.obj, scope, cls_name)\n        elif isinstance(e, A.BinOp):\n            self._walk_expr(e.left, scope, cls_name)\n            self._walk_expr(e.right, scope, cls_name)\n        elif isinstance(e, A.UnaryOp):\n            self._walk_expr(e.operand, scope, cls_name)\n        elif isinstance(e, A.Index):\n            self._walk_expr(e.obj, scope, cls_name)\n            self._walk_expr(e.index, scope, cls_name)\n        elif isinstance(e, A.ListLit):\n            for x in e.elements o
