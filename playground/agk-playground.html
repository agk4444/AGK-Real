<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGK Playground</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d1117; color: #e6edf3; }
  header { padding: 12px 16px; border-bottom: 1px solid #21262d;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header h1 span { color: #58a6ff; }
  header .sub { color: #8b949e; font-size: 12px; }
  #status { margin-left: auto; font-size: 12px; color: #8b949e; }
  #status.ready { color: #3fb950; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 57px); }
  .pane { display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid #21262d; }
  .toolbar { display: flex; gap: 8px; padding: 8px 12px; align-items: center;
             border-bottom: 1px solid #21262d; flex-wrap: wrap; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px;
           padding: 8px 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
  button.secondary { background: #21262d; color: #e6edf3; }
  button:disabled { opacity: .4; cursor: default; }
  select { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
           border-radius: 6px; padding: 7px; font-family: inherit; font-size: 13px; }
  textarea, pre { flex: 1; margin: 0; padding: 12px; background: #0d1117;
                  color: #e6edf3; border: 0; font-size: 13px; line-height: 1.5;
                  font-family: inherit; white-space: pre; overflow: auto; }
  textarea { resize: none; outline: none; }
  pre .err { color: #f85149; }
  pre .warn { color: #d29922; }
  pre .ok { color: #3fb950; }
  .label { font-size: 11px; color: #8b949e; text-transform: uppercase;
           letter-spacing: .08em; padding: 8px 12px 0; }
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; height: auto; }
    .pane + .pane { border-left: 0; border-top: 1px solid #21262d; }
    textarea, pre { min-height: 38vh; }
  }
</style>
</head>
<body>
<header>
  <h1>AGK <span>Playground</span></h1>
  <div class="sub">English-like code &rarr; Python, in your browser</div>
  <div id="status">loading python&hellip;</div>
</header>
<main>
  <div class="pane">
    <div class="toolbar">
      <select id="samples"></select>
      <button id="run" disabled>Run</button>
      <button id="compile" class="secondary" disabled>Compile</button>
    </div>
    <div class="label">program.agk</div>
    <textarea id="src" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="toolbar">
      <select id="view">
        <option value="output">Output</option>
        <option value="python">Generated Python</option>
      </select>
    </div>
    <div class="label" id="outlabel">output</div>
    <pre id="out"></pre>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const SOURCES = {"agk/__init__.py": "", "agk/__main__.py": "\"\"\"AGK-Real v2 command line.\n\n    python -m agk run <file.agk>        compile and run\n    python -m agk build <file.agk> [-o out.py]   compile to Python\n    python -m agk check <file.agk>       compile only; report errors/warnings\n    python -m agk repl                   interactive session\n    python -m agk                        interactive session\n\nExit codes: 0 ok, 1 compile error, 2 runtime or usage error.\n\"\"\"\n\nimport os\nimport sys\n\nfrom .errors import AGKError\nfrom .pipeline import compile_source, format_agk_traceback\nfrom .repl import repl\n\nUSAGE = __doc__\n\n\ndef _read(path):\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            return f.read()\n    except OSError as e:\n        print(f\"agk: cannot read '{path}': {e.strerror}\", file=sys.stderr)\n        raise SystemExit(2)\n\n\ndef _compile(path, annotate=False):\n    src = _read(path)\n    search = [os.path.dirname(os.path.abspath(path))]\n    try:\n        return compile_source(src, filename=path, search_paths=search,\n                              annotate=annotate)\n    except AGKError as e:\n        print(e, file=sys.stderr)\n        raise SystemExit(1)\n\n\ndef _report_warnings(warnings):\n    for w in warnings:\n        print(w, file=sys.stderr)\n\n\ndef cmd_run(path):\n    code, warnings = _compile(path, annotate=True)\n    _report_warnings(warnings)\n    try:\n        exec(compile(code, path, \"exec\"), {\"__name__\": \"__main__\"})  # noqa: S102\n    except Exception:\n        # Show AGK file:line (not generated-Python lines) so the user\n        # sees their own code. Needs sys.exc_info: the traceback object.\n        exc_type, exc_value, tb = sys.exc_info()\n        sys.stderr.write(format_agk_traceback(exc_type, exc_value, tb, code))\n        raise SystemExit(2)\n    return 0\n\n\ndef cmd_build(path, out):\n    code, warnings = _compile(path)\n    _report_warnings(warnings)\n    if out is None:\n        out = os.path.splitext(path)[0] + \".py\"\n    try:\n        with open(out, \"w\", encoding=\"utf-8\") as f:\n            f.write(code)\n    except OSError as e:\n        print(f\"agk: cannot write '{out}': {e.strerror}\", file=sys.stderr)\n        raise SystemExit(2)\n    print(f\"wrote {out}\")\n    return 0\n\n\ndef cmd_check(path):\n    _code, warnings = _compile(path)\n    _report_warnings(warnings)\n    print(f\"{path}: OK\")\n    return 0\n\n\ndef main(argv=None):\n    if argv is None:\n        argv = sys.argv[1:]\n    if not argv or argv[0] == \"repl\":\n        repl()\n        return 0\n    cmd, rest = argv[0], argv[1:]\n    if cmd == \"run\" and len(rest) == 1:\n        return cmd_run(rest[0])\n    if cmd == \"build\" and rest and rest[0].endswith(\".agk\"):\n        out = None\n        if len(rest) == 3 and rest[1] == \"-o\":\n            out = rest[2]\n        elif len(rest) != 1:\n            print(USAGE, file=sys.stderr)\n            return 2\n        return cmd_build(rest[0], out)\n    if cmd == \"check\" and len(rest) == 1:\n        return cmd_check(rest[0])\n    print(USAGE, file=sys.stderr)\n    return 2\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main(sys.argv[1:]))\n", "agk/ast_nodes.py": "\"\"\"AST nodes for AGK-Real v1.\n\nEvery node carries source line/column for error reporting (file:line:col).\nPositions are excluded from equality (compare=False) so tests can assert\nAST shape without caring about positions.\n\"\"\"\n\nfrom dataclasses import dataclass, field\nfrom typing import List, Optional, Tuple, Any\n\n\n@dataclass\nclass Node:\n    line: int = field(default=0, compare=False, kw_only=True)\n    col: int = field(default=0, compare=False, kw_only=True)\n\n\n# -- program ------------------------------------------------------------\n\n@dataclass\nclass Program(Node):\n    statements: List[Any]  # top-level: Import, ConstantDef, FunctionDef, ClassDef\n\n\n@dataclass\nclass Import(Node):\n    module: str  # e.g. \"math\", \"os.path\"\n\n\n@dataclass\nclass ConstantDef(Node):\n    name: str\n    type_name: str\n    value: Any  # IntLit | FloatLit | StringLit | BoolLit\n\n\n@dataclass\nclass Param(Node):\n    name: str\n    type_name: str\n    default: Optional[Any] = None  # v2: literal default value\n\n\n@dataclass\nclass FunctionDef(Node):\n    name: str\n    params: List[Param]\n    return_type: Optional[str]\n    body: List[Any]\n\n\n@dataclass\nclass ConstructorDef(Node):\n    params: List[Param]\n    body: List[Any]\n\n\n@dataclass\nclass FieldDecl(Node):\n    name: str\n    type_name: str\n\n\n@dataclass\nclass ClassDef(Node):\n    name: str\n    base: Optional[str]\n    fields: List[FieldDecl]\n    constructor: Optional[ConstructorDef]\n    methods: List[FunctionDef]\n\n\n# -- statements ----------------------------------------------------------\n\n@dataclass\nclass CreateStmt(Node):\n    name: str\n    type_name: str\n\n\n@dataclass\nclass SetStmt(Node):\n    name: str\n    value: Any\n\n\n@dataclass\nclass SetAttr(Node):\n    \"\"\"Assignment to an attribute, e.g. self.name = value.\n    Produced by the semantic phase when `set <field>` targets a class field.\"\"\"\n    obj: Any\n    attr: str\n    value: Any\n\n\n@dataclass\nclass IfStmt(Node):\n    condition: Any\n    then_body: List[Any]\n    elifs: List[Tuple[Any, List[Any]]] = field(default_factory=list)\n    else_body: Optional[List[Any]] = None\n\n\n@dataclass\nclass WhileStmt(Node):\n    condition: Any\n    body: List[Any]\n\n\n@dataclass\nclass ForEachStmt(Node):\n    var: str\n    iterable: Any\n    body: List[Any]\n\n\n@dataclass\nclass ForRangeStmt(Node):\n    \"\"\"v2: `for i from <start> to <end> [step <step>]:` \u2014 inclusive.\"\"\"\n    var: str\n    start: Any\n    end: Any\n    step: Optional[Any]  # None => step 1\n    body: List[Any]\n\n\n@dataclass\nclass TryStmt(Node):\n    \"\"\"v2: try/catch/finally. catch_name None => bare `catch:`.\"\"\"\n    body: List[Any]\n    catch_name: Optional[str]\n    catch_body: Optional[List[Any]]\n    finally_body: Optional[List[Any]]\n\n\n@dataclass\nclass RaiseStmt(Node):\n    \"\"\"v2: `raise <expr>` or bare `raise` (re-raise).\"\"\"\n    value: Optional[Any]\n\n\n@dataclass\nclass ReturnStmt(Node):\n    value: Optional[Any]  # None => bare `return`\n\n\n@dataclass\nclass ExprStmt(Node):\n    \"\"\"A bare expression used as a statement (e.g. a call like print(x)).\"\"\"\n    expr: Any\n\n\n# -- expressions ----------------------------------------------------------\n\n@dataclass\nclass IntLit(Node):\n    value: int\n\n\n@dataclass\nclass FloatLit(Node):\n    value: float\n\n\n@dataclass\nclass StringLit(Node):\n    value: str\n\n\n@dataclass\nclass BoolLit(Node):\n    value: bool\n\n\n@dataclass\nclass Name(Node):\n    id: str\n\n\n@dataclass\nclass BinOp(Node):\n    left: Any\n    op: str      # '+', '-', '*', '/', '%', '==', '!=', '<', '>', '<=', '>=', 'and', 'or'\n    right: Any\n\n\n@dataclass\nclass UnaryOp(Node):\n    op: str      # '-', 'not'\n    operand: Any\n\n\n@dataclass\nclass Call(Node):\n    func: Any\n    args: List[Any]\n\n\n@dataclass\nclass Attribute(Node):\n    obj: Any\n    attr: str\n\n\n@dataclass\nclass Index(Node):\n    obj: Any\n    index: Any\n\n\n@dataclass\nclass ListLit(Node):\n    elements: List[Any]\n\n\n@dataclass\nclass DictLit(Node):\n    pairs: List[Tuple[Any, Any]]\n", "agk/codegen.py": "\"\"\"AGK-Real v2 Python code generator.\n\nTranslates the semantically-analyzed AST to plain Python 3 (no runtime\ndependency). Expression emission is precedence-aware: parentheses are\nadded exactly when the child binds less tightly than its context.\n\"\"\"\n\nfrom . import ast_nodes as A\n\n_PREC = {\n    \"or\": 1,\n    \"and\": 2,\n    \"==\": 3, \"!=\": 3,\n    \"<\": 4, \">\": 4, \"<=\": 4, \">=\": 4,\n    \"+\": 5, \"-\": 5,\n    \"*\": 6, \"/\": 6, \"%\": 6,\n}\n_UNARY_PREC = 7\n_ATOM_PREC = 9\n\n\ndef _quote(s):\n    return '\"' + (s.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"')\n                   .replace(\"\\n\", \"\\\\n\").replace(\"\\t\", \"\\\\t\")) + '\"'\n\n\nclass CodeGenerator:\n    def __init__(self, agk_file=None):\n        self.lines = []\n        self.indent = 0\n        self._started = False  # blank-line separator state across programs\n        # When agk_file is set, every emitted statement line gets a\n        # trailing `# AGK <file>:<line>` comment so tracebacks can be\n        # mapped back to AGK source lines (see pipeline.rewrite_traceback).\n        self._agk_file = agk_file\n\n    def emit(self, text, node=None):\n        line = \"    \" * self.indent + text\n        if (self._agk_file and node is not None and text.strip()\n                and getattr(node, \"line\", 0)):\n            line += f\"  # AGK {self._agk_file}:{node.line}\"\n        self.lines.append(line)\n\n    # -- entry ------------------------------------------------------------\n\n    def generate_program(self, program, skip_imports=frozenset(),\n                         agk_file=None):\n        \"\"\"Emit one program's top-level statements, skipping resolved\n        (inlined) module imports.\"\"\"\n        if agk_file is not None:\n            self._agk_file = agk_file\n        for stmt in program.statements:\n            if isinstance(stmt, A.Import) and stmt.module in skip_imports:\n                continue\n            if self._started:\n                self.emit(\"\")\n            self._started = True\n            self.gen_top(stmt)\n\n    def generate(self, program):\n        self.emit(\"# Generated by AGK-Real v2 - do not edit\")\n        self.generate_program(program)\n        if any(isinstance(s, A.FunctionDef) and s.name == \"main\"\n               for s in program.statements):\n            self.emit(\"\")\n            self.emit('if __name__ == \"__main__\":')\n            self.indent += 1\n            self.emit(\"main()\")\n            self.indent -= 1\n        return \"\\n\".join(self.lines) + \"\\n\"\n\n    def gen_top(self, stmt):\n        if isinstance(stmt, A.Import):\n            self.emit(f\"import {stmt.module}\", stmt)\n        elif isinstance(stmt, A.ConstantDef):\n            self.emit(f\"{stmt.name} = {self.expr(stmt.value)}\", stmt)\n        elif isinstance(stmt, A.FunctionDef):\n            self.gen_def(stmt.name, stmt.params, stmt.body, node=stmt)\n        elif isinstance(stmt, A.ClassDef):\n            self.gen_class(stmt)\n        else:  # pragma: no cover - parser/semantic never produce this\n            raise AssertionError(f\"unexpected top-level node: {stmt!r}\")\n\n    def gen_def(self, name, params, body, extra_params=(), node=None):\n        names = list(extra_params) + [\n            p.name if p.default is None\n            else f\"{p.name}={self.expr(p.default)}\"\n            for p in params\n        ]\n        self.emit(f\"def {name}({', '.join(names)}):\", node)\n        self.indent += 1\n        for s in body:\n            self.gen_stmt(s)\n        self.indent -= 1\n\n    def gen_class(self, cls):\n        base = f\"({cls.base})\" if cls.base else \"\"\n        self.emit(f\"class {cls.name}{base}:\", cls)\n        self.indent += 1\n        if cls.constructor:\n            self.gen_def(\"__init__\", cls.constructor.params,\n                         cls.constructor.body, extra_params=(\"self\",),\n                         node=cls.constructor)\n        elif cls.fields:\n            self.emit(\"def __init__(self):\")\n            self.indent += 1\n            for f in cls.fields:\n                self.emit(f\"self.{f.name} = None\")\n            self.indent -= 1\n        for m in cls.methods:\n            self.gen_def(m.name, m.params, m.body, extra_params=(\"self\",),\n                         node=m)\n        self.indent -= 1\n\n    # -- statements ---------------------------------------------------------\n\n    def gen_stmt(self, s):\n        if isinstance(s, A.CreateStmt):\n            pass  # declaration only; no output until `set`\n        elif isinstance(s, A.SetStmt):\n            self.emit(f\"{s.name} = {self.expr(s.value)}\", s)\n        elif isinstance(s, A.SetAttr):\n            self.emit(f\"{self.expr(s.obj)}.{s.attr} = {self.expr(s.value)}\", s)\n        elif isinstance(s, A.IfStmt):\n            self.emit(f\"if {self.expr(s.condition)}:\", s)\n            self.gen_block(s.then_body)\n            for cond, body in s.elifs:\n                self.emit(f\"elif {self.expr(cond)}:\")\n                self.gen_block(body)\n            if s.else_body is not None:\n                self.emit(\"else:\")\n                self.gen_block(s.else_body)\n        elif isinstance(s, A.WhileStmt):\n            self.emit(f\"while {self.expr(s.condition)}:\", s)\n            self.gen_block(s.body)\n        elif isinstance(s, A.ForEachStmt):\n            self.emit(f\"for {s.var} in {self.expr(s.iterable)}:\", s)\n            self.gen_block(s.body)\n        elif isinstance(s, A.ForRangeStmt):\n            start, end = self.expr(s.start), self.expr(s.end)\n            if s.step is None:\n                self.emit(f\"for {s.var} in range({start}, ({end}) + 1):\", s)\n            else:\n                step = self.expr(s.step)\n                # inclusive on both ends, counting up or down\n                stop = (f\"(({end}) + 1) if (({step}) > 0) \"\n                        f\"else (({end}) - 1)\")\n                self.emit(f\"for {s.var} in range({start}, {stop}, {step}):\",\n                          s)\n            self.gen_block(s.body)\n        elif isinstance(s, A.TryStmt):\n            self.emit(\"try:\", s)\n            self.gen_block(s.body)\n            if s.catch_body is not None:\n                if s.catch_name:\n                    self.emit(f\"except Exception as {s.catch_name}:\", s)\n                else:\n                    self.emit(\"except Exception:\", s)\n                self.gen_block(s.catch_body)\n            if s.finally_body is not None:\n                self.emit(\"finally:\", s)\n                self.gen_block(s.finally_body)\n        elif isinstance(s, A.RaiseStmt):\n            if s.value is None:\n                self.emit(\"raise\", s)\n            elif isinstance(s.value, A.StringLit):\n                # v2: `raise \"message\"` raises Exception(\"message\") so a\n                # plain string message just works (Python forbids raising\n                # a bare str).\n                self.emit(f\"raise Exception({self.expr(s.value)})\", s)\n            else:\n                self.emit(f\"raise {self.expr(s.value)}\", s)\n        elif isinstance(s, A.ReturnStmt):\n            if s.value is None:\n                self.emit(\"return\", s)\n            else:\n                self.emit(f\"return {self.expr(s.value)}\", s)\n        elif isinstance(s, A.ExprStmt):\n            self.emit(self.expr(s.expr), s)\n        else:  # pragma: no cover\n            raise AssertionError(f\"unexpected statement: {s!r}\")\n\n    def gen_block(self, stmts):\n        self.indent += 1\n        for s in stmts:\n            self.gen_stmt(s)\n        self.indent -= 1\n\n    # -- expressions ----------------------------------------------------------\n\n    def expr(self, node, parent_prec=0):\n        if isinstance(node, A.IntLit):\n            return str(node.value)\n        if isinstance(node, A.FloatLit):\n            return repr(node.value)\n        if isinstance(node, A.StringLit):\n            return _quote(node.value)\n        if isinstance(node, A.BoolLit):\n            return \"True\" if node.value else \"False\"\n        if isinstance(node, A.Name):\n            return node.id\n        if isinstance(node, A.BinOp):\n            prec = _PREC[node.op]\n            left = self.expr(node.left, prec)\n            right = self.expr(node.right, prec + 1)\n            text = f\"{left} {node.op} {right}\"\n            return f\"({text})\" if prec < parent_prec else text\n        if isinstance(node, A.UnaryOp):\n            operand = self.expr(node.operand, _UNARY_PREC)\n            text = f\"-{operand}\" if node.op == \"-\" else f\"not {operand}\"\n            return f\"({text})\" if _UNARY_PREC < parent_prec else text\n        if isinstance(node, A.Call):\n            args = \", \".join(self.expr(a) for a in node.args)\n            return f\"{self.expr(node.func, _ATOM_PREC)}({args})\"\n        if isinstance(node, A.Attribute):\n            return f\"{self.expr(node.obj, _ATOM_PREC)}.{node.attr}\"\n        if isinstance(node, A.Index):\n            return f\"{self.expr(node.obj, _ATOM_PREC)}[{self.expr(node.index)}]\"\n        if isinstance(node, A.ListLit):\n            return \"[\" + \", \".join(self.expr(e) for e in node.elements) + \"]\"\n        if isinstance(node, A.DictLit):\n            pairs = \", \".join(f\"{self.expr(k)}: {self.expr(v)}\"\n                              for k, v in node.pairs)\n            return \"{\" + pairs + \"}\"\n        raise AssertionError(f\"unexpected expression: {node!r}\")  # pragma: no cover\n\n\ndef generate(program):\n    \"\"\"Generate Python source for a semantically-analyzed program.\"\"\"\n    return CodeGenerator().generate(program)\n", "agk/errors.py": "\"\"\"Compiler errors. All user-facing errors carry file:line:column and never\nleak Python tracebacks (the CLI catches these and prints them cleanly).\"\"\"\n\n\nclass AGKError(Exception):\n    def __init__(self, message, filename=\"<input>\", line=0, column=0, phase=\"error\"):\n        self.message = message\n        self.filename = filename\n        self.line = line\n        self.column = column\n        self.phase = phase\n        super().__init__(str(self))\n\n    def __str__(self):\n        if self.line:\n            return f\"{self.filename}:{self.line}:{self.column}: {self.phase}: {self.message}\"\n        return f\"{self.filename}: {self.phase}: {self.message}\"\n\n\nclass LexerError(AGKError):\n    def __init__(self, message, filename=\"<input>\", line=0, column=0):\n        super().__init__(message, filename, line, column, phase=\"lexer error\")\n\n\nclass ParserError(AGKError):\n    def __init__(self, message, filename=\"<input>\", line=0, column=0):\n        super().__init__(message, filename, line, column, phase=\"parser error\")\n\n\nclass SemanticError(AGKError):\n    def __init__(self, message, filename=\"<input>\", line=0, column=0):\n        super().__init__(message, filename, line, column, phase=\"semantic error\")\n", "agk/lexer.py": "\"\"\"AGK-Real v1 lexer.\n\nProduces INDENT/DEDENT tokens from significant leading whitespace\n(4 spaces per level; tabs are an error). Blank lines and comment-only\nlines never affect indentation. All failures raise LexerError with\nfile:line:column.\n\"\"\"\n\nfrom .tokens import Token, TokenType, KEYWORDS\nfrom .errors import LexerError\n\n_TWO_CHAR_OPS = {\n    \"==\": TokenType.EQ,\n    \"!=\": TokenType.NEQ,\n    \"<=\": TokenType.LTE,\n    \">=\": TokenType.GTE,\n}\n\n_ONE_CHAR_OPS = {\n    \"+\": TokenType.PLUS,\n    \"-\": TokenType.MINUS,\n    \"*\": TokenType.STAR,\n    \"/\": TokenType.SLASH,\n    \"%\": TokenType.PERCENT,\n    \"<\": TokenType.LT,\n    \">\": TokenType.GT,\n    \"(\": TokenType.LPAREN,\n    \")\": TokenType.RPAREN,\n    \"[\": TokenType.LBRACKET,\n    \"]\": TokenType.RBRACKET,\n    \"{\": TokenType.LBRACE,\n    \"}\": TokenType.RBRACE,\n    \",\": TokenType.COMMA,\n    \":\": TokenType.COLON,\n    \".\": TokenType.DOT,\n}\n\n_ESCAPES = {\"n\": \"\\n\", \"t\": \"\\t\", '\"': '\"', \"\\\\\": \"\\\\\"}\n\n\nclass Lexer:\n    def __init__(self, source, filename=\"<input>\"):\n        self.source = source\n        self.filename = filename\n        self.tokens = []\n        # indent stack holds column counts; index == nesting depth\n        self._indents = [0]\n\n    def error(self, message, line, column):\n        raise LexerError(message, self.filename, line, column)\n\n    def tokenize(self):\n        lines = self.source.split(\"\\n\")\n        for lineno, raw in enumerate(lines, start=1):\n            self._lex_line(raw, lineno)\n        # unwind any remaining indentation at EOF\n        while len(self._indents) > 1:\n            self._indents.pop()\n            self.tokens.append(Token(TokenType.DEDENT, \"\", lineno, 0))\n        self.tokens.append(Token(TokenType.EOF, \"\", lineno, 0))\n        return self.tokens\n\n    # -- line handling -------------------------------------------------\n\n    def _lex_line(self, raw, lineno):\n        # measure leading whitespace\n        pos = 0\n        while pos < len(raw) and raw[pos] in \" \\t\":\n            if raw[pos] == \"\\t\":\n                self.error(\"tabs are not allowed for indentation (use 4 spaces)\",\n                           lineno, pos)\n            pos += 1\n        indent = pos\n        rest = raw[pos:]\n\n        # blank or comment-only lines: emit nothing, ignore indentation\n        stripped = rest.lstrip()\n        if stripped == \"\" or stripped.startswith(\"#\"):\n            return\n\n        # indentation change -> INDENT / DEDENTs\n        if indent > self._indents[-1]:\n            if indent - self._indents[-1] != 4:\n                self.error(\n                    f\"indentation must increase by exactly 4 spaces \"\n                    f\"(got {indent - self._indents[-1]})\",\n                    lineno, 0)\n            self._indents.append(indent)\n            self.tokens.append(Token(TokenType.INDENT, \"\", lineno, 0))\n        elif indent < self._indents[-1]:\n            while len(self._indents) > 1 and indent < self._indents[-1]:\n                self._indents.pop()\n                self.tokens.append(Token(TokenType.DEDENT, \"\", lineno, 0))\n            if indent != self._indents[-1]:\n                self.error(\"dedent does not match any outer indentation level\",\n                           lineno, 0)\n\n        self._lex_code(rest, lineno, pos)\n        self.tokens.append(Token(TokenType.NEWLINE, \"\\n\", lineno, len(raw)))\n\n    # -- code handling -------------------------------------------------\n\n    def _lex_code(self, text, lineno, base_col):\n        i = 0\n        n = len(text)\n        while i < n:\n            ch = text[i]\n            col = base_col + i\n            if ch == \"#\":\n                break  # comment to end of line\n            if ch in \" \\t\":\n                i += 1\n                continue\n            two = text[i:i + 2]\n            if two in _TWO_CHAR_OPS:\n                self.tokens.append(Token(_TWO_CHAR_OPS[two], two, lineno, col))\n                i += 2\n                continue\n            if ch in _ONE_CHAR_OPS:\n                self.tokens.append(Token(_ONE_CHAR_OPS[ch], ch, lineno, col))\n                i += 1\n                continue\n            if ch == \"=\":\n                # `=` is only valid in `define constant X as T = <lit>`;\n                # anything else is a parser error (M2 gives the hint there)\n                self.tokens.append(Token(TokenType.ASSIGN, ch, lineno, col))\n                i += 1\n                continue\n            if ch == '\"':\n                value, i = self._lex_string(text, i, lineno, base_col)\n                self.tokens.append(Token(TokenType.STRING, value, lineno, col))\n                continue\n            if ch.isdigit():\n                value, i = self._lex_number(text, i)\n                ttype = TokenType.FLOAT if \".\" in value else TokenType.INT\n                self.tokens.append(Token(ttype, value, lineno, col))\n                continue\n            if ch.isalpha() or ch == \"_\":\n                j = i\n                while j < n and (text[j].isalnum() or text[j] == \"_\"):\n                    j += 1\n                word = text[i:j]\n                ttype = KEYWORDS.get(word, TokenType.IDENTIFIER)\n                self.tokens.append(Token(ttype, word, lineno, col))\n                i = j\n                continue\n            self.error(f\"unexpected character {ch!r}\", lineno, col)\n\n    def _lex_string(self, text, i, lineno, base_col):\n        # text[i] == '\"'\n        i += 1\n        out = []\n        n = len(text)\n        while i < n:\n            ch = text[i]\n            if ch == '\"':\n                return \"\".join(out), i + 1\n            if ch == \"\\\\\":\n                if i + 1 >= n or text[i + 1] not in _ESCAPES:\n                    self.error(f\"bad escape '\\\\{text[i + 1] if i + 1 < n else ''}'\",\n                               lineno, base_col + i)\n                out.append(_ESCAPES[text[i + 1]])\n                i += 2\n                continue\n            out.append(ch)\n            i += 1\n        self.error(\"unterminated string literal\", lineno, base_col + i)\n\n    def _lex_number(self, text, i):\n        j = i\n        n = len(text)\n        while j < n and text[j].isdigit():\n            j += 1\n        if j < n and text[j] == \".\" and j + 1 < n and text[j + 1].isdigit():\n            j += 1\n            while j < n and text[j].isdigit():\n                j += 1\n        return text[i:j], j\n", "agk/parser.py": "\"\"\"AGK-Real v1 recursive-descent parser.\n\nConsumes the INDENT/DEDENT token stream from the lexer and builds the AST.\nEvery node records its source line/column (for file:line:col errors).\nAll failures raise ParserError. The parser never guesses indentation \u2014\nit follows the lexer's INDENT/DEDENT tokens exactly.\n\"\"\"\n\nfrom .tokens import Token, TokenType as T\nfrom .errors import ParserError\nfrom . import ast_nodes as A\n\n\nclass Parser:\n    def __init__(self, tokens, filename=\"<input>\"):\n        self.tokens = tokens\n        self.filename = filename\n        self.pos = 0\n\n    # -- token plumbing -------------------------------------------------\n\n    def peek(self):\n        return self.tokens[self.pos]\n\n    def advance(self):\n        tok = self.tokens[self.pos]\n        if tok.type != T.EOF:\n            self.pos += 1\n        return tok\n\n    def check(self, *types):\n        return self.peek().type in types\n\n    def match(self, *types):\n        if self.check(*types):\n            return self.advance()\n        return None\n\n    def expect(self, type_, message):\n        tok = self.peek()\n        if tok.type != type_:\n            raise ParserError(message, self.filename, tok.line, tok.column)\n        return self.advance()\n\n    def error(self, message, tok=None):\n        tok = tok or self.peek()\n        raise ParserError(message, self.filename, tok.line, tok.column)\n\n    def _skip_newlines(self):\n        while self.match(T.NEWLINE):\n            pass\n\n    # -- entry point ----------------------------------------------------\n\n    def parse(self):\n        statements = []\n        self._skip_newlines()\n        while not self.check(T.EOF):\n            if self.match(T.IMPORT):\n                statements.append(self.parse_import())\n            elif self.check(T.DEFINE):\n                statements.append(self.parse_top_level_define())\n            else:\n                self.error(f\"unexpected {self.peek().value!r} at top level; \"\n                           f\"expected 'import' or 'define'\")\n            self._skip_newlines()\n        return A.Program(statements)\n\n    def parse_import(self):\n        imp = self.tokens[self.pos - 1]  # the IMPORT token just matched\n        parts = [self.expect(T.IDENTIFIER, \"expected module name\").value]\n        while self.match(T.DOT):\n            parts.append(self.expect(T.IDENTIFIER, \"expected module name\").value)\n        self.expect(T.NEWLINE, \"expected end of line after import\")\n        return A.Import(\".\".join(parts), line=imp.line, col=imp.column)\n\n    def parse_top_level_define(self):\n        defn = self.expect(T.DEFINE, \"expected 'define'\")\n        tok = self.peek()\n        if tok.type == T.FUNCTION:\n            return self.parse_function_def()\n        if tok.type == T.CLASS:\n            return self.parse_class_def()\n        if tok.type == T.CONSTANT:\n            return self.parse_constant_def()\n        self.error(\"expected 'function', 'class', or 'constant' after 'define'\")\n\n    # -- definitions ----------------------------------------------------\n\n    def _parse_signature(self):\n        \"\"\"Parse `name [that takes a as T, ...] [and returns T]`, after\n        `define function` / `define constructor`.\n        Returns (name_tok|None, params, return_type).\"\"\"\n        name_tok = self.advance() if self.check(T.IDENTIFIER) else None\n        params = []\n        return_type = None\n        if self.match(T.THAT):\n            if self.match(T.TAKES):\n                params = self._parse_params()\n            if self.match(T.AND):\n                self.expect(T.RETURNS, \"expected 'returns' after 'and'\")\n                return_type = self.expect(T.IDENTIFIER,\n                                          \"expected return type name\").value\n            elif self.match(T.RETURNS):\n                return_type = self.expect(T.IDENTIFIER,\n                                          \"expected return type name\").value\n        return name_tok, params, return_type\n\n    def _parse_params(self):\n        params = [self._parse_param()]\n        while self.match(T.COMMA):\n            params.append(self._parse_param())\n        return params\n\n    def _parse_param(self):\n        name = self.expect(T.IDENTIFIER, \"expected parameter name\")\n        self.expect(T.AS, f\"expected 'as' after parameter {name.value!r}\")\n        type_name = self.expect(T.IDENTIFIER,\n                                f\"expected type for parameter {name.value!r}\")\n        default = None\n        if self.match(T.ASSIGN):\n            default = self._parse_default(name)\n        return A.Param(name.value, type_name.value, default,\n                       line=name.line, col=name.column)\n\n    def _parse_default(self, name_tok):\n        \"\"\"v2: parse a literal default value (optional leading `-`).\"\"\"\n        neg_tok = self.match(T.MINUS)\n        tok = self.peek()\n        node = None\n        if tok.type == T.INT:\n            node = A.IntLit(int(tok.value), line=tok.line, col=tok.column)\n        elif tok.type == T.FLOAT:\n            node = A.FloatLit(float(tok.value), line=tok.line, col=tok.column)\n        elif tok.type == T.STRING:\n            node = self._parse_string(tok)\n            if not isinstance(node, A.StringLit):\n                self.error(\n                    f\"default value for parameter {name_tok.value!r} must be \"\n                    f\"a static string (interpolation is not allowed in \"\n                    f\"defaults)\", tok)\n        elif tok.type in (T.TRUE, T.FALSE):\n            node = A.BoolLit(tok.type == T.TRUE,\n                             line=tok.line, col=tok.column)\n        if node is None:\n            self.error(\n                f\"default value for parameter {name_tok.value!r} must be a \"\n                f\"literal (number, string, or boolean)\", tok)\n        if neg_tok is not None:\n            if not isinstance(node, (A.IntLit, A.FloatLit)):\n                self.error(\n                    f\"cannot negate the default value of parameter \"\n                    f\"{name_tok.value!r}\", neg_tok)\n            node = A.UnaryOp(\"-\", node, line=neg_tok.line, col=neg_tok.column)\n        self.advance()\n        return node\n\n    def parse_function_def(self):\n        fn = self.expect(T.FUNCTION, \"expected 'function'\")\n        name_tok, params, return_type = self._parse_signature()\n        if name_tok is None:\n            self.error(\"expected function name\")\n        self.expect(T.COLON, \"expected ':' after function signature\")\n        body = self.parse_block()\n        return A.FunctionDef(name_tok.value, params, return_type, body,\n                             line=fn.line, col=fn.column)\n\n    def parse_constant_def(self):\n        cnst = self.expect(T.CONSTANT, \"expected 'constant'\")\n        name = self.expect(T.IDENTIFIER, \"expected constant name\")\n        self.expect(T.AS, f\"expected 'as' after constant {name.value!r}\")\n        type_name = self.expect(T.IDENTIFIER,\n                                f\"expected type for constant {name.value!r}\")\n        self.expect(T.ASSIGN, \"expected '=' in constant definition\")\n        value = self.parse_primary()\n        if (not isinstance(value, (A.IntLit, A.FloatLit, A.StringLit, A.BoolLit))\n                or not self.check(T.NEWLINE)):\n            self.error(\"constant value must be a single literal\")\n        self.expect(T.NEWLINE, \"expected end of line after constant definition\")\n        return A.ConstantDef(name.value, type_name.value, value,\n                             line=cnst.line, col=cnst.column)\n\n    def parse_class_def(self):\n        cls = self.expect(T.CLASS, \"expected 'class'\")\n        name = self.expect(T.IDENTIFIER, \"expected class name\")\n        base = None\n        if self.match(T.EXTENDS):\n            base = self.expect(T.IDENTIFIER, \"expected base class name\").value\n        if self.match(T.IMPLEMENTS):\n            self.error(\"'implements' is not supported in v1\")\n        self.expect(T.COLON, \"expected ':' after class header\")\n        self.expect(T.NEWLINE, \"expected end of line after class header\")\n        self.expect(T.INDENT, \"expected indented class body\")\n\n        fields, methods, constructor = [], [], None\n        while not self.check(T.DEDENT, T.EOF):\n            if self.match(T.NEWLINE):\n                continue\n            if self.match(T.VARIABLE):\n                fields.append(self._parse_field())\n            elif self.check(T.DEFINE):\n                defn = self.advance()\n                if self.match(T.CONSTRUCTOR):\n                    if constructor is not None:\n                        self.error(\"duplicate constructor\", defn)\n                    constructor = self._parse_constructor()\n                elif self.check(T.FUNCTION):\n                    methods.append(self.parse_function_def())\n                else:\n                    self.error(\"expected 'constructor' or 'function' \"\n                               \"after 'define' in class body\", defn)\n            else:\n                self.error(\"expected 'variable', 'define constructor', \"\n                           \"or 'define function' in class body\")\n        self.expect(T.DEDENT, \"expected end of class body\")\n        return A.ClassDef(name.value, base, fields, constructor, methods,\n                          line=cls.line, col=cls.column)\n\n    def _parse_field(self):\n        var = self.tokens[self.pos - 1]  # VARIABLE token just matched\n        name = self.expect(T.IDENTIFIER, \"expected field name\")\n        self.expect(T.AS, f\"expected 'as' after field {name.value!r}\")\n        type_name = self.expect(T.IDENTIFIER,\n                                f\"expected type for field {name.value!r}\")\n        self.expect(T.NEWLINE, \"expected end of line after field declaration\")\n        return A.FieldDecl(name.value, type_name.value,\n                           line=var.line, col=var.column)\n\n    def _parse_constructor(self):\n        ctor = self.tokens[self.pos - 1]  # CONSTRUCTOR token just matched\n        _, params, _ = self._parse_signature()\n        self.expect(T.COLON, \"expected ':' after constructor signature\")\n        body = self.parse_block()\n        return A.ConstructorDef(params, body, line=ctor.line, col=ctor.column)\n\n    # -- blocks and statements -------------------------------------------\n\n    def parse_block(self):\n        self.expect(T.NEWLINE, \"expected end of line\")\n        self.expect(T.INDENT, \"expected indented block\")\n        stmts = []\n        while not self.check(T.DEDENT, T.EOF):\n            if self.match(T.NEWLINE):\n                continue\n            stmts.append(self.parse_statement())\n        self.expect(T.DEDENT, \"expected end of block\")\n        return stmts\n\n    def parse_statement(self):\n        tok = self.peek()\n        if tok.type == T.CREATE:\n            return self.parse_create()\n        if tok.type == T.SET:\n            return self.parse_set()\n        if tok.type == T.IF:\n            return self.parse_if()\n        if tok.type == T.WHILE:\n            return self.parse_while()\n        if tok.type == T.FOR:\n            return self.parse_for()\n        if tok.type == T.TRY:\n            return self.parse_try()\n        if tok.type == T.RAISE:\n            return self.parse_raise()\n        if tok.type == T.RETURN:\n            return self.parse_return()\n        if tok.type == T.DEFINE:\n            self.error(\"'define' is only allowed at top level or in a class body\")\n        if tok.type == T.IDENTIFIER and self._next_is(T.ASSIGN):\n            self.error(\"unexpected '='; AGK uses 'set <name> to <expr>' \"\n                       \"for assignment (or '==' for comparison)\", tok)\n        expr = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.ExprStmt(expr, line=expr.line, col=expr.col)\n\n    def _next_is(self, type_):\n        return (self.pos + 1 < len(self.tokens)\n                and self.tokens[self.pos + 1].type == type_)\n\n    def parse_create(self):\n        crt = self.expect(T.CREATE, \"expected 'create'\")\n        name = self.expect(T.IDENTIFIER, \"expected variable name\")\n        self.expect(T.AS, f\"expected 'as' after variable {name.value!r}\")\n        type_name = self.expect(T.IDENTIFIER,\n                                f\"expected type for variable {name.value!r}\")\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.CreateStmt(name.value, type_name.value,\n                            line=crt.line, col=crt.column)\n\n    def parse_set(self):\n        st = self.expect(T.SET, \"expected 'set'\")\n        name = self.expect(T.IDENTIFIER, \"expected variable name\")\n        self.expect(T.TO, f\"expected 'to' after variable {name.value!r}\")\n        value = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.SetStmt(name.value, value, line=st.line, col=st.column)\n\n    def parse_if(self):\n        kw = self.expect(T.IF, \"expected 'if'\")\n        cond = self.parse_expression()\n        self.expect(T.COLON, \"expected ':' after 'if' condition\")\n        then_body = self.parse_block()\n        elifs = []\n        while self.match(T.ELIF):\n            econd = self.parse_expression()\n            self.expect(T.COLON, \"expected ':' after 'elif' condition\")\n            elifs.append((econd, self.parse_block()))\n        else_body = None\n        if self.match(T.ELSE):\n            self.expect(T.COLON, \"expected ':' after 'else'\")\n            else_body = self.parse_block()\n        return A.IfStmt(cond, then_body, elifs, else_body,\n                        line=kw.line, col=kw.column)\n\n    def parse_while(self):\n        kw = self.expect(T.WHILE, \"expected 'while'\")\n        cond = self.parse_expression()\n        self.expect(T.COLON, \"expected ':' after 'while' condition\")\n        return A.WhileStmt(cond, self.parse_block(),\n                           line=kw.line, col=kw.column)\n\n    def parse_for(self):\n        \"\"\"v2: `for each x in ...`, `for x in ...`, and\n        `for i from <start> to <end> [step <step>]:`.\"\"\"\n        kw = self.expect(T.FOR, \"expected 'for'\")\n        if self.match(T.EACH):\n            return self._parse_for_each(kw)\n        var = self.expect(T.IDENTIFIER, \"expected loop variable after 'for'\")\n        if self.match(T.FROM):\n            start = self.parse_expression()\n            self.expect(T.TO,\n                        \"expected 'to' in 'for <var> from <start> to <end>'\")\n            end = self.parse_expression()\n            step = None\n            if self.match(T.STEP):\n                step = self.parse_expression()\n            self.expect(T.COLON, \"expected ':' after 'for' header\")\n            return A.ForRangeStmt(var.value, start, end, step,\n                                  self.parse_block(),\n                                  line=kw.line, col=kw.column)\n        self.expect(T.IN, f\"expected 'in' after loop variable {var.value!r}\")\n        iterable = self.parse_expression()\n        self.expect(T.COLON, \"expected ':' after 'for' header\")\n        return A.ForEachStmt(var.value, iterable, self.parse_block(),\n                             line=kw.line, col=kw.column)\n\n    def _parse_for_each(self, kw):\n        var = self.expect(T.IDENTIFIER, \"expected loop variable\")\n        self.expect(T.IN, f\"expected 'in' after loop variable {var.value!r}\")\n        iterable = self.parse_expression()\n        self.expect(T.COLON, \"expected ':' after 'for each' header\")\n        return A.ForEachStmt(var.value, iterable, self.parse_block(),\n                             line=kw.line, col=kw.column)\n\n    def parse_try(self):\n        \"\"\"v2: try/catch/finally.\"\"\"\n        kw = self.expect(T.TRY, \"expected 'try'\")\n        self.expect(T.COLON, \"expected ':' after 'try'\")\n        body = self.parse_block()\n        catch_name, catch_body, finally_body = None, None, None\n        if self.match(T.CATCH):\n            if self.check(T.IDENTIFIER):\n                catch_name = self.advance().value\n            self.expect(T.COLON, \"expected ':' after 'catch'\")\n            catch_body = self.parse_block()\n        if self.match(T.FINALLY):\n            self.expect(T.COLON, \"expected ':' after 'finally'\")\n            finally_body = self.parse_block()\n        if catch_body is None and finally_body is None:\n            self.error(\"expected 'catch' or 'finally' after 'try' block\", kw)\n        return A.TryStmt(body, catch_name, catch_body, finally_body,\n                         line=kw.line, col=kw.column)\n\n    def parse_raise(self):\n        \"\"\"v2: `raise <expr>` or bare `raise` (re-raise inside catch).\"\"\"\n        kw = self.expect(T.RAISE, \"expected 'raise'\")\n        if self.check(T.NEWLINE):\n            self.advance()\n            return A.RaiseStmt(None, line=kw.line, col=kw.column)\n        value = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.RaiseStmt(value, line=kw.line, col=kw.column)\n\n    def parse_return(self):\n        kw = self.expect(T.RETURN, \"expected 'return'\")\n        if self.check(T.NEWLINE):\n            self.advance()\n            return A.ReturnStmt(None, line=kw.line, col=kw.column)\n        value = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.ReturnStmt(value, line=kw.line, col=kw.column)\n\n    # -- expressions (precedence climbing, per SPEC section 5) ------------\n\n    def parse_expression(self):\n        return self.parse_or()\n\n    def parse_or(self):\n        left = self.parse_and()\n        while True:\n            op = self.match(T.OR)\n            if not op:\n                return left\n            left = A.BinOp(left, \"or\", self.parse_and(),\n                           line=op.line, col=op.column)\n\n    def parse_and(self):\n        left = self.parse_equality()\n        while True:\n            op = self.match(T.AND)\n            if not op:\n                return left\n            left = A.BinOp(left, \"and\", self.parse_equality(),\n                           line=op.line, col=op.column)\n\n    def parse_equality(self):\n        left = self.parse_comparison()\n        while True:\n            op = self.match(T.EQ, T.NEQ)\n            if not op:\n                return left\n            sym = \"==\" if op.type == T.EQ else \"!=\"\n            left = A.BinOp(left, sym, self.parse_comparison(),\n                           line=op.line, col=op.column)\n\n    def parse_comparison(self):\n        left = self.parse_term()\n        while True:\n            op = self.match(T.LT, T.GT, T.LTE, T.GTE)\n            if not op:\n                return left\n            sym = {\"<\": \"<\", \">\": \">\", \"<=\": \"<=\", \">=\": \">=\"}[op.value]\n            left = A.BinOp(left, sym, self.parse_term(),\n                           line=op.line, col=op.column)\n\n    def parse_term(self):\n        left = self.parse_factor()\n        while True:\n            op = self.match(T.PLUS, T.MINUS)\n            if not op:\n                return left\n            left = A.BinOp(left, op.value, self.parse_factor(),\n                           line=op.line, col=op.column)\n\n    def parse_factor(self):\n        left = self.parse_unary()\n        while True:\n            op = self.match(T.STAR, T.SLASH, T.PERCENT)\n            if not op:\n                return left\n            left = A.BinOp(left, op.value, self.parse_unary(),\n                           line=op.line, col=op.column)\n\n    def parse_unary(self):\n        op = self.match(T.MINUS, T.NOT)\n        if op:\n            sym = \"-\" if op.type == T.MINUS else \"not\"\n            operand = self.parse_unary()\n            return A.UnaryOp(sym, operand, line=op.line, col=op.column)\n        return self.parse_postfix()\n\n    def parse_postfix(self):\n        node = self.parse_primary()\n        while True:\n            if self.match(T.DOT):\n                attr = self.expect(T.IDENTIFIER, \"expected attribute name\")\n                node = A.Attribute(node, attr.value,\n                                   line=node.line, col=node.col)\n            elif self.match(T.LBRACKET):\n                lb = self.tokens[self.pos - 1]\n                index = self.parse_expression()\n                self.expect(T.RBRACKET, \"expected ']'\")\n                node = A.Index(node, index, line=lb.line, col=lb.column)\n            elif self.match(T.LPAREN):\n                args = []\n                if not self.check(T.RPAREN):\n                    args.append(self.parse_expression())\n                    while self.match(T.COMMA):\n                        args.append(self.parse_expression())\n                self.expect(T.RPAREN, \"expected ')'\")\n                node = A.Call(node, args, line=node.line, col=node.col)\n            else:\n                return node\n\n    def parse_primary(self):\n        tok = self.peek()\n        if tok.type == T.INT:\n            self.advance()\n            return A.IntLit(int(tok.value), line=tok.line, col=tok.column)\n        if tok.type == T.FLOAT:\n            self.advance()\n            return A.FloatLit(float(tok.value), line=tok.line, col=tok.column)\n        if tok.type == T.STRING:\n            return self._parse_string(self.advance())\n        if tok.type == T.TRUE:\n            self.advance()\n            return A.BoolLit(True, line=tok.line, col=tok.column)\n        if tok.type == T.FALSE:\n            self.advance()\n            return A.BoolLit(False, line=tok.line, col=tok.column)\n        if tok.type == T.IDENTIFIER or tok.type == T.SELF:\n            self.advance()\n            return A.Name(tok.value, line=tok.line, col=tok.column)\n        if tok.type == T.LPAREN:\n            self.advance()\n            expr = self.parse_expression()\n            self.expect(T.RPAREN, \"expected ')'\")\n            return expr\n        if tok.type == T.LBRACKET:\n            return self.parse_list_literal()\n        if tok.type == T.LBRACE:\n            return self.parse_dict_literal()\n        self.error(f\"expected expression, found {tok.value!r}\")\n\n    def _parse_string(self, tok):\n        \"\"\"v2: parse a string literal, desugaring `{expr}` interpolation.\n\n        `\"Hello, {name}!\"` becomes `\"Hello, {}!\".format(name)`.\n        `{{` and `}}` produce literal braces; a lone `}` is an error.\n        Strings without interpolation are plain StringLit nodes (with\n        `{{`/`}}` unescaped), so v1 output is unchanged.\n        \"\"\"\n        value = tok.value\n        template, literal, exprs = [], [], []\n        i, n = 0, len(value)\n        while i < n:\n            ch = value[i]\n            if ch == \"{\":\n                if i + 1 < n and value[i + 1] == \"{\":\n                    literal.append(\"{\")\n                    template.append(\"{{\")\n                    i += 2\n                    continue\n                brace = i\n                inner, i = self._scan_braced(value, i, tok)\n                exprs.append(self._parse_braced_expr(inner, tok, brace))\n                template.append(\"{}\")\n            elif ch == \"}\":\n                if i + 1 < n and value[i + 1] == \"}\":\n                    literal.append(\"}\")\n                    template.append(\"}}\")\n                    i += 2\n                    continue\n                self.error(\"single '}' in string literal \"\n                           \"(use '}}' for a literal brace)\", tok)\n            else:\n                literal.append(ch)\n                template.append(ch)\n                i += 1\n        if not exprs:\n            return A.StringLit(\"\".join(literal),\n                               line=tok.line, col=tok.column)\n        tmpl = A.StringLit(\"\".join(template), line=tok.line, col=tok.column)\n        func = A.Attribute(tmpl, \"format\", line=tok.line, col=tok.column)\n        return A.Call(func, exprs, line=tok.line, col=tok.column)\n\n    def _scan_braced(self, value, i, tok):\n        \"\"\"value[i] == '{': return (inner_text, index_past_'}').\n\n        Matches braces respecting nesting and double-quoted strings\n        inside the expression.\"\"\"\n        depth = 0\n        j, n = i, len(value)\n        in_str = False\n        while j < n:\n            ch = value[j]\n            if in_str:\n                if ch == \"\\\\\":\n                    j += 2\n                    continue\n                if ch == '\"':\n                    in_str = False\n                j += 1\n                continue\n            if ch == '\"':\n                in_str = True\n            elif ch == \"{\":\n                depth += 1\n            elif ch == \"}\":\n                depth -= 1\n                if depth == 0:\n                    return value[i + 1:j], j + 1\n            j += 1\n        self.error(\"unterminated '{...}' in string literal\", tok)\n\n    def _parse_braced_expr(self, inner, tok, brace):\n        \"\"\"Parse the expression inside `{...}` with corrected positions.\"\"\"\n        from .errors import LexerError, ParserError\n        from .lexer import Lexer\n        if not inner.strip():\n            self.error(\"empty '{...}' in string literal\", tok)\n        # column of the first inner char (tok.column is the opening quote,\n        # `brace` is the value index of the opening `{`)\n        base_col = tok.column + brace + 2\n        try:\n            tokens = Lexer(inner, self.filename).tokenize()\n        except LexerError as e:\n            raise ParserError(e.message, self.filename, tok.line,\n                              base_col + e.column) from None\n        for t in tokens:\n            t.line = tok.line\n            t.column = base_col + t.column\n        sub = Parser(tokens, self.filename)\n        node = sub.parse_expression()\n        rest = sub.peek()\n        if rest.type not in (T.NEWLINE, T.EOF):\n            raise ParserError(\n                f\"unexpected {rest.value!r} in '{{...}}' \"\n                f\"(use '{{{{' for a literal brace, e.g. JSON)\",\n                self.filename, rest.line, rest.column)\n        return node\n\n    def parse_list_literal(self):\n        lb = self.expect(T.LBRACKET, \"expected '['\")\n        elements = []\n        if not self.check(T.RBRACKET):\n            elements.append(self.parse_expression())\n            while self.match(T.COMMA):\n                elements.append(self.parse_expression())\n        self.expect(T.RBRACKET, \"expected ']'\")\n        return A.ListLit(elements, line=lb.line, col=lb.column)\n\n    def parse_dict_literal(self):\n        lb = self.expect(T.LBRACE, \"expected '{'\")\n        pairs = []\n        if not self.check(T.RBRACE):\n            pairs.append(self._parse_dict_pair())\n            while self.match(T.COMMA):\n                pairs.append(self._parse_dict_pair())\n        self.expect(T.RBRACE, \"expected '}'\")\n        return A.DictLit(pairs, line=lb.line, col=lb.column)\n\n    def _parse_dict_pair(self):\n        key = self.parse_expression()\n        self.expect(T.COLON, \"expected ':' in dict literal\")\n        value = self.parse_expression()\n        return (key, value)\n\n\ndef parse(source, filename=\"<input>\"):\n    \"\"\"Convenience: lex + parse source text.\"\"\"\n    from .lexer import Lexer\n    return Parser(Lexer(source, filename).tokenize(), filename).parse()\n\n\ndef parse_expression_src(source, filename=\"<input>\"):\n    \"\"\"Parse a single expression (for the REPL).\"\"\"\n    from .lexer import Lexer\n    from .tokens import TokenType as T\n    parser = Parser(Lexer(source, filename).tokenize(), filename)\n    node = parser.parse_expression()\n    tok = parser.peek()\n    if tok.type not in (T.NEWLINE, T.EOF):\n        raise ParserError(f\"unexpected {tok.type.name.lower()} after expression\",\n                          filename, tok.line, tok.col)\n    return node\n\n\ndef parse_statement_list(source, filename=\"<input>\"):\n    \"\"\"Parse block-level statements (for the REPL), e.g. ``set x to 5``.\n\n    The source is wrapped in a synthetic function so the normal block\n    statement parser can consume it; the function wrapper is discarded.\n    \"\"\"\n    if not source.strip():\n        return []\n    indented = \"\".join(\n        (\"    \" + line if line.strip() else \"\") + \"\\n\"\n        for line in source.splitlines()\n    )\n    prog = parse(\"define function __chunk__:\\n\" + indented, filename=filename)\n    return prog.statements[0].body\n", "agk/pipeline.py": "\"\"\"AGK-Real v2 pipeline: parse -> analyze -> generate -> (optionally) run.\n\nModule imports: ``import <name>`` first looks for ``<name>.agk`` next to\nthe importing file, in the given search paths, then in the bundled\nstdlib. A found module is compiled and inlined (its functions, classes\nand constants become directly callable); anything else falls through to\na plain Python ``import <name>``.\n\"\"\"\n\nimport io\nimport os\nimport re\nimport traceback\nfrom contextlib import redirect_stdout\nfrom pathlib import Path\n\nfrom . import ast_nodes as A\nfrom .parser import parse\nfrom .semantic import analyze\nfrom .codegen import CodeGenerator\n\nSTDLIB_DIR = Path(__file__).parent / \"stdlib\"\nHEADER = \"# Generated by AGK-Real v2 - do not edit\"\n\n\ndef _find_module(name, base_dir, search_paths):\n    \"\"\"Locate <name>.agk. Returns a Path or None. Dotted names are\n    always Python imports, never .agk modules.\"\"\"\n    if \".\" in name:\n        return None\n    dirs = []\n    if base_dir:\n        dirs.append(base_dir)\n    dirs.extend(search_paths)\n    dirs.append(STDLIB_DIR)\n    for d in dirs:\n        candidate = Path(d) / f\"{name}.agk\"\n        if candidate.is_file():\n            return candidate\n    return None\n\n\ndef _resolve_modules(program, filename, search_paths, _seen=None):\n    \"\"\"Compile-time include resolution. Returns [(name, Program, path)]\n    in dependency order. Cycles are tolerated (skipped on revisit).\"\"\"\n    seen = _seen if _seen is not None else set()\n    modules = []\n    base_dir = None\n    if filename not in (None, \"<string>\", \"<input>\", \"<repl>\"):\n        parent = os.path.dirname(os.path.abspath(filename))\n        if os.path.isdir(parent):\n            base_dir = parent\n    for stmt in program.statements:\n        if not isinstance(stmt, A.Import) or stmt.module in seen:\n            continue\n        seen.add(stmt.module)\n        path = _find_module(stmt.module, base_dir, search_paths)\n        if path is None:\n            continue  # plain Python import; emitted as-is\n        mod_prog = parse(path.read_text(), filename=str(path))\n        modules.extend(_resolve_modules(mod_prog, str(path), search_paths, seen))\n        modules.append((stmt.module, mod_prog, str(path)))\n    return modules\n\n\ndef _generate_all(program, modules, resolved, filename, annotate):\n    cg = CodeGenerator()\n    cg.emit(HEADER)\n    for _name, mod_prog, mod_path in modules:\n        cg.generate_program(mod_prog, skip_imports=resolved,\n                            agk_file=mod_path if annotate else None)\n    cg.generate_program(program, skip_imports=resolved,\n                        agk_file=filename if annotate else None)\n    main_def = next((s for s in program.statements\n                     if isinstance(s, A.FunctionDef) and s.name == \"main\"),\n                    None)\n    if main_def is not None:\n        cg.emit(\"\")\n        cg.emit('if __name__ == \"__main__\":')\n        cg.indent += 1\n        cg.emit(\"main()\", main_def)\n        cg.indent -= 1\n    return \"\\n\".join(cg.lines) + \"\\n\"\n\n\n_AGK_COMMENT = re.compile(r\"# AGK (.+):(\\d+)\\s*$\")\n\n\ndef _agk_line_map(code):\n    \"\"\"{generated python lineno: (agk_file, agk_lineno)} from the\n    `# AGK file:line` comments (emitted when annotate=True).\"\"\"\n    line_map = {}\n    for i, line in enumerate(code.splitlines(), start=1):\n        m = _AGK_COMMENT.search(line)\n        if m:\n            line_map[i] = (m.group(1), int(m.group(2)))\n    return line_map\n\n\ndef format_agk_traceback(exc_type, exc_value, tb, code):\n    \"\"\"Format an exception like a Python traceback, but with AGK\n    file:line for frames that came from AGK code.\n\n    Requires code compiled with annotate=True. Mapped frames show\n    `File \"<agk file>\", line <n>` plus that AGK source line; other\n    frames (Python stdlib, unannotated lines) use the normal rendering.\n    \"\"\"\n    line_map = _agk_line_map(code)\n    file_cache = {}\n\n    def agk_source(path, lineno):\n        if path not in file_cache:\n            try:\n                with open(path, encoding=\"utf-8\") as f:\n                    file_cache[path] = f.read().splitlines()\n            except OSError:\n                file_cache[path] = []\n        lines = file_cache[path]\n        if 1 <= lineno <= len(lines):\n            return lines[lineno - 1].strip()\n        return \"\"\n\n    out = [\"Traceback (most recent call last):\"]\n    while tb is not None:\n        code_obj = tb.tb_frame.f_code\n        # The exec() call in `agk run` itself is noise: skip it so the\n        # user only sees their own code (and any library frames).\n        if not (code_obj.co_name == \"cmd_run\"\n                and code_obj.co_filename.endswith(\"/agk/__main__.py\")):\n            lineno = tb.tb_lineno\n            name = code_obj.co_name\n            if lineno in line_map:\n                agk_file, agk_lineno = line_map[lineno]\n                out.append(f'  File \"{agk_file}\", line {agk_lineno}, in {name}')\n                src = agk_source(agk_file, agk_lineno)\n                if src:\n                    out.append(f\"    {src}\")\n            else:\n                for item in traceback.format_list(\n                        traceback.extract_tb(tb, limit=1)):\n                    out.append(item.rstrip(\"\\n\"))\n        tb = tb.tb_next\n    out.append(\"\".join(\n        traceback.format_exception_only(exc_type, exc_value)).rstrip(\"\\n\"))\n    return \"\\n\".join(out) + \"\\n\"\n\n\ndef compile_program(program, filename=\"<string>\", search_paths=(),\n                    extra_top_levels=(), annotate=False):\n    \"\"\"Compile an already-parsed program. Returns (code, warnings, modules).\n\n    annotate=True appends `# AGK file:line` comments to generated lines\n    so runtime tracebacks can be mapped back to AGK source lines.\n    \"\"\"\n    if search_paths is None:\n        search_paths = [os.getcwd()]\n    modules = _resolve_modules(program, filename, list(search_paths))\n    warnings = []\n    for _name, mod_prog, mod_file in modules:\n        _, mod_warnings = analyze(mod_prog, filename=mod_file)\n        warnings.extend(mod_warnings)\n    resolved = {name for name, _, _ in modules}\n    extra = list(extra_top_levels) + [mp for _, mp, _ in modules]\n    program, main_warnings = analyze(program, filename=filename,\n                                     extra_top_levels=extra)\n    warnings.extend(main_warnings)\n    return (_generate_all(program, modules, resolved, filename, annotate),\n            warnings, modules)\n\n\ndef compile_source(source, filename=\"<string>\", search_paths=(),\n                   extra_top_levels=(), annotate=False):\n    \"\"\"Compile AGK source to Python. Returns (python_code, warnings).\"\"\"\n    program = parse(source, filename=filename)\n    code, warnings, _ = compile_program(\n        program, filename=filename, search_paths=search_paths,\n        extra_top_levels=extra_top_levels, annotate=annotate)\n    return code, warnings\n\n\ndef run_source(source, filename=\"<string>\", search_paths=()):\n    \"\"\"Compile and execute AGK source. Returns (stdout, namespace, warnings).\n\n    The program runs as __main__ so a `define function main:` entrypoint\n    executes automatically.\n    \"\"\"\n    code, warnings = compile_source(source, filename,\n                                    search_paths=search_paths)\n    namespace = {\"__name__\": \"__main__\"}\n    buf = io.StringIO()\n    with redirect_stdout(buf):\n        exec(compile(code, filename, \"exec\"), namespace)\n    return buf.getvalue(), namespace, warnings\n", "agk/repl.py": "\"\"\"AGK-Real v1 interactive REPL.\n\nEach input is tried as (1) a full program (definitions, imports), then\n(2) a single expression whose value is printed, then (3) a list of\nstatements. A trailing ':' continues onto more lines until a blank line.\nVariables created with `create`, and functions/classes/constants defined\nearlier, persist across inputs.\n\"\"\"\n\nimport os\n\nfrom . import ast_nodes as A\nfrom .errors import AGKError\nfrom .parser import parse, parse_expression_src, parse_statement_list\nfrom .semantic import analyze\nfrom .codegen import CodeGenerator\nfrom .pipeline import compile_program\n\nBANNER = (\"AGK-Real v2  |  definitions, statements and expressions  |  \"\n          \"blank line ends a block  |  'exit' quits\")\n\n# Warnings that are noise for one REPL input (the name lives on).\n_REPL_NOISE = (\"is never assigned a value\", \"unused variable\")\n\n\ndef _created_names(stmts):\n    \"\"\"All names introduced by `create` anywhere in a statement list.\"\"\"\n    names = set()\n\n    def walk(node):\n        if isinstance(node, A.CreateStmt):\n            names.add(node.name)\n        if isinstance(node, A.IfStmt):\n            for s in node.then_body:\n                walk(s)\n            for _cond, body in node.elifs:\n                for s in body:\n                    walk(s)\n            if node.else_body:\n                for s in node.else_body:\n                    walk(s)\n        elif isinstance(node, (A.WhileStmt, A.ForEachStmt, A.ForRangeStmt)):\n            for s in node.body:\n                walk(s)\n        elif isinstance(node, A.TryStmt):\n            for s in node.body:\n                walk(s)\n            if node.catch_body:\n                for s in node.catch_body:\n                    walk(s)\n            if node.finally_body:\n                for s in node.finally_body:\n                    walk(s)\n\n    for s in stmts:\n        walk(s)\n    return names\n\n\nclass Session:\n    def __init__(self):\n        self.namespace = {\"__name__\": \"<repl>\"}\n        self.known = set()       # variable / Python-import names\n        self.known_defs = []     # FunctionDef / ClassDef / ConstantDef nodes\n\n    def _extra(self):\n        return [A.Program(statements=self.known_defs)] if self.known_defs else []\n\n    def _remember_program(self, program, modules):\n        \"\"\"Record a successfully compiled chunk's definitions so later\n        inputs resolve (and may redefine) them.\"\"\"\n        defined = set()\n        for stmt in program.statements:\n            if isinstance(stmt, (A.FunctionDef, A.ClassDef, A.ConstantDef)):\n                defined.add((type(stmt).__name__, stmt.name))\n            elif isinstance(stmt, A.Import):\n                if not any(stmt.module == name for name, _, _ in modules):\n                    self.known.add(stmt.module.split(\".\")[0])\n        self.known_defs = [\n            d for d in self.known_defs\n            if (type(d).__name__, d.name) not in defined\n        ]\n        for stmt in program.statements:\n            if isinstance(stmt, (A.FunctionDef, A.ClassDef, A.ConstantDef)):\n                self.known_defs.append(stmt)\n        for _name, mod_prog, _path in modules:\n            for stmt in mod_prog.statements:\n                if isinstance(stmt, (A.FunctionDef, A.ClassDef, A.ConstantDef)):\n                    key = (type(stmt).__name__, stmt.name)\n                    self.known_defs = [d for d in self.known_defs\n                                       if (type(d).__name__, d.name) != key]\n                    self.known_defs.append(stmt)\n\n    # -- the three tiers ----------------------------------------------------\n\n    def run_program(self, chunk):\n        program = parse(chunk, filename=\"<repl>\")\n        # Drop defs this chunk replaces before compiling, so redefinition\n        # works the way it does in other REPLs.\n        defined = {(type(s).__name__, s.name) for s in program.statements\n                   if isinstance(s, (A.FunctionDef, A.ClassDef, A.ConstantDef))}\n        kept = [d for d in self.known_defs\n                if (type(d).__name__, d.name) not in defined]\n        code, warnings, modules = compile_program(\n            program, filename=\"<repl>\", search_paths=[os.getcwd()],\n            extra_top_levels=[A.Program(statements=kept)] if kept else [])\n        for w in warnings:\n            print(w)\n        exec(compile(code, \"<repl>\", \"exec\"), self.namespace)  # noqa: S102\n        self.known_defs = kept\n        self._remember_program(program, modules)\n\n    def run_statements(self, chunk):\n        stmts = parse_statement_list(chunk, filename=\"<repl>\")\n        wrapper = A.FunctionDef(name=\"__repl__\", params=[], return_type=None,\n                               body=stmts)\n        prog = A.Program(statements=[wrapper])\n        _, warnings = analyze(prog, filename=\"<repl>\", predeclared=self.known,\n                              extra_top_levels=self._extra())\n        cg = CodeGenerator()\n        for s in wrapper.body:\n            cg.gen_stmt(s)\n        for w in warnings:\n            if not any(noise in w for noise in _REPL_NOISE):\n                print(w)\n        exec(compile(\"\\n\".join(cg.lines), \"<repl>\", \"exec\"),  # noqa: S102\n             self.namespace)\n        self.known.update(_created_names(stmts))\n\n    def run_expression(self, chunk):\n        node = parse_expression_src(chunk, filename=\"<repl>\")\n        wrapper = A.FunctionDef(name=\"__repl__\", params=[], return_type=None,\n                               body=[A.ReturnStmt(value=node)])\n        prog = A.Program(statements=[wrapper])\n        analyze(prog, filename=\"<repl>\", predeclared=self.known,\n                extra_top_levels=self._extra())\n        code = CodeGenerator().expr(wrapper.body[0].value)\n        result = eval(compile(code, \"<repl>\", \"eval\"),  # noqa: S307\n                      self.namespace)\n        if result is not None:\n            print(repr(result))\n\n    # -- dispatch ---------------------------------------------------------------\n\n    def handle(self, chunk):\n        stripped = chunk.strip()\n        if not stripped:\n            return True\n        if stripped in (\"exit\", \"quit\"):\n            return False\n        if stripped.split()[0] in (\"define\", \"class\", \"import\"):\n            self.run_program(chunk)\n            return True\n        try:\n            self.run_expression(chunk)\n        except AGKError:\n            try:\n                self.run_statements(chunk)\n            except AGKError as stmt_err:\n                # Expression failed too: the statement error is usually the\n                # more informative one (e.g. `set x to`).\n                raise stmt_err from None\n        return True\n\n\ndef _read_chunk():\n    lines = []\n    while True:\n        try:\n            line = input(\"... \" if lines else \">>> \")\n        except EOFError:\n            print()\n            raise\n        if not line.strip():\n            if lines:\n                break\n            continue\n        lines.append(line)\n        if len(lines) == 1 and not line.rstrip().endswith(\":\"):\n            break\n    return \"\\n\".join(lines) + \"\\n\"\n\n\ndef repl():\n    print(BANNER)\n    session = Session()\n    while True:\n        try:\n            chunk = _read_chunk()\n        except EOFError:\n            break\n        try:\n            if not session.handle(chunk):\n                break\n        except AGKError as e:\n            print(e)\n        except KeyboardInterrupt:\n            print()\n            continue\n", "agk/semantic.py": "\"\"\"AGK-Real v1 semantic analyzer.\n\nWalks the AST and enforces SPEC section 6:\n  - use of an undeclared name -> error naming the variable and line\n  - `set` on an undeclared name -> error\n  - `create` of a duplicate name in one scope -> error\n  - call of an unknown function / wrong arity -> error\n  - `return` outside a function -> error\n  - unused variables, never-assigned variables, unreachable code -> warnings\n\nAlso rewrites bare field references inside methods to `self.<field>`\n(SetStmt -> SetAttr, Name -> Attribute) per SPEC 4.7.\n\nRaises SemanticError on the first error; collects warnings in .warnings.\n\"\"\"\n\nfrom . import ast_nodes as A\nfrom .errors import SemanticError\n\nBUILTINS = {\n    \"print\": -1, \"len\": 1, \"str\": 1, \"int\": 1, \"float\": 1, \"bool\": 1,\n    \"range\": -1, \"input\": -1, \"list\": -1, \"dict\": -1, \"abs\": 1,\n    \"min\": -1, \"max\": -1, \"sum\": 1, \"sorted\": 1, \"enumerate\": 1,\n    \"zip\": -1, \"round\": -1, \"type\": 1, \"repr\": 1, \"open\": -1,\n}\n\n\nclass _Scope:\n    def __init__(self, parent=None):\n        self.parent = parent\n        # name -> {\"assigned\": bool, \"used\": bool, \"node\": node}\n        self.vars = {}\n\n    def declare(self, name, node):\n        self.vars[name] = {\"assigned\": False, \"used\": False, \"node\": node}\n\n    def lookup(self, name):\n        scope = self\n        while scope is not None:\n            if name in scope.vars:\n                return scope, scope.vars[name]\n            scope = scope.parent\n        return None, None\n\n\nclass SemanticAnalyzer:\n    def __init__(self, filename=\"<input>\"):\n        self.filename = filename\n        self.warnings = []\n        self.functions = {}   # name -> FunctionDef (arity checking)\n        self.classes = {}     # name -> ClassDef\n        self.constants = set()\n        self._scope = None\n        self._in_function = 0\n        self._class_fields = None  # set of field names while inside a method\n\n    # -- helpers ----------------------------------------------------------\n\n    def error(self, message, node):\n        raise SemanticError(message, self.filename, node.line, node.col)\n\n    def warn(self, message, node):\n        self.warnings.append(\n            f\"{self.filename}:{node.line}:{node.col}: warning: {message}\")\n\n    # -- entry --------------------------------------------------------------\n\n    def analyze(self, program, predeclared=(), extra_top_levels=()):\n        # pass 1: collect top-level names, detect duplicates\n        for mod in extra_top_levels:\n            for stmt in mod.statements:\n                if isinstance(stmt, A.FunctionDef):\n                    self._add_top_level(stmt.name, stmt, self.functions,\n                                        \"function\")\n                elif isinstance(stmt, A.ClassDef):\n                    self._add_top_level(stmt.name, stmt, self.classes, \"class\")\n                elif isinstance(stmt, A.ConstantDef):\n                    if stmt.name in self.constants:\n                        self.error(f\"duplicate constant '{stmt.name}'\", stmt)\n                    self.constants.add(stmt.name)\n        for stmt in program.statements:\n            if isinstance(stmt, A.FunctionDef):\n                self._add_top_level(stmt.name, stmt, self.functions,\n                                    \"function\")\n            elif isinstance(stmt, A.ClassDef):\n                self._add_top_level(stmt.name, stmt, self.classes, \"class\")\n            elif isinstance(stmt, A.ConstantDef):\n                if stmt.name in self.constants:\n                    self.error(f\"duplicate constant '{stmt.name}'\", stmt)\n                self.constants.add(stmt.name)\n            elif isinstance(stmt, A.Import):\n                pass  # handled in pass 2 scope setup\n            else:\n                self.error(\"unexpected top-level statement\", stmt)\n\n        # pass 2: analyze bodies\n        self._scope = _Scope()\n        for name in predeclared:\n            # Names carried over from earlier REPL input: known, assigned,\n            # and exempt from unused warnings.\n            self._scope.declare(name, None)\n            self._scope.vars[name][\"assigned\"] = True\n            self._scope.vars[name][\"used\"] = True\n        for stmt in program.statements:\n            if isinstance(stmt, A.Import):\n                top = stmt.module.split(\".\")[0]\n                self._scope.declare(top, stmt)\n                self._scope.vars[top][\"assigned\"] = True\n            elif isinstance(stmt, A.ConstantDef):\n                self._scope.declare(stmt.name, stmt)\n                self._scope.vars[stmt.name][\"assigned\"] = True\n        for mod in extra_top_levels:\n            for stmt in mod.statements:\n                if isinstance(stmt, A.Import):\n                    top = stmt.module.split(\".\")[0]\n                    if top not in self._scope.vars:\n                        self._scope.declare(top, stmt)\n                        self._scope.vars[top][\"assigned\"] = True\n                elif isinstance(stmt, A.ConstantDef):\n                    if stmt.name not in self._scope.vars:\n                        self._scope.declare(stmt.name, stmt)\n                        self._scope.vars[stmt.name][\"assigned\"] = True\n        for stmt in program.statements:\n            if isinstance(stmt, (A.FunctionDef,)):\n                self._check_function(stmt)\n            elif isinstance(stmt, A.ClassDef):\n                self._check_class(stmt)\n        self._check_unused(self._scope)\n        return self.warnings\n\n    def _add_top_level(self, name, node, table, kind):\n        if name in table or name in self.functions or name in self.classes:\n            self.error(f\"duplicate {kind} '{name}'\", node)\n        if name in BUILTINS:\n            self.error(f\"{kind} name '{name}' shadows a builtin\", node)\n        table[name] = node\n\n    # -- functions / classes --------------------------------------------------\n\n    def _check_params(self, params):\n        \"\"\"Declare params; v2: defaults must trail (no plain param after\n        a defaulted one).\"\"\"\n        seen = set()\n        seen_default = False\n        for p in params:\n            if p.name in seen:\n                self.error(f\"duplicate parameter '{p.name}'\", p)\n            seen.add(p.name)\n            if p.default is not None:\n                seen_default = True\n            elif seen_default:\n                self.error(\n                    f\"parameter '{p.name}' without a default follows a \"\n                    f\"parameter with a default\", p)\n            self._scope.declare(p.name, p)\n            self._scope.vars[p.name][\"assigned\"] = True\n\n    def _check_function(self, fn):\n        self._scope = _Scope(self._scope)\n
