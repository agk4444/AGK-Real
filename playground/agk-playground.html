structor\"):\n            scope.declare(\"parameter\", \"self\", fn.line, fn.col, cls_name or \"\")\n        for p in fn.params or []:\n            scope.declare(\"parameter\", p.name, p.line, p.col,\n                          p.type_name or \"\")\n        self._walk_block(fn.body, scope, cls_name)\n\n    def _walk_block(self, stmts, scope, cls_name):\n        for s in stmts or []:\n            try:\n                self._walk_stmt(s, scope, cls_name)\n            except Exception:\n                continue  # one odd statement must not kill the index\n\n    def _walk_stmt(self, s, scope, cls_name):\n        if isinstance(s, A.CreateStmt):\n            scope.declare(\"variable\", s.name, s.line, s.col,\n                          s.type_name or \"\")\n        elif isinstance(s, A.SetStmt):\n            self._walk_expr(s.value, scope, cls_name)\n            self._record_target(s.name, s.line, s.col, scope, cls_name)\n        elif isinstance(s, A.SetAttr):\n            # produced by the semantic phase for `set <field> ...`\n            self._walk_expr(s.obj, scope, cls_name)\n            self._record_attr(s.attr, s.line, s.col, s.obj, scope, cls_name)\n            self._walk_expr(s.value, scope, cls_name)\n        elif isinstance(s, A.IfStmt):\n            self._walk_expr(s.condition, scope, cls_name)\n            self._walk_block(s.then_body, scope, cls_name)\n            for cond, body in s.elifs or []:\n                self._walk_expr(cond, scope, cls_name)\n                self._walk_block(body, scope, cls_name)\n            if s.else_body is not None:\n                self._walk_block(s.else_body, scope, cls_name)\n        elif isinstance(s, A.WhileStmt):\n            self._walk_expr(s.condition, scope, cls_name)\n            self._walk_block(s.body, scope, cls_name)\n        elif isinstance(s, A.ForEachStmt):\n            self._walk_expr(s.iterable, scope, cls_name)\n            scope.declare(\"variable\", s.var, s.line, s.col, \"\")\n            self._walk_block(s.body, scope, cls_name)\n        elif isinstance(s, A.ForRangeStmt):\n            self._walk_expr(s.start, scope, cls_name)\n            self._walk_expr(s.end, scope, cls_name)\n            if s.step is not None:\n                self._walk_expr(s.step, scope, cls_name)\n            scope.declare(\"variable\", s.var, s.line, s.col, \"\")\n            self._walk_block(s.body, scope, cls_name)\n        elif isinstance(s, A.TryStmt):\n            self._walk_block(s.body, scope, cls_name)\n            if s.catch_body is not None:\n                if s.catch_name:\n                    scope.declare(\"variable\", s.catch_name, s.line, s.col, \"\")\n                self._walk_block(s.catch_body, scope, cls_name)\n            if s.finally_body is not None:\n                self._walk_block(s.finally_body, scope, cls_name)\n        elif isinstance(s, A.RaiseStmt):\n            if s.value is not None:\n                self._walk_expr(s.value, scope, cls_name)\n        elif isinstance(s, A.ReturnStmt):\n            if s.value is not None:\n                self._walk_expr(s.value, scope, cls_name)\n        elif isinstance(s, A.ExprStmt):\n            self._walk_expr(s.expr, scope, cls_name)\n        elif isinstance(s, A.FunctionDef):\n            # not valid AGK, but don't crash on it\n            self._walk_function(s, scope, \"function\", cls_name, s.name)\n        # top-level-only statements need no walk here\n\n    def _walk_expr(self, e, scope, cls_name):\n        if e is None or isinstance(\n                e, (A.IntLit, A.FloatLit, A.StringLit, A.BoolLit)):\n            return\n        if isinstance(e, A.Name):\n            self._record_target(e.id, e.line, e.col, scope, cls_name)\n        elif isinstance(e, A.Call):\n            func = e.func\n            if isinstance(func, A.Name):\n                # mirrors semantic._check_call: bare names resolve to\n                # builtins, functions, classes, or scope variables\n                self._record_target(func.id, func.line, func.col,\n                                    scope, cls_name)\n            else:\n                self._walk_expr(func, scope, cls_name)\n            for a in e.args or []:\n                self._walk_expr(a, scope, cls_name)\n        elif isinstance(e, A.Attribute):\n            self._walk_expr(e.obj, scope, cls_name)\n            self._record_attr(e.attr, e.line, e.col, e.obj, scope, cls_name)\n        elif isinstance(e, A.BinOp):\n            self._walk_expr(e.left, scope, cls_name)\n            self._walk_expr(e.right, scope, cls_name)\n        elif isinstance(e, A.UnaryOp):\n            self._walk_expr(e.operand, scope, cls_name)\n        elif isinstance(e, A.Index):\n            self._walk_expr(e.obj, scope, cls_name)\n            self._walk_expr(e.index, scope, cls_name)\n        elif isinstance(e, A.ListLit):\n            for x in e.elements or []:\n                self._walk_expr(x, scope, cls_name)\n        elif isinstance(e, A.DictLit):\n            for k, v in e.pairs or []:\n                self._walk_expr(k, scope, cls_name)\n                self._walk_expr(v, scope, cls_name)\n\n    def _record_target(self, name, line, col, scope, cls_name):\n        _s, entry = scope.table.lookup(name)\n        if entry is not None:\n            d = entry[\"node\"]\n            self.refs.append(Ref((d.scope_id, d.name), name, line, col))\n        elif name not in BUILTINS and cls_name:\n            # best effort for documents the analyzer didn't finish:\n            # a bare name inside a method may be a field\n            d = self._member_def(cls_name, name)\n            if d is not None:\n                self.refs.append(Ref((d.scope_id, d.name), name, line, col))\n\n    def _record_attr(self, attr, line, col, obj, scope, cls_name):\n        # `self.<attr>` / `set self.<attr>`: the analyzer rewrites bare\n        # field uses to these, so resolve them to the field/method Def\n        if cls_name and isinstance(obj, A.Name) and obj.id == \"self\":\n            d = self._member_def(cls_name, attr, kinds=(\"method\", \"field\"))\n            if d is not None:\n                self.refs.append(Ref((d.scope_id, d.name), attr, line, col))\n\n    def _member_def(self, cls_name, name, kinds=(\"field\", \"method\")):\n        seen = set()\n        cur = cls_name\n        while cur and cur not in seen:\n            seen.add(cur)\n            members = self.class_members.get(cur)\n            if not members:\n                return None\n            for kind in kinds:\n                d = members[kind + \"s\"].get(name)\n                if d is not None:\n                    return d\n            cur = members[\"base\"]\n        return None\n\n    # -- outline --------------------------------------------------------\n\n    @staticmethod\n    def _param_entry(p):\n        return {\"kind\": \"parameter\", \"name\": p.name, \"line\": p.line,\n                \"col\": p.col, \"end_line\": p.line, \"children\": []}\n\n    def _build_outline(self, program):\n        for s in program.statements or []:\n            if isinstance(s, A.FunctionDef):\n                self.top_symbols.append({\n                    \"kind\": \"function\", \"name\": s.name,\n                    \"line\": s.line, \"col\": s.col,\n                    \"end_line\": _max_line(s) or s.line,\n                    \"children\": [self._param_entry(p)\n                                  for p in s.params or []],\n                })\n            elif isinstance(s, A.ClassDef):\n                children = [\n                    {\"kind\": \"field\", \"name\": f.name, \"line\": f.line,\n                     \"col\": f.col, \"end_line\": f.line, \"children\": []}\n                    for f in s.fields or []]\n                if s.constructor is not None:\n                    c = s.constructor\n                    children.append({\n                        \"kind\": \"constructor\", \"name\": \"constructor\",\n                        \"line\": c.line, \"col\": c.col,\n                        \"end_line\": _max_line(c) or c.line,\n                        \"children\": [self._param_entry(p)\n                                      for p in c.params or []],\n                    })\n                for m in s.methods or []:\n                    children.append({\n                        \"kind\": \"method\", \"name\": m.name,\n                        \"line\": m.line, \"col\": m.col,\n                        \"end_line\": _max_line(m) or m.line,\n                        \"children\": [self._param_entry(p)\n                                      for p in m.params or []],\n                    })\n                self.top_symbols.append({\n                    \"kind\": \"class\", \"name\": s.name,\n                    \"line\": s.line, \"col\": s.col,\n                    \"end_line\": _max_line(s) or s.line,\n                    \"children\": children,\n                })\n            elif isinstance(s, A.ConstantDef):\n                self.top_symbols.append({\n                    \"kind\": \"constant\", \"name\": s.name,\n                    \"line\": s.line, \"col\": s.col,\n                    \"end_line\": s.line, \"children\": [],\n                })\n            elif isinstance(s, A.Import):\n                self.top_symbols.append({\n                    \"kind\": \"module\", \"name\": s.module.split(\".\")[0],\n                    \"line\": s.line, \"col\": s.col,\n                    \"end_line\": s.line, \"children\": [],\n                })\n\n    # -- queries --------------------------------------------------------\n\n    def def_of(self, def_key):\n        sid, name = def_key\n        if 0 <= sid < len(self.scopes):\n            return self.scopes[sid].defs.get(name)\n        return None\n\n    def scope_at(self, line1):\n        \"\"\"Innermost function/method scope containing 1-based line1.\"\"\"\n        best = self.scopes[0] if self.scopes else None\n        for sc in self.scopes[1:]:\n            if sc.kind in (\"function\", \"method\", \"constructor\") \\\n                    and sc.start_line <= line1 <= sc.end_line:\n                if best is None or best.kind == \"module\" or (\n                        sc.start_line >= best.start_line\n                        and sc.end_line <= best.end_line):\n                    best = sc\n        return best\n\n    def visible_defs(self, scope):\n        \"\"\"All Defs visible from `scope`, nearest scope wins.\"\"\"\n        seen = {}\n        t = scope.table\n        while t is not None:\n            for name, entry in t.vars.items():\n                if name not in seen:\n                    seen[name] = entry[\"node\"]\n            t = t.parent\n        return seen\n\n    def resolve_at(self, lines, lsp_line, character):\n        \"\"\"Def under (lsp_line, character): the definition site if the\n        cursor is on it, otherwise the Def the reference resolves to.\n        None when there is no symbol there.\"\"\"\n        if not (0 <= lsp_line < len(lines)):\n            return None\n        word = word_at(lines[lsp_line], character)\n        if not word:\n            return None\n        for sc in self.scopes:\n            d = sc.defs.get(word)\n            if d is not None:\n                loc = locate_range(lines, d.line, d.col, d.name)\n                if loc is not None and _contains(loc, lsp_line, character):\n                    return d\n        for ref in self.refs:\n            if ref.name != word:\n                continue\n            loc = locate_range(lines, ref.line, ref.col, ref.name)\n            if loc is not None and _contains(loc, lsp_line, character):\n                return self.def_of(ref.def_key)\n        return None\n\n    def locations_of(self, target):\n        \"\"\"All reference sites resolving to `target` Def.\"\"\"\n        key = (target.scope_id, target.name)\n        return [r for r in self.refs if r.def_key == key]\n\n\n# -- stdlib module functions (for completion) -------------------------------\n\n_STDLIB_FUNCS = None\n\n\ndef stdlib_functions():\n    \"\"\"{module name: [(function name, signature)]} for agk/stdlib/*.agk.\n\n    Parsed once and cached; a broken stdlib file just yields no entries.\n    \"\"\"\n    global _STDLIB_FUNCS\n    if _STDLIB_FUNCS is None:\n        _STDLIB_FUNCS = {}\n        d = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"stdlib\")\n        try:\n            files = sorted(os.listdir(d))\n        except OSError:\n            files = []\n        for fn in files:\n            if not fn.endswith(\".agk\"):\n                continue\n            mod = fn[:-4]\n            try:\n                with open(os.path.join(d, fn), encoding=\"utf-8\") as f:\n                    prog = parse(f.read(), filename=fn)\n                funcs = []\n                for st in prog.statements or []:\n                    if isinstance(st, A.FunctionDef):\n                        funcs.append((st.name, ScopeIndex._sig(\n                            st.params, st.return_type)))\n                _STDLIB_FUNCS[mod] = funcs\n            except Exception:\n                _STDLIB_FUNCS[mod] = []\n    return _STDLIB_FUNCS\n\n\n_COMPLETION_KIND = {  # Def.kind -> LSP CompletionItemKind\n    \"function\": 3, \"method\": 2, \"constructor\": 4, \"class\": 7,\n    \"constant\": 21, \"variable\": 6, \"parameter\": 6, \"field\": 5,\n    \"module\": 9,\n}\n\n_SYMBOL_KIND = {  # outline kind -> LSP SymbolKind\n    \"function\": 12, \"method\": 6, \"constructor\": 9, \"class\": 5,\n    \"field\": 8, \"constant\": 14, \"variable\": 13, \"parameter\": 13,\n    \"module\": 2,\n}\n\n\n# -- diagnostics ----------------------------------------------------------\n\n\ndef _range(source_lines, line1, col):\n    \"\"\"AGK is 1-based lines, 0-based cols; LSP is 0-based both.\"\"\"\n    lsp_line = max(line1 - 1, 0)\n    char = max(col, 0)\n    end = char + 1\n    if 0 <= lsp_line < len(source_lines):\n        end = _extend_to_word(source_lines[lsp_line], char)\n    return {\n        \"start\": {\"line\": lsp_line, \"character\": char},\n        \"end\": {\"line\": lsp_line, \"character\": end},\n    }\n\n\ndef validate(source, filename, search_paths):\n    \"\"\"Run source through the real pipeline.\n\n    Returns (diagnostics, symbol_index, scope_index). The pipeline raises\n    on the first error, so diagnostics carry at most one error plus any\n    warnings.\n    \"\"\"\n    source_lines = source.splitlines()\n    diagnostics = []\n    program = None\n    try:\n        program = parse(source, filename=filename)\n        # optimize=False: the v0.4.0 optimizer strips dead `create`\n        # declarations, which would hide variable definition sites from\n        # the scope index. Diagnostics are unaffected (they come from\n        # parse/analyze/typecheck, all of which run before optimize),\n        # and the generated code is discarded here anyway.\n        _code, warnings, _modules = compile_program(\n            program, filename=filename, search_paths=search_paths,\n            optimize=False)\n    except AGKError as e:\n        diagnostics.append({\n            \"range\": _range(source_lines, e.line or 1, e.column),\n            \"severity\": 1,  # Error\n            \"source\": SERVER_NAME,\n            \"message\": f\"{e.phase}: {e.message}\",\n        })\n    except Exception as e:  # never kill the server on a compiler bug\n        diagnostics.append({\n            \"range\": _range(source_lines, 1, 0),\n            \"severity\": 1,\n            \"source\": SERVER_NAME,\n            \"message\": f\"internal error: {e}\",\n        })\n    else:\n        for w in warnings:\n            m = _WARN_RE.match(w)\n            if not m:\n                continue\n            _wfile, wline, wcol, msg = m.groups()\n            diagnostics.append({\n                \"range\": _range(source_lines, int(wline), int(wcol)),\n                \"severity\": 2,  # Warning\n                \"source\": SERVER_NAME,\n                \"message\": f\"warning: {msg}\",\n            })\n    if program is not None:\n        return (diagnostics, SymbolIndex.from_program(program),\n                ScopeIndex.from_program(program))\n    return diagnostics, SymbolIndex(), ScopeIndex()\n\n\n# -- server ---------------------------------------------------------------\n\n\nclass LanguageServer:\n    def __init__(self, stdin=None, stdout=None):\n        self.stdin = stdin or sys.stdin.buffer\n        self.stdout = stdout or sys.stdout.buffer\n        self.documents = {}   # uri -> {\"text\", \"version\", \"path\"}\n        self.indexes = {}     # uri -> SymbolIndex\n        self.scope_indexes = {}  # uri -> ScopeIndex\n        self._shutdown = False\n\n    # -- io ---------------------------------------------------------------\n\n    def send(self, obj):\n        write_message(self.stdout, obj)\n\n    def notify(self, method, params):\n        self.send({\"jsonrpc\": \"2.0\", \"method\": method, \"params\": params})\n\n    def respond(self, msg_id, result):\n        self.send({\"jsonrpc\": \"2.0\", \"id\": msg_id, \"result\": result})\n\n    def error(self, msg_id, code, message):\n        self.send({\"jsonrpc\": \"2.0\", \"id\": msg_id,\n                   \"error\": {\"code\": code, \"message\": message}})\n\n    # -- documents --------------------------------------------------------\n\n    def _store(self, uri, text, version):\n        path = uri_to_path(uri)\n        self.documents[uri] = {\n            \"text\": text,\n            \"version\": version,\n            \"path\": path or \"<input>\",\n        }\n\n    def _publish_diagnostics(self, uri):\n        doc = self.documents[uri]\n        search_paths = []\n        if doc[\"path\"] != \"<input>\":\n            d = os.path.dirname(os.path.abspath(doc[\"path\"]))\n            if os.path.isdir(d):\n                search_paths.append(d)\n        diagnostics, index, scope_index = validate(\n            doc[\"text\"], doc[\"path\"], search_paths)\n        self.indexes[uri] = index\n        self.scope_indexes[uri] = scope_index\n        self.notify(\"textDocument/publishDiagnostics\",\n                    {\"uri\": uri, \"diagnostics\": diagnostics})\n\n    # -- handlers ---------------------------------------------------------\n\n    def on_initialize(self, msg_id, _params):\n        self.respond(msg_id, {\n            \"capabilities\": {\n                \"textDocumentSync\": 1,  # full document sync\n                \"hoverProvider\": True,\n                \"definitionProvider\": True,\n                \"completionProvider\": {\"triggerCharacters\": [\".\"]},\n                \"renameProvider\": True,\n                \"referencesProvider\": True,\n                \"documentSymbolProvider\": True,\n            },\n            \"serverInfo\": {\"name\": SERVER_NAME, \"version\": SERVER_VERSION},\n        })\n\n    def on_did_open(self, params):\n        doc = params[\"textDocument\"]\n        self._store(doc[\"uri\"], doc[\"text\"], doc.get(\"version\"))\n        self._publish_diagnostics(doc[\"uri\"])\n\n    def on_did_change(self, params):\n        uri = params[\"textDocument\"][\"uri\"]\n        version = params[\"textDocument\"].get(\"version\")\n        changes = params.get(\"contentChanges\", [])\n        if uri in self.documents and changes:\n            # full sync: the last change carries the whole document\n            self._store(uri, changes[-1][\"text\"], version)\n            self._publish_diagnostics(uri)\n\n    def _word_and_entries(self, uri, position):\n        doc = self.documents.get(uri)\n        if doc is None:\n            return None, []\n        lines = doc[\"text\"].splitlines()\n        line_no = position.get(\"line\", 0)\n        if not (0 <= line_no < len(lines)):\n            return None, []\n        word = word_at(lines[line_no], position.get(\"character\", 0))\n        if not word:\n            return None, []\n        entries = self.indexes.get(uri)\n        entries = entries.symbols.get(word, []) if entries else []\n        return word, entries\n\n    def on_hover(self, msg_id, params):\n        _word, entries = self._word_and_entries(\n            params[\"textDocument\"][\"uri\"], params[\"position\"])\n        if not entries:\n            self.respond(msg_id, None)\n            return\n        e = entries[0]\n        title = {\"function\": \"**function**\",\n                 \"method\": \"**method**\",\n                 \"class\": \"**class**\",\n                 \"constant\": \"**constant**\",\n                 \"variable\": \"**variable**\",\n                 \"parameter\": \"**parameter**\",\n                 \"field\": \"**field**\"}.get(e[\"kind\"], f\"**{e['kind']}**\")\n        md = f\"{title} `{e['name']}`\"\n        if e[\"detail\"]:\n            md += f\"\\n\\n{e['detail']}\"\n        md += f\"\\n\\ndefined at line {e['line']}\"\n        self.respond(msg_id, {\n            \"contents\": {\"kind\": \"markdown\", \"value\": md},\n        })\n\n    def on_definition(self, msg_id, params):\n        uri = params[\"textDocument\"][\"uri\"]\n        _word, entries = self._word_and_entries(uri, params[\"position\"])\n        if not entries:\n            self.respond(msg_id, None)\n            return\n        e = entries[0]\n        doc = self.documents[uri]\n        lines = doc[\"text\"].splitlines()\n        lsp_line = max(e[\"line\"] - 1, 0)\n        char = e[\"col\"]\n        if 0 <= lsp_line < len(lines):\n            found = lines[lsp_line].find(e[\"name\"].split(\".\")[-1], e[\"col\"])\n            if found >= 0:\n                char = found\n        end = char + len(e[\"name\"].split(\".\")[-1])\n        self.respond(msg_id, {\n            \"uri\": uri,\n            \"range\": {\n                \"start\": {\"line\": lsp_line, \"character\": char},\n                \"end\": {\"line\": lsp_line, \"character\": end},\n            },\n        })\n\n    def on_completion(self, msg_id, params):\n        uri = params[\"textDocument\"][\"uri\"]\n        doc = self.documents.get(uri)\n        if doc is None:\n            self.respond(msg_id, {\"isIncomplete\": False, \"items\": []})\n            return\n        lines = doc[\"text\"].splitlines()\n        pos = params.get(\"position\", {})\n        line_no = pos.get(\"line\", 0)\n        character = pos.get(\"character\", 0)\n        text = lines[line_no] if 0 <= line_no < len(lines) else \"\"\n        before = text[:max(0, character)]\n        items = self._module_attr_items(before)\n        if items is None:\n            items = self._prefix_items(uri, line_no, before)\n        self.respond(msg_id, {\"isIncomplete\": False, \"items\": items})\n\n    def _module_attr_items(self, before):\n        \"\"\"Completion right after ``<module>.``: that stdlib module's\n        functions. Returns None when the cursor is not after a dot.\"\"\"\n        m = re.search(r\"([A-Za-z_][A-Za-z0-9_]*)\\.$\", before)\n        if not m:\n            return None\n        return [{\"label\": name, \"kind\": 2, \"detail\": sig,\n                 \"sortText\": \"0\" + name}\n                for name, sig in stdlib_functions().get(m.group(1), [])]\n\n    def _prefix_items(self, uri, line_no, before):\n        \"\"\"Completion on an identifier prefix: in-scope symbols first,\n        then keywords, builtins, and stdlib module names.\"\"\"\n        pm = re.search(r\"[A-Za-z_][A-Za-z0-9_]*$\", before)\n        prefix = pm.group(0) if pm else \"\"\n        items, seen = [], set()\n\n        def add(label, kind, detail, sort):\n            if label in seen or not label.startswith(prefix):\n                return\n            seen.add(label)\n            items.append({\"label\": label, \"kind\": kind, \"detail\": detail,\n                          \"sortText\": sort})\n\n        index = self.scope_indexes.get(uri)\n        if index is not None:\n            scope = index.scope_at(line_no + 1)\n            if scope is not None:\n                for name, d in index.visible_defs(scope).items():\n                    add(name, _COMPLETION_KIND.get(d.kind, 6), d.detail,\n                        (\"0\" if d.scope_id == scope.id else \"1\") + name)\n        for kw in KEYWORDS:\n            add(kw, 14, \"keyword\", \"2\" + kw)\n        for name in BUILTINS:\n            add(name, 3, \"builtin function\", \"3\" + name)\n        for mod in stdlib_functions():\n            add(mod, 9, \"standard library module\", \"4\" + mod)\n        return items\n\n    def _resolve(self, uri, position):\n        doc = self.documents.get(uri)\n        index = self.scope_indexes.get(uri)\n        if doc is None or index is None:\n            return None, None\n        lines = doc[\"text\"].splitlines()\n        target = index.resolve_at(lines, position.get(\"line\", 0),\n                                  position.get(\"character\", 0))\n        return target, lines\n\n    def on_rename(self, msg_id, params):\n        uri = params[\"textDocument\"][\"uri\"]\n        new_name = params.get(\"newName\", \"\")\n        if not re.fullmatch(r\"[A-Za-z_][A-Za-z0-9_]*\", new_name or \"\"):\n            self.error(msg_id, -32602, f\"invalid new name: {new_name!r}\")\n            return\n        target, lines = self._resolve(uri, params.get(\"position\", {}))\n        if target is None:\n            # no symbol under the cursor: nothing to rename\n            self.respond(msg_id, None)\n            return\n        index = self.scope_indexes[uri]\n        edits = []\n        loc = locate_range(lines, target.line, target.col, target.name)\n        if loc is not None:\n            edits.append({\"range\": _lsp_range(loc), \"newText\": new_name})\n        for ref in index.locations_of(target):\n            loc = locate_range(lines, ref.line, ref.col, ref.name)\n            if loc is not None:\n                edits.append({\"range\": _lsp_range(loc), \"newText\": new_name})\n        edits.sort(key=lambda e: (e[\"range\"][\"start\"][\"line\"],\n                                  e[\"range\"][\"start\"][\"character\"]))\n        self.respond(msg_id, {\"changes\": {uri: edits}})\n\n    def on_references(self, msg_id, params):\n        uri = params[\"textDocument\"][\"uri\"]\n        target, lines = self._resolve(uri, params.get(\"position\", {}))\n        if target is None:\n            self.respond(msg_id, [])\n            return\n        include_decl = params.get(\"context\", {}).get(\"includeDeclaration\",\n                                                     True)\n        index = self.scope_indexes[uri]\n        locs = []\n        if include_decl:\n            loc = locate_range(lines, target.line, target.col, target.name)\n            if loc is not None:\n                locs.append({\"uri\": uri, \"range\": _lsp_range(loc)})\n        for ref in index.locations_of(target):\n            loc = locate_range(lines, ref.line, ref.col, ref.name)\n            if loc is not None:\n                locs.append({\"uri\": uri, \"range\": _lsp_range(loc)})\n        locs.sort(key=lambda l: (l[\"range\"][\"start\"][\"line\"],\n                                 l[\"range\"][\"start\"][\"character\"]))\n        self.respond(msg_id, locs)\n\n    def on_document_symbol(self, msg_id, params):\n        uri = params[\"textDocument\"][\"uri\"]\n        doc = self.documents.get(uri)\n        index = self.scope_indexes.get(uri)\n        if doc is None or index is None:\n            self.respond(msg_id, [])\n            return\n        lines = doc[\"text\"].splitlines()\n        self.respond(msg_id, [self._document_symbol(e, lines)\n                              for e in index.top_symbols])\n\n    def _document_symbol(self, entry, lines):\n        loc = locate_range(lines, entry[\"line\"], entry[\"col\"], entry[\"name\"])\n        if loc is None:\n            loc = (entry[\"line\"] - 1, entry[\"col\"],\n                   entry[\"col\"] + len(entry[\"name\"]))\n        sel = _lsp_range(loc)\n        end_line = max(entry[\"end_line\"], entry[\"line\"]) - 1\n        end_char = len(lines[end_line]) if 0 <= end_line < len(lines) else 0\n        return {\n            \"name\": entry[\"name\"],\n            \"kind\": _SYMBOL_KIND[entry[\"kind\"]],\n            \"range\": {\"start\": sel[\"start\"],\n                      \"end\": {\"line\": end_line, \"character\": end_char}},\n            \"selectionRange\": sel,\n            \"children\": [self._document_symbol(c, lines)\n                         for c in entry[\"children\"]],\n        }\n\n    # -- main loop --------------------------------------------------------\n\n    def dispatch(self, msg):\n        method = msg.get(\"method\", \"\")\n        msg_id = msg.get(\"id\")\n        params = msg.get(\"params\", {}) or {}\n        is_request = \"id\" in msg\n\n        handler = {\n            \"initialize\": lambda: self.on_initialize(msg_id, params),\n            \"shutdown\": lambda: self._do_shutdown(msg_id),\n            \"textDocument/hover\": lambda: self.on_hover(msg_id, params),\n            \"textDocument/definition\":\n                lambda: self.on_definition(msg_id, params),\n            \"textDocument/completion\":\n                lambda: self.on_completion(msg_id, params),\n            \"textDocument/rename\":\n                lambda: self.on_rename(msg_id, params),\n            \"textDocument/references\":\n                lambda: self.on_references(msg_id, params),\n            \"textDocument/documentSymbol\":\n                lambda: self.on_document_symbol(msg_id, params),\n        }.get(method)\n\n        if handler is not None:\n            if is_request or method == \"shutdown\":\n                handler()\n            return\n\n        # notifications\n        if method == \"initialized\":\n            return\n        if method == \"exit\":\n            sys.exit(0 if self._shutdown else 1)\n        if method == \"textDocument/didOpen\":\n            self.on_did_open(params)\n            return\n        if method == \"textDocument/didChange\":\n            self.on_did_change(params)\n            return\n        # unknown: reply MethodNotFound to requests, ignore notifications\n        if is_request:\n            self.error(msg_id, -32601, f\"method not found: {method}\")\n\n    def _do_shutdown(self, msg_id):\n        self._shutdown = True\n        self.respond(msg_id, None)\n\n    def run(self):\n        while True:\n            msg = read_message(self.stdin)\n            if msg is None:\n                break\n            try:\n                self.dispatch(msg)\n            except Exception:\n                # a bad handler must not take the server down\n                if \"id\" in msg:\n                    self.error(msg.get(\"id\"), -32603, \"internal error\")\n\n\ndef main():\n    LanguageServer().run()\n\n\nif __name__ == \"__main__\":\n    main()\n", "agk/mock.py": "\"\"\"AGK-Real v2 test mocks.\n\nBecause AGK module imports are compiled inline into a single namespace,\na \"module function\" is just a name in the test module's namespace.\nReplacing that name with a :class:`Mock` therefore intercepts every\ncall to it -- including calls made from imported helper code -- until\nthe mock is restored.\n\nAGK-level API (injected into every test module by the test runner)::\n\n    create m as Mock\n    set m to mock(\"fetch_price\")          # record calls, return None\n    set m to mock_return(\"fetch_price\", 42)  # record calls, return 42\n    ...\n    if m.call_count() != 1:\n        raise \"expected one call\"\n    create first_arg as String\n    set first_arg to m.call_arg(0, 0)     # arg 0 of call 0\n    unmock(m)                             # restore the original\n\nThe names ``mock``, ``mock_return`` and ``unmock`` are reserved in test\nfiles (the runner pre-declares them so test code typechecks).\n\nPython-level API: :func:`patch` swaps a name in any namespace dict for\na recording Mock; ``mock.restore()`` (or the AGK ``unmock`` helper)\nputs the original back.\n\"\"\"\n\nfrom .parser import parse\n\nMOCK_PRELUDE_SRC = '''\\\ndefine function mock that takes name as String and returns Mock:\n    return None\n\ndefine function mock_return that takes name as String, value as Object and returns Mock:\n    return None\n\ndefine function unmock that takes m as Mock:\n    return None\n'''\n\n# Parsed once at import; passed as extra_top_levels when compiling test\n# files so the mock helpers typecheck. Bodies are never analyzed or\n# generated -- the runner injects real Python implementations.\nMOCK_PRELUDE = parse(MOCK_PRELUDE_SRC, filename=\"<agk-test-prelude>\")\n\n#: Names reserved for the mock helpers in test files.\nMOCK_NAMES = (\"mock\", \"mock_return\", \"unmock\")\n\n\nclass Mock:\n    \"\"\"A callable stand-in that records every call made to it.\"\"\"\n\n    def __init__(self, name, original, namespace, return_value=None):\n        self._mock_name = name\n        self._mock_original = original\n        self._mock_namespace = namespace\n        self._mock_return_value = return_value\n        self._mock_calls = []\n\n    def __call__(self, *args, **kwargs):\n        self._mock_calls.append((args, kwargs))\n        return self._mock_return_value\n\n    def __repr__(self):\n        return (f\"<Mock of '{self._mock_name}': \"\n                f\"{len(self._mock_calls)} calls>\")\n\n    @property\n    def calls(self):\n        \"\"\"List of (args, kwargs) for every recorded call.\"\"\"\n        return list(self._mock_calls)\n\n    def call_count(self):\n        \"\"\"Number of recorded calls.\"\"\"\n        return len(self._mock_calls)\n\n    def call_arg(self, call_index, arg_index):\n        \"\"\"The ``arg_index``-th positional argument of the\n        ``call_index``-th call (both 0-based).\"\"\"\n        return self._mock_calls[call_index][0][arg_index]\n\n    def restore(self):\n        \"\"\"Put the original function back in the namespace.\"\"\"\n        self._mock_namespace[self._mock_name] = self._mock_original\n\n\ndef patch(namespace, name, return_value=None):\n    \"\"\"Replace ``namespace[name]`` with a recording Mock.\n\n    Returns the Mock. Raises ValueError when ``name`` is missing or\n    not callable, so a typo fails fast instead of silently mocking\n    nothing.\n    \"\"\"\n    if name not in namespace:\n        raise ValueError(f\"mock: no function named '{name}' \"\n                         f\"in this test module\")\n    original = namespace[name]\n    if not callable(original):\n        raise ValueError(f\"mock: '{name}' is not callable\")\n    mock = Mock(name, original, namespace, return_value)\n    namespace[name] = mock\n    return mock\n\n\ndef install_helpers(namespace):\n    \"\"\"AGK-callable mock helpers bound to ``namespace``.\n\n    Returns a dict to merge into the test module's namespace before\n    exec: ``mock(name)``, ``mock_return(name, value)``, ``unmock(m)``.\n    \"\"\"\n    def _mock(name):\n        return patch(namespace, name)\n\n    def _mock_return(name, value):\n        return patch(namespace, name, return_value=value)\n\n    def _unmock(m):\n        if not isinstance(m, Mock):\n            raise ValueError(\n                \"unmock: expected a Mock from mock()/mock_return()\")\n        m.restore()\n\n    return {\"mock\": _mock, \"mock_return\": _mock_return, \"unmock\": _unmock}\n", "agk/optimize.py": "\"\"\"AST-to-AST optimization pass for AGK-Real.\n\nRuns after semantic analysis / type-checking, before codegen. Every\ntransformation is semantics-preserving: when in doubt the node is left\nuntouched.\n\n  1. Constant folding: pure literal BinOp/UnaryOp expressions are\n     evaluated at compile time (``2 + 3 * 4`` -> ``14``,\n     ``\"a\" + \"b\"`` -> ``\"ab\"``). Anything that could raise at fold time\n     (``1 / 0``), produce a non-finite float, allocate unbounded memory\n     (giant string repetition), or has side effects (calls) is never\n     folded.\n  2. Dead-code elimination: statements after ``return``/``raise`` in the\n     same block are dropped.\n  3. Dead-store elimination: ``create``/``set`` of a local that is never\n     read afterwards is dropped, but only when the right-hand side is a\n     plain literal -- so no side effect and no exception can be lost.\n\"\"\"\n\nfrom . import ast_nodes as A\n\n_NO_FOLD = object()\n_LITERALS = (A.IntLit, A.FloatLit, A.StringLit, A.BoolLit)\n\n# Cap on folded string length: folding \"a\" * 10**9 must not turn the\n# compiler into a memory bomb. The unoptimized program would attempt the\n# same allocation at run time; we simply decline to do it at compile time.\n_MAX_FOLDED_STR = 10_000\n\n\n# -- constant folding ---------------------------------------------------\n\ndef _lit_value(node):\n    \"\"\"Python value of a literal node, or _NO_FOLD.\"\"\"\n    if isinstance(node, A.BoolLit):\n        return node.value\n    if isinstance(node, A.IntLit):\n        return node.value\n    if isinstance(node, A.FloatLit):\n        return node.value\n    if isinstance(node, A.StringLit):\n        return node.value\n    return _NO_FOLD\n\n\ndef _wrap_literal(value, like):\n    \"\"\"Rebuild a literal node for a folded value, or _NO_FOLD.\n\n    Non-finite floats are rejected: repr(inf)/repr(nan) are not valid\n    Python literals, so emitting them would be a miscompile.\n    \"\"\"\n    kw = {\"line\": like.line, \"col\": like.col}\n    if isinstance(value, bool):\n        return A.BoolLit(value, **kw)\n    if isinstance(value, int):\n        return A.IntLit(value, **kw)\n    if isinstance(value, float):\n        if value != value or value in (float(\"inf\"), float(\"-inf\")):\n            return _NO_FOLD\n        return A.FloatLit(value, **kw)\n    if isinstance(value, str):\n        if len(value) > _MAX_FOLDED_STR:\n            return _NO_FOLD\n        return A.StringLit(value, **kw)\n    return _NO_FOLD\n\n\ndef _fold_binop(op, left, right):\n    \"\"\"Evaluate a binary op on two Python literal values, or _NO_FOLD.\n\n    Any exception (ZeroDivisionError, TypeError, ...) means \"leave the\n    expression alone\" so the error still surfaces at run time.\n    \"\"\"\n    try:\n        if op == \"+\":\n            return left + right\n        if op == \"-\":\n            return left - right\n        if op == \"*\":\n            return left * right\n        if op == \"/\":\n            return left / right\n        if op == \"%\":\n            return left % right\n        if op == \"==\":\n            return left == right\n        if op == \"!=\":\n            return left != right\n        if op == \"<\":\n            return left < right\n        if op == \">\":\n            return left > right\n        if op == \"<=\":\n            return left <= right\n        if op == \">=\":\n            return left >= right\n        if op == \"and\":\n            return left and right\n        if op == \"or\":\n            return left or right\n    except Exception:\n        return _NO_FOLD\n    return _NO_FOLD\n\n\ndef _fold_unary(op, value):\n    try:\n        if op == \"-\":\n            return -value\n        if op == \"not\":\n            return not value\n    except Exception:\n        return _NO_FOLD\n    return _NO_FOLD\n\n\ndef _fold_expr(e):\n    \"\"\"Bottom-up constant folding. Returns the (possibly new) node.\"\"\"\n    if isinstance(e, A.BinOp):\n        e.left = _fold_expr(e.left)\n        e.right = _fold_expr(e.right)\n        left = _lit_value(e.left)\n        right = _lit_value(e.right)\n        if left is not _NO_FOLD and right is not _NO_FOLD:\n            folded = _wrap_literal(_fold_binop(e.op, left, right), e)\n            if folded is not _NO_FOLD:\n                return folded\n        return e\n    if isinstance(e, A.UnaryOp):\n        e.operand = _fold_expr(e.operand)\n        value = _lit_value(e.operand)\n        if value is not _NO_FOLD:\n            folded = _wrap_literal(_fold_unary(e.op, value), e)\n            if folded is not _NO_FOLD:\n                return folded\n        return e\n    if isinstance(e, A.AwaitExpr):\n        e.operand = _fold_expr(e.operand)\n        return e\n    if isinstance(e, A.Call):\n        # Calls are never folded (side effects), but their subtrees are.\n        e.func = _fold_expr(e.func)\n        e.args = [_fold_expr(a) for a in e.args]\n        return e\n    if isinstance(e, A.Attribute):\n        e.obj = _fold_expr(e.obj)\n        return e\n    if isinstance(e, A.Index):\n        e.obj = _fold_expr(e.obj)\n        e.index = _fold_expr(e.index)\n        return e\n    if isinstance(e, A.ListLit):\n        e.elements = [_fold_expr(x) for x in e.elements]\n        return e\n    if isinstance(e, A.DictLit):\n        e.pairs = [(_fold_expr(k), _fold_expr(v)) for k, v in e.pairs]\n        return e\n    return e\n\n\n# -- read/write sets ----------------------------------------------------\n\ndef _reads_expr(e):\n    \"\"\"Names read (in expression position) anywhere inside e.\"\"\"\n    if e is None:\n        return set()\n    if isinstance(e, A.Name):\n        return {e.id}\n    if isinstance(e, A.BinOp):\n        return _reads_expr(e.left) | _reads_expr(e.right)\n    if isinstance(e, A.UnaryOp):\n        return _reads_expr(e.operand)\n    if isinstance(e, A.AwaitExpr):\n        return _reads_expr(e.operand)\n    if isinstance(e, A.Call):\n        out = _reads_expr(e.func)\n        for a in e.args:\n            out |= _reads_expr(a)\n        return out\n    if isinstance(e, A.Attribute):\n        return _reads_expr(e.obj)\n    if isinstance(e, A.Index):\n        return _reads_expr(e.obj) | _reads_expr(e.index)\n    if isinstance(e, A.ListLit):\n        out = set()\n        for x in e.elements:\n            out |= _reads_expr(x)\n        return out\n    if isinstance(e, A.DictLit):\n        out = set()\n        for k, v in e.pairs:\n            out |= _reads_expr(k) | _reads_expr(v)\n        return out\n    return set()\n\n\ndef _reads_block(stmts):\n    out = set()\n    for s in stmts or ():\n        out |= _reads_stmt(s)\n    return out\n\n\ndef _reads_stmt(s):\n    \"\"\"Names read anywhere inside statement s (all nested blocks).\"\"\"\n    if isinstance(s, A.ExprStmt):\n        return _reads_expr(s.expr)\n    if isinstance(s, A.SetStmt):\n        return _reads_expr(s.value)\n    if isinstance(s, A.SetAttr):\n        return _reads_expr(s.obj) | _reads_expr(s.value)\n    if isinstance(s, (A.ReturnStmt, A.YieldStmt, A.RaiseStmt)):\n        return _reads_expr(s.value)\n    if isinstance(s, A.IfStmt):\n        out = _reads_expr(s.condition)\n        out |= _reads_block(s.then_body)\n        for cond, body in s.elifs:\n            out |= _reads_expr(cond) | _reads_block(body)\n        out |= _reads_block(s.else_body)\n        return out\n    if isinstance(s, A.WhileStmt):\n        return _reads_expr(s.condition) | _reads_block(s.body)\n    if isinstance(s, A.ForEachStmt):\n        return _reads_expr(s.iterable) | _reads_block(s.body)\n    if isinstance(s, A.ForRangeStmt):\n        out = (_reads_expr(s.start) | _reads_expr(s.end)\n               | _reads_expr(s.step) | _reads_block(s.body))\n        return out\n    if isinstance(s, A.TryStmt):\n        return (_reads_block(s.body) | _reads_block(s.catch_body)\n                | _reads_block(s.finally_body))\n    return set()\n\n\ndef _writes_stmt(s):\n    \"\"\"Local names definitely bound by s itself (not nested blocks).\"\"\"\n    if isinstance(s, A.SetStmt):\n        return {s.name}\n    if isinstance(s, A.CreateStmt) and not s.soft:\n        # `create` emits no code, but a hard declaration starts the name's\n        # live range. A soft (Simple AGK `x is ...`) redeclare is a pure\n        # no-op: it must not kill liveness, or an earlier `x = <literal>`\n        # would be wrongly dropped as a dead store.\n        return {s.name}\n    return set()\n\n\n# -- block optimizer ----------------------------------------------------\n\ndef _opt_stmt(s, live_after):\n    \"\"\"Fold s's expressions and optimize nested blocks in place.\n\n    live_after: names live just after s in the enclosing block; nested\n    blocks that can observe them get it as their own live-after set.\n    \"\"\"\n    if isinstance(s, A.ExprStmt):\n        s.expr = _fold_expr(s.expr)\n    elif isinstance(s, A.SetStmt):\n        s.value = _fold_expr(s.value)\n    elif isinstance(s, A.SetAttr):\n        s.obj = _fold_expr(s.obj)\n        s.value = _fold_expr(s.value)\n    elif isinstance(s, (A.ReturnStmt, A.YieldStmt, A.RaiseStmt)):\n        s.value = _fold_expr(s.value)\n    elif isinstance(s, A.IfStmt):\n        s.condition = _fold_expr(s.condition)\n        s.then_body = _opt_block(s.then_body, live_after)[0]\n        s.elifs = [(_fold_expr(cond), _opt_block(body, live_after)[0])\n                   for cond, body in s.elifs]\n        if s.else_body is not None:\n            s.else_body = _opt_block(s.else_body, live_after)[0]\n    elif isinstance(s, A.WhileStmt):\n        s.condition = _fold_expr(s.condition)\n        # The body loops back to the condition and to its own top:\n        # anything the condition or the body reads is live at the end\n        # of the body. (Without the body's own reads, a store at the\n        # end of the body feeding a read at the top of the next\n        # iteration would be wrongly dropped as a dead store.)\n        s.body = _opt_block(s.body,\n                            live_after | _reads_expr(s.condition)\n                            | _reads_block(s.body))[0]\n    elif isinstance(s, A.ForEachStmt):\n        s.iterable = _fold_expr(s.iterable)\n        # Loop back-edge: the body's own reads are live at its end.\n        s.body = _opt_block(s.body,\n                            live_after | _reads_block(s.body))[0]\n    elif isinstance(s, A.ForRangeStmt):\n        s.start = _fold_expr(s.start)\n        s.end = _fold_expr(s.end)\n        if s.step is not None:\n            s.step = _fold_expr(s.step)\n        # Loop back-edge: the body's own reads are live at its end.\n        s.body = _opt_block(s.body,\n                            live_after | _reads_block(s.body))[0]\n    elif isinstance(s, A.TryStmt):\n        # The handlers can run after any point of the try body, so\n        # anything they read is live throughout it.\n        catch_reads = _reads_block(s.catch_body)\n        finally_reads = _reads_block(s.finally_body)\n        s.body = _opt_block(\n            s.body, live_after | catch_reads | finally_reads)[0]\n        if s.catch_body is not None:\n            s.catch_body = _opt_block(\n                s.catch_body, live_after | finally_reads)[0]\n        if s.finally_body is not None:\n            s.finally_body = _opt_block(s.finally_body, live_after)[0]\n    elif isinstance(s, A.FunctionDef):\n        s.decorators = [_fold_expr(d) for d in s.decorators]\n        s.body = _opt_block(s.body, set())[0]\n    elif isinstance(s, A.ClassDef):\n        if s.constructor is not None:\n            s.constructor.body = _opt_block(s.constructor.body, set())[0]\n        for m in s.methods:\n            m.decorators = [_fold_expr(d) for d in m.decorators]\n            m.body = _opt_block(m.body, set())[0]\n    return s\n\n\ndef _opt_block(stmts, live_after):\n    \"\"\"Optimize one statement list.\n\n    Returns (new_statements, live_before). Dead-code elimination runs\n    forward (drop everything after return/raise); dead-store elimination\n    runs backward with a liveness set.\n    \"\"\"\n    # Phase 1 (forward): truncate after return/raise.\n    kept = []\n    for s in stmts:\n        kept.append(s)\n        if isinstance(s, (A.ReturnStmt, A.RaiseStmt)):\n            break\n    # Phase 2 (backward): nested blocks + dead stores.\n    live = set(live_after)\n    out = []\n    for s in reversed(kept):\n        s = _opt_stmt(s, live)\n        if isinstance(s, A.CreateStmt):\n            # `create` emits no code; an unread declaration is dead.\n            if s.name not in live:\n                continue\n        elif isinstance(s, A.SetStmt):\n            # Drop only literal stores to unread locals: a literal RHS\n            # has no side effects and cannot raise.\n            if (s.name not in live\n                    and isinstance(s.value, _LITERALS)\n                    and s.name not in _reads_expr(s.value)):\n                continue\n        out.append(s)\n        reads = _reads_stmt(s)\n        writes = _writes_stmt(s)\n        # A write kills liveness, unless the RHS itself reads the name\n        # (e.g. `set x to x + 1` keeps x live for earlier statements).\n        live = (live - (writes - reads)) | reads\n    out.reverse()\n    return out, live\n\n\ndef optimize_program(program):\n    \"\"\"Run the optimization pass over a parsed+analyzed Program.\n\n    Mutates the program in place and returns it.\n    \"\"\"\n    program.statements = _opt_block(program.statements, set())[0]\n    return program\n", "agk/parser.py": "\"\"\"AGK-Real v1 recursive-descent parser.\n\nConsumes the INDENT/DEDENT token stream from the lexer and builds the AST.\nEvery node records its source line/column (for file:line:col errors).\nAll failures raise ParserError. The parser never guesses indentation \u2014\nit follows the lexer's INDENT/DEDENT tokens exactly.\n\"\"\"\n\nfrom .tokens import Token, TokenType as T\nfrom .errors import ParserError\nfrom . import ast_nodes as A\n\n\nclass Parser:\n    def __init__(self, tokens, filename=\"<input>\"):\n        self.tokens = tokens\n        self.filename = filename\n        self.pos = 0\n        # v0.6.0 (Simple AGK): counter for hidden `repeat` loop variables.\n        self._repeat_counter = 0\n\n    # -- token plumbing -------------------------------------------------\n\n    def peek(self):\n        return self.tokens[self.pos]\n\n    def advance(self):\n        tok = self.tokens[self.pos]\n        if tok.type != T.EOF:\n            self.pos += 1\n        return tok\n\n    def check(self, *types):\n        return self.peek().type in types\n\n    def match(self, *types):\n        if self.check(*types):\n            return self.advance()\n        return None\n\n    def expect(self, type_, message):\n        tok = self.peek()\n        if tok.type != type_:\n            raise ParserError(message, self.filename, tok.line, tok.column)\n        return self.advance()\n\n    def error(self, message, tok=None):\n        tok = tok or self.peek()\n        raise ParserError(message, self.filename, tok.line, tok.column)\n\n    def _skip_newlines(self):\n        while self.match(T.NEWLINE):\n            pass\n\n    # -- entry point ----------------------------------------------------\n\n    def parse(self):\n        statements = []\n        self._skip_newlines()\n        while not self.check(T.EOF):\n            if self.match(T.IMPORT):\n                statements.append(self.parse_import())\n            elif self.check(T.DEFINE, T.AT):\n                statements.append(self.parse_top_level_define())\n            elif self.check(T.EXTERN):\n                statements.append(self.parse_extern_def())\n            elif self.check(T.TO):\n                # v0.6.0 (Simple AGK): `to <name> ...:` at top level.\n                statements.append(self.parse_to_function_def())\n            else:\n                self.error(f\"unexpected {self.peek().value!r} at top level; \"\n                           f\"expected 'import', 'define', or 'extern'\")\n            self._skip_newlines()\n        return A.Program(statements)\n\n    def parse_import(self):\n        imp = self.tokens[self.pos - 1]  # the IMPORT token just matched\n        parts = [self.expect(T.IDENTIFIER, \"expected module name\").value]\n        while self.match(T.DOT):\n            parts.append(self.expect(T.IDENTIFIER, \"expected module name\").value)\n        self.expect(T.NEWLINE, \"expected end of line after import\")\n        return A.Import(\".\".join(parts), line=imp.line, col=imp.column)\n\n    def parse_top_level_define(self):\n        decorators = self.parse_decorators()\n        defn = self.expect(T.DEFINE, \"expected 'define'\")\n        is_async = self.match(T.ASYNC) is not None\n        tok = self.peek()\n        if tok.type == T.FUNCTION:\n            return self.parse_function_def(decorators, is_async)\n        if tok.type == T.CLASS:\n            if is_async:\n                self.error(\"classes cannot be async\", defn)\n            if decorators:\n                self.error(\"decorators are not supported on classes\", defn)\n            return self.parse_class_def()\n        if tok.type == T.CONSTANT:\n            if is_async:\n                self.error(\"constants cannot be async\", defn)\n            if decorators:\n                self.error(\"decorators are not supported on constants\", defn)\n            return self.parse_constant_def()\n        self.error(\"expected 'function', 'class', or 'constant' after 'define'\")\n\n    def parse_decorators(self):\n        \"\"\"v0.4.0: consume `@name` / `@name(args)` lines; returns a list of\n        Name/Call expressions (possibly empty).\"\"\"\n        decorators = []\n        while self.match(T.AT):\n            name_tok = self.expect(T.IDENTIFIER,\n                                   \"expected decorator name after '@'\")\n            node = A.Name(name_tok.value,\n                          line=name_tok.line, col=name_tok.column)\n            if self.match(T.LPAREN):\n                args = []\n                if not self.check(T.RPAREN):\n                    args.append(self.parse_expression())\n                    while self.match(T.COMMA):\n                        args.append(self.parse_expression())\n                self.expect(T.RPAREN,\n                            \"expected ')' after decorator arguments\")\n                node = A.Call(node, args,\n                              line=name_tok.line, col=name_tok.column)\n            self.expect(T.NEWLINE, \"expected end of line after decorator\")\n            decorators.append(node)\n        return decorators\n\n    # -- definitions ----------------------------------------------------\n\n    def _parse_signature(self, allow_defaults=True):\n        \"\"\"Parse `name [that takes a as T, ...] [and returns T]`, after\n        `define function` / `define constructor` / `extern function`.\n        Returns (name_tok|None, params, return_type).\"\"\"\n        name_tok = self.advance() if self.check(T.IDENTIFIER) else None\n        params = []\n        return_type = None\n        if self.match(T.THAT):\n            if self.match(T.TAKES):\n                params = self._parse_params(allow_defaults)\n            if self.match(T.AND):\n                self.expect(T.RETURNS, \"expected 'returns' after 'and'\")\n                return_type = self.expect(T.IDENTIFIER,\n                                          \"expected return type name\").value\n            elif self.match(T.RETURNS):\n                return_type = self.expect(T.IDENTIFIER,\n                                          \"expected return type name\").value\n        return name_tok, params, return_type\n\n    def _parse_params(self, allow_defaults=True):\n        params = [self._parse_param(allow_defaults)]\n        while self.match(T.COMMA):\n            params.append(self._parse_param(allow_defaults))\n        return params\n\n    def _parse_param(self, allow_defaults=True):\n        name = self.expect(T.IDENTIFIER, \"expected parameter name\")\n        self.expect(T.AS, f\"expected 'as' after parameter {name.value!r}\")\n        type_name = self.expect(T.IDENTIFIER,\n                                f\"expected type for parameter {name.value!r}\")\n        default = None\n        if self.match(T.ASSIGN):\n            if not allow_defaults:\n                self.error(\"extern function parameters cannot have default \"\n                           \"values\", name)\n            default = self._parse_default(name)\n        return A.Param(name.value, type_name.value, default,\n                       line=name.line, col=name.column)\n\n    def _parse_default(self, name_tok):\n        \"\"\"v2: parse a literal default value (optional leading `-`).\"\"\"\n        neg_tok = self.match(T.MINUS)\n        tok = self.peek()\n        node = None\n        if tok.type == T.INT:\n            node = A.IntLit(int(tok.value), line=tok.line, col=tok.column)\n        elif tok.type == T.FLOAT:\n            node = A.FloatLit(float(tok.value), line=tok.line, col=tok.column)\n        elif tok.type == T.STRING:\n            node = self._parse_string(tok)\n            if not isinstance(node, A.StringLit):\n                self.error(\n                    f\"default value for parameter {name_tok.value!r} must be \"\n                    f\"a static string (interpolation is not allowed in \"\n                    f\"defaults)\", tok)\n        elif tok.type in (T.TRUE, T.FALSE):\n            node = A.BoolLit(tok.type == T.TRUE,\n                             line=tok.line, col=tok.column)\n        if node is None:\n            self.error(\n                f\"default value for parameter {name_tok.value!r} must be a \"\n                f\"literal (number, string, or boolean)\", tok)\n        if neg_tok is not None:\n            if not isinstance(node, (A.IntLit, A.FloatLit)):\n                self.error(\n                    f\"cannot negate the default value of parameter \"\n                    f\"{name_tok.value!r}\", neg_tok)\n            node = A.UnaryOp(\"-\", node, line=neg_tok.line, col=neg_tok.column)\n        self.advance()\n        return node\n\n    def parse_function_def(self, decorators=(), is_async=False):\n        fn = self.expect(T.FUNCTION, \"expected 'function'\")\n        name_tok, params, return_type = self._parse_signature()\n        if name_tok is None:\n            self.error(\"expected function name\")\n        self.expect(T.COLON, \"expected ':' after function signature\")\n        body = self.parse_block()\n        return A.FunctionDef(name_tok.value, params, return_type, body,\n                             is_async=is_async,\n                             decorators=list(decorators),\n                             line=fn.line, col=fn.column)\n\n    def parse_extern_def(self):\n        \"\"\"FFI declaration (top level only, no body):\n        `extern function <name> [that takes ...] [and returns T] from \"<lib>\"`.\"\"\"\n        ext = self.expect(T.EXTERN, \"expected 'extern'\")\n        self.expect(T.FUNCTION, \"expected 'function' after 'extern'\")\n        name_tok, params, return_type = self._parse_signature(\n            allow_defaults=False)\n        if name_tok is None:\n            self.error(\"expected function name after 'extern function'\")\n        self.expect(T.FROM,\n                    \"expected 'from \\\"<library>\\\"' after extern function \"\n                    \"signature\")\n        lib_tok = self.expect(T.STRING,\n                              \"expected library name in quotes after 'from'\")\n        self.expect(T.NEWLINE, \"expected end of line after extern declaration\")\n        return A.ExternDef(name_tok.value, params, return_type, lib_tok.value,\n                           line=ext.line, col=ext.column)\n\n    def parse_constant_def(self):\n        cnst = self.expect(T.CONSTANT, \"expected 'constant'\")\n        name = self.expect(T.IDENTIFIER, \"expected constant name\")\n        self.expect(T.AS, f\"expected 'as' after constant {name.value!r}\")\n        type_name = self.expect(T.IDENTIFIER,\n                                f\"expected type for constant {name.value!r}\")\n        self.expect(T.ASSIGN, \"expected '=' in constant definition\")\n        value = self.parse_primary()\n        if (not isinstance(value, (A.IntLit, A.FloatLit, A.StringLit, A.BoolLit))\n                or not self.check(T.NEWLINE)):\n            self.error(\"constant value must be a single literal\")\n        self.expect(T.NEWLINE, \"expected end of line after constant definition\")\n        return A.ConstantDef(name.value, type_name.value, value,\n                             line=cnst.line, col=cnst.column)\n\n    def parse_class_def(self):\n        cls = self.expect(T.CLASS, \"expected 'class'\")\n        name = self.expect(T.IDENTIFIER, \"expected class name\")\n        base = None\n        if self.match(T.EXTENDS):\n            base = self.expect(T.IDENTIFIER, \"expected base class name\").value\n        if self.match(T.IMPLEMENTS):\n            self.error(\"'implements' is not supported in v1\")\n        self.expect(T.COLON, \"expected ':' after class header\")\n        self.expect(T.NEWLINE, \"expected end of line after class header\")\n        self.expect(T.INDENT, \"expected indented class body\")\n\n        fields, methods, constructor = [], [], None\n        while not self.check(T.DEDENT, T.EOF):\n            if self.match(T.NEWLINE):\n                continue\n            if self.match(T.VARIABLE):\n                fields.append(self._parse_field())\n            elif self.check(T.DEFINE, T.AT):\n                decorators = self.parse_decorators()\n                defn = self.expect(T.DEFINE, \"expected 'define'\")\n                is_async = self.match(T.ASYNC) is not None\n                if self.match(T.CONSTRUCTOR):\n                    if constructor is not None:\n                        self.error(\"duplicate constructor\", defn)\n                    if decorators:\n                        self.error(\"decorators are not supported on \"\n                                   \"constructors\", defn)\n                    if is_async:\n                        self.error(\"constructors cannot be async\", defn)\n                    constructor = self._parse_constructor()\n                elif self.check(T.FUNCTION):\n                    methods.append(self.parse_function_def(decorators,\n                                                           is_async))\n                else:\n                    self.error(\"expected 'constructor' or 'function' \"\n                               \"after 'define' in class body\", defn)\n            elif self.check(T.TO):\n                # v0.6.0 (Simple AGK): `to <name> ...:` as a method.\n                methods.append(self.parse_to_function_def())\n            else:\n                self.error(\"expected 'variable', 'define constructor', \"\n                           \"or 'define function' in class body\")\n        self.expect(T.DEDENT, \"expected end of class body\")\n        return A.ClassDef(name.value, base, fields, constructor, methods,\n                          line=cls.line, col=cls.column)\n\n    def _parse_field(self):\n        var = self.tokens[self.pos - 1]  # VARIABLE token just matched\n        name = self.expect(T.IDENTIFIER, \"expected field name\")\n        self.expect(T.AS, f\"expected 'as' after field {name.value!r}\")\n        type_name = self.expect(T.IDENTIFIER,\n                                f\"expected type for field {name.value!r}\")\n        self.expect(T.NEWLINE, \"expected end of line after field declaration\")\n        return A.FieldDecl(name.value, type_name.value,\n                           line=var.line, col=var.column)\n\n    def _parse_constructor(self):\n        ctor = self.tokens[self.pos - 1]  # CONSTRUCTOR token just matched\n        _, params, _ = self._parse_signature()\n        self.expect(T.COLON, \"expected ':' after constructor signature\")\n        body = self.parse_block()\n        return A.ConstructorDef(params, body, line=ctor.line, col=ctor.column)\n\n    # -- blocks and statements -------------------------------------------\n\n    def parse_block(self):\n        self.expect(T.NEWLINE, \"expected end of line\")\n        self.expect(T.INDENT, \"expected indented block\")\n        stmts = []\n        while not self.check(T.DEDENT, T.EOF):\n            if self.match(T.NEWLINE):\n                continue\n            result = self.parse_statement()\n            # v0.6.0 (Simple AGK): some forms desugar to several statements.\n            if isinstance(result, list):\n                stmts.extend(result)\n            else:\n                stmts.append(result)\n        self.expect(T.DEDENT, \"expected end of block\")\n        return stmts\n\n    # -- Simple AGK (v0.6.0): contextual plain-English forms ------------------\n    #\n    # `to`, `say`, `ask`, `repeat`, `increase`, `decrease` and `otherwise`\n    # are NOT new reserved words. Each is only treated specially at\n    # statement start (or, for `otherwise`, right after an if/elif block)\n    # when the following tokens match the full pattern; every other use \u2014\n    # including as a variable or function name \u2014 parses exactly as before.\n    # `is`, `giving`, `times`, `time`, `by`, `with`, `greater`, `than`,\n    # `less`, `equal` stay plain NAME tokens matched by pattern.\n\n    # Tokens that can begin an expression, for `say`/`ask`/`repeat`\n    # dispatch. LPAREN is deliberately excluded: `say(x)` stays a call to\n    # a user-defined `say`, and NEWLINE/EOF are excluded so a bare `say`\n    # still parses as a variable reference.\n    _SIMPLE_EXPR_START = (\n        T.INT, T.FLOAT, T.STRING, T.TRUE, T.FALSE, T.IDENTIFIER, T.SELF,\n        T.LBRACKET, T.LBRACE, T.MINUS, T.NOT, T.AWAIT,\n    )\n\n    def _peek_is_word(self, offset, value):\n        \"\"\"True when the token `offset` ahead is a plain NAME `value`.\"\"\"\n        i = self.pos + offset\n        return (i < len(self.tokens)\n                and self.tokens[i].type == T.IDENTIFIER\n                and self.tokens[i].value == value)\n\n    def _next_starts_simple_expr(self):\n        i = self.pos + 1\n        return (i < len(self.tokens)\n                and self.tokens[i].type in self._SIMPLE_EXPR_START)\n\n    def parse_statement(self):\n        tok = self.peek()\n        if tok.type == T.CREATE:\n            return self.parse_create()\n        if tok.type == T.SET:\n            return self.parse_set()\n        if tok.type == T.IF:\n            return self.parse_if()\n        if tok.type == T.WHILE:\n            return self.parse_while()\n        if tok.type == T.FOR:\n            return self.parse_for()\n        if tok.type == T.TRY:\n            return self.parse_try()\n        if tok.type == T.RAISE:\n            return self.parse_raise()\n        if tok.type == T.RETURN:\n            return self.parse_return()\n        if tok.type == T.YIELD:\n            return self.parse_yield()\n        if tok.type == T.TO:\n            self.error(\"'to' function definitions are only allowed at top \"\n                       \"level or in a class body (like 'define')\", tok)\n        if tok.type == T.IDENTIFIER and self._peek_is_word(1, \"is\"):\n            # `name is <expr>` \u2014 before the say/ask/repeat/increase words\n            # below, so `say is 5` declares `say` rather than erroring.\n            return self.parse_is_statement()\n        if (tok.type == T.IDENTIFIER and tok.value in (\"increase\", \"decrease\")\n                and self._next_is_identifier()):\n            return self.parse_increase_decrease()\n        if (tok.type == T.IDENTIFIER and tok.value in (\"say\", \"ask\", \"repeat\")\n                and self._next_starts_simple_expr()):\n            if tok.value == \"say\":\n                return self.parse_say()\n            if tok.value == \"ask\":\n                return self.parse_ask()\n            return self.parse_repeat()\n        if tok.type == T.DEFINE:\n            self.error(\"'define' is only allowed at top level or in a class body\")\n        if tok.type == T.EXTERN:\n            self.error(\"'extern' is only allowed at top level\")\n        if tok.type == T.IDENTIFIER and self._next_is(T.ASSIGN):\n            self.error(\"unexpected '='; AGK uses 'set <name> to <expr>' \"\n                       \"for assignment (or '==' for comparison)\", tok)\n        expr = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.ExprStmt(expr, line=expr.line, col=expr.col)\n\n    def _next_is_identifier(self):\n        i = self.pos + 1\n        return (i < len(self.tokens)\n                and self.tokens[i].type == T.IDENTIFIER)\n\n    def _infer_simple_type(self, value):\n        \"\"\"v0.6.0: inferred declared type for `x is <expr>`. Literals get\n        their type; anything else is dynamically typed (None).\"\"\"\n        if isinstance(value, A.IntLit):\n            return \"Integer\"\n        if isinstance(value, A.FloatLit):\n            return \"Float\"\n        if isinstance(value, A.StringLit):\n            return \"String\"\n        if isinstance(value, A.BoolLit):\n            return \"Boolean\"\n        if isinstance(value, A.ListLit):\n            return \"List\"\n        if isinstance(value, A.DictLit):\n            return \"Dict\"\n        return None\n\n    def parse_is_statement(self):\n        \"\"\"`name is <expr>`: declare-with-inference when `name` is new in\n        scope, plain assignment when it exists (never a redeclare error).\n        Desugars to a soft CreateStmt + SetStmt; semantic analysis decides\n        declare vs. assign from scope.\n\n        When the words after `is` read as a comparison (`is not ...`,\n        `is greater|less than ...`), the whole line is an expression\n        statement instead, matching the expression-level `is` rules.\"\"\"\n        name_tok = self.expect(T.IDENTIFIER, \"expected variable name\")\n        is_tok = self.advance()  # the 'is' NAME\n        if self.check(T.NOT) or (\n                self._peek_is_word(0, \"greater\")\n                or self._peek_is_word(0, \"less\")) \\\n                and self._peek_is_word(1, \"than\"):\n            # comparison tail: rewind and parse as an expression statement\n            self.pos -= 2\n            expr = self.parse_expression()\n            self.expect(T.NEWLINE, \"expected end of line\")\n            return A.ExprStmt(expr, line=expr.line, col=expr.col)\n        value = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        create = A.CreateStmt(name_tok.value, self._infer_simple_type(value),\n                              soft=True,\n                              line=name_tok.line, col=name_tok.column)\n        assign = A.SetStmt(name_tok.value, value,\n                           line=is_tok.line, col=is_tok.column)\n        return [create, assign]\n\n    def parse_say(self):\n        \"\"\"`say <expr>` \u2014 Simple AGK for `print(<expr>)`.\"\"\"\n        kw = self.advance()  # 'say'\n        value = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.ExprStmt(\n            A.Call(A.Name(\"print\", line=kw.line, col=kw.column), [value],\n                   line=kw.line, col=kw.column),\n            line=kw.line, col=kw.column)\n\n    def parse_ask(self):\n        \"\"\"`ask <expr> giving <name>` \u2014 read a line with `input(<expr>)`\n        into `name` (declared as String, or assigned when it exists).\"\"\"\n        kw = self.advance()  # 'ask'\n        prompt = self.parse_expression()\n        g = self.peek()\n        if not (g.type == T.IDENTIFIER and g.value == \"giving\"):\n            self.error(\"expected 'giving <name>' after 'ask <expr>'\", g)\n        self.advance()\n        name = self.expect(T.IDENTIFIER, \"expected variable name after \"\n                                         \"'giving'\")\n        self.expect(T.NEWLINE, \"expected end of line\")\n        create = A.CreateStmt(name.value, \"String\", soft=True,\n                              line=kw.line, col=kw.column)\n        assign = A.SetStmt(\n            name.value,\n            A.Call(A.Name(\"input\", line=kw.line, col=kw.column), [prompt],\n                   line=kw.line, col=kw.column),\n            line=kw.line, col=kw.column)\n        return [create, assign]\n\n    def parse_repeat(self):\n        \"\"\"`repeat <expr> times:` \u2014 counted loop. Desugars to\n        `for <hidden> in range(<expr>):` with a generated variable name\n        that cannot collide with user code.\"\"\"\n        kw = self.advance()  # 'repeat'\n        count = self.parse_expression()\n        t = self.peek()\n        if not (t.type == T.IDENTIFIER and t.value in (\"times\", \"time\")):\n            self.error(\"expected 'times' (or 'time') after 'repeat <expr>'\",\n                       t)\n        self.advance()\n        self.expect(T.COLON, \"expected ':' after 'repeat <expr> times'\")\n        var = f\"__agk_repeat_{self._repeat_counter}\"\n        self._repeat_counter += 1\n        body = self.parse_block()\n        return A.ForEachStmt(\n            var,\n            A.Call(A.Name(\"range\", line=kw.line, col=kw.column), [count],\n                   line=kw.line, col=kw.column),\n            body, line=kw.line, col=kw.column)\n\n    def parse_increase_decrease(self):\n        \"\"\"`increase <name> [by <expr>]` / `decrease <name> [by <expr>]` \u2014\n        `<name> = <name> +/- (<expr>)`, defaulting the amount to 1.\"\"\"\n        kw = self.advance()  # 'increase' or 'decrease'\n        name = self.expect(T.IDENTIFIER, \"expected variable name\")\n        g = self.peek()\n        if g.type == T.IDENTIFIER and g.value == \"by\":\n            self.advance()\n            amount = self.parse_expression()\n        else:\n            amount = A.IntLit(1, line=kw.line, col=kw.column)\n        self.expect(T.NEWLINE, \"expected end of line\")\n        op = \"+\" if kw.value == \"increase\" else \"-\"\n        target = A.Name(name.value, line=name.line, col=name.column)\n        return A.SetStmt(name.value,\n                         A.BinOp(target, op, amount,\n                                 line=kw.line, col=kw.column),\n                         line=kw.line, col=kw.column)\n\n    def parse_to_function_def(self):\n        \"\"\"`to <name> [with <params>] [and returns <Type>]:` \u2014 Simple AGK\n        alias for `define function`. Params are comma-separated\n        `name [as Type]`; an omitted type is dynamically typed.\"\"\"\n        kw = self.expect(T.TO, \"expected 'to'\")\n        name_tok = self.expect(T.IDENTIFIER, \"expected function name \"\n                                             \"after 'to'\")\n        params = []\n        if self._peek_is_word(0, \"with\"):\n            self.advance()\n            params = self._parse_simple_params()\n        return_type = None\n        if self.match(T.AND):\n            self.expect(T.RETURNS, \"expected 'returns' after 'and'\")\n            return_type = self.expect(T.IDENTIFIER,\n                                      \"expected return type name\").value\n        self.expect(T.COLON, \"expected ':' after function signature\")\n        body = self.parse_block()\n        return A.FunctionDef(name_tok.value, params, return_type, body,\n                             line=kw.line, col=kw.column)\n\n    def _parse_simple_params(self):\n        params = [self._parse_simple_param()]\n        while self.match(T.COMMA):\n            params.append(self._parse_simple_param())\n        return params\n\n    def _parse_simple_param(self):\n        name = self.expect(T.IDENTIFIER, \"expected parameter name\")\n        type_name = None\n        if self.match(T.AS):\n            type_name = self.expect(\n                T.IDENTIFIER,\n                f\"expected type for parameter {name.value!r}\").value\n        return A.Param(name.value, type_name, None,\n                       line=name.line, col=name.column)\n\n    def _next_is(self, type_):\n        return (self.pos + 1 < len(self.tokens)\n                and self.tokens[self.pos + 1].type == type_)\n\n    def parse_create(self):\n        crt = self.expect(T.CREATE, \"expected 'create'\")\n        name = self.expect(T.IDENTIFIER, \"expected variable name\")\n        self.expect(T.AS, f\"expected 'as' after variable {name.value!r}\")\n        type_name = self.expect(T.IDENTIFIER,\n                                f\"expected type for variable {name.value!r}\")\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.CreateStmt(name.value, type_name.value,\n                            line=crt.line, col=crt.column)\n\n    def parse_set(self):\n        st = self.expect(T.SET, \"expected 'set'\")\n        name = self.expect(T.IDENTIFIER, \"expected variable name\")\n        self.expect(T.TO, f\"expected 'to' after variable {name.value!r}\")\n        value = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.SetStmt(name.value, value, line=st.line, col=st.column)\n\n    def _at_otherwise_if(self):\n        \"\"\"`otherwise if` right after an if/elif block (Simple AGK).\"\"\"\n        t = self.tokens\n        p = self.pos\n        return (p + 1 < len(t) and t[p].type == T.IDENTIFIER\n                and t[p].value == \"otherwise\" and t[p + 1].type == T.IF)\n\n    def _at_otherwise(self):\n        \"\"\"`otherwise:` right after an if/elif block (Simple AGK).\"\"\"\n        t = self.tokens\n        p = self.pos\n        return (p + 1 < len(t) and t[p].type == T.IDENTIFIER\n                and t[p].value == \"otherwise\"\n                and t[p + 1].type == T.COLON)\n\n    def parse_if(self):\n        kw = self.expect(T.IF, \"expected 'if'\")\n        cond = self.parse_expression()\n        self.expect(T.COLON, \"expected ':' after 'if' condition\")\n        then_body = self.parse_block()\n        elifs = []\n        while True:\n            if self.match(T.ELIF):\n                pass\n            elif self._at_otherwise_if():\n                self.advance()  # 'otherwise'\n                self.advance()  # 'if'\n            else:\n                break\n            econd = self.parse_expression()\n            self.expect(T.COLON, \"expected ':' after 'elif' condition\")\n            elifs.append((econd, self.parse_block()))\n        else_body = None\n        if self.match(T.ELSE):\n            self.expect(T.COLON, \"expected ':' after 'else'\")\n            else_body = self.parse_block()\n        elif self._at_otherwise():\n            self.advance()  # 'otherwise'\n            self.expect(T.COLON, \"expected ':' after 'otherwise'\")\n            else_body = self.parse_block()\n        return A.IfStmt(cond, then_body, elifs, else_body,\n                        line=kw.line, col=kw.column)\n\n    def parse_while(self):\n        kw = self.expect(T.WHILE, \"expected 'while'\")\n        cond = self.parse_expression()\n        self.expect(T.COLON, \"expected ':' after 'while' condition\")\n        return A.WhileStmt(cond, self.parse_block(),\n                           line=kw.line, col=kw.column)\n\n    def parse_for(self):\n        \"\"\"v2: `for each x in ...`, `for x in ...`, and\n        `for i from <start> to <end> [step <step>]:`.\"\"\"\n        kw = self.expect(T.FOR, \"expected 'for'\")\n        if self.match(T.EACH):\n            return self._parse_for_each(kw)\n        var = self.expect(T.IDENTIFIER, \"expected loop variable after 'for'\")\n        if self.match(T.FROM):\n            start = self.parse_expression()\n            self.expect(T.TO,\n                        \"expected 'to' in 'for <var> from <start> to <end>'\")\n            end = self.parse_expression()\n            step = None\n            if self.match(T.STEP):\n                step = self.parse_expression()\n            self.expect(T.COLON, \"expected ':' after 'for' header\")\n            return A.ForRangeStmt(var.value, start, end, step,\n                                  self.parse_block(),\n                                  line=kw.line, col=kw.column)\n        self.expect(T.IN, f\"expected 'in' after loop variable {var.value!r}\")\n        iterable = self.parse_expression()\n        self.expect(T.COLON, \"expected ':' after 'for' header\")\n        return A.ForEachStmt(var.value, iterable, self.parse_block(),\n                             line=kw.line, col=kw.column)\n\n    def _parse_for_each(self, kw):\n        var = self.expect(T.IDENTIFIER, \"expected loop variable\")\n        self.expect(T.IN, f\"expected 'in' after loop variable {var.value!r}\")\n        iterable = self.p
