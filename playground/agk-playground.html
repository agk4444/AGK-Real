    self.lines.add(frame.f_lineno)\n        return self._trace_lines\n\n\ndef _is_stdlib(agk_file):\n    try:\n        return Path(agk_file).is_relative_to(STDLIB_DIR)\n    except (ValueError, OSError):\n        return False\n\n\nclass Coverage:\n    \"\"\"Per-AGK-file line coverage aggregated over a test run.\"\"\"\n\n    def __init__(self):\n        self._files = {}  # agk path -> [total lines set, covered lines set]\n\n    def add_run(self, code, executed_lines):\n        \"\"\"Fold one compiled test file's executed Python lines in.\n\n        ``executed_lines`` is a set of generated-Python line numbers;\n        they are mapped back to AGK (file, line) pairs via the\n        `# AGK file:line` annotations. Total executable lines are the\n        distinct AGK lines that produced generated code.\n        \"\"\"\n        for py_lineno, (agk_file, agk_lineno) in \\\n                agk_line_map(code).items():\n            if _is_stdlib(agk_file):\n                continue\n            total, covered = self._files.setdefault(agk_file, (set(), set()))\n            total.add(agk_lineno)\n            if py_lineno in executed_lines:\n                covered.add(agk_lineno)\n\n    def rows(self):\n        \"\"\"Sorted [(agk_file, pct, covered, total)] for the report.\"\"\"\n        out = []\n        for agk_file in sorted(self._files):\n            total, covered = self._files[agk_file]\n            pct = round(100 * len(covered) / len(total)) if total else 100\n            out.append((agk_file, pct, len(covered), len(total)))\n        return out\n\n\ndef _exec_tests(path, code, namespace, results):\n    \"\"\"Exec one compiled test module and run its test_* functions.\n\n    Appends (label, ok) tuples to ``results``. Returns True when the\n    module executed cleanly (individual test failures still return\n    True; they are recorded in ``results``).\n    \"\"\"\n    try:\n        exec(compile(code, str(path), \"exec\"), namespace)  # noqa: S102\n    except Exception:\n        print(f\"{path}: module-level error\", file=sys.stderr)\n        exc_type, exc_value, tb = sys.exc_info()\n        sys.stderr.write(format_agk_traceback(exc_type, exc_value, tb, code))\n        results.append((str(path), False))\n        return False\n    setup = _fixture(namespace, \"setup\")\n    teardown = _fixture(namespace, \"teardown\")\n    for name in _test_names(namespace):\n        try:\n            try:\n                if setup is not None:\n                    setup()\n                namespace[name]()\n            finally:\n                if teardown is not None:\n                    teardown()\n        except Exception:\n            print(f\"FAIL {path}::{name}\")\n            exc_type, exc_value, tb = sys.exc_info()\n            sys.stderr.write(\n                format_agk_traceback(exc_type, exc_value, tb, code))\n            results.append((f\"{path}::{name}\", False))\n        else:\n            print(f\"PASS {path}::{name}\")\n            results.append((f\"{path}::{name}\", True))\n    return True\n\n\ndef _run_file(path, results, coverage=None):\n    \"\"\"Compile, exec, and run one test file. Appends (label, ok) tuples\n    to ``results``. When ``coverage`` (a Coverage) is given, executed\n    lines are traced and folded into it. Returns True when the file\n    was collected cleanly.\"\"\"\n    try:\n        src = path.read_text(encoding=\"utf-8\")\n    except OSError as e:\n        print(f\"agk: cannot read '{path}': {e.strerror}\", file=sys.stderr)\n        results.append((str(path), False))\n        return False\n    try:\n        code, warnings = compile_source(\n            src, filename=str(path), search_paths=[str(path.parent)],\n            annotate=True, extra_top_levels=(MOCK_PRELUDE,))\n    except AGKError as e:\n        print(f\"{path}: {e}\", file=sys.stderr)\n        results.append((str(path), False))\n        return False\n    for w in warnings:\n        print(w, file=sys.stderr)\n    namespace = {}\n    namespace.update(install_helpers(namespace))\n    if coverage is None:\n        return _exec_tests(path, code, namespace, results)\n    with _Tracer(str(path)) as tracer:\n        ok = _exec_tests(path, code, namespace, results)\n    coverage.add_run(code, tracer.lines)\n    return ok\n\n\ndef run_tests(path=\".\", coverage=False):\n    \"\"\"Discover and run AGK tests under ``path``.\n\n    Prints PASS/FAIL lines plus a summary, and returns an exit code:\n    0 when everything passed, 1 when any test failed or a file could\n    not be collected, 2 when the path itself is unusable.\n\n    With ``coverage=True``, a per-file AGK line-coverage table is\n    printed after the summary.\n    \"\"\"\n    try:\n        files = collect(path)\n    except FileNotFoundError as e:\n        print(f\"agk: {e}\", file=sys.stderr)\n        return 2\n    results = []\n    cov = Coverage() if coverage else None\n    for f in files:\n        _run_file(f, results, cov)\n    passed = sum(1 for _label, ok in results if ok)\n    failed = len(results) - passed\n    print(f\"{passed} passed, {failed} failed\")\n    if failed:\n        print(\"failed:\")\n        for label, ok in results:\n            if not ok:\n                print(f\"  {label}\")\n    if cov is not None:\n        print(\"coverage:\")\n        for agk_file, pct, n_covered, n_total in cov.rows():\n            print(f\"  {agk_file}: {pct}% ({n_covered}/{n_total} lines)\")\n    return 0 if failed == 0 else 1\n", "agk/tokens.py": "\"\"\"Token types for the AGK-Real v1 lexer.\"\"\"\n\nfrom enum import Enum, auto\n\n\nclass TokenType(Enum):\n    # Keywords\n    DEFINE = auto()\n    FUNCTION = auto()\n    THAT = auto()\n    TAKES = auto()\n    AND = auto()\n    RETURNS = auto()\n    CREATE = auto()\n    SET = auto()\n    TO = auto()\n    CONSTANT = auto()\n    IF = auto()\n    ELIF = auto()\n    ELSE = auto()\n    WHILE = auto()\n    FOR = auto()\n    EACH = auto()\n    IN = auto()\n    RETURN = auto()\n    CLASS = auto()\n    VARIABLE = auto()\n    CONSTRUCTOR = auto()\n    EXTENDS = auto()\n    IMPLEMENTS = auto()\n    IMPORT = auto()\n    OR = auto()\n    NOT = auto()\n    TRUE = auto()\n    FALSE = auto()\n    AS = auto()\n    SELF = auto()\n    # v2 keywords\n    TRY = auto()\n    CATCH = auto()\n    FINALLY = auto()\n    RAISE = auto()\n    FROM = auto()\n    STEP = auto()\n    # FFI keyword\n    EXTERN = auto()\n    # v0.4.0 keywords\n    ASYNC = auto()\n    AWAIT = auto()\n    YIELD = auto()\n\n    # Literals / names\n    IDENTIFIER = auto()\n    INT = auto()\n    FLOAT = auto()\n    STRING = auto()\n\n    # Operators\n    PLUS = auto()\n    MINUS = auto()\n    STAR = auto()\n    SLASH = auto()\n    PERCENT = auto()\n    EQ = auto()        # ==\n    NEQ = auto()       # !=\n    ASSIGN = auto()     # = (only valid in `define constant`)\n    LT = auto()\n    GT = auto()\n    LTE = auto()       # <=\n    GTE = auto()       # >=\n\n    # Delimiters\n    LPAREN = auto()\n    RPAREN = auto()\n    LBRACKET = auto()\n    RBRACKET = auto()\n    LBRACE = auto()\n    RBRACE = auto()\n    COMMA = auto()\n    COLON = auto()\n    DOT = auto()\n    AT = auto()        # @ (decorators)\n\n    # Structural\n    NEWLINE = auto()\n    INDENT = auto()\n    DEDENT = auto()\n    EOF = auto()\n\n\n# Lexer emits LTE/GTE for <= and >=.\nKEYWORDS = {\n    \"define\": TokenType.DEFINE,\n    \"function\": TokenType.FUNCTION,\n    \"that\": TokenType.THAT,\n    \"takes\": TokenType.TAKES,\n    \"and\": TokenType.AND,\n    \"returns\": TokenType.RETURNS,\n    \"create\": TokenType.CREATE,\n    \"set\": TokenType.SET,\n    \"to\": TokenType.TO,\n    \"constant\": TokenType.CONSTANT,\n    \"if\": TokenType.IF,\n    \"elif\": TokenType.ELIF,\n    \"else\": TokenType.ELSE,\n    \"while\": TokenType.WHILE,\n    \"for\": TokenType.FOR,\n    \"each\": TokenType.EACH,\n    \"in\": TokenType.IN,\n    \"return\": TokenType.RETURN,\n    \"class\": TokenType.CLASS,\n    \"variable\": TokenType.VARIABLE,\n    \"constructor\": TokenType.CONSTRUCTOR,\n    \"extends\": TokenType.EXTENDS,\n    \"implements\": TokenType.IMPLEMENTS,\n    \"import\": TokenType.IMPORT,\n    \"or\": TokenType.OR,\n    \"not\": TokenType.NOT,\n    \"true\": TokenType.TRUE,\n    \"false\": TokenType.FALSE,\n    \"as\": TokenType.AS,\n    \"self\": TokenType.SELF,\n    \"try\": TokenType.TRY,\n    \"catch\": TokenType.CATCH,\n    \"finally\": TokenType.FINALLY,\n    \"raise\": TokenType.RAISE,\n    \"from\": TokenType.FROM,\n    \"step\": TokenType.STEP,\n    \"async\": TokenType.ASYNC,\n    \"await\": TokenType.AWAIT,\n    \"yield\": TokenType.YIELD,\n    \"extern\": TokenType.EXTERN,\n}\n\n\nclass Token:\n    __slots__ = (\"type\", \"value\", \"line\", \"column\")\n\n    def __init__(self, type_, value, line, column):\n        self.type = type_\n        self.value = value\n        self.line = line\n        self.column = column\n\n    def __repr__(self):\n        return f\"Token({self.type.name}, {self.value!r}, {self.line}:{self.column})\"\n\n    def __eq__(self, other):\n        return (\n            isinstance(other, Token)\n            and self.type == other.type\n            and self.value == other.value\n        )\n", "agk/typecheck.py": "\"\"\"AGK-Real static type checker.\n\nRuns after semantic analysis (wired in via pipeline.py). Verifies the\ndeclared annotations on variables, constants, function parameters, and\nreturn types against simply-inferred expression types:\n\n    Integer, Float, String, Boolean, List, Dict, None, Object,\n    plus class names as nominal types.\n\nGradual typing: anything the checker cannot infer is \"unknown\" and\nnever produces an error, and ``Object`` accepts any type in either\ndirection (it is the dynamic escape hatch). Unannotated code \u2014 e.g.\nfunctions without a declared return type \u2014 is left alone.\n\nRaises TypeCheckError (a compile error, like SemanticError) on the\nfirst mismatch. There are no generics and no union types.\n\"\"\"\n\nfrom . import ast_nodes as A\nfrom .errors import TypeCheckError\n\nINTEGER = \"Integer\"\nFLOAT = \"Float\"\nSTRING = \"String\"\nBOOLEAN = \"Boolean\"\nLIST = \"List\"\nDICT = \"Dict\"\nOBJECT = \"Object\"\nNONE_TYPE = \"None\"  # e.g. the result of print(), or a bare `return`\n\n_NUMERIC = {INTEGER, FLOAT}\n\n# builtin name -> fixed result type. Builtins with argument-dependent or\n# otherwise dynamic results (abs/min/max/round) are special-cased in\n# _call_type; everything else not listed here is \"unknown\".\n_BUILTIN_TYPES = {\n    \"print\": NONE_TYPE,\n    \"len\": INTEGER,\n    \"str\": STRING,\n    \"int\": INTEGER,\n    \"float\": FLOAT,\n    \"bool\": BOOLEAN,\n    \"input\": STRING,\n    \"list\": LIST,\n    \"dict\": DICT,\n    \"repr\": STRING,\n    \"sorted\": LIST,\n}\n\n\nclass _Param:\n    __slots__ = (\"name\", \"type_name\")\n\n    def __init__(self, name, type_name):\n        self.name = name\n        self.type_name = type_name\n\n\nclass _FuncSig:\n    __slots__ = (\"params\", \"return_type\")\n\n    def __init__(self, params, return_type):\n        self.params = params          # list of _Param\n        self.return_type = return_type  # declared type name or None\n\n\nclass _ClassInfo:\n    def __init__(self, name, base):\n        self.name = name\n        self.base = base              # base class name or None\n        self.fields = {}              # field name -> declared type name\n        self.methods = {}             # method name -> _FuncSig\n        self.ctor = None              # _FuncSig or None\n\n\nclass TypeChecker:\n    def __init__(self, filename=\"<input>\"):\n        self.filename = filename\n        self.funcs = {}    # function name -> _FuncSig\n        self.classes = {}  # class name -> _ClassInfo\n        self._top_scope = {}\n        self._scope = None       # current function scope: name -> type|None\n        self._func_sig = None    # _FuncSig of the function being checked\n        self._func_label = \"\"    # e.g. \"function 'f'\" (for messages)\n        self._class = None       # _ClassInfo of the class being checked\n\n    # -- helpers ----------------------------------------------------------\n\n    def error(self, message, node):\n        raise TypeCheckError(message, self.filename, node.line, node.col)\n\n    def _assignable(self, want, got):\n        \"\"\"Can a value of inferred type `got` be stored where `want` is\n        declared? Either side may be None (unknown) \u2014 gradual typing:\n        unknown is always accepted.\"\"\"\n        if want is None or got is None:\n            return True\n        if want == OBJECT or got == OBJECT:\n            return True  # Object is the dynamic escape hatch\n        if want == got:\n            return True\n        if want == FLOAT and got == INTEGER:\n            return True  # numeric widening\n        return self._is_subclass(got, want)\n\n    def _is_subclass(self, child, parent):\n        \"\"\"Nominal subclass check over the collected class table.\"\"\"\n        seen = set()\n        cur = self.classes.get(child)\n        while cur is not None and cur.name not in seen:\n            seen.add(cur.name)\n            if cur.base is None:\n                return False\n            if cur.base == parent:\n                return True\n            cur = self.classes.get(cur.base)\n        return False\n\n    def _method_sig(self, class_name, method_name):\n        \"\"\"Look up a method through the inheritance chain.\"\"\"\n        seen = set()\n        cur = self.classes.get(class_name)\n        while cur is not None and cur.name not in seen:\n            seen.add(cur.name)\n            if method_name in cur.methods:\n                return cur.methods[method_name], cur.name\n            cur = self.classes.get(cur.base) if cur.base else None\n        return None, None\n\n    # -- entry --------------------------------------------------------------\n\n    def check(self, program, extra_top_levels=()):\n        # pass 1: collect signatures (extras first, like semantic analysis)\n        for mod in extra_top_levels:\n            self._collect_top_level(mod)\n        self._collect_top_level(program)\n        # pass 2: check bodies\n        for mod in extra_top_levels:\n            for stmt in mod.statements:\n                if isinstance(stmt, A.ConstantDef):\n                    self._top_scope[stmt.name] = stmt.type_name\n        for stmt in program.statements:\n            if isinstance(stmt, A.ConstantDef):\n                self._check_constant(stmt)\n                self._top_scope[stmt.name] = stmt.type_name\n            elif isinstance(stmt, A.FunctionDef):\n                self._check_function(stmt, None)\n            elif isinstance(stmt, A.ClassDef):\n                self._check_class(stmt)\n\n    def _collect_top_level(self, program):\n        for stmt in program.statements:\n            if isinstance(stmt, A.FunctionDef):\n                self.funcs[stmt.name] = _FuncSig(\n                    [_Param(p.name, p.type_name) for p in stmt.params],\n                    stmt.return_type)\n            elif isinstance(stmt, A.ClassDef):\n                self._collect_class(stmt)\n\n    def _collect_class(self, cls):\n        info = _ClassInfo(cls.name, cls.base)\n        self.classes[cls.name] = info  # register first: order-independent\n        if cls.base and cls.base in self.classes:\n            info.fields.update(self.classes[cls.base].fields)\n        for f in cls.fields:\n            info.fields[f.name] = f.type_name\n        if cls.constructor is not None:\n            info.ctor = _FuncSig(\n                [_Param(p.name, p.type_name)\n                 for p in cls.constructor.params],\n                None)\n        for m in cls.methods:\n            info.methods[m.name] = _FuncSig(\n                [_Param(p.name, p.type_name) for p in m.params],\n                m.return_type)\n\n    # -- functions / classes --------------------------------------------------\n\n    def _new_scope(self, params):\n        scope = dict(self._top_scope)\n        for p in params:\n            scope[p.name] = p.type_name\n        return scope\n\n    def _check_defaults(self, params, label):\n        for p in params:\n            if p.default is not None:\n                got = self._type_of(p.default)\n                if not self._assignable(p.type_name, got):\n                    self.error(\n                        f\"type mismatch: default value of parameter \"\n                        f\"'{p.name}' of {label} is {got}, \"\n                        f\"expected {p.type_name}\", p.default)\n\n    def _check_function(self, fn, class_info):\n        if class_info is None:\n            sig = self.funcs[fn.name]\n            label = f\"function '{fn.name}'\"\n        else:\n            sig = class_info.methods[fn.name]\n            label = f\"method '{fn.name}' of class '{class_info.name}'\"\n        self._check_defaults(fn.params, label)\n        self._scope = self._new_scope(fn.params)\n        self._func_sig = sig\n        self._func_label = label\n        self._class = class_info\n        try:\n            self._check_block(fn.body)\n        finally:\n            self._scope = None\n            self._func_sig = None\n            self._class = None\n\n    def _check_class(self, cls):\n        info = self.classes[cls.name]\n        if cls.constructor is not None:\n            ctor = cls.constructor\n            label = f\"constructor of class '{cls.name}'\"\n            self._check_defaults(ctor.params, label)\n            self._scope = self._new_scope(ctor.params)\n            self._scope[\"self\"] = cls.name\n            self._func_sig = info.ctor\n            self._func_label = label\n            self._class = info\n            try:\n                self._check_block(ctor.body)\n            finally:\n                self._scope = None\n                self._func_sig = None\n                self._class = None\n        for m in cls.methods:\n            self._check_function(m, info)\n\n    def _check_constant(self, stmt):\n        got = self._type_of(stmt.value)\n        if not self._assignable(stmt.type_name, got):\n            self.error(\n                f\"type mismatch: constant '{stmt.name}' declared as \"\n                f\"{stmt.type_name}, but value is {got}\", stmt)\n\n    # -- statements ---------------------------------------------------------------\n\n    def _check_block(self, stmts):\n        for s in stmts:\n            self._check_stmt(s)\n\n    def _check_stmt(self, s):\n        if isinstance(s, A.CreateStmt):\n            # v0.6.0 (Simple AGK): a soft `x is <expr>` redeclare keeps the\n            # original declared type, so reassignment is checked exactly\n            # like `set` (a type mismatch is still an error).\n            if not s.soft or s.name not in self._scope:\n                self._scope[s.name] = s.type_name\n        elif isinstance(s, A.SetStmt):\n            got = self._type_of(s.value)\n            want = self._scope.get(s.name)\n            if not self._assignable(want, got):\n                self.error(\n                    f\"type mismatch: cannot assign {got} to variable \"\n                    f\"'{s.name}' declared as {want}\", s)\n        elif isinstance(s, A.SetAttr):\n            # field assignment (semantic analysis rewrote bare field\n            # names to self.<field>)\n            want = self._field_type(s.obj, s.attr)\n            if want is not None:\n                got = self._type_of(s.value)\n                if not self._assignable(want, got):\n                    self.error(\n                        f\"type mismatch: cannot assign {got} to field \"\n                        f\"'{s.attr}' declared as {want}\", s)\n        elif isinstance(s, A.ReturnStmt):\n            want = self._func_sig.return_type if self._func_sig else None\n            if want is not None:\n                if s.value is None:\n                    self.error(\n                        f\"type mismatch: {self._func_label} declares \"\n                        f\"return type {want}, but 'return' has no value\", s)\n                else:\n                    got = self._type_of(s.value)\n                    if not self._assignable(want, got):\n                        self.error(\n                            f\"type mismatch: {self._func_label} declares \"\n                            f\"return type {want}, but returns {got}\", s)\n        elif isinstance(s, A.IfStmt):\n            self._type_of(s.condition)\n            self._check_block(s.then_body)\n            for cond, body in s.elifs:\n                self._type_of(cond)\n                self._check_block(body)\n            if s.else_body is not None:\n                self._check_block(s.else_body)\n        elif isinstance(s, A.WhileStmt):\n            self._type_of(s.condition)\n            self._check_block(s.body)\n        elif isinstance(s, A.ForEachStmt):\n            self._type_of(s.iterable)\n            self._scope.setdefault(s.var, None)  # element type is unknown\n            self._check_block(s.body)\n        elif isinstance(s, A.ForRangeStmt):\n            self._type_of(s.start)\n            self._type_of(s.end)\n            if s.step is not None:\n                self._type_of(s.step)\n            self._scope.setdefault(s.var, INTEGER)\n            self._check_block(s.body)\n        elif isinstance(s, A.TryStmt):\n            self._check_block(s.body)\n            if s.catch_body is not None:\n                if s.catch_name is not None:\n                    self._scope.setdefault(s.catch_name, None)\n                self._check_block(s.catch_body)\n            if s.finally_body is not None:\n                self._check_block(s.finally_body)\n        elif isinstance(s, A.RaiseStmt):\n            if s.value is not None:\n                self._type_of(s.value)\n        elif isinstance(s, A.ExprStmt):\n            self._type_of(s.expr)\n        # anything else was already validated by semantic analysis\n\n    def _field_type(self, obj, attr):\n        \"\"\"Declared type of a field store/load, or None if unknown.\"\"\"\n        class_name = None\n        if (isinstance(obj, A.Name) and obj.id == \"self\"\n                and self._class is not None):\n            class_name = self._class.name\n        else:\n            class_name = self._type_of(obj)\n        info = self.classes.get(class_name) if class_name else None\n        if info is not None:\n            return info.fields.get(attr)\n        return None\n\n    # -- expressions ---------------------------------------------------------------\n\n    def _type_of(self, e):\n        \"\"\"Infer the type of an expression. Returns a type name, or None\n        when the type is unknown (gradual typing: never an error).\"\"\"\n        if isinstance(e, A.IntLit):\n            return INTEGER\n        if isinstance(e, A.FloatLit):\n            return FLOAT\n        if isinstance(e, A.StringLit):\n            return STRING\n        if isinstance(e, A.BoolLit):\n            return BOOLEAN\n        if isinstance(e, A.ListLit):\n            for x in e.elements:\n                self._type_of(x)\n            return LIST\n        if isinstance(e, A.DictLit):\n            for k, v in e.pairs:\n                self._type_of(k)\n                self._type_of(v)\n            return DICT\n        if isinstance(e, A.Name):\n            if self._scope is not None:\n                return self._scope.get(e.id)\n            return None\n        if isinstance(e, A.BinOp):\n            lt = self._type_of(e.left)\n            rt = self._type_of(e.right)\n            return self._binop_type(e.op, lt, rt)\n        if isinstance(e, A.UnaryOp):\n            t = self._type_of(e.operand)\n            if e.op == \"not\":\n                return BOOLEAN\n            if e.op == \"-\" and t in _NUMERIC:\n                return t\n            return None\n        if isinstance(e, A.Call):\n            return self._call_type(e)\n        if isinstance(e, A.Attribute):\n            return self._attr_type(e)\n        if isinstance(e, A.Index):\n            self._type_of(e.obj)\n            self._type_of(e.index)\n            return None  # element type is unknown without generics\n        return None\n\n    @staticmethod\n    def _binop_type(op, lt, rt):\n        if op in (\"==\", \"!=\", \"<\", \">\", \"<=\", \">=\"):\n            return BOOLEAN\n        if op in (\"and\", \"or\"):\n            # `x or default` keeps x's type; stay silent rather than\n            # claim Boolean and risk false positives.\n            return None\n        if lt is None or rt is None:\n            return None\n        if op == \"/\":\n            return FLOAT if lt in _NUMERIC and rt in _NUMERIC else None\n        if lt in _NUMERIC and rt in _NUMERIC:\n            return FLOAT if FLOAT in (lt, rt) else INTEGER\n        if op == \"+\" and lt == STRING and rt == STRING:\n            return STRING\n        if op == \"+\" and lt == LIST and rt == LIST:\n            return LIST\n        return None\n\n    def _call_type(self, e):\n        arg_types = [self._type_of(a) for a in e.args]\n        func = e.func\n        if isinstance(func, A.Name):\n            name = func.id\n            if name in _BUILTIN_TYPES:\n                return _BUILTIN_TYPES[name]\n            if name == \"abs\" and arg_types:\n                t = arg_types[0]\n                return t if t in _NUMERIC else None\n            if name in (\"min\", \"max\") and arg_types:\n                known = {t for t in arg_types if t is not None}\n                return known.pop() if len(known) == 1 else None\n            if name == \"round\":\n                if len(arg_types) == 1:\n                    return INTEGER\n                if len(arg_types) == 2:\n                    return FLOAT\n                return None\n            if name in self.funcs:\n                sig = self.funcs[name]\n                self._check_args(f\"function '{name}'\", sig.params,\n                                 e. (p.type_name, got):\n                self.error(\n                    f\"type mismatch: argument '{p.name}' of {label} \"\n                    f\"expects {p.type_name}, got {got}\", arg)\n\n\ndef typecheck(program, filename=\"<input>\", extra_top_levels=()):\n    \"\"\"Run the static type checker over an already-analyzed program.\n\n    Raises TypeCheckError on the first type mismatch. extra_top_levels\n    are programs whose top-level functions/classes/constants are visible\n    (compiled stdlib modules); their signatures are collected but their\n    bodies are not re-checked.\n    \"\"\"\n    checker = TypeChecker(filename)\n    checker.check(program, extra_top_levels=extra_top_levels)\n", "agk/stdlib/agent.agk": "# AGK-Real standard library: LLM-backed agent helpers.\n# Import with: import agent\n# (Functions are inlined into your program; call them directly.)\n#\n# Talks to any OpenAI-compatible /chat/completions endpoint using only\n# the Python standard library (urllib). Requires an API key and network\n# access: set the AGK_LLM_API_KEY environment variable, or pass\n# api_key=\"...\". An alternate endpoint can be set with the\n# AGK_LLM_BASE_URL environment variable or base_url=\"...\".\n# Nothing in this module works offline.\n\nimport json\nimport os\nimport urllib.request\nimport urllib.error\n\n\ndefine function _api_key that takes api_key as String and returns String:\n    if api_key != \"\":\n        return api_key\n    create env_key as Object\n    set env_key to os.environ.get(\"AGK_LLM_API_KEY\", \"\")\n    if env_key == \"\":\n        raise \"agent: no API key - set the AGK_LLM_API_KEY environment variable or pass api_key=\\\"...\\\"\"\n    return env_key\n\n\ndefine function _base_url that takes base_url as String and returns String:\n    if base_url != \"\":\n        return base_url\n    create env_url as Object\n    set env_url to os.environ.get(\"AGK_LLM_BASE_URL\", \"\")\n    if env_url == \"\":\n        return \"https://api.openai.com/v1\"\n    return env_url\n\n\ndefine function _extract_json that takes s as String and returns String:\n    create t as String\n    set t to s.strip()\n    set t to t.replace(\"```json\", \"\")\n    set t to t.replace(\"```\", \"\")\n    return t.strip()\n\n\ndefine function chat that takes messages as List, model as String = \"gpt-4o-mini\", api_key as String = \"\", base_url as String = \"\", timeout as Integer = 30 and returns String:\n    create key as String\n    set key to _api_key(api_key)\n    create url as String\n    set url to _base_url(base_url)\n    create payload as Object\n    set payload to {\"model\": model, \"messages\": messages}\n    create body as String\n    set body to json.dumps(payload)\n    create req as Object\n    set req to urllib.request.Request(url + \"/chat/completions\", body.encode(\"utf-8\"))\n    req.add_header(\"Authorization\", \"Bearer \" + key)\n    req.add_header(\"Content-Type\", \"application/json\")\n    create text as String\n    set text to \"\"\n    # AGK has no None literal: dict.get on a missing key yields Python None,\n    # which is what urlopen expects for its data argument here (the Request\n    # already carries the body).\n    create no_data as Object\n    set no_data to {\"k\": 1}.get(\"missing\")\n    try:\n        create resp as Object\n        set resp to urllib.request.urlopen(req, no_data, timeout)\n        set text to resp.read().decode(\"utf-8\")\n        resp.close()\n    catch:\n        raise \"agent.chat: request to {url} failed - check the API key, base URL and network connection\"\n    create data as Object\n    set data to {}\n    try:\n        set data to json.loads(text)\n    catch:\n        raise \"agent.chat: the model response was not valid JSON\"\n    create content as String\n    set content to \"\"\n    try:\n        set content to data[\"choices\"][0][\"message\"][\"content\"]\n    catch:\n        raise \"agent.chat: unexpected response shape (missing choices[0].message.content)\"\n    return content\n\n\ndefine function react that takes goal as String, tools as Dict, max_steps as Integer = 8, model as String = \"gpt-4o-mini\", api_key as String = \"\", base_url as String = \"\" and returns Object:\n    create names as Object\n    set names to []\n    for each name in tools.keys():\n        names.append(name)\n    create system as String\n    set system to \"You are a reasoning agent. Your available tools: \" + str(names) + \". Reply with ONLY one JSON object per turn and no other text: either {{\\\"tool\\\": \\\"<name>\\\", \\\"args\\\": {{...}}}} to call a tool, or {{\\\"answer\\\": \\\"...\\\"}} when you have the final answer.\"\n    create messages as Object\n    set messages to [{\"role\": \"system\", \"content\": system}, {\"role\": \"user\", \"content\": goal}]\n    create steps as Object\n    set steps to []\n    create answer as String\n    set answer to \"\"\n    create done as Boolean\n    set done to false\n    create step_n as Integer\n    set step_n to 0\n    create reply as String\n    set reply to \"\"\n    create parsed as Object\n    set parsed to {}\n    create ok as Boolean\n    set ok to true\n    create has_answer as Boolean\n    set has_answer to false\n    create ans as Object\n    set ans to \"\"\n    create has_tool as Boolean\n    set has_tool to false\n    create tname as Object\n    set tname to \"\"\n    create known as Boolean\n    set known to false\n    create tool_fn as Object\n    set tool_fn to 0\n    create args as Object\n    set args to {}\n    create observation as Object\n    set observation to \"\"\n    while step_n < max_steps and not done:\n        set step_n to step_n + 1\n        set reply to chat(messages, model, api_key, base_url)\n        set parsed to {}\n        set ok to true\n        try:\n            set parsed to json.loads(_extract_json(reply))\n        catch:\n            set ok to false\n        if not ok:\n            messages.append({\"role\": \"user\", \"content\": \"That was not valid JSON. Reply with ONLY a JSON object: {{\\\"tool\\\": \\\"<name>\\\", \\\"args\\\": {{...}}}} or {{\\\"answer\\\": \\\"...\\\"}}.\"})\n        else:\n            set has_answer to false\n            set ans to \"\"\n            try:\n                set ans to parsed[\"answer\"]\n                set has_answer to true\n            catch:\n                set has_answer to false\n            if has_answer:\n                set answer to ans\n                set done to true\n            else:\n                set has_tool to false\n                set tname to \"\"\n                try:\n                    set tname to parsed[\"tool\"]\n                    set has_tool to true\n                catch:\n                    set has_tool to false\n                if not has_tool:\n                    messages.append({\"role\": \"user\", \"content\": \"Reply with ONLY a JSON object: {{\\\"tool\\\": \\\"<name>\\\", \\\"args\\\": {{...}}}} or {{\\\"answer\\\": \\\"...\\\"}}.\"})\n                else:\n                    set known to false\n                    set tool_fn to 0\n                    try:\n                        set tool_fn to tools[tname]\n                        set known to true\n                    catch:\n                        set known to false\n                    if not known:\n                        messages.append({\"role\": \"user\", \"content\": \"Unknown tool '\" + str(tname) + \"'. Available tools: \" + str(names) + \". Reply with ONLY a JSON object.\"})\n                    else:\n                        set args to {}\n                        try:\n                            set args to parsed[\"args\"]\n                        catch:\n                            set args to {}\n                        set observation to \"\"\n                        try:\n                            set observation to str(tool_fn(args))\n                        catch:\n                            set observation to \"the tool raised an error\"\n ileutils.agk": "# AGK-Real standard library: file utilities.\n# Import with: import fileutils\n# (Functions are inlined into your program; call them directly.)\n\nimport os\n\ndefine function read_text that takes path as String and returns String:\n    return open(path).read()\n\ndefine function write_text that takes path as String, text as String:\n    create f as Object\n    set f to open(path, \"w\")\n    f.write(text)\n    f.close()\n\ndefine function append_text that takes path as String, text as String:\n    create f as Object\n    set f to open(path, \"a\")\n    f.write(text)\n    f.close()\n\ndefine function file_exists that takes path as String and returns Boolean:\n    return os.path.exists(path)\n\ndefine function list_dir that takes path as String and returns List:\n    return os.listdir(path)\n", "agk/stdlib/graphics.agk": "# AGK-Real standard library: tiny software rasterizer.\n# Import with: import graphics\n# (Functions are inlined into your program; call them directly.)\n#\n# Draw pixels, lines, rectangles and circles on an in-memory canvas,\n# then save it as a real PNG file. Pure Python standard library\n# (struct + zlib + binascii) \u2014 no display, no windowing, no\n# third-party packages.\n#\n# A canvas is a Dict: {\"width\": w, \"height\": h, \"pixels\": [...]},\n# where \"pixels\" is a flat row-major list of [r, g, b] colors.\n# Colors are [r, g, b] lists (each channel 0-255; out-of-range values\n# are clamped) or \"#rrggbb\" strings. All drawing is clipped to the\n# canvas bounds: out-of-range coordinates are silently skipped.\n\nimport struct\nimport zlib\nimport binascii\n\n\ndefine function _to_rgb that takes color as Object and returns Object:\n    if type(color) == str:\n        create s as String\n        set s to color\n        if len(s) != 7:\n            raise \"graphics: color string must look like \\\"#rrggbb\\\"\"\n        if s[0] != \"#\":\n            raise \"graphics: color string must look like \\\"#rrggbb\\\"\"\n        create hr as Integer\n        set hr to int(s[1] + s[2], 16)\n        create hg as Integer\n        set hg to int(s[3] + s[4], 16)\n        create hb as Integer\n        set hb to int(s[5] + s[6], 16)\n        return [hr, hg, hb]\n    create r as Integer\n    set r to 0\n    create g as Integer\n    set g to 0\n    create b as Integer\n    set b to 0\n    try:\n        set r to color[0]\n        set g to color[1]\n        set b to color[2]\n    catch:\n        raise \"graphics: color must be an [r, g, b] list or a \\\"#rrggbb\\\" string\"\n    if r < 0:\n        set r to 0\n    if r > 255:\n        set r to 255\n    if g < 0:\n        set g to 0\n    if g > 255:\n        set g to 255\n    if b < 0:\n        set b to 0\n    if b > 255:\n        set b to 255\n    return [r, g, b]\n\n\ndefine function new that takes width as Integer, height as Integer, bg as Object and returns Object:\n    if width < 1 or height < 1:\n        raise \"graphics.new: width and height must be at least 1\"\n    create rgb as Object\n    set rgb to _to_rgb(bg)\n    create pixels as Object\n    set pixels to []\n    create n as Integer\n    set n to width * height\n    create i as Integer\n    set i to 0\n    while i < n:\n        pixels.append([rgb[0], rgb[1], rgb[2]])\n        set i to i + 1\n    return {\"width\": width, \"height\": height, \"pixels\": pixels}\n\n\ndefine function get_pixel that takes canvas as Object, x as Integer, y as Integer and returns Object:\n    create w as Integer\n    set w to canvas[\"width\"]\n    create h as Integer\n    set h to canvas[\"height\"]\n    if x < 0 or y < 0 or x >= w or y >= h:\n        raise \"graphics.get_pixel: coordinates out of bounds\"\n    create px as Object\n    set px to canvas[\"pixels\"][y * w + x]\n    return [px[0], px[1], px[2]]\n\n\ndefine function pixel that takes canvas as Object, x as Integer, y as Integer, color as Object and returns Object:\n    create w as Integer\n    set w to canvas[\"width\"]\n    create h as Integer\n    set h to canvas[\"height\"]\n    if x < 0 or y < 0 or x >= w or y >= h:\n        return canvas\n    create px as Object\n    set px to canvas[\"pixels\"]\n    px.__setitem__(y * w + x, _to_rgb(color))\n    return canvas\n\n\ndefine function line that takes canvas as Object, x1 as Integer, y1 as Integer, x2 as Integer, y2 as Integer, color as Object and returns Object:\n    create dx as Integer\n    set dx to abs(x2 - x1)\n    create dy as Integer\n    set dy to 0 - abs(y2 - y1)\n    create sx as Integer\n    set sx to 1\n    if x1 > x2:\n        set sx to -1\n    create sy as Integer\n    set sy to 1\n    if y1 > y2:\n        set sy to -1\n    create err as Integer\n    set err to dx + dy\n    create cx as Integer\n    set cx to x1\n    create cy as Integer\n    set cy to y1\n    create e2 as Integer\n    set e2 to 0\n    create done as Boolean\n    set done to false\n    while not done:\n        pixel(canvas, cx, cy, color)\n        if cx == x2 and cy == y2:\n            set done to true\n        else:\n            set e2 to 2 * err\n            if e2 >= dy:\n                set err to err + dy\n                set cx to cx + sx\n            if e2 <= dx:\n                set err to err + dx\n                set cy to cy + sy\n    return canvas\n\n\ndefine function _hline that takes canvas as Object, x1 as Integer, x2 as Integer, y as Integer, color as Object and returns Object:\n    create xa as Integer\n    set xa to x1\n    create xb as Integer\n    set xb to x2\n    if xa > xb:\n        set xa to x2\n        set xb to x1\n    for xx from xa to xb:\n        pixel(canvas, xx, y, color)\n    return canvas\n\n\ndefine function rect that takes canvas as Object, x as Integer, y as Integer, w as Integer, h as Integer, color as Object, fill as Boolean = true and returns Object:\n    if fill:\n        for yy1 from y to y + h - 1:\n            for xx1 from x to x + w - 1:\n                pixel(canvas, xx1, yy1, color)\n    else:\n        for xx2 from x to x + w - 1:\n            pixel(canvas, xx2, y, color)\n            pixel(canvas, xx2, y + h - 1, color)\n        for yy2 from y to y + h - 1:\n            pixel(canvas, x, yy2, color)\n            pixel(canvas, x + w - 1, yy2, color)\n    return canvas\n\n\ndefine function circle that takes canvas as Object, cx as Integer, cy as Integer, r as Integer, color as Object, fill as Boolean = true and returns Object:\n    if r < 0:\n        raise \"graphics.circle: radius must be >= 0\"\n    create x as Integer\n    set x to r\n    create y as Integer\n    set y to 0\n    create err as Integer\n    set err to 0\n    while x >= y:\n        if fill:\n            _hline(canvas, cx - x, cx + x, cy + y, color)\n            _hline(canvas, cx - x, cx + x, cy - y, color)\n            _hline(canvas, cx - y, cx + y, cy + x, color)\n            _hline(canvas, cx - y, cx + y, cy - x, color)\n        else:\n            pixel(canvas, cx + x, cy + y, color)\n            pixel(canvas, cx - x, cy + y, color)\n            pixel(canvas, cx + x, cy - y, color)\n            pixel(canvas, cx - x, cy - y, color)\n            pixel(canvas, cx + y, cy + x, color)\n            pixel(canvas, cx - y, cy + x, color)\n            pixel(canvas, cx + y, cy - x, color)\n            pixel(canvas, cx - y, cy - x, color)\n        set y to y + 1\n        if err <= 0:\n            set err to err + 2 * y + 1\n        else:\n            set x to x - 1\n            set err to err - 2 * x + 1\n    return canvas\n\n\ndefine function _png_chunk that takes ctype as String, data as Object and returns Object:\n    create sep as Object\n    set sep to \"\".encode()\n    create parts as Object\n    set parts to []\n    parts.append(struct.pack(\">I\", len(data)))\n    create t as Object\n    set t to ctype.encode(\"ascii\")\n    parts.append(t)\n    parts.append(data)\n    create crc as Integer\n    set crc to binascii.crc32(t + data)\n    parts.append(struct.pack(\">I\", crc))\n    return sep.join(parts)\n\n\ndefine function save_png that takes canvas as Object, path as String and returns String:\n    create width as Integer\n    set width to canvas[\"width\"]\n    create height as Integer\n    set height to canvas[\"height\"]\n    create pixels as Object\n    set pixels to canvas[\"pixels\"]\n    create sep as Object\n    set sep to \"\".encode()\n    create raw_parts as Object\n    set raw_parts to []\n    create row_parts as Object\n    set row_parts to []\n    create px as Object\n    set px to []\n    for y from 0 to height - 1:\n        set row_parts to []\n        row_parts.append(struct.pack(\"B\", 0))\n        for x from 0 to width - 1:\n            set px to pixels[y * width + x]\n            row_parts.append(struct.pack(\"3B\", px[0], px[1], px[2]))\n        raw_parts.append(sep.join(row_parts))\n    create raw as Object\n    set raw to sep.join(raw_parts)\n    create ihdr as Object\n    set ihdr to struct.pack(\">IIBBBBB\", width, height, 8, 2, 0, 0, 0)\n    create png_parts as Object\n    set png_parts to []\n    png_parts.append(struct.pack(\"8B\", 137, 80, 78, 71, 13, 10, 26, 10))\n    png_parts.append(_png_chunk(\"IHDR\", ihdr))\n    png_parts.append(_png_chunk(\"IDAT\", zlib.compress(raw)))\n    png_parts.append(_png_chunk(\"IEND\", \"\".encode()))\n    create png as Object\n    set png to sep.join(png_parts)\n    create f as Object\n    set f to open(path, \"wb\")\n    f.write(png)\n    f.close()\n    return path\n", "agk/stdlib/httputils.agk": "# AGK-Real standard library: HTTP utilities.\n# Import with: import httputils\n# (Functions are inlined into your program; call them directly.)\n\nimport urllib.request\n\ndefine function http_get that takes url as String and returns String:\n    create resp as Object\n    set resp to urllib.request.urlopen(url)\n    create data as String\n    set data to resp.read().decode(\"utf-8\")\n    resp.close()\n    return data\n", "agk/stdlib/jsonutils.agk": "# AGK-Real standard library: JSON utilities.\n# Import with: import jsonutils\n# (Functions are inlined into your program; call them directly.)\n\nimport json\n\ndefine function parse_json that takes s as String and returns Object:\n    return json.loads(s)\n\ndefine function to_json that takes value as Object and returns String:\n    return json.dumps(value)\n", "agk/stdlib/listutils.agk": "# AGK-Real standard library: list utilities.\n# Import with: import listutils\n# (Functions are inlined into your program; call them directly.)\n\ndefine function sum_list that takes xs as List and returns Integer:\n    create total as Integer\n    set total to 0\n    for each x in xs:\n        set total to total + x\n    return total\n\ndefine function max_in_list that takes xs as List and returns Integer:\n    create best as Integer\n    set best to xs[0]\n    for each x in xs:\n        if x > best:\n            set best to x\n    return best\n\ndefine function min_in_list that takes xs as List and returns Integer:\n    create best as Integer\n    set best to xs[0]\n    for each x in xs:\n        if x < best:\n            set best to x\n    return best\n\ndefine function contains_int that takes xs as List, item as Integer and returns Boolean:\n    for each x in xs:\n        if x == item:\n            return true\n    return false\n", "agk/stdlib/regexutils.agk": "# AGK-Real standard library: regular-expression utilities.\n# Import with: import regexutils\n# (Functions are inlined into your program; call them directly.)\n\nimport re\n\ndefine function regex_match that takes pattern as String, text as String and returns Boolean:\n    if re.search(pattern, text):\n        return true\n    return false\n\ndefine function regex_find_all that takes pattern as String, text as String and returns List:\n    return re.findall(pattern, text)\n\ndefine function regex_replace that takes pattern as String, replacement as String, text as String and returns String:\n    return re.sub(pattern, replacement, text)\n\ndefine function regex_split that takes pattern as String, text as String and returns List:\n    return re.split(pattern, text)\n", "agk/stdlib/sqliteutils.agk": "# AGK-Real standard library: SQLite helpers.\n# Import with: import sqliteutils\n# (Functions are inlined into your program; call them directly.)\n#\n# These helpers are deliberately stateless: every call opens the database,\n# runs its statement, commits (for writes), and closes the connection.\n\nimport sqlite3\n\ndefine function db_execute that takes db_path as String, sql as String and returns String:\n    create con as Object\n    set con to sqlite3.connect(db_path)\n    con.execute(sql)\n    con.commit()\n    con.close()\n    return \"ok\"\n\ndefine function db_query that takes db_path as String, sql as String and returns List:\n    create con as Object\n    set con to sqlite3.connect(db_path)\n    create cur as Object\n    set cur to con.execute(sql)\n    create out as List\n    set out to []\n    for each r in cur:\n        out.append(list(r))\n    con.close()\n    return out\n", "agk/stdlib/strutils.agk": "# AGK-Real standard library: string utilities.\n# Import with: import strutils\n# (Functions are inlined into your program; call them directly.)\n\ndefine function shout that takes s as String and returns String:\n    return s.upper() + \"!\"\n\ndefine function repeat_string that takes s as String, n as Integer and returns String:\n    create out as String\n    set out to \"\"\n    create i as Integer\n    set i to 0\n    while i < n:\n        set out to out + s\n        set i to i + 1\n    return out\n\ndefine function join_lines that takes lines as List and returns String:\n    create out as String\n    set out to \"\"\n    for each line in lines:\n        set out to out + line + \"\\n\"\n    return out\n\ndefine function slug that takes s as String and returns String:\n    return s.lower().replace(\" \", \"-\")\n"};

const SAMPLES = {"hello": "define function main:\n    print(\"hello, agk\")\n", "simple_showcase": "to describe with n:\n    if n is 1:\n        say \"one thing\"\n    otherwise if n is greater than 1:\n        say \"{n} things\"\n    otherwise:\n        say \"nothing\"\n\ndefine function main:\n    total is 0\n    repeat 5 times:\n        increase total by 2\n    say \"total: {total}\"\n    decrease total\n    if total is less than or equal to 10:\n        say \"within budget\"\n    if total is not 0:\n        say \"nonzero\"\n    if total is greater than or equal to 9:\n        say \"at least nine\"\n    describe(total)\n", "account": "define class Account:\n    variable balance as Float\n    define constructor that takes initial as Float:\n        set balance to initial\n    define function deposit that takes amount as Float:\n        set balance to balance + amount\n    define function withdraw that takes amount as Float:\n        if amount <= balance:\n            set balance to balance - amount\n        else:\n            print(\"insufficient funds\")\n    define function get_balance that returns Float:\n        return balance\n\ndefine function main:\n    create a as Object\n    set a to Account(100.0)\n    a.deposit(50.0)\n    a.withdraw(30.0)\n    print(a.get_balance())\n    a.withdraw(500.0)\n", "async_demo": "import asyncio\n\ndefine async function fetch_title that takes url as String:\n    await asyncio.sleep(0.01)\n    return \"title of \" + url\n\ndefine async function main:\n    create pages as List\n    set pages to [\"a\", \"b\", \"c\"]\n    for each p in pages:\n        create t as String\n        set t to await fetch_title(p)\n        print(t)\n", "branches": "define function grade that takes score as Integer and returns String:\n    if score >= 90:\n        return \"A\"\n    elif score >= 80:\n        return \"B\"\n    elif score >= 70:\n        return \"C\"\n    else:\n        return \"F\"\n\ndefine function main:\n    print(grade(95))\n    print(grade(82))\n    print(grade(71))\n    print(grade(40))\n", "constants": "define constant PI as Float = 3.14159\ndefine constant GREETING as String = \"hi\"\n\ndefine function main:\n    print(PI * 2)\n    print(GREETING)\n", "crypto_demo": "import crypto\n\ndefine function main:\n    print(sha256(\"abc\"))\n    print(md5(\"abc\"))\n    print(hmac_sha256(\"key\", \"The quick brown fox jumps over the lazy dog\"))\n    print(base64_encode(\"hello, agk\"))\n    print(base64_decode(\"aGVsbG8sIGFnaw==\"))\n    print(compare_digest(\"same\", \"same\"))\n    print(compare_digest(\"same\", \"different\"))\n", "decorators": "define class Doubler:\n    variable fn as Object\n    define constructor that takes f as Object:\n        set fn to f\n    define function __call__:\n        return self.fn() * 2\n\n@Doubler\ndefine function five:\n    return 5\n\ndefine function main:\n    print(five())\n", "dicts": "define function main:\n    create scores as Object\n    set scores to {\"amy\": 95, \"bob\": 82}\n    print(scores[\"amy\"])\n    create keys as List\n    set keys to [\"a\", \"b\"]\n    print(keys[1])\n", "factorial": "define function fact that takes n as Integer and returns Integer:\n    create r as Integer\n    set r to 1\n    while n > 1:\n        set r to r * n\n        set n to n - 1\n    return r\n\ndefine function main:\n    print(fact(5))\n    print(fact(0))\n", "fib": "define function fib that takes n as Integer and returns Integer:\n    if n <= 1:\n        return n\n    else:\n        return fib(n - 1) + fib(n - 2)\n\ndefine function main:\n    create i as Integer\n    set i to 0\n    while i < 8:\n        print(fib(i))\n        set i to i + 1\n", "generators": "define function fibonacci:\n    create a as Integer\n    create b as Integer\n    set a to 0\n    set b to 1\n    while true:\n        yield a\n        create next as Integer\n        set next to a + b\n        set a to b\n        set b to next\n\ndefine function main:\n    create count as Integer\n    set count to 0\n    for each n in fibonacci():\n        print(n)\n        set count to count + 1\n        if count >= 8:\n            return\n", "graphics_demo": "import graphics\n\ndefine function main:\n    create c as Object\n    set c to new(16, 12, \"#1a1a2e\")\n    line(c, 0, 0, 15, 11, \"#e94560\")\n    rect(c, 2, 2, 5, 4, [0, 255, 0], false)\n    circle(c, 12, 8, 3, \"#0f3460\", true)\n    print(get_pixel(c, 0, 0))\n    print(get_pixel(c, 2, 2))\n    print(get_pixel(c, 4, 3))\n    print(get_pixel(c, 12, 8))\n    print(get_pixel(c, 15, 11))\n", "import_math": "import math\n\ndefine function main:\n    print(math.floor(3.7))\n    print(math.pi > 3)\n", "inheritance": "define class Animal:\n    variable name as String\n    define constructor that takes n as String:\n        set name to n\n    define function speak that returns String:\n        return \"...\"\n\ndefine class Dog extends Animal:\n    define constructor that takes n as String:\n        set name to n\n    define function speak that returns String:\n        return \"woof\"\n\ndefine function main:\n    create d as Object\n    set d to Dog(\"rex\")\n    print(d.speak())\n    print(d.name)\n", "logic": "define function main:\n    create a as Boolean\n    create b as Boolean\n    set a to true\n    set b to false\n    if a or b:\n        print(\"or\")\n    if a and b:\n        print(\"and\")\n    else:\n        print(\"not-and\")\n", "loops": "define function main:\n    create total as Integer\n    set total to 0\n    create xs as List\n    set xs to [1, 2, 3, 4, 5]\n    for each x in xs:\n        set total to total + x\n    print(total)\n    create i as Integer\n    set i to 3\n    while i > 0:\n        print(i)\n        set i to i - 1\n    print(\"done\")\n", "nested": "define function double that takes x as Integer and returns Integer:\n    return x * 2\n\ndefine function quad that takes x as Integer and returns Integer:\n    return double(double(x))\n\ndefine function main:\n    print(quad(3))\n    print(double(1 + 2))\n", "no_main": "define function add that takes a as Integer, b as Integer and returns Integer:\n    return a + b\n", "precedence": "define function main:\n    print(1 + 2 * 3)\n    print((1 + 2) * 3)\n    print(10 - 2 - 3)\n    print(10 - (2 - 3))\n", "strings": "define function main:\n    create name as String\n    set name to \"agk\"\n    print(\"hello, \" + name)\n    create flag as Boolean\n    set flag to true\n    if flag and not false:\n        print(\"logic works\")\n"};

const srcEl = document.getElementById("src");
const outEl = document.getElementById("out");
const statusEl = document.getElementById("status");
const runBtn = document.getElementById("run");
const compileBtn = document.getElementById("compile");
const samplesEl = document.getElementById("samples");
const viewEl = document.getElementById("view");

for (const k of Object.keys(SAMPLES)) {
  const o = document.createElement("option");
  o.value = k; o.textContent = k + ".agk";
  samplesEl.appendChild(o);
}
samplesEl.onchange = () => { srcEl.value = SAMPLES[samplesEl.value]; };
srcEl.value = SAMPLES.hello;

let pyodide = null;
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function show(html) { outEl.innerHTML = html; }

async function loadPyodideLib() {
  // Primary CDN is attempted via the <script> tag in <head>. If it did
  // not define loadPyodide (blocked/slow network), try a fallback CDN
  // before giving up with a clear message.
  if (typeof loadPyodide !== "undefined") return;
  const fallbacks = [
    "https://unpkg.com/pyodide@0.26.4/full/pyodide.js",
    "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"
  ];
  for (const url of fallbacks) {
    try {
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = url;
        s.onload = resolve;
        s.onerror = () => reject(new Error("script error"));
        document.head.appendChild(s);
      });
    } catch (e) { /* try next */ }
    if (typeof loadPyodide !== "undefined") return;
  }
  throw new Error("could not download Pyodide from a CDN — check your internet connection and reload");
}

async function init() {
  try {
    await loadPyodideLib();
    pyodide = await loadPyodide();
    for (const [path, content] of Object.entries(SOURCES)) {
      const dir = path.split("/").slice(0, -1).join("/");
      try { pyodide.FS.mkdir("/" + dir); } catch (e) { /* exists */ }
      pyodide.FS.writeFile("/" + path, content);
    }
    pyodide.runPython(`
import sys
sys.path.insert(0, "/")
import io, traceback
from contextlib import redirect_stdout
import agk.pipeline

def agk_compile(src):
    try:
        code, warnings = agk.pipeline.compile_source(src, filename="playground.agk")
        return {"ok": True, "code": code, "warnings": warnings}
    except Exception as e:
        return {"ok": False, "error": str(e)}

def agk_run(src):
    try:
        code, warnings = agk.pipeline.compile_source(src, filename="playground.agk")
    except Exception as e:
        return {"ok": False, "error": str(e)}
    ns = {"__name__": "__main__"}
    buf = io.StringIO()
    try:
        with redirect_stdout(buf):
            exec(compile(code, "playground.agk", "exec"), ns)
    except Exception as e:
        tb = "".join(traceback.format_exception(type(e), e, e.__traceback__))
        return {"ok": False, "error": tb, "output": buf.getvalue()}
    return {"ok": True, "output": buf.getvalue(), "warnings": warnings}
`);
    statusEl.textContent = "ready";
    statusEl.className = "ready";
    runBtn.disabled = false;
    compileBtn.disabled = false;
  } catch (e) {
    statusEl.textContent = "failed to load: " + e;
  }
}

function doCompile() {
  const r = pyodide.globals.get("agk_compile")(srcEl.value).toJs({dict_converter: Object.fromEntries});
  if (r.ok) {
    viewEl.value = "python";
    document.getElementById("outlabel").textContent = "generated python";
    let html = "";
    for (const w of r.warnings || []) html += `<span class="warn">${esc(w)}</span>\n`;
    show(html + esc(r.code));
  } else {
    viewEl.value = "output";
    document.getElementById("outlabel").textContent = "output";
    show(`<span class="err">${esc(r.error)}</span>`);
  }
}

function doRun() {
  const r = pyodide.globals.get("agk_run")(srcEl.value).toJs({dict_converter: Object.fromEntries});
  viewEl.value = "output";
  document.getElementById("outlabel").textContent = "output";
  let html = "";
  const out = r.output || "";
  if (out) html += esc(out);
  if (r.ok) {
    for (const w of r.warnings || []) html += `<span class="warn">${esc(w)}</span>\n`;
    if (!html) html = '<span class="ok">(no output)</span>';
  } else {
    html += `<span class="err">${esc(r.error)}</span>`;
  }
  show(html);
}

runBtn.onclick = doRun;
compileBtn.onclick = doCompile;
viewEl.onchange = () => {
  document.getElementById("outlabel").textContent =
    viewEl.value === "python" ? "generated python" : "output";
  if (viewEl.value === "python") doCompile();
};
init();
</script>
