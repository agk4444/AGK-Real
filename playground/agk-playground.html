arse_expression()\n        self.expect(T.COLON, \"expected ':' after 'for each' header\")\n        return A.ForEachStmt(var.value, iterable, self.parse_block(),\n                             line=kw.line, col=kw.column)\n\n    def parse_try(self):\n        \"\"\"v2: try/catch/finally.\"\"\"\n        kw = self.expect(T.TRY, \"expected 'try'\")\n        self.expect(T.COLON, \"expected ':' after 'try'\")\n        body = self.parse_block()\n        catch_name, catch_body, finally_body = None, None, None\n        if self.match(T.CATCH):\n            if self.check(T.IDENTIFIER):\n                catch_name = self.advance().value\n            self.expect(T.COLON, \"expected ':' after 'catch'\")\n            catch_body = self.parse_block()\n        if self.match(T.FINALLY):\n            self.expect(T.COLON, \"expected ':' after 'finally'\")\n            finally_body = self.parse_block()\n        if catch_body is None and finally_body is None:\n            self.error(\"expected 'catch' or 'finally' after 'try' block\", kw)\n        return A.TryStmt(body, catch_name, catch_body, finally_body,\n                         line=kw.line, col=kw.column)\n\n    def parse_raise(self):\n        \"\"\"v2: `raise <expr>` or bare `raise` (re-raise inside catch).\"\"\"\n        kw = self.expect(T.RAISE, \"expected 'raise'\")\n        if self.check(T.NEWLINE):\n            self.advance()\n            return A.RaiseStmt(None, line=kw.line, col=kw.column)\n        value = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.RaiseStmt(value, line=kw.line, col=kw.column)\n\n    def parse_return(self):\n        kw = self.expect(T.RETURN, \"expected 'return'\")\n        if self.check(T.NEWLINE):\n            self.advance()\n            return A.ReturnStmt(None, line=kw.line, col=kw.column)\n        value = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.ReturnStmt(value, line=kw.line, col=kw.column)\n\n    def parse_yield(self):\n        \"\"\"v0.4.0: `yield <expr>` or bare `yield`.\"\"\"\n        kw = self.expect(T.YIELD, \"expected 'yield'\")\n        if self.check(T.NEWLINE):\n            self.advance()\n            return A.YieldStmt(None, line=kw.line, col=kw.column)\n        value = self.parse_expression()\n        self.expect(T.NEWLINE, \"expected end of line\")\n        return A.YieldStmt(value, line=kw.line, col=kw.column)\n\n    # -- expressions (precedence climbing, per SPEC section 5) ------------\n\n    def parse_expression(self):\n        return self.parse_or()\n\n    def parse_or(self):\n        left = self.parse_and()\n        while True:\n            op = self.match(T.OR)\n            if not op:\n                return left\n            left = A.BinOp(left, \"or\", self.parse_and(),\n                           line=op.line, col=op.column)\n\n    def parse_and(self):\n        left = self.parse_equality()\n        while True:\n            op = self.match(T.AND)\n            if not op:\n                return left\n            left = A.BinOp(left, \"and\", self.parse_equality(),\n                           line=op.line, col=op.column)\n\n    def parse_equality(self):\n        left = self.parse_comparison()\n        while True:\n            # v0.6.0 (Simple AGK): `a is b` -> `a == b`, `a is not b` -> `a != b`\n            if self.check(T.IDENTIFIER) and self.peek().value == \"is\":\n                is_tok = self.advance()\n                sym = \"!=\"\n                if not self.match(T.NOT):\n                    sym = \"==\"\n                left = A.BinOp(left, sym, self.parse_comparison(),\n                               line=is_tok.line, col=is_tok.column)\n                continue\n            op = self.match(T.EQ, T.NEQ)\n            if not op:\n                return left\n            sym = \"==\" if op.type == T.EQ else \"!=\"\n            left = A.BinOp(left, sym, self.parse_comparison(),\n                           line=op.line, col=op.column)\n\n    def _match_english_comparison(self):\n        \"\"\"Match `is greater|less than [or equal to]` at the current\n        position (v0.6.0 Simple AGK). Returns (symbol, `is` token) and\n        consumes the words, or None without consuming anything.\n\n        The words stay plain NAME tokens (`or`/`to` lex as keywords and\n        are matched by type); nothing here becomes reserved.\"\"\"\n        t = self.tokens\n        p = self.pos\n\n        def at(i, type_, value):\n            return (p + i < len(t) and t[p + i].type == type_\n                    and t[p + i].value == value)\n\n        if not at(0, T.IDENTIFIER, \"is\"):\n            return None\n        if at(1, T.IDENTIFIER, \"greater\"):\n            sym = \">\"\n        elif at(1, T.IDENTIFIER, \"less\"):\n            sym = \"<\"\n        else:\n            return None\n        if not at(2, T.IDENTIFIER, \"than\"):\n            return None\n        end = 3\n        if (at(3, T.OR, \"or\") and at(4, T.IDENTIFIER, \"equal\")\n                and at(5, T.TO, \"to\")):\n            sym += \"=\"\n            end = 6\n        is_tok = t[p]\n        self.pos = p + end\n        return sym, is_tok\n\n    def parse_comparison(self):\n        left = self.parse_term()\n        while True:\n            eng = self._match_english_comparison()\n            if eng is not None:\n                sym, is_tok = eng\n                left = A.BinOp(left, sym, self.parse_term(),\n                               line=is_tok.line, col=is_tok.column)\n                continue\n            op = self.match(T.LT, T.GT, T.LTE, T.GTE)\n            if not op:\n                return left\n            sym = {\"<\": \"<\", \">\": \">\", \"<=\": \"<=\", \">=\": \">=\"}[op.value]\n            left = A.BinOp(left, sym, self.parse_term(),\n                           line=op.line, col=op.column)\n\n    def parse_term(self):\n        left = self.parse_factor()\n        while True:\n            op = self.match(T.PLUS, T.MINUS)\n            if not op:\n                return left\n            left = A.BinOp(left, op.value, self.parse_factor(),\n                           line=op.line, col=op.column)\n\n    def parse_factor(self):\n        left = self.parse_unary()\n        while True:\n            op = self.match(T.STAR, T.SLASH, T.PERCENT)\n            if not op:\n                return left\n            left = A.BinOp(left, op.value, self.parse_unary(),\n                           line=op.line, col=op.column)\n\n    def parse_unary(self):\n        op = self.match(T.MINUS, T.NOT)\n        if op:\n            sym = \"-\" if op.type == T.MINUS else \"not\"\n            operand = self.parse_unary()\n            return A.UnaryOp(sym, operand, line=op.line, col=op.column)\n        aw = self.match(T.AWAIT)\n        if aw:\n            # v0.4.0: `await <unary>`; binds like Python, so\n            # `await f() + 1` is `(await f()) + 1`.\n            return A.AwaitExpr(self.parse_unary(),\n                              line=aw.line, col=aw.column)\n        return self.parse_postfix()\n\n    def parse_postfix(self):\n        node = self.parse_primary()\n        while True:\n            if self.match(T.DOT):\n                attr = self.expect(T.IDENTIFIER, \"expected attribute name\")\n                node = A.Attribute(node, attr.value,\n                                   line=node.line, col=node.col)\n            elif self.match(T.LBRACKET):\n                lb = self.tokens[self.pos - 1]\n                index = self.parse_expression()\n                self.expect(T.RBRACKET, \"expected ']'\")\n                node = A.Index(node, index, line=lb.line, col=lb.column)\n            elif self.match(T.LPAREN):\n                args = []\n                if not self.check(T.RPAREN):\n                    args.append(self.parse_expression())\n                    while self.match(T.COMMA):\n                        args.append(self.parse_expression())\n                self.expect(T.RPAREN, \"expected ')'\")\n                node = A.Call(node, args, line=node.line, col=node.col)\n            else:\n                return node\n\n    def parse_primary(self):\n        tok = self.peek()\n        if tok.type == T.INT:\n            self.advance()\n            return A.IntLit(int(tok.value), line=tok.line, col=tok.column)\n        if tok.type == T.FLOAT:\n            self.advance()\n            return A.FloatLit(float(tok.value), line=tok.line, col=tok.column)\n        if tok.type == T.STRING:\n            return self._parse_string(self.advance())\n        if tok.type == T.TRUE:\n            self.advance()\n            return A.BoolLit(True, line=tok.line, col=tok.column)\n        if tok.type == T.FALSE:\n            self.advance()\n            return A.BoolLit(False, line=tok.line, col=tok.column)\n        if tok.type == T.IDENTIFIER or tok.type == T.SELF:\n            self.advance()\n            return A.Name(tok.value, line=tok.line, col=tok.column)\n        if tok.type == T.LPAREN:\n            self.advance()\n            expr = self.parse_expression()\n            self.expect(T.RPAREN, \"expected ')'\")\n            return expr\n        if tok.type == T.LBRACKET:\n            return self.parse_list_literal()\n        if tok.type == T.LBRACE:\n            return self.parse_dict_literal()\n        self.error(f\"expected expression, found {tok.value!r}\")\n\n    def _parse_string(self, tok):\n        \"\"\"v2: parse a string literal, desugaring `{expr}` interpolation.\n\n        `\"Hello, {name}!\"` becomes `\"Hello, {}!\".format(name)`.\n        `{{` and `}}` produce literal braces; a lone `}` is an error.\n        Strings without interpolation are plain StringLit nodes (with\n        `{{`/`}}` unescaped), so v1 output is unchanged.\n        \"\"\"\n        value = tok.value\n        template, literal, exprs = [], [], []\n        i, n = 0, len(value)\n        while i < n:\n            ch = value[i]\n            if ch == \"{\":\n                if i + 1 < n and value[i + 1] == \"{\":\n                    literal.append(\"{\")\n                    template.append(\"{{\")\n                    i += 2\n                    continue\n                brace = i\n                inner, i = self._scan_braced(value, i, tok)\n                exprs.append(self._parse_braced_expr(inner, tok, brace))\n                template.append(\"{}\")\n            elif ch == \"}\":\n                if i + 1 < n and value[i + 1] == \"}\":\n                    literal.append(\"}\")\n                    template.append(\"}}\")\n                    i += 2\n                    continue\n                self.error(\"single '}' in string literal \"\n                           \"(use '}}' for a literal brace)\", tok)\n            else:\n                literal.append(ch)\n                template.append(ch)\n                i += 1\n        if not exprs:\n            return A.StringLit(\"\".join(literal),\n                               line=tok.line, col=tok.column)\n        tmpl = A.StringLit(\"\".join(template), line=tok.line, col=tok.column)\n        func = A.Attribute(tmpl, \"format\", line=tok.line, col=tok.column)\n        return A.Call(func, exprs, line=tok.line, col=tok.column)\n\n    def _scan_braced(self, value, i, tok):\n        \"\"\"value[i] == '{': return (inner_text, index_past_'}').\n\n        Matches braces respecting nesting and double-quoted strings\n        inside the expression.\"\"\"\n        depth = 0\n        j, n = i, len(value)\n        in_str = False\n        while j < n:\n            ch = value[j]\n            if in_str:\n                if ch == \"\\\\\":\n                    j += 2\n                    continue\n                if ch == '\"':\n                    in_str = False\n                j += 1\n                continue\n            if ch == '\"':\n                in_str = True\n            elif ch == \"{\":\n                depth += 1\n            elif ch == \"}\":\n                depth -= 1\n                if depth == 0:\n                    return value[i + 1:j], j + 1\n            j += 1\n        self.error(\"unterminated '{...}' in string literal\", tok)\n\n    def _parse_braced_expr(self, inner, tok, brace):\n        \"\"\"Parse the expression inside `{...}` with corrected positions.\"\"\"\n        from .errors import LexerError, ParserError\n        from .lexer import Lexer\n        if not inner.strip():\n            self.error(\"empty '{...}' in string literal\", tok)\n        # column of the first inner char (tok.column is the opening quote,\n        # `brace` is the value index of the opening `{`)\n        base_col = tok.column + brace + 2\n        try:\n            tokens = Lexer(inner, self.filename).tokenize()\n        except LexerError as e:\n            raise ParserError(e.message, self.filename, tok.line,\n                              base_col + e.column) from None\n        for t in tokens:\n            t.line = tok.line\n            t.column = base_col + t.column\n        sub = Parser(tokens, self.filename)\n        node = sub.parse_expression()\n        rest = sub.peek()\n        if rest.type not in (T.NEWLINE, T.EOF):\n            raise ParserError(\n                f\"unexpected {rest.value!r} in '{{...}}' \"\n                f\"(use '{{{{' for a literal brace, e.g. JSON)\",\n                self.filename, rest.line, rest.column)\n        return node\n\n    def parse_list_literal(self):\n        lb = self.expect(T.LBRACKET, \"expected '['\")\n        elements = []\n        if not self.check(T.RBRACKET):\n            elements.append(self.parse_expression())\n            while self.match(T.COMMA):\n                elements.append(self.parse_expression())\n        self.expect(T.RBRACKET, \"expected ']'\")\n        return A.ListLit(elements, line=lb.line, col=lb.column)\n\n    def parse_dict_literal(self):\n        lb = self.expect(T.LBRACE, \"expected '{'\")\n        pairs = []\n        if not self.check(T.RBRACE):\n            pairs.append(self._parse_dict_pair())\n            while self.match(T.COMMA):\n                pairs.append(self._parse_dict_pair())\n        self.expect(T.RBRACE, \"expected '}'\")\n        return A.DictLit(pairs, line=lb.line, col=lb.column)\n\n    def _parse_dict_pair(self):\n        key = self.parse_expression()\n        self.expect(T.COLON, \"expected ':' in dict literal\")\n        value = self.parse_expression()\n        return (key, value)\n\n\ndef parse(source, filename=\"<input>\"):\n    \"\"\"Convenience: lex + parse source text.\"\"\"\n    from .lexer import Lexer\n    return Parser(Lexer(source, filename).tokenize(), filename).parse()\n\n\ndef parse_expression_src(source, filename=\"<input>\"):\n    \"\"\"Parse a single expression (for the REPL).\"\"\"\n    from .lexer import Lexer\n    from .tokens import TokenType as T\n    parser = Parser(Lexer(source, filename).tokenize(), filename)\n    node = parser.parse_expression()\n    tok = parser.peek()\n    if tok.type not in (T.NEWLINE, T.EOF):\n        raise ParserError(f\"unexpected {tok.type.name.lower()} after expression\",\n                          filename, tok.line, tok.column)\n    return node\n\n\ndef parse_statement_list(source, filename=\"<input>\"):\n    \"\"\"Parse block-level statements (for the REPL), e.g. ``set x to 5``.\n\n    The source is wrapped in a synthetic function so the normal block\n    statement parser can consume it; the function wrapper is discarded.\n    \"\"\"\n    if not source.strip():\n        return []\n    indented = \"\".join(\n        (\"    \" + line if line.strip() else \"\") + \"\\n\"\n        for line in source.splitlines()\n    )\n    prog = parse(\"define function __chunk__:\\n\" + indented, filename=filename)\n    return prog.statements[0].body\n", "agk/pipeline.py": "\"\"\"AGK-Real v2 pipeline: parse -> analyze -> generate -> (optionally) run.\n\nModule imports: ``import <name>`` first looks for ``<name>.agk`` next to\nthe importing file, in the given search paths, then in the bundled\nstdlib, then in installed packages (``packages/<dep>/`` from the\nnearest agk.json). A found module is compiled and inlined (its\nfunctions, classes and constants become directly callable); anything\nelse falls through to a plain Python ``import <name>``.\n\"\"\"\n\nimport hashlib\nimport io\nimport json\nimport os\nimport re\nimport shutil\nimport traceback\nfrom contextlib import redirect_stdout\nfrom pathlib import Path\n\nfrom . import ast_nodes as A\nfrom .parser import parse\nfrom .pkg import package_module_dirs\nfrom .semantic import analyze\nfrom .typecheck import typecheck\nfrom .codegen import CodeGenerator, program_uses_async, _asyncio_imported\nfrom .optimize import optimize_program\n\nSTDLIB_DIR = Path(__file__).parent / \"stdlib\"\nHEADER = \"# Generated by AGK-Real v2 - do not edit\"\n\n\ndef _find_module(name, base_dir, search_paths, pkg_dirs=()):\n    \"\"\"Locate <name>.agk. Returns a Path or None. Dotted names are\n    always Python imports, never .agk modules.\n\n    Precedence: the importing file's directory, then the caller search\n    paths, then the bundled stdlib, then installed packages\n    (packages/<dep>/ from the project's agk.json).\n    \"\"\"\n    if \".\" in name:\n        return None\n    dirs = []\n    if base_dir:\n        dirs.append(base_dir)\n    dirs.extend(search_paths)\n    dirs.append(STDLIB_DIR)\n    dirs.extend(pkg_dirs)\n    for d in dirs:\n        candidate = Path(d) / f\"{name}.agk\"\n        if candidate.is_file():\n            return candidate\n    return None\n\n\ndef _resolve_modules(program, filename, search_paths, _seen=None, pkg_dirs=()):\n    \"\"\"Compile-time include resolution. Returns [(name, Program, path)]\n    in dependency order. Cycles are tolerated (skipped on revisit).\"\"\"\n    seen = _seen if _seen is not None else set()\n    modules = []\n    base_dir = None\n    if filename not in (None, \"<string>\", \"<input>\", \"<repl>\"):\n        parent = os.path.dirname(os.path.abspath(filename))\n        if os.path.isdir(parent):\n            base_dir = parent\n    for stmt in program.statements:\n        if not isinstance(stmt, A.Import) or stmt.module in seen:\n            continue\n        seen.add(stmt.module)\n        path = _find_module(stmt.module, base_dir, search_paths, pkg_dirs)\n        if path is None:\n            continue  # plain Python import; emitted as-is\n        mod_prog = parse(path.read_text(), filename=str(path))\n        modules.extend(_resolve_modules(mod_prog, str(path), search_paths,\n                                        seen, pkg_dirs))\n        modules.append((stmt.module, mod_prog, str(path)))\n    return modules\n\n\ndef _generate_all(program, modules, resolved, filename, annotate):\n    cg = CodeGenerator()\n    cg.emit(HEADER)\n    # v0.4.0: async functions need the event loop available.\n    mod_progs = [mp for _, mp, _ in modules]\n    if ((program_uses_async(program)\n            or any(program_uses_async(mp) for mp in mod_progs))\n            and not _asyncio_imported([program] + mod_progs)):\n        cg.emit(\"import asyncio\")\n    for _name, mod_prog, mod_path in modules:\n        cg.generate_program(mod_prog, skip_imports=resolved,\n                            agk_file=mod_path if annotate else None)\n    cg.generate_program(program, skip_imports=resolved,\n                        agk_file=filename if annotate else None)\n    main_def = next((s for s in program.statements\n                     if isinstance(s, A.FunctionDef) and s.name == \"main\"),\n                    None)\n    if main_def is not None:\n        cg.emit(\"\")\n        cg.emit('if __name__ == \"__main__\":')\n        cg.indent += 1\n        if main_def.is_async:\n            cg.emit(\"asyncio.run(main())\", main_def)\n        else:\n            cg.emit(\"main()\", main_def)\n        cg.indent -= 1\n    return \"\\n\".join(cg.lines) + \"\\n\"\n\n\n_AGK_COMMENT = re.compile(r\"# AGK (.+):(\\d+)\\s*$\")\n\n\ndef agk_line_map(code):\n    \"\"\"{generated python lineno: (agk_file, agk_lineno)} from the\n    `# AGK file:line` comments (emitted when annotate=True). Public so\n    tools like the debugger can map generated code back to AGK source.\"\"\"\n    line_map = {}\n    for i, line in enumerate(code.splitlines(), start=1):\n        m = _AGK_COMMENT.search(line)\n        if m:\n            line_map[i] = (m.group(1), int(m.group(2)))\n    return line_map\n\n\ndef format_agk_traceback(exc_type, exc_value, tb, code):\n    \"\"\"Format an exception like a Python traceback, but with AGK\n    file:line for frames that came from AGK code.\n\n    Requires code compiled with annotate=True. Mapped frames show\n    `File \"<agk file>\", line <n>` plus that AGK source line; other\n    frames (Python stdlib, unannotated lines) use the normal rendering.\n    \"\"\"\n    line_map = agk_line_map(code)\n    file_cache = {}\n\n    def agk_source(path, lineno):\n        if path not in file_cache:\n            try:\n                with open(path, encoding=\"utf-8\") as f:\n                    file_cache[path] = f.read().splitlines()\n            except OSError:\n                file_cache[path] = []\n        lines = file_cache[path]\n        if 1 <= lineno <= len(lines):\n            return lines[lineno - 1].strip()\n        return \"\"\n\n    out = [\"Traceback (most recent call last):\"]\n    while tb is not None:\n        code_obj = tb.tb_frame.f_code\n        # The exec() call in `agk run` itself is noise: skip it so the\n        # user only sees their own code (and any library frames).\n        if not (code_obj.co_name == \"cmd_run\"\n                and code_obj.co_filename.endswith(\"/agk/__main__.py\")):\n            lineno = tb.tb_lineno\n            name = code_obj.co_name\n            if lineno in line_map:\n                agk_file, agk_lineno = line_map[lineno]\n                out.append(f'  File \"{agk_file}\", line {agk_lineno}, in {name}')\n                src = agk_source(agk_file, agk_lineno)\n                if src:\n                    out.append(f\"    {src}\")\n            else:\n                for item in traceback.format_list(\n                        traceback.extract_tb(tb, limit=1)):\n                    out.append(item.rstrip(\"\\n\"))\n        tb = tb.tb_next\n    out.append(\"\".join(\n        traceback.format_exception_only(exc_type, exc_value)).rstrip(\"\\n\"))\n    return \"\\n\".join(out) + \"\\n\"\n\n\ndef compile_program(program, filename=\"<string>\", search_paths=(),\n                    extra_top_levels=(), annotate=False, optimize=True):\n    \"\"\"Compile an already-parsed program. Returns (code, warnings, modules).\n\n    annotate=True appends `# AGK file:line` comments to generated lines\n    so runtime tracebacks can be mapped back to AGK source lines.\n    optimize=True (default) runs the AST optimization pass\n    (agk.optimize) after semantic analysis, before codegen.\n    \"\"\"\n    if search_paths is None:\n        search_paths = [os.getcwd()]\n    if filename not in (None, \"<string>\", \"<input>\", \"<repl>\"):\n        entry_dir = os.path.dirname(os.path.abspath(filename))\n    else:\n        entry_dir = os.getcwd()\n    pkg_dirs = package_module_dirs(entry_dir)\n    modules = _resolve_modules(program, filename, list(search_paths),\n                               pkg_dirs=pkg_dirs)\n    warnings = []\n    seen_progs = []\n    for _name, mod_prog, mod_file in modules:\n        _, mod_warnings = analyze(mod_prog, filename=mod_file,\n                                  extra_top_levels=seen_progs)\n        typecheck(mod_prog, filename=mod_file, extra_top_levels=seen_progs)\n        if optimize:\n            optimize_program(mod_prog)\n        warnings.extend(mod_warnings)\n        seen_progs.append(mod_prog)\n    resolved = {name for name, _, _ in modules}\n    extra = list(extra_top_levels) + [mp for _, mp, _ in modules]\n    program, main_warnings = analyze(program, filename=filename,\n                                     extra_top_levels=extra)\n    typecheck(program, filename=filename, extra_top_levels=extra)\n    if optimize:\n        optimize_program(program)\n    warnings.extend(main_warnings)\n    return (_generate_all(program, modules, resolved, filename, annotate),\n            warnings, modules)\n\n\ndef compile_source(source, filename=\"<string>\", search_paths=(),\n                   extra_top_levels=(), annotate=False, optimize=True):\n    \"\"\"Compile AGK source to Python. Returns (python_code, warnings).\"\"\"\n    program = parse(source, filename=filename)\n    code, warnings, _ = compile_program(\n        program, filename=filename, search_paths=search_paths,\n        extra_top_levels=extra_top_levels, annotate=annotate,\n        optimize=optimize)\n    return code, warnings\n\n\ndef run_source(source, filename=\"<string>\", search_paths=(), optimize=True):\n    \"\"\"Compile and execute AGK source. Returns (stdout, namespace, warnings).\n\n    The program runs as __main__ so a `define function main:` entrypoint\n    executes automatically.\n    \"\"\"\n    code, warnings = compile_source(source, filename,\n                                    search_paths=search_paths,\n                                    optimize=optimize)\n    namespace = {\"__name__\": \"__main__\"}\n    buf = io.StringIO()\n    with redirect_stdout(buf):\n        exec(compile(code, filename, \"exec\"), namespace)\n    return buf.getvalue(), namespace, warnings\n\n\n# ---------------------------------------------------------------------------\n# Incremental compilation cache (used by `agk build`).\n#\n# `<entry-dir>/.agkcache/manifest.json` maps each compiled .agk file's\n# absolute path to an entry:\n#   {\"fingerprint\": <hex>, \"chunk\": <generated python>, \"warnings\": [...]}\n# The entry file additionally stores the fully assembled output under \"code\".\n#\n# Fingerprint design (cache key): sha256 over\n#     compiler version                      <- any compiler upgrade\n#                                            invalidates the whole cache\n#     \\x00\n#     sha256 of the module's own source bytes\n#     \\x00\n#     the fingerprints of its direct .agk imports, sorted\n# A module's fingerprint therefore incorporates its dependencies'\n# fingerprints recursively, so editing a module transitively invalidates\n# every importer: dependents are conservatively recompiled (we do not try\n# to prove a dependent is unaffected by a dependency change). Plain Python\n# imports (unresolved or dotted names) are not tracked -- they emit\n# verbatim and cannot affect AGK codegen.\n#\n# Skipping analyze()/typecheck()/optimize()/codegen on a cache hit is\n# sound because a hit implies the module's source AND every transitive\n# dependency's source are byte identical to the cached build. analyze()\n# and typecheck() only read top-level names/signatures (never mutate)\n# from the extra_top_levels programs, so their outcomes are pinned by\n# the fingerprint too.\n\nCACHE_DIR_NAME = \".agkcache\"\nCACHE_FORMAT = 1\n# Keep in sync with pyproject.toml. Any compiler change must invalidate\n# previously cached codegen, so the version salts every fingerprint.\nCOMPILER_VERSION = \"0.6.0\"\n\n_MANIFEST_NAME = \"manifest.json\"\n\n\ndef _source_hash_bytes(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef _fingerprint(src_hash, dep_fps, salt=\"\"):\n    h = hashlib.sha256()\n    h.update((\"agk-cache-v%d:%s\\x00\" % (CACHE_FORMAT, COMPILER_VERSION))\n             .encode(\"utf-8\"))\n    h.update(salt.encode(\"utf-8\"))\n    h.update(b\"\\x00\")\n    h.update(src_hash.encode(\"utf-8\"))\n    for d in dep_fps:\n        h.update(b\"\\x00\")\n        h.update(d.encode(\"utf-8\"))\n    return h.hexdigest()\n\n\ndef _direct_agk_deps(mod_prog, mod_path, search_paths, pkg_dirs=()):\n    \"\"\"Absolute paths of the .agk modules mod_prog directly imports.\n\n    Mirrors _resolve_modules' lookup (including pkg_dirs) so the\n    dependency graph covers every module that gets inlined.\n    \"\"\"\n    base = os.path.dirname(os.path.abspath(mod_path))\n    deps = []\n    for stmt in mod_prog.statements:\n        if isinstance(stmt, A.Import):\n            found = _find_module(stmt.module, base, list(search_paths),\n                                 pkg_dirs)\n            if found is not None:\n                deps.append(os.path.abspath(str(found)))\n    return deps\n\n\ndef _load_manifest(cache_dir):\n    \"\"\"Read the cache manifest; {} when missing, corrupt, or written by a\n    different compiler version (stale caches invalidate on upgrade).\"\"\"\n    try:\n        with open(os.path.join(cache_dir, _MANIFEST_NAME),\n                  encoding=\"utf-8\") as f:\n            data = json.load(f)\n    except (OSError, ValueError):\n        return {}\n    if not isinstance(data, dict):\n        return {}\n    if (data.get(\"format\") != CACHE_FORMAT\n            or data.get(\"version\") != COMPILER_VERSION):\n        return {}\n    entries = data.get(\"entries\")\n    return entries if isinstance(entries, dict) else {}\n\n\ndef _save_manifest(cache_dir, entries):\n    # Drop entries whose source file no longer exists: they can never hit.\n    # (Entries belonging to other entry files sharing this directory are\n    # kept -- pruning is by file existence, not by \"seen in this build\".)\n    entries = {p: e for p, e in entries.items() if os.path.isfile(p)}\n    os.makedirs(cache_dir, exist_ok=True)\n    tmp = os.path.join(cache_dir, _MANIFEST_NAME + \".tmp\")\n    with open(tmp, \"w\", encoding=\"utf-8\") as f:\n        json.dump({\"format\": CACHE_FORMAT, \"version\": COMPILER_VERSION,\n                   \"entries\": entries}, f)\n    os.replace(tmp, os.path.join(cache_dir, _MANIFEST_NAME))\n\n\ndef wipe_cache(cache_dir):\n    \"\"\"Remove the compilation cache directory. Returns True if removed.\"\"\"\n    if os.path.isdir(cache_dir):\n        shutil.rmtree(cache_dir)\n        return True\n    return False\n\n\ndef _assemble_chunks(chunks, main_def, filename, annotate,\n                     needs_asyncio_import=False):\n    \"\"\"Reproduce _generate_all's exact output from per-module chunks.\n\n    A shared CodeGenerator separates consecutive top-level statements with\n    one blank line and emits HEADER with no blank after it; emitting each\n    module with a fresh generator and joining the non-empty chunks with\n    \"\\\\n\\\\n\" after HEADER reproduces that byte-for-byte.\n    \"\"\"\n    parts = [c for c in chunks if c.strip()]\n    code = HEADER\n    if needs_asyncio_import:\n        code += \"\\nimport asyncio\"\n    if parts:\n        code += \"\\n\" + \"\\n\\n\".join(parts)\n    code += \"\\n\"\n    if main_def is not None:\n        code += \"\\nif __name__ == \\\"__main__\\\":\\n\"\n        # v0.4.0: an async main runs on the event loop.\n        call = (\"asyncio.run(main())\"\n                if getattr(main_def, \"is_async\", False) else \"main()\")\n        line = \"    \" + call\n        if annotate and getattr(main_def, \"line\", 0):\n            line += \"  # AGK %s:%d\" % (filename, main_def.line)\n        code += line + \"\\n\"\n    return code\n\n\ndef compile_program_cached(program, filename=\"<string>\", search_paths=(),\n                           extra_top_levels=(), annotate=False,\n                           cache_dir=None, entry_source=None, optimize=True):\n    \"\"\"Like compile_program, but reuses per-module results from the\n    `.agkcache` manifest when fingerprints match.\n\n    Returns (code, warnings, modules, status) where status is a list of\n    (display_name, cache_hit) in build order: modules first (dependency\n    order), then the entry file.\n\n    entry_source: the entry file's source text, used for its fingerprint;\n    read from filename when None. cache_dir=None disables caching and\n    behaves exactly like compile_program.\n\n    The cache key covers the compiler version, each module's source hash,\n    the transitive dependency fingerprints, and the annotate flag.\n    Callers that vary search_paths resolution or extra_top_levels between\n    builds should use separate cache directories.\n    \"\"\"\n    if cache_dir is None:\n        code, warnings, modules = compile_program(\n            program, filename=filename, search_paths=search_paths,\n            extra_top_levels=extra_top_levels, annotate=annotate,\n            optimize=optimize)\n        return code, warnings, modules, []\n    if search_paths is None:\n        search_paths = [os.getcwd()]\n    search_paths = list(search_paths)\n    if filename not in (None, \"<string>\", \"<input>\", \"<repl>\"):\n        entry_dir = os.path.dirname(os.path.abspath(filename))\n    else:\n        entry_dir = os.getcwd()\n    pkg_dirs = package_module_dirs(entry_dir)\n    modules = _resolve_modules(program, filename, search_paths,\n                               pkg_dirs=pkg_dirs)\n    resolved = {name for name, _, _ in modules}\n    manifest = _load_manifest(cache_dir)\n\n    src_hashes = {}\n    dep_paths = {}\n    for _name, mod_prog, mod_path in modules:\n        apath = os.path.abspath(mod_path)\n        with open(apath, \"rb\") as f:\n            src_hashes[apath] = _source_hash_bytes(f.read())\n        dep_paths[apath] = _direct_agk_deps(mod_prog, mod_path, search_paths,\n                                            pkg_dirs)\n\n    # Recursive fingerprints; a back edge in an import cycle contributes\n    # the target's source-only hash so cycles terminate. A change anywhere\n    # in the cycle still propagates: the back edge's target hash changes,\n    # which changes every fingerprint around the cycle.\n    # `salt` pins codegen-affecting options (currently annotate, optimize)\n    # so builds with different options never share cache entries.\n    salt = (\"annotate\" if annotate else \"\") + (\";noopt\" if not optimize else \"\")\n    fps = {}\n    visiting = set()\n\n    def fingerprint(apath):\n        if apath in fps:\n            return fps[apath]\n        if apath in visiting:\n            return _fingerprint(src_hashes[apath], [], salt)\n        visiting.add(apath)\n        try:\n            dfps = sorted(fingerprint(d) for d in dep_paths[apath])\n            result = _fingerprint(src_hashes[apath], dfps, salt)\n        finally:\n            visiting.discard(apath)\n        fps[apath] = result\n        return result\n\n    for apath in src_hashes:\n        fingerprint(apath)\n\n    def gen_chunk(prog, agk_file):\n        cg = CodeGenerator()\n        cg.generate_program(prog, skip_imports=resolved,\n                            agk_file=agk_file if annotate else None)\n        return \"\\n\".join(cg.lines)\n\n    warnings = []\n    seen_progs = []\n    chunks = []\n    status = []\n    for name, mod_prog, mod_path in modules:\n        apath = os.path.abspath(mod_path)\n        entry = manifest.get(apath)\n        if (isinstance(entry, dict)\n                and entry.get(\"fingerprint\") == fps[apath]\n                and isinstance(entry.get(\"chunk\"), str)):\n            chunks.append(entry[\"chunk\"])\n            warnings.extend(entry.get(\"warnings\", []))\n            status.append((name, True))\n        else:\n            _, mod_warnings = analyze(mod_prog, filename=mod_path,\n                                      extra_top_levels=seen_progs)\n            typecheck(mod_prog, filename=mod_path,\n                      extra_top_levels=seen_progs)\n            if optimize:\n                optimize_program(mod_prog)\n            warnings.extend(mod_warnings)\n            chunk = gen_chunk(mod_prog, mod_path)\n            chunks.append(chunk)\n            status.append((name, False))\n            manifest[apath] = {\"fingerprint\": fps[apath], \"chunk\": chunk,\n                               \"warnings\": list(mod_warnings)}\n        # analyze() only reads top-level names from these; the parsed ASTs\n        # are deterministic from source, so later modules see identical\n        # inputs whether or not this module was a cache hit.\n        seen_progs.append(mod_prog)\n\n    # The entry file: its fingerprint covers every module, so a hit here\n    # implies all modules hit too; reuse the fully assembled output.\n    entry_key = os.path.abspath(filename)\n    if entry_source is None:\n        with open(entry_key, \"rb\") as f:\n            entry_source = f.read().decode(\"utf-8\")\n    entry_fp = _fingerprint(_source_hash_bytes(entry_source.encode(\"utf-8\")),\n                            sorted(fps.values()), salt)\n    entry = manifest.get(entry_key)\n    if (isinstance(entry, dict) and entry.get(\"fingerprint\") == entry_fp\n            and isinstance(entry.get(\"code\"), str)):\n        status.append((os.path.basename(filename), True))\n        _save_manifest(cache_dir, manifest)\n        return entry[\"code\"], list(entry.get(\"warnings\", [])), modules, status\n\n    extra = list(extra_top_levels) + [mp for _, mp, _ in modules]\n    program, main_warnings = analyze(program, filename=filename,\n                                     extra_top_levels=extra)\n    typecheck(program, filename=filename, extra_top_levels=extra)\n    if optimize:\n        optimize_program(program)\n    warnings.extend(main_warnings)\n    chunks.append(gen_chunk(program, filename))\n    main_def = next((s for s in program.statements\n                     if isinstance(s, A.FunctionDef) and s.name == \"main\"),\n                    None)\n    # v0.4.0: mirror _generate_all's asyncio handling for async programs.\n    mod_progs = [mp for _, mp, _ in modules]\n    uses_async = (program_uses_async(program)\n                  or any(program_uses_async(mp) for mp in mod_progs))\n    needs_asyncio_import = (uses_async\n                            and not _asyncio_imported([program] + mod_progs))\n    code = _assemble_chunks(chunks, main_def, filename, annotate,\n                            needs_asyncio_import)\n    status.append((os.path.basename(filename), False))\n    manifest[entry_key] = {\"fingerprint\": entry_fp, \"code\": code,\n                           \"warnings\": list(warnings)}\n    _save_manifest(cache_dir, manifest)\n    return code, warnings, modules, status\n\n\ndef compile_source_cached(source, filename=\"<string>\", search_paths=(),\n                          extra_top_levels=(), annotate=False,\n                          cache_dir=None, optimize=True):\n    \"\"\"Compile AGK source to Python using the incremental cache.\n\n    Returns (python_code, warnings, status); see compile_program_cached.\n    \"\"\"\n    program = parse(source, filename=filename)\n    code, warnings, _modules, status = compile_program_cached(\n        program, filename=filename, search_paths=search_paths,\n        extra_top_levels=extra_top_levels, annotate=annotate,\n        cache_dir=cache_dir, entry_source=source, optimize=optimize)\n    return code, warnings, status\n", "agk/pkg.py": "\"\"\"`agk pkg` \u2014 minimal, registry-free package manager.\n\nPackages are plain git repositories containing .agk modules; there is no\ncentral registry (Go-modules style, minus the proxy). ``agk pkg install``\nclones a package (shallow) into ``<project>/packages/<name>/`` and pins\nthe commit hash in ``agk.json``. A local directory installs by copy,\nwhich makes offline testing possible.\n\n``import <module>`` resolves installed packages *after* the importing\nfile's own directory, the caller's search paths, and the bundled stdlib\n(see pipeline._find_module); the search is driven by the nearest\n``agk.json`` found walking up from the entry file.\n\nManifest format (agk.json):\n\n    {\n      \"name\": \"myproject\",\n      \"version\": \"0.1.0\",\n      \"dependencies\": {\n        \"greeter\": {\n          \"url\": \"https://example.com/greeter.git\",\n          \"commit\": \"abc1234def...\",\n          \"version\": \"1.2.0\"\n        }\n      }\n    }\n\n``commit`` is null for local-directory installs; ``version`` is read\nfrom the package's own agk.json when it has one, else null.\n\"\"\"\n\nimport json\nimport os\nimport shutil\nimport subprocess\nfrom pathlib import Path\n\nMANIFEST_NAME = \"agk.json\"\nPACKAGES_DIR_NAME = \"packages\"\nDEFAULT_VERSION = \"0.1.0\"\n\n\nclass PkgError(Exception):\n    \"\"\"Usage / IO / git failure for a pkg operation.\"\"\"\n\n\ndef find_project_root(start=None):\n    \"\"\"Nearest ancestor of *start* (or cwd) containing agk.json.\"\"\"\n    d = Path(start if start is not None else os.getcwd()).resolve()\n    for p in (d, *d.parents):\n        if (p / MANIFEST_NAME).is_file():\n            return p\n    return None\n\n\ndef load_manifest(root):\n    path = Path(root) / MANIFEST_NAME\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            manifest = json.load(f)\n    except (OSError, json.JSONDecodeError) as e:\n        raise PkgError(f\"cannot read '{path}': {e}\")\n    if not isinstance(manifest, dict):\n        raise PkgError(f\"'{path}' is not a JSON object\")\n    manifest.setdefault(\"dependencies\", {})\n    return manifest\n\n\ndef save_manifest(root, manifest):\n    path = Path(root) / MANIFEST_NAME\n    with open(path, \"w\", encoding=\"utf-8\") as f:\n        json.dump(manifest, f, indent=2)\n        f.write(\"\\n\")\n\n\ndef cmd_init(cwd=None, name=None, version=DEFAULT_VERSION):\n    \"\"\"Create agk.json in *cwd*. Raises PkgError if one already exists.\"\"\"\n    root = Path(cwd if cwd is not None else os.getcwd()).resolve()\n    path = root / MANIFEST_NAME\n    if path.exists():\n        raise PkgError(f\"'{path}' already exists\")\n    manifest = {\n        \"name\": name or root.name,\n        \"version\": version,\n        \"dependencies\": {},\n    }\n    save_manifest(root, manifest)\n    return manifest\n\n\ndef _run_git(args, cwd):\n    try:\n        return subprocess.run(\n            [\"git\", *args], cwd=str(cwd),\n            capture_output=True, text=True, check=True)\n    except FileNotFoundError:\n        raise PkgError(\"git is not installed\")\n    except subprocess.CalledProcessError as e:\n        raise PkgError(f\"git {' '.join(args)} failed: {e.stderr.strip()}\")\n\n\ndef _derive_name(source, explicit=None):\n    if explicit:\n        return explicit\n    s = source.rstrip(\"/\").rstrip(\"\\\\\")\n    tail = s\n    if \"://\" in s:\n        tail = s.split(\"://\", 1)[1]\n    elif \"@\" in s and \":\" in s:\n        # scp-like syntax: git@host:path/to/repo.git\n        tail = s.split(\":\", 1)[1]\n    base = tail.rsplit(\"/\", 1)[-1]\n    if base.endswith(\".git\"):\n        base = base[:-4]\n    if not base:\n        raise PkgError(f\"cannot derive a package name from '{source}'; \"\n                       \"pass --name\")\n    return base\n\n\ndef _package_version(pkg_dir):\n    \"\"\"Version from the package's own agk.json, or None.\"\"\"\n    path = Path(pkg_dir) / MANIFEST_NAME\n    if path.is_file():\n        try:\n            with open(path, encoding=\"utf-8\") as f:\n                return json.load(f).get(\"version\")\n        except (OSError, json.JSONDecodeError, AttributeError):\n            return None\n    return None\n\n\ndef _record_dependency(root, pkg_name, url, commit):\n    manifest = load_manifest(root)\n    deps = manifest.setdefault(\"dependencies\", {})\n    deps[pkg_name] = {\n        \"url\": url,\n        \"commit\": commit,\n        \"version\": _package_version(root / PACKAGES_DIR_NAME / pkg_name),\n    }\n    save_manifest(root, manifest)\n    return deps[pkg_name]\n\n\ndef cmd_install(source, cwd=None, name=None):\n    \"\"\"Install a package from a git URL (cloned shallow) or a local\n    directory (copied). Records url + commit hash in agk.json.\n    Reinstalling an already-installed package is a no-op (idempotent).\n\n    Returns a dict describing the install (with 'already_installed').\n    \"\"\"\n    cwd = Path(cwd if cwd is not None else os.getcwd()).resolve()\n    root = find_project_root(cwd) or cwd\n    if not (root / MANIFEST_NAME).is_file():\n        raise PkgError(f\"no '{MANIFEST_NAME}' in '{root}' \"\n                       \"(run 'agk pkg init' first)\")\n    pkg_name = _derive_name(source, name)\n    dest = root / PACKAGES_DIR_NAME / pkg_name\n    manifest = load_manifest(root)\n    recorded = manifest.get(\"dependencies\", {}).get(pkg_name)\n\n    if dest.is_dir() and recorded is not None:\n        return {\"name\": pkg_name, \"path\": str(dest),\n                \"already_installed\": True, \"entry\": recorded}\n\n    local = Path(source).expanduser()\n    if local.is_dir():\n        # Local directory install: plain copy (offline-friendly).\n        if dest.exists():\n            shutil.rmtree(dest)\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        shutil.copytree(local, dest, ignore=shutil.ignore_patterns(\".git\"))\n        url = str(local.resolve())\n        commit = None\n    else:\n        # Git URL (file:// URLs also work offline for tests).\n        if dest.exists():\n            raise PkgError(f\"'{dest}' already exists but is not recorded \"\n                           f\"in '{MANIFEST_NAME}'\")\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        _run_git([\"clone\", \"--depth\", \"1\", source, str(dest)], cwd=root)\n        url = source\n        commit = _run_git([\"rev-parse\", \"HEAD\"], cwd=dest).stdout.strip()\n\n    entry = _record_dependency(root, pkg_name, url, commit)\n    return {\"name\": pkg_name, \"path\": str(dest), \"already_installed\": False,\n            \"entry\": entry}\n\n\ndef cmd_list(cwd=None):\n    \"\"\"Installed packages per agk.json. Returns [(name, entry, present)].\"\"\"\n    cwd = Path(cwd if cwd is not None else os.getcwd()).resolve()\n    root = find_project_root(cwd) or cwd\n    if not (root / MANIFEST_NAME).is_file():\n        raise PkgError(f\"no '{MANIFEST_NAME}' in '{root}' \"\n                       \"(run 'agk pkg init' first)\")\n    manifest = load_manifest(root)\n    pkg_root = root / PACKAGES_DIR_NAME\n    result = []\n    for pkg_name, entry in manifest.get(\"dependencies\", {}).items():\n        result.append((pkg_name, entry,\n                       (pkg_root / pkg_name).is_dir()))\n    return result\n\n\ndef package_module_dirs(entry_dir=None):\n    \"\"\"Search dirs for .agk module resolution: <project>/packages/<dep>\n    for every dependency in the nearest agk.json. Returns [Path, ...].\"\"\"\n    root = find_project_root(entry_dir)\n    if root is None:\n        return []\n    pkg_root = root / PACKAGES_DIR_NAME\n    dirs = []\n    for pkg_name in load_manifest(root).get(\"dependencies\", {}):\n        d = pkg_root / pkg_name\n        if d.is_dir():\n            dirs.append(d)\n    return dirs\n", "agk/repl.py": "\"\"\"AGK-Real v1 interactive REPL.\n\nEach input is tried as (1) a full program (definitions, imports), then\n(2) a single expression whose value is printed, then (3) a list of\nstatements. A trailing ':' continues onto more lines until a blank line.\nVariables created with `create`, and functions/classes/constants defined\nearlier, persist across inputs.\n\"\"\"\n\nimport os\n\nfrom . import ast_nodes as A\nfrom .errors import AGKError\nfrom .parser import parse, parse_expression_src, parse_statement_list\nfrom .semantic import analyze\nfrom .codegen import CodeGenerator\nfrom .pipeline import compile_program\n\nBANNER = (\"AGK-Real v2  |  definitions, statements and expressions  |  \"\n          \"blank line ends a block  |  'exit' quits\")\n\n# Warnings that are noise for one REPL input (the name lives on).\n_REPL_NOISE = (\"is never assigned a value\", \"unused variable\")\n\n\ndef _created_names(stmts):\n    \"\"\"All names introduced by `create` anywhere in a statement list.\"\"\"\n    names = set()\n\n    def walk(node):\n        if isinstance(node, A.CreateStmt):\n            names.add(node.name)\n        if isinstance(node, A.IfStmt):\n            for s in node.then_body:\n                walk(s)\n            for _cond, body in node.elifs:\n                for s in body:\n                    walk(s)\n            if node.else_body:\n                for s in node.else_body:\n                    walk(s)\n        elif isinstance(node, (A.WhileStmt, A.ForEachStmt, A.ForRangeStmt)):\n            for s in node.body:\n                walk(s)\n        elif isinstance(node, A.TryStmt):\n            for s in node.body:\n                walk(s)\n            if node.catch_body:\n                for s in node.catch_body:\n                    walk(s)\n            if node.finally_body:\n                for s in node.finally_body:\n                    walk(s)\n\n    for s in stmts:\n        walk(s)\n    return names\n\n\nclass Session:\n    def __init__(self):\n        self.namespace = {\"__name__\": \"<repl>\"}\n        self.known = set()       # variable / Python-import names\n        self.known_defs = []     # FunctionDef / ClassDef / ConstantDef nodes\n\n    def _extra(self):\n        return [A.Program(statements=self.known_defs)] if self.known_defs else []\n\n    def _remember_program(self, program, modules):\n        \"\"\"Record a successfully compiled chunk's definitions so later\n        inputs resolve (and may redefine) them.\"\"\"\n        defined = set()\n        for stmt in program.statements:\n            if isinstance(stmt, (A.FunctionDef, A.ClassDef, A.ConstantDef, A.ExternDef)):\n                defined.add((type(stmt).__name__, stmt.name))\n            elif isinstance(stmt, A.Import):\n                if not any(stmt.module == name for name, _, _ in modules):\n                    self.known.add(stmt.module.split(\".\")[0])\n        self.known_defs = [\n            d for d in self.known_defs\n            if (type(d).__name__, d.name) not in defined\n        ]\n        for stmt in program.statements:\n            if isinstance(stmt, (A.FunctionDef, A.ClassDef, A.ConstantDef, A.ExternDef)):\n                self.known_defs.append(stmt)\n        for _name, mod_prog, _path in modules:\n            for stmt in mod_prog.statements:\n                if isinstance(stmt, (A.FunctionDef, A.ClassDef, A.ConstantDef, A.ExternDef)):\n                    key = (type(stmt).__name__, stmt.name)\n                    self.known_defs = [d for d in self.known_defs\n                                       if (type(d).__name__, d.name) != key]\n                    self.known_defs.append(stmt)\n\n    # -- the three tiers ----------------------------------------------------\n\n    def run_program(self, chunk):\n        program = parse(chunk, filename=\"<repl>\")\n        # Drop defs this chunk replaces before compiling, so redefinition\n        # works the way it does in other REPLs.\n        defined = {(type(s).__name__, s.name) for s in program.statements\n                   if isinstance(s, (A.FunctionDef, A.ClassDef, A.ConstantDef, A.ExternDef))}\n        kept = [d for d in self.known_defs\n                if (type(d).__name__, d.name) not in defined]\n        code, warnings, modules = compile_program(\n            program, filename=\"<repl>\", search_paths=[os.getcwd()],\n            extra_top_levels=[A.Program(statements=kept)] if kept else [])\n        for w in warnings:\n            print(w)\n        exec(compile(code, \"<repl>\", \"exec\"), self.namespace)  # noqa: S102\n        self.known_defs = kept\n        self._remember_program(program, modules)\n\n    def run_statements(self, chunk):\n        stmts = parse_statement_list(chunk, filename=\"<repl>\")\n        wrapper = A.FunctionDef(name=\"__repl__\", params=[], return_type=None,\n                               body=stmts)\n        prog = A.Program(statements=[wrapper])\n        _, warnings = analyze(prog, filename=\"<repl>\", predeclared=self.known,\n                              extra_top_levels=self._extra())\n        cg = CodeGenerator()\n        for s in wrapper.body:\n            cg.gen_stmt(s)\n        for w in warnings:\n            if not any(noise in w for noise in _REPL_NOISE):\n                print(w)\n        exec(compile(\"\\n\".join(cg.lines), \"<repl>\", \"exec\"),  # noqa: S102\n             self.namespace)\n        self.known.update(_created_names(stmts))\n\n    def run_expression(self, chunk):\n        node = parse_expression_src(chunk, filename=\"<repl>\")\n        wrapper = A.FunctionDef(name=\"__repl__\", params=[], return_type=None,\n                               body=[A.ReturnStmt(value=node)])\n        prog = A.Program(statements=[wrapper])\n        analyze(prog, filename=\"<repl>\", predeclared=self.known,\n                extra_top_levels=self._extra())\n        code = CodeGenerator().expr(wrapper.body[0].value)\n        result = eval(compile(code, \"<repl>\", \"eval\"),  # noqa: S307\n                      self.namespace)\n        if result is not None:\n            print(repr(result))\n\n    # -- dispatch ---------------------------------------------------------------\n\n    def handle(self, chunk):\n        stripped = chunk.strip()\n        if not stripped:\n            return True\n        if stripped in (\"exit\", \"quit\"):\n            return False\n        if stripped.split()[0] in (\"define\", \"class\", \"import\"):\n            self.run_program(chunk)\n            return True\n        if _looks_like_simple_statement(chunk):\n            # v0.6.0 (Simple AGK): `x is 10` must assign like it does in a\n            # file, not evaluate `x == 10`; route statement forms to\n            # statement handling first.\n            try:\n                self.run_statements(chunk)\n            except AGKError:\n                self.run_expression(chunk)\n            return True\n        try:\n            self.run_expression(chunk)\n        except AGKError:\n            try:\n                self.run_statements(chunk)\n            except AGKError as stmt_err:\n                # Expression failed too: the statement error is usually the\n                # more informative one (e.g. `set x to`).\n                raise stmt_err from None\n        return True\n\n\ndef _looks_like_simple_statement(chunk):\n    \"\"\"True when a REPL chunk starts with a Simple AGK statement form.\n\n    Mirrors the parser's statement dispatch: `name is <expr>` (but not\n    the `is not` / `is greater|less than` comparisons), `say`/`ask`/`repeat`\n    followed by an expression, and `increase`/`decrease` followed by a\n    name. Anything else keeps the historical expression-first order.\n    \"\"\"\n    from .lexer import Lexer\n    from .tokens import TokenType as T\n    try:\n        toks = [t for t in Lexer(chunk, \"<repl>\").tokenize()\n                if t.type not in (T.NEWLINE, T.EOF)]\n    except AGKError:\n        return False\n    if not toks or toks[0].type != T.IDENTIFIER:\n        return False\n    word = toks[0].value\n\n    def is_word(i, value):\n        return (i < len(toks) and toks[i].type == T.IDENTIFIER\n                and toks[i].value == value)\n\n    if is_word(1, \"is\"):\n        # comparison tails stay expressions: `x is not 5`,\n        # `x is greater than 5`\n        if len(toks) > 2 and toks[2].type == T.NOT:\n            return False\n        if (is_word(2, \"greater\") or is_word(2, \"less\")) \\\n                and is_word(3, \"than\"):\n            return False\n        return True\n    if word in (\"increase\", \"decrease\"):\n        return len(toks) > 1 and toks[1].type == T.IDENTIFIER\n    if word in (\"say\", \"ask\", \"repeat\"):\n        return len(toks) > 1 and toks[1].type in (\n            T.INT, T.FLOAT, T.STRING, T.TRUE, T.FALSE, T.IDENTIFIER, T.SELF,\n            T.LBRACKET, T.LBRACE, T.MINUS, T.NOT, T.AWAIT)\n    return False\n\n\ndef _read_chunk():\n    lines = []\n    while True:\n        try:\n            line = input(\"... \" if lines else \">>> \")\n        except EOFError:\n            print()\n            raise\n        if not line.strip():\n            if lines:\n                break\n            continue\n        lines.append(line)\n        if len(lines) == 1 and not line.rstrip().endswith(\":\"):\n            break\n    return \"\\n\".join(lines) + \"\\n\"\n\n\ndef repl():\n    print(BANNER)\n    session = Session()\n    while True:\n        try:\n            chunk = _read_chunk()\n        except EOFError:\n            break\n        try:\n            if not session.handle(chunk):\n                break\n        except AGKError as e:\n            print(e)\n        except KeyboardInterrupt:\n            print()\n            continue\n", "agk/scaffold.py": "\"\"\"`agk new` \u2014 project scaffolding.\n\nGenerates a runnable project skeleton so a fresh project starts from\n`agk new <name>` and immediately passes `agk run` and `agk test`.\n\nApp layout (default):\n\n    <name>/\n        agk.json\n        README.md\n        .gitignore\n        src/\n            main.agk          # entry point: `define function main`\n            greeter.agk       # a tiny module, imported by main.agk\n        tests/\n            greeter_test.agk  # discovered by `agk test`, imports greeter\n\nLib layout (`--lib`): no entry point; the module itself is the product.\n\n    <name>/\n        agk.json\n        README.md\n        .gitignore\n        src/\n            <name>.agk        # the library module\n        tests/\n            <name>_test.agk\n\nPublic API: ``scaffold(name, kind=\"app\", directory=\".\", force=False)``\nreturns the created project root Path. Raises ``ScaffoldError`` on bad\ninput (invalid name, target exists and is non-empty without force).\n\"\"\"\n\nimport os\nimport re\nfrom pathlib import Path\n\nNAME_RE = re.compile(r\"^[A-Za-z_][A-Za-z0-9_]*$\")\n\n\nclass ScaffoldError(Exception):\n    \"\"\"Usage / IO failure for a scaffold operation.\"\"\"\n\n\nAPP_MAIN = \"\"\"import greeter\n\ndefine function main:\n    message is greet(\"AGK\")\n    say message\n\"\"\"\n\nAPP_GREETER = \"\"\"to greet with name:\n    return \"Hello, \" + name + \"!\"\n\"\"\"\n\nAPP_TEST = \"\"\"import greeter\n\ndefine function test_greet_includes_name:\n    got is greet(\"Zuck\")\n    if got is not \"Hello, Zuck!\":\n        raise \"expected 'Hello, Zuck!' but got '\" + got + \"'\"\n\ndefine function test_greet_empty_name:\n    got is greet(\"\")\n    if got is not \"Hello, !\":\n        raise \"empty name failed: \" + got\n\"\"\"\n\nLIB_MODULE = \"\"\"to double with n:\n    return n * 2\n\nto triple with n:\n    return n * 3\n\"\"\"\n\nLIB_TEST = \"\"\"import {name}\n\ndefine function test_double:\n    if double(21) is not 42:\n        raise \"double(21) should be 42\"\n\ndefine function test_triple:\n    if triple(14) is not 42:\n        raise \"triple(14) should be 42\"\n\"\"\"\n\nREADME_APP = \"\"\"# {name}\n\nAn AGK app. Built with [AGK-Real](https://github.com/agk4444/AGK-Real).\n\n## Run\n\n    agk run src/main.agk\n\n## Test\n\n    agk test\n\n## Package\n\n    agk pkg init        # (already done \u2014 see agk.json)\n    agk pkg install <git-url-or-path> [--name NAME]\n\"\"\"\n\nREADME_LIB = \"\"\"# {name}\n\nAn AGK library. Built with [AGK-Real](https://github.com/agk4444/AGK-Real).\n\n## Use it\n\n    import {name}\n\n    answer is double(21)\n\n## Test\n\n    agk test\n\"\"\"\n\nGITIGNORE = \"\"\".agkcache/\n__pycache__/\n*.pyc\n\"\"\"\n\nMANIFEST_TEMPLATE = \"\"\"{{\n  \"name\": \"{name}\",\n  \"version\": \"0.1.0\",\n  \"dependencies\": {{}}\n}}\n\"\"\"\n\n\ndef validate_name(name):\n    \"\"\"Project names must also work as module file names.\"\"\"\n    if not name or not NAME_RE.match(name):\n        raise ScaffoldError(\n            f\"invalid project name '{name}': use letters, digits and \"\n            \"underscores, starting with a letter or underscore\")\n    return name\n\n\ndef _write(root, relpath, content):\n    path = root / relpath\n    path.parent.mkdir(parents=True, exist_ok=True)\n    with open(path, \"w\", encoding=\"utf-8\") as f:\n        f.write(content)\n\n\ndef scaffold(name, kind=\"app\", directory=\".\", force=False):\n    \"\"\"Create a new AGK project skeleton. Returns the project root Path.\"\"\"\n    validate_name(name)\n    if kind not in (\"app\", \"lib\"):\n        raise ScaffoldError(f\"unknown scaffold kind '{kind}': app or lib\")\n    root = Path(directory) / name\n    if root.exists():\n        if not force and any(root.iterdir()):\n            raise ScaffoldError(\n                f\"'{root}' already exists and is not empty \"\n                \"(use --force to scaffold into it anyway)\")\n    else:\n        root.mkdir(parents=True)\n\n    _write(root, \"agk.json\", MANIFEST_TEMPLATE.format(name=name))\n    _write(root, \".gitignore\", GITIGNORE)\n    if kind == \"app\":\n        _write(root, \"README.md\", README_APP.format(name=name))\n        _write(root, \"src/main.agk\", APP_MAIN)\n        _write(root, \"src/greeter.agk\", APP_GREETER)\n        _write(root, \"tests/greeter_test.agk\", APP_TEST)\n    else:\n        _write(root, \"README.md\", README_LIB.format(name=name))\n        _write(root, f\"src/{name}.agk\", LIB_MODULE)\n        _write(root, f\"tests/{name}_test.agk\",\n               LIB_TEST.format(name=name))\n    return root\n\n\ndef describe(root, kind):\n    \"\"\"Human-readable tree of what was created, plus next steps.\"\"\"\n    lines = [f\"created {root}/\"]\n    for dirpath, dirnames, filenames in os.walk(root):\n        dirnames.sort()\n        rel = os.path.relpath(dirpath, root)\n        depth = 0 if rel == \".\" else rel.count(os.sep) + 1\n        if rel != \".\":\n            lines.append(\"  \" * depth + os.path.basename(dirpath) + \"/\")\n        for fn in sorted(filenames):\n            lines.append(\"  \" * (depth + 1) + fn)\n    lines.append(\"\")\n    if kind == \"app\":\n        lines.append(f\"next: cd {root.name} && agk run src/main.agk\")\n    else:\n        lines.append(f\"next: cd {root.name} && agk test\")\n    return \"\\n\".join(lines)\n", "agk/semantic.py": "\"\"\"AGK-Real v1 semantic analyzer.\n\nWalks the AST and enforces SPEC section 6:\n  - use of an undeclared name -> error naming the variable and line\n  - `set` on an undeclared name -> error\n  - `create` of a duplicate name in one scope -> error\n  - call of an unknown function / wrong arity -> error\n  - `return` outside a function -> error\n  - unused variables, never-assigned variables, unreachable code -> warnings\n\nAlso rewrites bare field references inside methods to `self.<field>`\n(SetStmt -> SetAttr, Name -> Attribute) per SPEC 4.7.\n\nRaises SemanticError on the first error; collects warnings in .warnings.\n\"\"\"\n\nfrom . import ast_nodes as A\nfrom .errors import SemanticError\nfrom .ffi import FFI_CTYPES\n\nimport difflib\n\nBUILTINS = {\n    \"print\": -1, \"len\": 1, \"str\": 1, \"int\": 1, \"float\": 1, \"bool\": 1,\n    \"range\": -1, \"input\": -1, \"list\": -1, \"dict\": -1, \"abs\": 1,\n    \"min\": -1, \"max\": -1, \"sum\": 1, \"sorted\": 1, \"enumerate\": 1,\n    \"zip\": -1, \"round\": -1, \"type\": 1, \"repr\": 1, \"open\": -1,\n}\n\n\nclass _Scope:\n    def __init__(self, parent=None):\n        self.parent = parent\n        # name -> {\"assigned\": bool, \"used\": bool, \"node\": node}\n        self.vars = {}\n\n    def declare(self, name, node):\n        self.vars[name] = {\"assigned\": False, \"used\": False, \"node\": node}\n\n    def lookup(self, name):\n        scope = self\n        while scope is not None:\n            if name in scope.vars:\n                return scope, scope.vars[name]\n            scope = scope.parent\n        return None, None\n\n\nclass SemanticAnalyzer:\n    def __init__(self, filename=\"<input>\"):\n        self.filename = filename\n        self.warnings = []\n        self.functions = {}   # name -> FunctionDef (arity checking)\n        self.extern_functions = {}  # name -> ExternDef (FFI; arity checking)\n        self.classes = {}     # name -> ClassDef\n        self.constants = set()\n        self._scope = None\n        self._in_function = 0\n        self._in_async_function = 0  # v0.4.0: >0 while inside `async` def\n        self._class_fields = None  # set of field names while inside a method\n\n    # -- helpers ----------------------------------------------------------\n\n    def error(self, message, node):\n        raise SemanticError(message, self.filename, node.line, node.col)\n\n    def warn(self, message, node):\n        self.warnings.append(\n            f\"{self.filename}:{node.line}:{node.col}: warning: {message}\")\n\n    def _suggest(self, name):\n        \"\"\"Return a \". did you mean '<match>'?\" suffix for an undefined\n        name, or '' when nothing is close enough.\"\"\"\n        candidates = set()\n        scope = self._scope\n        while scope is not None:\n            candidates.update(scope.vars)\n            scope = scope.parent\n        candidates.update(self.functions)\n        candidates.update(self.extern_functions)\n        candidates.update(self.classes)\n        candidates.update(BUILTINS)\n        candidates.discard(name)\n        matches = difflib.get_close_matches(name, sorted(candidates),\n                                            n=1, cutoff=0.6)\n        if matches:\n            return f\". did you mean '{matches[0]}'?\"\n        return \"\"\n\n    # -- entry --------------------------------------------------------------\n\n    def analyze(self, program, predeclared=(), extra_top_levels=()):\n        # pass 1: collect top-level names, detect duplicates\n        for mod in extra_top_levels:\n            for stmt in mod.statements:\n                if isinstance(stmt, A.FunctionDef):\n                    self._add_top_level(stmt.name, stmt, self.functions,\n                                        \"function\")\n                elif isinstance(stmt, A.ExternDef):\n                    self._register_extern(stmt)\n                elif isinstance(stmt, A.ClassDef):\n                    self._add_top_level(stmt.name, stmt, self.classes, \"class\")\n                elif isinstance(stmt, A.ConstantDef):\n                    if stmt.name in self.constants:\n                        self.error(f\"duplicate constant '{stmt.name}'\", stmt)\n                    self.constants.add(stmt.name)\n        for stmt in program.statements:\n            if isinstance(stmt, A.FunctionDef):\n                self._add_top_level(stmt.name, stmt, self.functions,\n                                    \"function\")\n            elif isinstance(stmt, A.ExternDef):\n                self._register_extern(stmt)\n            elif isinstance(stmt, A.ClassDef):\n                self._add_top_level(stmt.name, stmt, self.classes, \"class\")\n            elif isinstance(stmt, A.ConstantDef):\n                if stmt.name in self.constants:\n                    self.error(f\"duplicate constant '{stmt.name}'\", stmt)\n                self.constants.add(stmt.name)\n            elif isinstance(stmt, A.Import):\n                pass  # handled in pass 2 scope setup\n            else:\n                self.error(\"unexpected top-level statement\", stmt)\n\n        # pass 2: analyze bodies\n        self._scope = _Scope()\n        for name in predeclared:\n            # Names carried over from earlier REPL input: known, assigned,\n            # and exempt from unused warnings.\n            self._scope.declare(name, None)\n            self._scope.vars[name][\"assigned\"] = True\n            self._scope.vars[name][\"used\"] = True\n        for stmt in program.statements:\n            if isinstance(stmt, A.Import):\n                top = stmt.module.split(\".\")[0]\n                self._scope.declare(top, stmt)\n                self._scope.vars[top][\"assigned\"] = True\n            elif isinstance(stmt, A.ConstantDef):\n                self._scope.declare(stmt.name, stmt)\n                self._scope.vars[stmt.name][\"assigned\"] = True\n        for mod in extra_top_levels:\n            for stmt in mod.statements:\n                if isinstance(stmt, A.Import):\n                    top = stmt.module.split(\".\")[0]\n                    if top not in self._scope.vars:\n                        self._scope.declare(top, stmt)\n                        self._scope.vars[top][\"assigned\"] = True\n                elif isinstance(stmt, A.ConstantDef):\n                    if stmt.name not in self._scope.vars:\n                        self._scope.declare(stmt.name, stmt)\n                        self._scope.vars[stmt.name][\"assigned\"] = True\n        for stmt in program.statements:\n            if isinstance(stmt, (A.FunctionDef,)):\n                self._check_function(stmt)\n            elif isinstance(stmt, A.ClassDef):\n                self._check_class(stmt)\n        self._check_unused(self._scope)\n        return self.warnings\n\n    def _add_top_level(self, name, node, table, kind):\n        if (name in table or name in self.functions or name in self.classes\n                or name in self.extern_functions):\n            self.error(f\"duplicate {kind} '{name}'\", node)\n        if name in BUILTINS:\n            self.error(f\"{kind} name '{name}' shadows a builtin\", node)\n        table[name] = node\n\n    def _register_extern(self, stmt):\n        \"\"\"Register an `extern function` declaration: duplicate detection\n        plus FFI signature validation (supported types only).\"\"\"\n        name = stmt.name\n        if (name in self.extern_functions or name in self.functions\n                or name in self.classes):\n            self.error(f\"duplicate extern function '{name}'\", stmt)\n        # Unlike `define function`, an extern name may deliberately shadow\n        # a builtin (C libraries export names like `abs`); the generated\n        # wrapper replaces the builtin in the module namespace.\n        if not stmt.lib:\n            self.error(f\"extern function '{name}': library name must not \"\n                       f\"be empty\", stmt)\n        seen = set()\n        for p in stmt.params:\n            if p.name in seen:\n                self.error(f\"duplicate parameter '{p.name}'\", p)\n            seen.add(p.name)\n            if p.type_name not in FFI_CTYPES:\n                self.error(\n                    f\"extern function '{name}': unsupported parameter type \"\n                    f\"'{p.type_name}' (FFI supports: \"\n                    f\"{', '.join(sorted(FFI_CTYPES))})\", p)\n        if (stmt.return_type is not None\n                and stmt.return_type not in FFI_CTYPES):\n            self.error(\n                f\"extern function '{name}': unsupported return type \"\n                f\"'{stmt.return_type}' (FFI supports: \"\n                f\"{', '.join(sorted(FFI_CTYPES))})\", stmt)\n        self.extern_functions[name] = stmt\n\n    # -- functions / classes --------------------------------------------------\n\n    def _check_params(self, params):\n        \"\"\"Declare params; v2: defaults must trail (no plain param after\n        a defaulted one).\"\"\"\n        seen = set()\n        seen_default = False\n        for p in params:\n            if p.name in seen:\n                self.error(f\"duplicate parameter '{p.name}'\", p)\n            seen.add(p.name)\n            if p.default is not None:\n                seen_default = True\n            elif seen_default:\n                self.error(\n                    f\"parameter '{p.name}' without a default follows a \"\n                    f\"parameter with a default\", p)\n            self._scope.declare(p.name, p)\n            self._scope.vars[p.name][\"assigned\"] = True\n\n    def _check_function(self, fn):\n        self._scope = _Scope(self._scope)\n        self._in_function += 1\n        if fn.is_async:\n            self._in_async_function += 1\n        try:\n            self._check_decorators(fn)\n            self._check_params(fn.params)\n            self._check_block(fn.body)\n            self._check_unused(self._scope)\n        finally:\n            self._in_function -= 1\n            if fn.is_async:\n                self._in_async_function -= 1\n            self._scope = self._scope.parent\n\n    def _check_decorators(self, fn):\n        \"\"\"v0.4.0: decorator names resolve through normal scope lookup.\"\"\"\n        checked = []\n        for d in fn.decorators:\n            if isinstance(d, A.Name):\n                checked.append(self._resolve_name(d))\n            elif isinstance(d, A.Call):\n                d.args = [self._check_expr(a) for a in d.args]\n                if isinstance(d.func, A.Name):\n                    d.func = self._resolve_name(d.func)\n                else:  # pragma: no cover - parser only builds Name/Call\n                    d.func = self._check_expr(d.func)\n                checked.append(d)\n            else:  # pragma: no cover - parser only builds Name/Call\n                self.error(\"invalid decorator\", d)\n        fn.decorators = checked\n\n    def _all_fields(self, cls):\n        \"\"\"Own fields plus inherited fields (transitive, cycle-safe).\"\"\"\n        fields = [f.name for f in cls.fields]\n        seen_classes = {cls.name}\n        base_name = cls.base\n        while base_name:\n            if base_name in seen_classes:\n                break\n            seen_classes.add(base_name)\n            base_def = self.classes.get(base_name)\n            if base_def is None:\n                break\n            for f in base_def.fields:\n                if f.name not in fields:\n                    fields.append(f.name)\n            base_name = base_def.base\n        return fields\n\n    def _check_class(self, cls):\n        own_fields = [f.name for f in cls.fields]\n        if len(set(own_fields)) != len(own_fields):\n            self.error(f\"duplicate field in class '{cls.name}'\", cls)\n        if cls.base and cls.base not in self.classes:\n            self.error(f\"undefined base class '{cls.base}'\"\n                       f\"{self._suggest(cls.base)}\", cls)\n        fields = self._all_fields(cls)\n        method_names = [m.name for m in cls.methods]\n        if len(set(method_names)) != len(method_names):\n            self.error(f\"duplicate method in class '{cls.name}'\", cls)\n        prev_fields = self._class_fields\n        self._class_fields = set(fields)\n        try:\n            if cls.constructor:\n                self._check_method_like(cls.constructor, is_constructor=True)\n            for m in cls.methods:\n                self._check_method_like(m, is_constructor=False)\n        finally:\n            self._class_fields = prev_fields\n\n    def _check_method_like(self, fn, is_constructor):\n        self._scope = _Scope(self._scope)\n        self._in_function += 1\n        is_async = getattr(fn, \"is_async\", False)\n        if is_async:\n            self._in_async_function += 1\n        try:\n            if not is_constructor:\n                self._check_decorators(fn)\n            self._scope.declare(\"self\", fn)\n            self._scope.vars[\"self\"][\"assigned\"] = True\n            seen = {\"self\"}\n            seen_default = False\n            for p in fn.params:\n                if p.name in seen:\n                    self.error(f\"duplicate parameter '{p.name}'\", p)\n                seen.add(p.name)\n                if p.default is not None:\n                    seen_default = True\n                elif seen_default:\n                    self.error(\n                        f\"parameter '{p.name}' without a default follows a \"\n                        f\"parameter with a default\", p)\n                self._scope.declare(p.name, p)\n                self._scope.vars[p.name][\"assigned\"] = True\n            self._check_block(fn.body)\n            self._check_unused(self._scope, skip={\"self\"})\n        finally:\n            self._in_function -= 1\n            if is_async:\n                self._in_async_function -= 1\n            self._scope = self._scope.parent\n\n    # -- statements ---------------------------------------------------------------\n\n    def _check_block(self, stmts):\n        seen_return = False\n        for i, s in enumerate(stmts):\n            if seen_return:\n                self.warn(\"unreachable code\", s)\n            stmts[i] = self._check_stmt(s)\n            if isinstance(s, A.ReturnStmt):\n                seen_return = True\n\n    # v0.6.0 (Simple AGK): hidden `repeat` loop variables never warn.\n    _REPEAT_VAR_PREFIX = \"__agk_repeat_\"\n\n    def _check_stmt(self, s):\n        if isinstance(s, A.CreateStmt):\n            if s.name in self._scope.vars:\n                # v0.6.0: `x is <expr>` / `ask ... giving x` redeclare as\n                # assignment \u2014 never a redeclare error.\n                if not s.soft:\n                    self.error(f\"variable '{s.name}' is already declared\", s)\n            elif (s.soft and self._class_fields is not None\n                    and s.name in self._class_fields):\n                # assigning to a field: leave it undeclared so the SetStmt\n                # below rewrites to self.<field> = value, like `set` does\n                pass\n            else:\n                self._scope.declare(s.name, s)\n        elif isinstance(s, A.SetStmt):\n            s.value = self._check_expr(s.value)\n            scope, entry = self._scope.lookup(s.name)\n            if entry is not None:\n                entry[\"assigned\"] = True\n            elif (self._class_fields is not None\n                    and s.name in self._class_fields):\n                # field assignment -> self.<field> = value\n                return A.SetAttr(A.Name(\"self\", line=s.line, col=s.col),\n                                 s.name, s.value, line=s.line, col=s.col)\n            else:\n                self.error(f\"cannot set undefined variable '{s.name}'\"\n                           f\"{self._suggest(s.name)}\", s)\n        elif isinstance(s, A.IfStmt):\n            s.condition = self._check_expr(s.condition)\n            self._check_block(s.then_body)\n            new_elifs = []\n            for cond, body in s.elifs:\n                new_elifs.append((self._check_expr(cond), body))\n                self._check_block(body)\n            s.elifs = new_elifs\n            if s.else_body is not None:\n                self._check_block(s.else_body)\n        elif isinstance(s, A.WhileStmt):\n            s.condition = self._check_expr(s.condition)\n            self._check_block(s.body)\n        elif isinstance(s, A.ForEachStmt):\n            s.iterable = self._check_expr(s.iterable)\n            if s.var not in self._scope.vars:\n                self._scope.declare(s.var, s)\n            self._scope.vars[s.var][\"assigned\"] = True\n            if s.var.startswith(self._REPEAT_VAR_PREFIX):\n                # v0.6.0: hidden `repeat` loop variable \u2014 never read by\n                # user code, so exempt it from the unused-variable warning\n                self._scope.vars[s.var][\"used\"] = True\n            self._check_block(s.body)\n        elif isinstance(s, A.ForRangeStmt):\n            s.start = self._check_expr(s.start)\n            s.end = self._check_expr(s.end)\n            if s.step is not None:\n                s.step = self._check_expr(s.step)\n            if s.var not in self._scope.vars:\n                self._scope.declare(s.var, s)\n            self._scope.vars[s.var][\"assigned\"] = True\n            self._check_block(s.body)\n        elif isinstance(s, A.TryStmt):\n            self._check_block(s.body)\n            if s.catch_body is not None:\n                if s.catch_name is not None:\n                    if s.catch_name not in self._scope.vars:\n                        self._scope.declare(s.catch_name, s)\n                    self._scope.vars[s.catch_name][\"assigned\"] = True\n                self._check_block(s.catch_body)\n            if s.finally_body is not None:\n                self._check_block(s.finally_body)\n        elif isinstance(s, A.RaiseStmt):\n            if s.value is not None:\n                s.value = self._check_expr(s.value)\n        elif isinstance(s, A.ReturnStmt):\n            if self._in_function == 0:\n                self.error(\"'return' outside a function\", s)\n            if
