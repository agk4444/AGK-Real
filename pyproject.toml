[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agk-real"
version = "0.4.0"
description = "AGK-Real: an English-like programming language that compiles to plain Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "agk4444" },
]
keywords = ["language", "compiler", "english-like"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/agk4444/AGK-Real"
Repository = "https://github.com/agk4444/AGK-Real.git"

[project.scripts]
agk = "agk.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agk*"]

[tool.setuptools.package-data]
agk = ["stdlib/*.agk"]
